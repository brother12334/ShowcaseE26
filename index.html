function bindAIImport(){
  const a = AI_IMP;
  const on = (id, fn)=>{ const el = $("#"+id); if(el) el.onclick = fn; };
  // showModal bound the previous node's close button; this one is new every render.
  const c = $("#closeModal");
  if(c) c.onclick = hideModal;

  on("aiAgain",   ()=>{ a.result = null; a.err = ""; a.text = ""; a.files = []; renderAIImport(); });
  on("aiUse",     aiUsePlan);
  on("aiGo",      aiRun);

  const ta = $("#aiText");
  // Deliberately does not re-render: re-rendering on every keystroke would take the
  // caret and the keyboard with it.
  if(ta) ta.oninput = ()=>{ a.text = ta.value; };

  on("aiPick", ()=>{ const f = $("#obFile"); if(f) f.click(); });
  document.querySelectorAll("[data-airm]").forEach(b=> b.onclick = ()=>{
    a.files.splice(parseInt(b.dataset.airm, 10), 1);
    renderAIImport();
  });
  const f = $("#obFile");
  if(f) f.onchange = e=>{
    const picked = Array.prototype.slice.call(e.target.files || []);
    e.target.value = "";
    if(!picked.length) return;
    const big = picked.find(x=> x.size > 12 * 1024 * 1024);
    if(big){ a.err = esc(big.name) + " is too big to send (12 MB limit). A screenshot or a smaller photo will do."; renderAIImport(); return; }
    /* An Iron Log export is a plan we already speak. Recognising it here means the one
       "import" button also restores a backup, and it costs nothing to check. */
    const backup = picked.find(x=> /\.json$/i.test(x.name || ""));
    if(backup && picked.length === 1){ aiTryBackup(backup); return; }
    a.files = a.files.concat(picked).slice(0, 6);
    a.err = "";
    renderAIImport();
  };
}
/* A .json file gets one chance to be an Iron Log export before it is treated as
   something to read. If it is, no API call is made at all. */
function aiTryBackup(file){
  const r = new FileReader();
  r.onload = ()=>{
    let d = null;
    try{ d = JSON.parse(String(r.result)); }catch(e){}
    const prog = d && (d.program || d);
    const days = prog && typeof prog === "object"
      ? Object.keys(prog).filter(k=> k !== "finisher" && Array.isArray(prog[k]) && prog[k].length)
      : [];
    if(!days.length){
      AI_IMP.files = AI_IMP.files.concat([file]).slice(0, 6);
      AI_IMP.err = "";
      renderAIImport();
      return;
    }
    const split = d.customSplit && Array.isArray(d.customSplit.days) && d.customSplit.days.length
      ? d.customSplit
      : {name:"Imported split", tag:days.length+" days a week", custom:true,
         days: days.map((k,i)=>({id:k, name:prettyDayId(k), short:"D"+(i+1)})),
         layout: days.concat(days.length >= 5 ? ["rest","rest"] : ["rest"])};
    AI_IMP.result = {program: prog, customSplit: split, splitId: d.splitId || null,
                     warnings: [], backup: d};
    AI_IMP.err = "";
    renderAIImport();
    toast("Read straight from your Iron Log file");
  };
  r.onerror = ()=>{ AI_IMP.err = "Couldn't read that file."; renderAIImport(); };
  r.readAsText(file);
}
async function aiRun(){
  const a = AI_IMP;
  if(a.busy) return;
  const text = String(a.text || "").trim();
  if(!text && !a.files.length){
    a.err = "Paste your plan, or attach a photo of it, first.";
    renderAIImport();
    return;
  }
  a.busy = true; a.err = "";
  renderAIImport();
  try{
    const parts = [];
    if(text) parts.push({text:"Here is the plan:\n\n" + text.slice(0, 120000)});
    for(let i = 0; i < a.files.length; i++) parts.push(await aiFilePart(a.files[i]));
    const data = await aiCall(parts);
    if(data && data.understood === false){
      throw new Error(String(data.problem || "That didn't read as a training plan.").slice(0,200));
    }
    a.result = aiPlanToProgram(data || {});
    a.busy = false;
    renderAIImport();
  }catch(err){
    a.busy = false;
    a.err = (err && err.message) || "Something went wrong reading that.";
    renderAIImport();
  }
}
/* Committing the plan. During onboarding it becomes the wizard's imported plan and
   finishOnboarding writes it with everything else; afterwards it replaces the current
   programme, which is a big enough change to be confirmed and logged. */
async function aiUsePlan(){
  const r = AI_IMP && AI_IMP.result;
  if(!r) return;
  if(AI_IMP.ob && OB){
    OB.imported = r.backup || {program:r.program, customSplit:r.customSplit, splitId:r.splitId};
    hideModal();
    obGo(OB_STEPS.indexOf("plan"));
    toast("Plan read. Have a look before you start.");
    return;
  }
  const dayCount = r.customSplit.days.length;
  const ok = await askConfirm({
    title:"Replace your plan?",
    body:`Your programme becomes <b>${esc(r.customSplit.name)}</b>, ${dayCount} training day${dayCount===1?"":"s"} a cycle.
          <br><br>Every workout you have already logged is kept exactly as it is — this only changes what you
          are asked to do from here on. The cycle restarts at day one.`,
    yes:"Use this plan", no:"Keep my current plan"
  });
  if(!ok) return;
  const oldFin = Array.isArray(S.program && S.program.finisher) ? S.program.finisher : [];
  S.program = Object.assign({}, r.program, {finisher: oldFin});
  if(r.customSplit){ S.customSplit = r.customSplit; S.splitId = null; }
  else if(r.splitId){ S.splitId = r.splitId; S.customSplit = null; }
  applySplit();
  invalidateTableOrigin();
  invalidateMultiDay();
  S.pointer = 0; S.cycleDone = []; S.cycleStart = Date.now(); S.restDays = [];
  logPlanChange("programme", null, r.customSplit.name,
    ["Plan imported: " + r.customSplit.name,
     "Rotation is now " + DAYS.map(dayName).join(" → ")],
    {note:"Logged workouts were not affected."});
  AI_IMP = null;
  save(); queueSync();
  hideModal();
  TAB = "program"; render();
  toast("Plan imported. It's all yours to edit.");
}

function switchSplit(id){
  const oldProgram = S.program || {};
  S.splitId = id;
  S.customSplit = null;
  applySplit();
  const gear = (S.setup && S.setup.gear) || "full";
  const level = (S.setup && S.setup.level) || experience();
  const fresh = buildProgram(id, gear, level);
  /* Keep what carries over. A day present in both schedules is the same training day
     as far as you are concerned, and regenerating it would silently discard the loads
     and swaps you have built up on it. */
  const merged = {finisher: Array.isArray(oldProgram.finisher) ? oldProgram.finisher : []};

  logPlanChange("programme", null, splitName(),
    ["Schedule changed to " + splitName(), "Rotation is now " + DAYS.map(dayName).join(" → ")],
    {note:"Logged workouts were not affected."});

}
/* Renaming a training day. The day's KEY never changes — it is what every logged
   session points at — so this only ever edits the label. */
function renameDay(wid, name){
  const sp = currentSplit();
  if(!S.customSplit){
    /* A built-in split is shared by everyone, so a rename has to fork it into a custom
       one rather than editing the template in place. Same days, same layout, your
       names. */
    S.customSplit = {name:sp.name, tag:sp.tag, custom:true,
                     days: sp.days.map(d=>({id:d.id, name:d.name, short:d.short})),
                     layout: sp.layout.slice()};
    S.splitId = null;
  }
  const d = S.customSplit.days.find(x=>x.id === wid);
  if(!d) return;
  d.name = name;
  d.short = name.replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase() || d.short;
  applySplit();
  save(); queueSync(); render();
  toast("Renamed to " + name);
}

/* =====================================================================
   THE CYCLE STRIP

   Laid out as the cycle is actually run: P1 B1 L1 rest P2 B2 L2 rest. The rests sit in
   position rather than being parked at the end, because that is the shape of the week
   in your head and a strip that hides them makes an eight-day cycle look like a
   six-day one.

   WEEKDAY LABELS DRIFT, AND THAT IS ARITHMETIC, NOT A BUG. Eight slots do not fit in a
   seven-day week. Anchoring P1 to the Sunday you actually did it means the rest at
   slot 8 lands on the following Sunday, so the next cycle opens on Monday and the
   whole pattern advances one weekday each time round. The labels below are therefore
   PROJECTIONS from the anchor, not fixed assignments: they tell you which day each
   slot is heading for this time round, and they move next time.

   The alternative is pinning to weekdays, which needs a 7-day cycle and only leaves
   room for one rest. That trade was considered and rejected: the second rest is worth
   more here than a fixed calendar, because sleep is the binding constraint.        */
// CYCLE_LAYOUT itself now comes from your split; see applySplit().
const WEEKDAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* The date slot 0 of the current cycle is anchored to. Prefers the first training day
   actually logged this cycle, so the strip lines up with what you did rather than with
   when the app happened to roll over. */
function cycleAnchorDate(){
  const inCycle = S.sessions
    .filter(x=>x.startedAt >= S.cycleStart && DAYS.indexOf(x.workoutId) > -1)
    .sort((a,b)=>a.startedAt - b.startedAt);
  if(inCycle.length) return new Date(inCycle[0].startedAt);
  return new Date(S.cycleStart);
}
// Projected weekday for a slot, counting forward from the anchor.
function slotWeekday(slotIndex){
  const d = cycleAnchorDate();
  d.setDate(d.getDate() + slotIndex);
  return WEEKDAY_SHORT[d.getDay()];
}
/* THE ROTATION ONLY RUNS FORWARDS.

   The plate strip used to let any plate be tapped, which quietly turned a fixed
   schedule into a menu: one tap and you were back on a day you had already trained,
   with the cycle's checkmarks and the "since last time" card both describing a session
   you were about to repeat. This is a set programme — Push A, Pull A, Legs A, rest,
   Push B, Pull B, Legs B, rest — and the day you re-run is the day at the far end that
   never gets trained.

   A slot is PAST when the cycle has already spent it: either it is checked off, or the
   pointer has moved beyond it. Those plates still render (the strip is the clearest
   picture of where you are in the week) but they no longer take a tap. Jumping FORWARD
   is still allowed, because equipment being occupied is a real thing and the order of
   what's left is yours; going backwards is not, because there is nothing left there.

   Starting the cycle over is still one tap away, under "reset cycle". */
function slotIsPast(i){
  if(S.cycleDone.includes(i)) return true;
  /* A cycle with nothing logged in it has not spent anything yet, so it locks nothing.
     This is what keeps a fresh cycle fully open regardless of where the pointer happens
     to be sitting — including in saves written before recomputeCycle() started sending
     the pointer back to the top of the rotation on a wrap. */
  if(!S.cycleDone.length) return false;
  return i < S.pointer;
}
function plateStrip(){
  const cur = S.pointer;
  const taken = restDaysThisCycle();
  let html = '<div class="plates-wrap"><div class="plates">';
  let restSeen = 0;
  CYCLE_LAYOUT.forEach((key, slot)=>{
    const wd = slotWeekday(slot);
    if(key === "rest"){
      const idx = restSeen++;
      const date = taken[idx] || null;
      const isToday = date === todayStr();
      html += `<button class="plate rest${isToday?" cur":""}${date?" done":""}" data-rest="${idx}"
        aria-label="Rest ${idx+1} of ${REST_CREDITS}, ${wd}${date?", used "+date:", available"}"
        >R<small>${wd}</small>${date?'<span class="pcheck">&#10003;</span>':""}</button>`;
      return;
    }
    const i = ROTATION.indexOf(key);
    const m = dayMeta(key);
    const done = S.cycleDone.includes(i);
    /* The rotation only runs forwards. A slot that is already done, or that the pointer
       has moved past, is a day the cycle has spent, so it is rendered as a record rather
       than as something you can jump back onto. See slotIsPast(). */
    const past = slotIsPast(i);
    const cls = "plate" + (i===cur?" cur":"") + (done?" done":"") + (past?" past":"");
    /* aria-disabled, not disabled: a past plate still has to take the tap so it can say
       WHY nothing happened. A hard-disabled button swallows the tap silently, and
       "I pressed it and the app ignored me" is indistinguishable from a bug. */
    html += `<button class="${cls}" data-slot="${i}" style="background:${m.color}"${
      past?' aria-disabled="true"':""}
      aria-label="${m.name}, ${wd}${done?", done":past?", already passed this cycle":""}">${m.short}<small>${wd}</small>${
      done?'<span class="pcheck">&#10003;</span>':""}</button>`;
  });
  html += "</div>";
  const left = restCreditsLeft();
  html += `<div class="cycle-row"><span class="num">${S.cycleDone.length} of ${ROTATION.length} done &middot; ${
    left === REST_CREDITS ? REST_CREDITS+" rests available"
    : left ? left+" rest left" : "both rests used"}</span><span>${
    S.lastReview?'<button id="lastReviewBtn">last review</button> ':''}<button id="cycleReset">reset cycle</button></span></div>`;
  return html + "</div>";
}

function profInitials(name){
  const parts = String(name||"?").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return (parts.length===1 ? parts[0].slice(0,2) : parts[0][0]+parts[1][0]).toUpperCase();
}
function profColor(id){
  // stable colour per profile so each person is visually distinct at a glance
  const pal = ["#e05248","#4a82e0","#e8b62c","#46a85c","#b46ce0","#e07f2c","#2cc7c7","#e0629a"];
  let hs = 0;
  String(id).split("").forEach(c=>{ hs = (hs*31 + c.charCodeAt(0)) >>> 0; });
  return pal[hs % pal.length];
}

      if(switchProfile(nid)){
        // gist ID supplied → go and get their history right now, with real feedback.
        // No ID → make them a private one so their log is backed up from day one.
        if(gistId) setTimeout(pullFromGist, 120);
        else ensureGist();
      }
      return;
    }
    const gistChanged = !!gistId && ((p.gistId||"") !== gistId || (p.token||"") !== token);
    p.name = name; p.gistId = gistId; p.repo = repo; p.token = token;
    if(p.id===PROF.activeId){
      // keep the live state in step with the edited record
      S.sync.gistId = gistId; S.sync.repo = repo;
      if(token) S.sync.token = token;
      save();
    }
    saveProfiles();
    hideModal(); render();
    // pointed at a different gist → that's a request to load what's in it
    if(gistChanged && p.id===PROF.activeId) setTimeout(pullFromGist, 120);
    else toast("Profile saved");
  };
}

/* =====================================================================
   "SINCE LAST TIME" FEEDBACK, where a grade's advice actually surfaces

   Putting the full report card at the start of the next workout is the obvious place
   and the wrong one, for two reasons. The next workout is usually a DIFFERENT rotation
   day, so most of the advice is about exercises you are not doing today. And an
   eight-section card at the moment someone wants to start lifting is a wall to scroll
   past, which is how you train people to dismiss it.

   It lands in three places instead, each matched to the moment you can act on it:
     • TODAY, before you start: one card carrying the single highest-value fix from the
       last session of THIS rotation day, with the full breakdown one tap away.
     • IN THE SESSION: the same line, shrunk to a strip above the exercise it is about,
       so it is in front of you while you are choosing the weight.
     • HISTORY: the full card, on demand, unchanged.
   ===================================================================== */
function lastGradedFor(wid){
  for(let i=S.sessions.length-1;i>=0;i--){
    const s = S.sessions[i];
    if(s.workoutId === wid && s.quality) return s;
  }
  return null;
}
function focusCardHTML(wid){
  const s = lastGradedFor(wid);
  if(!s || !s.quality) return "";
  const q = s.quality;
  const a = (q.advice||[])[0];
  const col = gradeColor(q.pct);
  const d = new Date(s.date+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const nPr = (q.prs||[]).length;
  // A near-perfect session has nothing worth changing. Say so, rather than inventing
  // a criticism to fill the card, which is how advice stops being believed.
  const body = a
    ? `<div class="fc-do">${a.ex?`<b>${esc(a.ex)}</b> — `:""}${esc(a.text)}</div>`
    : `<div class="fc-do">Nothing needs fixing. Repeat it, one small step heavier.</div>`;
  const sub = [];
  if(nPr) sub.push(`🔥 ${nPr} personal record${nPr>1?"s":""} that day.`);
  if(a && !a.na && a.lost >= 1) sub.push(`Cost you ${r1(a.lost)} point${a.lost===1?"":"s"} on that grade.`);
  else if(a && a.na) sub.push(`That section couldn't be graded at all last time.`);
  return `<div class="card fc-card">
    <div class="fc-k">Since your last ${esc(widName(wid).toLowerCase())} day
      <span class="fc-grade" style="color:${col};background:${col}22">${esc(d)} · ${esc(q.grade)}</span></div>
    ${body}
    ${sub.length?`<div class="fc-sub">${sub.join(" ")}</div>`:""}
    <button class="fc-btn" data-fullgrade="${esc(s.id)}">See the full breakdown</button>
  </div>`;
}
/* Advice that names an exercise, keyed by canonical name, so the note about your squat
   appears above your squat rather than in a list you read once and scrolled past. */
function focusTipsFor(wid){
  const s = lastGradedFor(wid);
  const map = {};
  if(!s || !s.quality) return map;
  (s.quality.advice||[]).forEach(a=>{ if(a.ex) map[nrm(a.ex)] = a; });
  return map;
}
/* `seen` stops the same note printing twice when an exercise appears more than once in
   a session, which the finisher does by design: crunch → leg raise → crunch. */
function inlineTipHTML(a, seen){
  if(!a) return "";
  if(seen){
    if(seen.has(a.key)) return "";
    seen.add(a.key);
  }
  return `<div class="fc-inline"><span class="ins-tag">Last time</span><span>${esc(a.text)}</span></div>`;
}

// A finished exercise's sets, each tagged with the side it was done on where relevant.
function setListHTML(e){
  const parts = [];
  (e.sets||[]).forEach((st,i)=>{

      ? `<i class="side-chip ${side==="L"?"sc-l":"sc-r"}" style="margin-right:5px">${esc(sideTag(e.altStyle||"side", side))}</i>`
      : "";
    // A set with a logged reason carries it here too, so reading back an old session
    // never leaves you staring at a collapsed row with no idea what happened.
    const r = st.why && REASON_BY_CODE[st.why.code];
    const flag = r ? ` <span title="${attrSafe(r.label + (st.why.note ? " — "+st.why.note : ""))}">${r.icon}</span>` : "";
    parts.push(chip + esc(fmtSet(st)) + flag);

function bestSet(sets){
  let best=null;
  sets.forEach(s=>{
    if(s.reps==null||s.reps==="") return;
    const w = parseFloat(s.weight)||0;
    if(!best || w>(parseFloat(best.weight)||0)) best=s;
  });
  return best || sets[0];
}

/* The banner above an alternating exercise. It spells out the full running order for
   the session rather than just the opening side, so there's nothing to work out.
   `nSets` may be a count or an array length, both are accepted. */
/* The four-week rep-matching rule, printed on the exercise it applies to rather than
   left in a settings screen. The logged gap that motivates it (right 15, left 6, right
   14 on preacher curl on 7/23) is real and large enough that training both sides to
   their own limit would widen it, not close it. */
function asymHintHTML(e){
  if(!asymActiveFor(e)) return "";
  const st = sideStats(e.name);
  if(!st.ok){
    // no usable reading yet: state the rule, don't invent a number
    return `<div class="asym-hint"><b>Match the weaker side.</b> Same rep count both sides,
      set by whichever is weaker. <span class="asym-note">${esc(st.reason)}.</span></div>`;
  }
  if(!st.weaker){
    return `<div class="asym-hint"><b>Sides are level</b> at about ${r1(st.R.reps)} reps.
      <span class="asym-note">${esc(asymSampleText(st))}.</span></div>`;
  }
  const cap = Math.floor(Math.min(st.R.reps, st.L.reps));
  return `<div class="asym-hint"><b>Cap both sides at ${cap} reps.</b>
    ${esc(asymGapText(st))} <span class="asym-note">${esc(asymSampleText(st))}.</span></div>`;
}
function altHintHTML(style, startSide, nSets){
  const n = Math.max(1, Math.min(8, parseInt(nSets,10) || 3));
  const seq = [];
  for(let i=0;i<n;i++){
    const s = sideForSet(startSide, i);
    seq.push(`<i class="side-chip ${s==="L"?"sc-l":"sc-r"}">${esc(sideTag(style, s))}</i>`);
  }
  const lead = style === "cross"
    ? `Start with your <b>${sideWord(startSide)}</b> arm crossing on top`
    : `Start with your <b>${sideWord(startSide)}</b> arm`;
  const tail = style === "cross"
    ? `swap which arm is on top every set. Flips to ${sideWord(startSide==="R"?"L":"R")} first next time.`
    : `alternate every set. Flips to ${sideWord(startSide==="R"?"L":"R")} first next time.`;
  return `<div class="arm-hint">
    <div>${lead}, ${tail}</div>
    <div class="alt-seq">${seq.join('<span class="alt-arrow">›</span>')}</div>
  </div>`;
}
/* The L / R marker that sits under each set number on an alternating exercise, so you
   never have to count back to work out whose turn it is. Colour-coded because a glance
   at the shape is faster to read mid-set than the letter. */
function sideChip(en, si){
  if(!en || !en.startSide) return "";
  const style = en.altStyle || "side";
  const side = sideForSet(en.startSide, si);
  if(!side) return "";
  return `<i class="side-chip ${side==="L"?"sc-l":"sc-r"}" title="${esc(sideFull(style, side))}">${esc(sideTag(style, side))}</i>`;
}
/* =====================================================================
   PER-SET RPE TARGETS

   The old schema carried one RPE string for a whole exercise, which cannot express the
   thing these plans are actually built on: a ramp. "3 sets at RPE 9" and "7,8,8,9"
   are the same set count and very different amounts of accumulated fatigue, and the
   difference is the entire point of the rewrite.

   `e.rpes` is the ordered per-set target list. `e.rpe` is still populated with a
   summary range so nothing that reads it has to change. Anything without a list falls
   back to the range, so custom exercises and every legacy session keep working.       */
function rpeTargetFor(entry, si){
  const list = entry && entry.rpes;
  if(Array.isArray(list) && list.length){
    // more sets logged than prescribed (you added one) -> the last target carries on
    return list[Math.min(si, list.length - 1)];
  }
  return null;
}
// How far a logged RPE may sit from its target before it counts as off-target. Half a
// point is inside the noise of self-reported RPE; a full point is a real difference.
const RPE_TOL = 0.5;
function rpeTargetChipHTML(entry, si){
  const t = rpeTargetFor(entry, si);
  if(t == null) return "";
  return `<span class="rpe-target" title="Target for this set">${t}</span>`;
}
function rpeOptions(v){
  const opts = ["","6","6.5","7","7.5","8","8.5","9","9.5","10"];
  return opts.map(o=>`<option value="${o}" ${String(v??"")===o?"selected":""}>${o===""?"RPE":o}</option>`).join("");
}

/* ---------- focus mode ---------- */
function plateLoaderHTML(a){
  const total = a.entries.length;
  const doneMain = a.entries.filter(e=>!e.fin && e.sets.length && e.sets.every(st=>st.done)).length;
  const doneFin = a.entries.filter(e=>e.fin && e.sets.length && e.sets.every(st=>st.done)).length;
  const doneEx = doneMain + doneFin;
  const isNew = (a._loaded!=null && doneEx > a._loaded);
  a._loaded = doneEx;
  const full = total>0 && doneEx>=total;
  const color = DAY_HEX[a.workoutId] || "#eceae4";
  const pw = Math.max(7, Math.min(12, Math.floor(120/Math.max(1,total))));
  const sleeve = side=>{
    let out = "";
    for(let i=0;i<doneEx;i++){
      const h = Math.max(30, 62 - i*5);
      const c = i < doneMain ? color : "#9b99a0";
      const drop = (isNew && i===doneEx-1) ? " drop" : "";
      out += `<span class="bplate${drop}" style="width:${pw}px;height:${h}px;background:${c}"></span>`;
    }
    if(!full){
      const h = Math.max(30, 62 - doneEx*5);
      out += `<span class="bplate ghost" style="width:${pw}px;height:${h}px"></span>`;
    }
    return out;
  };
  return `<div class="bar-wrap${full?" fullbar":""}">
    <span class="bar-end"></span>
    <span class="sleeve left">${sleeve("l")}</span>
    <span class="collar"></span>
    <span class="bar-shaft"></span>
    <span class="collar"></span>
    <span class="sleeve right">${sleeve("r")}</span>
    <span class="bar-end"></span>
  </div>
  <div class="loader-label num">${full ? "Bar fully loaded, finish strong" : doneEx+" of "+total+" plates loaded"}</div>`;
}
function viewFocusSession(){
  const a = S.active;

  if(a.focusIdx==null) a.focusIdx = 0;
  a.focusIdx = Math.max(0, Math.min(a.focusIdx, Math.max(0, a.entries.length-1)));
  /* A superset is one step, not two. Landing on the second half means you arrived from
     the far side, so slide back to the first and show the whole pair. */
  const _ssHere = supersetInfo(a.entries, a.focusIdx);
  if(_ssHere && _ssHere.role === "second") a.focusIdx = Math.max(0, a.focusIdx - 1);
  const ei = a.focusIdx;
  const en = a.entries[ei];
  const _pair = supersetInfo(a.entries, ei);
  const _isPair = !!(_pair && _pair.role === "first" && a.entries[ei+1]);
  // a pair occupies two entries, so "at the end" has to account for both
  const atEnd = (_isPair ? ei + 1 : ei) >= a.entries.length - 1;
  let h = `<div class="card" style="padding:12px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:${m.color};width:15px;height:15px"></span><h3 style="font-size:19px">${m.name}</h3></div>
      <span class="num sub" style="font-size:15px">${a.entries.length?ei+1:0} / ${a.entries.length}</span>
    </div>
    ${plateLoaderHTML(a)}
  </div>`;
  if(!en){
    h += `<div class="empty">Nothing left in this session.</div>`;
    return h + focusFooter(a, true);
  }
  if(_isPair){
    // one card of rounds, exactly as the flat view draws it
    h += supersetGroupHTML(a, ei, focusTipsFor(a.workoutId), new Set());
    if(atEnd) h += focusNoteCardHTML(a);
    return h + focusFooter(a, atEnd);
  }
  const occ = occIndex(a.entries, ei);
  const anyDay = en.fin || sharedAcrossDays(en.name);
  const last = lastSetsFor(a.workoutId, en.name, anyDay, occ);

/* =====================================================================
   BODY TAB, training stress map
   ===================================================================== */
const C_GREY="#c9c9d4", C_NONE="#2a2a31", C_LOW="#3f5f8c", C_OK="#46a85c", C_WARN="#e8b62c", C_BAD="#e05248", C_FLAT="#6d6d75";
function hex2rgb(h){ h=h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function lerpHex(a,b,t){
  t = Math.max(0,Math.min(1,t));
  const A=hex2rgb(a), B=hex2rgb(b);
  return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");
}
function ramp(stops, t){
  // stops: [[pos,hex],...] ascending
  t = Math.max(0,Math.min(1,t));
  for(let i=1;i<stops.length;i++){
    if(t <= stops[i][0]){
      const [p0,c0]=stops[i-1], [p1,c1]=stops[i];
      return lerpHex(c0,c1,(t-p0)/((p1-p0)||1));
    }
  }
  return stops[stops.length-1][1];
}
const METRICS = [
  {id:"fatigue",  label:"Fatigue"},
  {id:"volume",   label:"Volume"},
  {id:"recovery", label:"Recovery"},
  {id:"growth",   label:"Growth"},
  {id:"injury",   label:"Injury Risk"}
];
// Volume is the one metric whose meaning depends on the window it's counted over, so
// its label and its one-liner say which window that is rather than assuming a week.
function metricLabel(id, win){
  const m = METRICS.find(x=>x.id===id);
  if(!m) return id;
  return id === "volume" ? (win && win.mode==="cycle" ? "Cycle Volume" : "Weekly Volume") : m.label;
}
function metricOneLiner(id, win){
  if(id === "volume"){
    return "How much work each muscle got "+((win && win.short) || "this week")+".";
  }
  return METRIC_ONELINER[id];
}
// value (0..100 or null), colour, glow strength (0..1) and a plain-English read
function muscleMetric(A, m, metric){
  if(metric==="fatigue"){
    const v = A.fat[m];
    return {v, txt:v+"%", color:ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], v/100), glow:v/100,
      note: v>=70?"heavily fatigued":v>=45?"carrying real fatigue":v>=20?"lightly fatigued":"fresh"};
  }
  if(metric==="volume"){
    const st = A.state[m], sets = A.vol[m], M = MUSCLES[m];
    const color = st.k==="none"?C_NONE : st.k==="under"?C_LOW : st.k==="optimal"?C_OK : st.k==="high"?C_WARN : C_BAD;
    const glow = st.k==="none"?0 : st.k==="under"?.35 : st.k==="optimal"?.75 : st.k==="high"?.85 : 1;
    return {v:Math.round(Math.min(100, sets/M.mrv*100)), txt:r1(sets)+" sets", color, glow, note:st.txt};
  }
  if(metric==="recovery"){
    const v = A.rec[m];
    return {v, txt:v+"%", color:ramp([[0,C_BAD],[.5,C_WARN],[1,C_OK]], v/100), glow:1-v/100,
      note: v>=95?"fully recovered":v>=70?"mostly recovered":v>=40?"still recovering":"not recovered yet"};
  }
  if(metric==="growth"){
    const g = A.grow[m];
    if(g.score==null) return {v:null, txt:" ", color:C_NONE, glow:0, note:g.note};
    const color = ramp([[0,C_BAD],[.45,C_FLAT],[.55,C_FLAT],[1,C_OK]], g.score/100);
    const note = g.isNew ? g.note
      : g.score>=65 ? "growing, strength trending up"
      : g.score>=45 ? "holding steady"
      : "losing ground vs the last block";
    return {v:g.score, txt:(g.isNew?"new":(g.strP>=0?"+":"")+Math.round((g.strP||0)*100)+"%"), color, glow:Math.abs(g.score-50)/50, note};
  }
  const v = A.inj[m].score;
  return {v, txt:v+"%", color:ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], v/100), glow:v/100,
    note: v>=75?"high risk, back off":v>=55?"elevated risk":v>=30?"some risk flags":"low risk"};
}
function metricLegend(metric){
  const sw = (c,t)=>`<span class="bm-lg"><span class="bm-sw" style="background:${c}"></span>${t}</span>`;
  if(metric==="volume"){
    return sw(C_NONE,"not trained")+sw(C_LOW,"too little")+sw(C_OK,"just right")+sw(C_WARN,"a lot")+sw(C_BAD,"too much");
  }
  if(metric==="growth"){
    return sw(C_OK,"growing")+sw(C_FLAT,"holding")+sw(C_BAD,"going backwards")+sw(C_NONE,"no data");
  }
  if(metric==="recovery"){
    return sw(C_OK,"ready to train")+sw(C_WARN,"nearly there")+sw(C_BAD,"still recovering");
  }
  if(metric==="fatigue"){
    return sw(C_OK,"fresh")+sw(C_WARN,"getting tired")+sw(C_BAD,"very tired");
  }
  return sw(C_OK,"low")+sw(C_WARN,"keep an eye on it")+sw(C_BAD,"back off");
}
// One plain sentence per metric, what the picture is actually showing you.
const METRIC_ONELINER = {
  fatigue:"How tired each muscle is right now.",
  volume:"How much work each muscle got this week.",
  recovery:"Which muscles are ready to train again.",
  growth:"Which muscles are actually getting stronger.",
  injury:"Where you're pushing harder than you're recovering."
};
/* ---------- the figure ----------
   Two stylised views so every muscle in the model has somewhere to live: chest, front
   delts, biceps, abs, obliques and quads read from the front; lats, traps, rear delts,
   triceps, erectors, glutes and hamstrings from the back. Each region is a tappable
   group whose fill and glow come straight from the selected metric. */
/* `isHead` says whether this is a drilled-in head (tap opens its detail) or a whole
   group at the top level (tap drills in). */
function bmGroup(key, shapes, A, metric, isHead, selected){
  const mm = isHead ? regionMetric(A, key, metric) : groupTileMetric(A, key, metric);
  const boost = selected ? 1 : 0;
  const near = (2 + mm.glow*5 + boost*4).toFixed(1);
  const far  = (5 + mm.glow*16 + boost*14).toFixed(1);
  const style = (mm.glow > 0.05 || selected)
    ? `filter:drop-shadow(0 0 ${near}px ${mm.color}) drop-shadow(0 0 ${far}px ${mm.color})`
    : "";
  const attr = isHead ? `data-m="${key}"` : `data-g="${key}"`;
  const cls = "bm-m" + (isHead ? " bm-head-shape" : "") + (selected ? " bm-sel" : "");
  return `<g class="${cls}" ${attr} fill="${mm.color}" style="${style}"><title>${esc(regionLabel(key))}: ${esc(mm.txt)}</title>${shapes}</g>`;
}
/* A whole group's colour at the top level: light grey if nothing trained it this week,
   otherwise the group's own verdict on the selected metric. */
function groupTileMetric(A, g, metric){
  const trained = (A.wk[g] && A.wk[g].sets > 0);
  if(!trained){
    // grey means "no data", and there are two ways to have none: the rotation hasn't
    // reached this muscle yet, or nothing is training it. Only the second is a problem.
    const q = (A.cyc && A.cyc.pending[g]) || 0;
    return q > 0
      ? {v:null, txt:"not yet this cycle, "+r1(q)+" sets due on "+dayList(pendingDayNames(A.cyc, g)), color:C_GREY, glow:0, queued:q}
      : {v:null, txt:"not trained", color:C_GREY, glow:0};
  }
  return muscleMetric(A, g, metric);
}
function regionLabel(r){ return REGIONS[r] ? REGIONS[r].name : (GROUPS[r] ? GROUPS[r].name : r); }
/* A head's colour. The VERDICT comes from its parent group, because that is the level
   the volume research works at. What the head contributes on its own is whether it has
   been trained at all, and what share of the group's work it is getting: a head with no
   logged work stays the neutral light grey no matter how the group is doing. */
function regionMetric(A, r, metric){
  const g = gOf(r);
  const own = A.rwk ? (A.rwk.sets[r]||0) : 0;
  if(own <= 0){
    return {v:null, txt:"not trained", color:C_GREY, glow:0,
            note:"no logged work in the last 7 days"};
  }
  const base = muscleMetric(A, g, metric);
  const share = A.rwk.share[r] || 0;
  const nHeads = (GROUP_REGIONS[g]||[]).length;
  if(metric === "volume"){
    // a head doing far less than its fair share of the group reads as under-worked
    const fair = nHeads > 1 ? 1/nHeads : 1;
    const rel = fair > 0 ? share/fair : 1;
    const color = rel < 0.5 ? C_LOW : base.color;
    return {v:base.v, txt:r1(own)+" sets", color, glow:base.glow,
            note: nHeads > 1
              ? r1(own)+" sets, "+Math.round(share*100)+"% of your "+gName(g).toLowerCase()+" work"
              : base.note};
  }
  return {v:base.v, txt:base.txt, color:base.color, glow:base.glow, note:base.note};
}

/* =====================================================================
   HEAD-LEVEL ATTRIBUTION

   A group's sets get shared out across its heads according to what the exercise
   actually does. This is the part that makes head-level tracking mean something:
   an overhead extension and a pushdown both count as triceps work, but they do NOT
   load the three heads equally, and after a few weeks that shows up as one head
   carrying the group while another does nothing.

   Numbers are relative weights within the group, not sets. 1.0 = this head gets the
   exercise's full credit, 0.3 = it gets a token amount. Anything not listed splits
   evenly across the group's heads.
   ===================================================================== */
const HEAD_BIAS = {
  // ---- triceps: the long head crosses the shoulder, so only overhead work stretches it
  "cable tricep extension":  {triceps:{tri_long:1,   tri_lateral:.55, tri_medial:.65}},
  "tricep pushdown":         {triceps:{tri_long:.35, tri_lateral:1,   tri_medial:.9}},
  "tricep kickback":         {triceps:{tri_long:.5,  tri_lateral:.9,  tri_medial:1}},
  // Guillotine = flat bench pressed to the neck, which raises the effective incline of
  // the pressing arc, so it reads as an upper-chest movement, not a mid-chest one.
  "guillotine press":        {triceps:{tri_long:.3,  tri_lateral:.9,  tri_medial:1},
                              chest:{chest_upper:1, chest_mid:.9, chest_lower:.35}},
  "chest dips":              {triceps:{tri_long:.4,  tri_lateral:1,   tri_medial:.9},
                              chest:{chest_upper:.3, chest_mid:.8, chest_lower:1}},
  // ---- chest: incline is the only reliable way into the upper pec
  "incline dumbbell bench press": {chest:{chest_upper:1, chest_mid:.7, chest_lower:.3}},
  "dumbbell bench press":         {chest:{chest_upper:.5, chest_mid:1, chest_lower:.8}},
  "cable chest press (on bench)": {chest:{chest_upper:.6, chest_mid:1, chest_lower:.7}},
  "mid cable fly (on bench)":     {chest:{chest_upper:.5, chest_mid:1, chest_lower:.8}},

/* Keyword fallbacks, so an exercise you add later still lands on the right heads. */
const HEAD_KEYWORDS = [
  [/\bincline\b/,                  {chest:{chest_upper:1, chest_mid:.7, chest_lower:.3}}],
  [/\bdecline\b|\bdip\b/,          {chest:{chest_upper:.3, chest_mid:.8, chest_lower:1}}],
  [/overhead|skull|french/,         {triceps:{tri_long:1, tri_lateral:.55, tri_medial:.65}}],
  [/pushdown|press[- ]?down/,       {triceps:{tri_long:.35, tri_lateral:1, tri_medial:.9}}],
  [/\bseated\b.*calf|calf.*\bseated\b/, {calves:{calf_lateral:.35, calf_medial:.35, soleus:1}}],
  [/standing.*calf|calf.*standing/, {calves:{calf_lateral:1, calf_medial:1, soleus:.35}}],
  [/leg extension|sissy/,           {quads:{quad_lateral:.9, quad_rectus:1, quad_medial:1}}],
  [/squat|leg press|lunge|hack/,    {quads:{quad_lateral:1, quad_rectus:.5, quad_medial:.9}}],
  [/rdl|romanian|stiff[- ]?leg|good ?morning/, {hams:{ham_lateral:.8, ham_medial:1}}],
  [/lying.*curl|leg curl/,          {hams:{ham_lateral:1, ham_medial:.8}}],
  [/leg raise|reverse crunch|hanging knee/, {abs:{abs_upper:.4, abs_mid:.8, abs_lower:1}}],
  [/crunch|sit[- ]?up/,             {abs:{abs_upper:1, abs_mid:1, abs_lower:.5}}],
  [/face pull|rear delt|reverse fly/, {traps:{traps_upper:.3, traps_mid:1}}],
  [/shrug/,                         {traps:{traps_upper:1, traps_mid:.3}}]
];
const HEAD_BIAS_C = canonIndex(HEAD_BIAS);
/* How this exercise splits a group's credit across that group's heads, normalised so
   the biggest-hit head gets the full 1.0 and the others a fraction of it. */
function headShares(exName, group){
  const regions = GROUP_REGIONS[group] || [];
  if(regions.length <= 1){ const o={}; regions.forEach(r=>o[r]=1); return o; }
  const k = nrm(exName), t = tableKey(exName);
  let raw = (HEAD_BIAS_C[t] && HEAD_BIAS_C[t][group])
         || (HEAD_BIAS_C[k] && HEAD_BIAS_C[k][group]) || null;
  if(!raw){
    for(const [re, map] of HEAD_KEYWORDS){ if((re.test(k) || re.test(t)) && map[group]){ raw = map[group]; break; } }
  }
  const out = {};
  if(!raw){ regions.forEach(r=> out[r] = 1); return out; }   // unknown: split evenly
  let max = 0;
  regions.forEach(r=>{ const v = raw[r]!=null ? raw[r] : 0; if(v>max) max=v; });
  if(!max){ regions.forEach(r=> out[r] = 1); return out; }
  regions.forEach(r=>{ out[r] = (raw[r]!=null ? raw[r] : 0) / max; });
  return out;
}
/* Per-head hard sets over a window, plus each head's share of its group's total. */
function regionStats(from, to){
  const sets = {}, vol = {}, exs = {};
  RKEYS.forEach(r=>{ sets[r]=0; vol[r]=0; exs[r]={}; });
  S.sessions.forEach(s=>{
    if(s.startedAt < from || s.startedAt >= to) return;
    s.entries.forEach(e=>{
      const mm = musclesFor(e.name);
      if(!mm) return;
      e.sets.forEach(st=>{
        if(!isWorkingSet(st)) return;
        const w = parseFloat(st.weight)||0, reps = parseFloat(st.reps)||0;
        Object.keys(mm).forEach(g=>{
          if(!GROUPS[g]) return;
          const share = headShares(e.name, g);
          Object.keys(share).forEach(r=>{
            const c = mm[g] * share[r];
            if(c <= 0) return;
            sets[r] += c;
            vol[r]  += w * reps * c;
            exs[r][e.name] = (exs[r][e.name]||0) + c;
          });
        });
      });
    });
  });
  // share of the parent group's head total, so "this head is doing 8% of your triceps work"
  const share = {};
  GKEYS.forEach(g=>{
    const rs = GROUP_REGIONS[g] || [];
    const tot = rs.reduce((t,r)=>t+sets[r], 0);
    rs.forEach(r=>{ share[r] = tot > 0 ? sets[r]/tot : 0; });
  });
  return {sets, vol, share, exs};
}

   Three layers, back to front:
     1. bm-weld: every path stroked thickly in one dark tone. The strokes overlap so the
        whole body fuses into a single silhouette, which outlines the figure and fills
        the seams so the page never shows through between muscles.
     2. the non-muscle parts (head, hair, hands, knees, ankles, feet)
     3. one <g> per REGION, filled by the selected metric. Regions with no logged work
        stay the neutral light grey, so a glance tells you what you have and haven't
        trained without having to read a single number.                              */
function mmPaths(list){ return list.map(d=>`<path d="${d}"/>`).join(""); }
/* All of a group's paths for one view, so a group can be drawn as a single shape. */
function groupPaths(g, view){
  return (GROUP_REGIONS[g]||[]).map(r=>(MM_REGIONS[r]&&MM_REGIONS[r][view])||[]).flat();
}
/* Some regions are a clipped portion of a bigger path (the front delt is carved out of
   the whole shoulder cap). Wrap them so the clip applies. */
function clipWrap(key, view, inner){
  const c = MM_CLIP[key] && MM_CLIP[key][view];
  if(!c) return inner;
  const id = "clip-"+key+"-"+view;
  const rects = c.map(r=>`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}"/>`).join("");
  return `<defs><clipPath id="${id}">${rects}</clipPath></defs><g clip-path="url(#${id})">${inner}</g>`;
}
/* TWO LEVELS.
   Nothing selected: one colour per muscle GROUP, so the figure reads as a dozen clean
   shapes rather than 37 competing ones. Tap a group and it drills in: that group splits
   into its individual heads while everything else fades back, so you are only ever
   looking at as much detail as you asked for. */
/* Shapes that still have to be DRAWN so the silhouette has no holes in it, but are no
   longer tracked muscles. Shins live here: the outline stays, the colour and the tap
   target are gone. */
const MM_RETIRED = ["tibialis"];
function retiredPaths(view){
  return MM_RETIRED.map(k=>(MM_REGIONS[k]&&MM_REGIONS[k][view])||[]).flat();
}
function bodyViewSVG(view, A, metric, label){
  const inert = MM_INERT[view].concat(retiredPaths(view));
  // weld from every shape that exists, tracked or not, so no seam shows through
  const all = Object.keys(MM_REGIONS).map(k=>(MM_REGIONS[k]&&MM_REGIONS[k][view])||[]).flat().concat(MM_INERT[view]);
  const focus = BODY_FOCUS;
  let out = `<svg viewBox="${MM_VIEW[view]}" role="img" aria-label="${label} of body">`;
  out += `<g class="bm-weld">${mmPaths(all)}</g>`;
  out += `<g class="bm-inert">${mmPaths(inert)}</g>`;
  GKEYS.forEach(g=>{
    const paths = groupPaths(g, view);
    if(!paths.length) return;
    if(focus && focus !== g){
      // not the muscle you are looking at: one flat muted shape, still tappable to switch
      out += `<g class="bm-m bm-dim" data-g="${g}"><title>${esc(gName(g))}</title>${mmPaths(paths)}</g>`;
      return;
    }
    if(focus === g && BODY_EXPAND){
      // split: each head on its own, so you can see which one is carrying the group
      (GROUP_REGIONS[g]||[]).forEach(r=>{
        const p = (MM_REGIONS[r] && MM_REGIONS[r][view]) || [];
        if(p.length) out += bmGroup(r, clipWrap(r, view, mmPaths(p)), A, metric, true);
      });
      return;
    }
    // selected but not yet split: the whole group, lit and outlined
    out += bmGroup(g, mmPaths(paths), A, metric, false, focus === g);
  });
  return out + `</svg>`;
}
function bodyFrontSVG(A, metric){ return bodyViewSVG("front", A, metric, "Front"); }
function bodyBackSVG(A, metric){  return bodyViewSVG("back",  A, metric, "Back");  }

// The one-line headline about whichever muscle is most extreme on this metric.
function headlineFor(metric, r){
  const n = r.mm.v;
  if(metric==="fatigue")  return n>=60 ? "is the most worn out right now." : n>=30 ? "is the most tired, but nothing's overcooked." : " and everything else, is fresh.";
  if(metric==="volume")   return r.mm.note+".";
  if(metric==="recovery") return n<=40 ? "still needs more time before another hard session." : n<=80 ? "is the closest to still needing rest." : " and everything else, is recovered and ready.";
  if(metric==="growth")   return n>=65 ? "is growing fastest right now." : n>=45 ? "is holding steady, like the rest." : "has gone backwards since the last block.";
  return n>=55 ? "is the one to back off on." : "is your highest flag, and it's still low.";
}
let BODY_METRIC = "fatigue";
let BODY_FOCUS = null;   // the muscle group you have selected
let BODY_EXPAND = false; // whether that group is split into its individual heads
let BODY_OPEN = {};      // which collapsible sections are expanded
function bodyToggle(k){ BODY_OPEN[k] = !BODY_OPEN[k]; render(); }
function sectionCard(key, title, sub, body, count){
  const open = !!BODY_OPEN[key];
  return `<div class="card sec">
    <button class="sec-h" data-sec="${key}">
      <span class="sec-t">${title}${count!=null?`<span class="sec-n">${count}</span>`:""}</span>
      <span class="sec-x">${open?"\u2212":"+"}</span>
    </button>
    ${sub?`<div class="sec-sub">${sub}</div>`:""}
    ${open?`<div class="sec-b">${body}</div>`:""}
  </div>`;
}

/* The line under the figure. It always says where you are and what a tap does next.

   The figure opens at MAJOR MUSCLE level and stays there. Splitting a group into its
   individual heads is now an explicit action ("Break it down") rather than something a
   second tap does by accident, because 37 competing shapes is not a picture anyone can
   read, and the heads only mean anything once you have picked a muscle to study. */
function drillBarHTML(A, metric){
  if(!BODY_FOCUS){
    return `<div class="bm-tap">Tap any muscle to see how it's doing.</div>`;
  }
  const g = BODY_FOCUS, heads = GROUP_REGIONS[g] || [];
  const gm = groupTileMetric(A, g, metric);
  const L = A.lm[g] || adjustedLandmarks(A, g);
  const queued = (A.cyc && A.cyc.pending[g]) || 0;
  const stat = A.wk[g].sets > 0
    ? r1(A.wk[g].sets)+" of "+L.mav+" target sets "+A.win.short
    : queued > 0
      ? "not trained yet, "+r1(queued)+" sets due on "+dayList(pendingDayNames(A.cyc, g))
      : "no work logged "+A.win.short;
  if(!BODY_EXPAND){
    return `<div class="bm-drill">
      <span><b>${esc(gName(g))}</b><br><small>${esc(stat)}${
        gm.txt && gm.v != null && metric !== "volume"
          ? " · "+esc(metricLabel(metric, A.win).toLowerCase())+" "+esc(gm.txt) : ""
      }</small></span>
      <span style="display:flex;gap:7px;flex-shrink:0">
        <button data-gdetail="${g}">Analyse</button>
        ${heads.length>1 ? `<button data-g2="${g}" style="background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)">Break it down</button>` : ""}
      </span>
    </div>
    <div class="bm-tap" style="margin-top:7px"><button class="bm-clear" id="bmBack">Clear selection</button></div>`;
  }
  return `<div class="bm-drill">
      <span>The <b>${heads.length} parts</b> of your ${esc(gName(g).toLowerCase())}. Tap one for what it is and how to train it.</span>
      <button id="bmBack">Back to all muscles</button>
    </div>
    <div class="bm-heads" style="margin-top:9px;border:none;padding:0">${heads.map(r=>{
      const rm = regionMetric(A, r, metric);
      return `<button class="bm-head" data-mrow="${r}" style="border-color:${rm.color}66">
        <span class="bm-hdot" style="background:${rm.color}"></span>${esc(REGIONS[r].name)}
        <small>${esc(rm.txt)}</small></button>`;
    }).join("")}</div>`;
}

/* =====================================================================
   BODY TAB

   Reordered around one question per card, top to bottom, so it reads as an argument
   rather than a pile of panels:

     1. WHICH PICTURE   the metric picker
     2. THE PICTURE     the figure, major muscles only
     3. THE HEADLINE    one sentence, plus the two numbers that frame it
     4. WHAT TO FIX     the actions, open by default, each one drillable
     5. EVERY MUSCLE    the full table, groups only
     6. YOUR CYCLE      zoomed out to overall load

   Removed on the way: "What am I looking at?" (its content is now the permanent
   one-liner over the figure and the hover glosses on the terms themselves) and the
   "Jargon buster" grid (every term in the app is tappable in place, so a separate
   dictionary of the same entries was a second, worse way to reach them). "How your
   targets are set" moved to Settings, where the rest of the configuration lives.
   ===================================================================== */
function viewBody(){
  const metric = BODY_METRIC;
  let h = `<div class="hdr"><h1>Body</h1>${hdrRight()}</div>`;
  if(!S.sessions.length){
    return h + `<div class="empty">Log a workout or two and this map fills in. It shows which muscles you have trained, how tired each one is, and where the gaps are.</div>`;
  }
  const A = bodyAnalysis();
  const win = A.win;

  /* -------- 1 + 2. the picture, with nothing above it but the picker -------------- */
  h += `<div class="metric-scroll"><div class="metric-seg">${
    METRICS.map(m=>`<button data-metric="${m.id}" class="${m.id===metric?"on":""}">${esc(metricLabel(m.id, win))}</button>`).join("")
  }</div></div>`;

  h += `<div class="card bm-card">
    <div class="bm-oneline">${esc(metricOneLiner(metric, win))}</div>
    <div class="bm-figs">
      <div class="bm-fig">${bodyFrontSVG(A, metric)}<div class="bm-fig-label">Front</div></div>
      <div class="bm-fig">${bodyBackSVG(A, metric)}<div class="bm-fig-label">Back</div></div>
    </div>
    <div class="bm-legend">${metricLegend(metric)}<span class="bm-lg"><span class="bm-sw" style="background:${C_GREY}"></span>${A.cyc.complete?"not trained":"not trained yet"}</span></div>
    ${drillBarHTML(A, metric)}
  </div>`;

  /* -------- 3. the headline -------------------------------------------------------
     Ranked at GROUP level, not head level. Reading "your triceps long head is the most
     fatigued thing on your body" as the top-line summary was technically true and
     practically useless; the group is the level you can act at.                     */
  const grank = GKEYS.filter(g=>!GROUPS[g].optional).map(g=>({g, mm:groupTileMetric(A, g, metric)}));
  const dir = (metric==="recovery"||metric==="growth") ? 1 : -1;
  const scored = grank.filter(x=>x.mm.v!=null).sort((a,b)=> dir===1 ? a.mm.v-b.mm.v : b.mm.v-a.mm.v);
  const worst = scored[0];
  /* A muscle with no logged work is two different statements depending on where the
     rotation has got to, and saying "your quads got no work" on day two of a cycle whose
     legs day is on Friday is simply wrong. They're split accordingly. */
  const cyc = A.cyc;
  const blank = grank.filter(x=>x.mm.v==null);
  const queued = blank.filter(x=>(cyc.pending[x.g]||0) > 0);
  const untrained = blank.filter(x=>!((cyc.pending[x.g]||0) > 0));
  const t = A.totals;
  h += `<div class="card bm-lead">
    <div class="bm-lead-k">In one line</div>
    <div class="bm-lead-v">
      <span class="bm-dot" style="background:${DAY_HEX[cyc.remaining[0]] || C_GREY}"></span>
      <span>${cyc.complete
        ? `A full <b>${cyc.total} of ${cyc.total}</b> workouts done: this cycle is complete, so everything below is a whole rotation's worth of training.`
        : `You're <b>${cyc.done} of ${cyc.total}</b> workouts into this cycle, with ${esc(dayList(cyc.names))} still to come. Anything those days will cover is counted as scheduled, not missing.`}</span>
    </div>
    ${worst?`<div class="bm-lead-v">
      <span class="bm-dot" style="background:${worst.mm.color}"></span>
      <span><b>${esc(gName(worst.g))}</b> ${esc(headlineFor(metric, {mm:worst.mm}))}</span>
    </div>`:""}
    ${queued.length?`<div class="bm-lead-v">
      <span class="bm-dot" style="background:${C_GREY}"></span>
      <span><b>${queued.length}</b> muscle group${queued.length===1?"":"s"} ${queued.length===1?"hasn't":"haven't"} come round yet: ${esc(queued.slice(0,4).map(x=>gName(x.g)).join(", "))}${queued.length>4?" and "+(queued.length-4)+" more":""}. Their work sits on days you still have left, so it isn't counted as missing.</span>
    </div>`:""}
    ${untrained.length?`<div class="bm-lead-v">
      <span class="bm-dot" style="background:${C_GREY}"></span>
      <span><b>${untrained.length}</b> muscle group${untrained.length===1?"":"s"} got no work ${esc(win.short)}${cyc.complete?"":" and nothing left in this cycle trains "+(untrained.length===1?"it":"them")}: ${esc(untrained.slice(0,4).map(x=>gName(x.g)).join(", "))}${untrained.length>4?" and "+(untrained.length-4)+" more":""}.</span>
    </div>`:""}
    <div class="bm-lead-v" style="border-top:1px solid var(--line);margin-top:11px;padding-top:11px">
      <span class="bm-dot" style="background:${ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], t.fat/100)}"></span>
      <span><b>${t.setsWk}</b> working sets over ${esc(win.label)}, at <b>${t.fat}%</b> average ${term("fatigue","tiredness")}.</span>
    </div>
  </div>`;

  /* -------- 4. what to fix, open by default, every row drillable ------------------ */
  const spanDays = (Date.now() - S.sessions[0].startedAt)/DAY_MS;
  const enoughWP = S.sessions.length >= 4 && spanDays >= 6;
  let wpBody = "";
  if(!enoughWP){
    wpBody = `<div class="sub">This needs at least 4 sessions across a full week before it can tell a real weak point from a rotation that hasn't come round yet. You're at ${S.sessions.length} session${S.sessions.length===1?"":"s"} over ${Math.max(1,Math.round(spanDays))} day${Math.round(spanDays)===1?"":"s"}, and ${cyc.done} of ${cyc.total} workouts into this cycle.</div>`;
  } else if(!A.weak.length){
    wpBody = `<div class="sub">Nothing to fix. Every muscle group is inside its productive volume range, balanced against its opposite, and either progressing or holding.${
      cyc.complete ? "" : " Muscles still waiting on "+esc(dayList(cyc.names))+" are counted as covered, not short."}</div>`;
  } else {
    const show = BODY_OPEN.wpall ? A.weak : A.weak.slice(0,3);
    wpBody = show.map((w,i)=>`<button class="wp sev${w.sev}" data-wp="${A.weak.indexOf(w)}">
        <span class="wp-rank">${i+1}</span>
        <span class="wp-body">
          <span class="wp-who">${esc(gName(w.muscle))}<span class="wp-sev">· ${w.sev>=3?"high priority":w.sev===2?"worth fixing":"minor"}</span></span>
          <span class="wp-do">${esc(w.act)}</span>
          <span class="wp-why">${esc(w.why)}</span>
          <span class="wp-more">Show me what this is about</span>
        </span>
        <span class="wp-chev">›</span>
      </button>`).join("");
    if(A.weak.length > 3){
      wpBody += `<button class="more-btn" data-sec="wpall">${BODY_OPEN.wpall?"Show fewer":"Show "+(A.weak.length-3)+" more"}</button>`;
    }
  }
  BODY_OPEN.fix = BODY_OPEN.fix===undefined ? true : BODY_OPEN.fix;   // open by default
  h += sectionCard("fix", "What to fix",
    "In order of what would help most. Tap any one to see the exercises and numbers behind it.",
    wpBody, enoughWP ? A.weak.length : null);

  /* -------- 5. every muscle, GROUPS ONLY ------------------------------------------
     This list used to print every group followed by a row of chips for each of its
     individual heads: 21 groups plus 37 heads, 58 tappable things, in a section whose
     job is "let me scan everything at once". Heads belong behind a muscle you have
     deliberately opened, not in the overview.                                       */
  let listBody = "";
  const shownGroups = GKEYS.filter(g=>!GROUPS[g].optional || A.wk[g].sets > 0);
  AREA_ORDER.forEach(area=>{
    const groups = shownGroups.filter(g=>AREA_OF[g]===area);
    if(!groups.length) return;
    let rows = "";
    groups.forEach(g=>{
      const L = A.lm[g] || adjustedLandmarks(A, g);
      const gm = muscleMetric(A, g, metric);
      const trained = A.wk[g].sets > 0;
      const q = cyc.pending[g] || 0;
      const val = metric==="volume"
        ? r1(A.wk[g].sets)+" / "+L.mav+" sets"
        : (trained ? gm.txt : (q > 0 ? "still to come" : "not trained"));
      const col = trained ? gm.color : C_GREY;
      // an untrained muscle with work still queued says so, rather than reading as a gap
      const note = (!trained && q > 0)
        ? r1(q)+" sets scheduled on "+dayList(pendingDayNames(cyc, g))
        : (gm.note || "");
      rows += `<button class="bm-row" data-grow="${g}" style="width:100%;background:none;border:none;border-bottom:1px solid var(--line);text-align:left;color:var(--text);font:inherit">
        <span class="bm-swatch" style="background:${col}"></span>
        <span class="bm-name"><span>${esc(gName(g))}</span><small>${esc(GROUP_REGIONS[g].length)} part${GROUP_REGIONS[g].length===1?"":"s"} · ${esc(note)}</small></span>
        <span class="bm-right">
          <span class="bm-val">${esc(val)}</span>
          <span class="bm-bar"><i style="width:${Math.max(3,gm.v==null?0:gm.v)}%;background:${col}"></i></span>
        </span>
      </button>`;
    });
    listBody += `<div class="bm-area">${esc(area)}</div><div class="bm-rank">` + rows + `</div>`;
  });
  h += sectionCard("all", "Every muscle",
    "Your "+shownGroups.length+" major muscle groups. Tap one to open it and, if you want, split it into its parts.",
    listBody, shownGroups.length);

  /* -------- 6. the whole cycle ---------------------------------------------------- */
  const acwrNote = t.acwr==null ? "needs 4 weeks of history to mean anything"
    : t.acwr > 1.5 ? "you ramped up fast, which is the classic injury warning sign"
    : t.acwr < 0.8 ? "well under your usual, fine for a light spell"
    : "a safe, steady rate of change";
  h += sectionCard("week", "Your training load",
    "Zoomed out from individual muscles to the whole of you.",
    `<div class="sys-grid">
      <div class="sys-tile"><div class="sys-k">${term("hardset","Working sets")} ${esc(win.short)}</div>
        <div class="sys-v">${t.setsWk}</div>
        <div class="sys-s">${t.setsPrev>0?(t.setsWk>=t.setsPrev?"+":"")+Math.round((t.setsWk-t.setsPrev)/t.setsPrev*100)+"% vs "+esc(win.prevLabel):"first "+esc(win.short.replace(/^this /,""))+" on record"}</div></div>
      <div class="sys-tile"><div class="sys-k">${term("acwr","Load change")}</div>
        <div class="sys-v" style="color:${t.acwr==null?"var(--dim)":(t.acwr>1.5||t.acwr<0.8)?"var(--arms)":"var(--ok)"}">${t.acwr==null?"—":t.acwr.toFixed(2)+"×"}</div>
        <div class="sys-s">${acwrNote}</div></div>
      <div class="sys-tile"><div class="sys-k">Average ${term("fatigue","tiredness")}</div>
        <div class="sys-v" style="color:${ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], t.fat/100)}">${t.fat}%</div>
        <div class="sys-s">${t.fat>=60?"worn down, a lighter week would pay off":t.fat>=35?"normal mid-block tiredness":"fresh across the board"}</div></div>
      <div class="sys-tile"><div class="sys-k">Highest ${term("injury","risk flag")}</div>
        <div class="sys-v" style="color:${ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], t.inj/100)}">${t.inj}%</div>
        <div class="sys-s">${t.inj>=55?"at least one muscle is being pushed too hard":"nothing above moderate"}</div></div>
    </div>
    ${A.modInfo.why.length?`<div class="bm-explain" style="margin-top:12px">Recovery adjusted for your check-ins: ${esc(A.modInfo.why.join("; "))}.</div>`:
      `<div class="bm-explain" style="margin-top:12px;color:var(--faint)">Log sleep and energy in your daily check-in and recovery gets adjusted for them.</div>`}
    <div class="bm-explain" style="margin-top:12px;color:var(--faint)">Volume is counted over <b>${esc(win.label)}</b>, and your targets are scaled to match. Change this, and see where the targets come from, in <b>Settings</b>.</div>`);

  h += `<div class="bm-credit">Anatomy from <a href="https://github.com/melihcolpan/MuscleMap" target="_blank" rel="noopener">MuscleMap</a> by Melih Colpan, MIT licence</div>`;
  return h;
}

/* ---------- a weak point, opened ----------
   The whole point of making these tappable: a finding is only trustworthy if you can
   see the sets that produced it. This shows the muscle's position against its own
   thresholds, then every exercise that fed it and by how much, then the reasoning. */
function openWeakPoint(idx){
  const A = bodyAnalysis();
  const w = A.weak[idx];
  if(!w) return;
  const g = w.muscle, G = GROUPS[g], L = A.lm[g], o = A.wk[g];
  const sets = o.sets;
  const gm = muscleMetric(A, g, "volume");
  // Counted at GROUP level. Summing the per-head numbers would double-count, because
  // one set of a pressing movement pays into all three heads of the chest.
  const exs = o.exs || {};
  const names = Object.keys(exs).sort((a,b)=>exs[b]-exs[a]);

  // the bar runs 0 → a little past MRV, so "over the ceiling" is visible rather than clipped
  const pos = Math.max(0, Math.min(100, sets/Math.max(1, L.mrv*1.15)*100));

  let h = `<h3>${esc(w.act)}</h3>
  <div class="wd-lead"><b>${esc(w.title)}.</b><br>
    <span style="color:var(--dim);font-size:14px">${esc(w.why)}</span></div>

  <div class="rev-head">Where it sits</div>
  <div class="wd-meter">
    <span class="wd-track">
      <i style="width:${pos}%;background:${gm.color}"></i>
    </span>
    <span class="num" style="flex-shrink:0;font-size:14px">${r1(sets)} sets</span>
  </div>
  <div class="wd-marks">
    <span>0</span><span>${term("mev","MEV")} ${L.mev}</span><span>${term("mav","MAV")} ${L.mav}</span><span>${term("mrv","MRV")} ${L.mrv}</span>
  </div>
  <div class="sub" style="margin:-2px 0 4px;color:var(--faint)">Counted over ${esc(A.win.label)}, with the thresholds scaled to match.</div>

  <div class="rev-head">What's feeding it, ${esc(A.win.short)}</div>`;
  if(names.length){
    names.forEach(n=>{
      h += `<div class="wd-ex"><b>${esc(n)}</b><span class="num">${r1(exs[n])} sets</span></div>`;
    });
    h += `<div class="bm-explain" style="margin-top:9px">Notice the fractions: a set is not worth the same to every muscle it touches. ${term("weighting","Why")}</div>`;
  } else {
    h += `<div class="wd-none">Nothing at all over ${esc(A.win.label)} — which is the finding.</div>`;
  }

  h += `<div class="rev-head">Why this matters</div>
    <div class="bm-explain">${esc(w.detail)}</div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn small" data-gdetail="${g}">Open ${esc(gName(g))}</button>
      <button class="btn ghost small" id="closeModal">Done</button>
    </div>`;
  showModal(h);
  MODAL_REOPEN = ()=> openWeakPoint(idx);
  document.querySelectorAll("#modal [data-gdetail]").forEach(b=> b.onclick=()=>{
    BODY_FOCUS = g; BODY_EXPAND = false;
    openGroupDetail(g);
  });
}

/* ---------- a whole muscle group, opened ----------
   The top level of the drill-down. Heads are deliberately NOT listed here as data;
   they're offered as one button, so the detail you get is the detail you asked for. */
function openGroupDetail(g){
  const G = GROUPS[g];
  if(!G) return;
  const A = bodyAnalysis();
  const L = A.lm[g] || adjustedLandmarks(A, g);
  const o = A.wk[g], st = A.state[g], gr = A.grow[g], inj = A.inj[g];
  const heads = GROUP_REGIONS[g] || [];
  const line = (k,v,c)=>`<div class="rev-line"><b>${k}</b><span class="num"${c?` style="color:${c}"`:""}>${v}</span></div>`;
  const lastTxt = o.lastMs
    ? (()=>{ const hrs = Math.round((Date.now()-o.lastMs)/3600e3);
             return hrs < 48 ? hrs+" h ago" : Math.round(hrs/24)+" days ago"; })()
    : "not in this window";
  // which of the days you have left this cycle actually carry work for this muscle
  const queued = A.cyc.pending[g] || 0;
  const queuedDays = pendingDayNames(A.cyc, g);

  let h = `<h3>${esc(G.name)}</h3>
  <div class="md-what">
    <div class="md-row"><span class="md-k">Right now</span><span>${esc(st.txt.charAt(0).toUpperCase()+st.txt.slice(1))}.</span></div>
    <div class="md-row"><span class="md-k">Made of</span><span>${esc(heads.map(r=>REGIONS[r].name).join(", "))}.</span></div>
  </div>

  <div class="rev-head">Your ${esc(G.name.toLowerCase())}, ${esc(A.win.short)}</div>
  ${line(term("hardset","Hard sets"), r1(o.sets)+" of "+L.mav+" target", muscleMetric(A,g,"volume").color)}
  ${line("Your range", term("mev","MEV")+" "+L.mev+" / "+term("mav","MAV")+" "+L.mav+" / "+term("mrv","MRV")+" "+L.mrv)}
  ${line("Trained", lastTxt+", "+(o.days||0)+" session"+((o.days||0)===1?"":"s"))}
  ${queued > 0 ? line("Still scheduled", r1(queued)+" sets on "+dayList(queuedDays)) : ""}
  ${line(term("fatigue","How tired"), A.fat[g]+"%", ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], A.fat[g]/100))}
  ${line(term("recovery","How recovered"), A.rec[g]+"%", ramp([[0,C_BAD],[.5,C_WARN],[1,C_OK]], A.rec[g]/100))}
  ${line(term("injury","Injury risk"), inj.score+"%", ramp([[0,C_OK],[.5,C_WARN],[1,C_BAD]], inj.score/100))}
  ${line(term("growth","Growth"), gr.score==null?"no recent data":(gr.isNew?"first block":(gr.strP>=0?"+":"")+Math.round(gr.strP*100)+"% strength"), gr.score==null?null:ramp([[0,C_BAD],[.5,C_FLAT],[1,C_OK]], gr.score/100))}`;

  const exs = Object.keys(o.exs||{}).sort((a,b)=>o.exs[b]-o.exs[a]);
  h += `<div class="rev-head">What's feeding it</div>`;
  if(exs.length){
    exs.forEach(n=> h += `<div class="wd-ex"><b>${esc(n)}</b><span class="num">${r1(o.exs[n])} sets</span></div>`);
    h += `<div class="bm-explain" style="margin-top:9px">A set is not worth the same to every muscle it touches. ${term("weighting","Why the fractions")}</div>`;
  } else {
    h += `<div class="wd-none">Nothing in ${esc(A.win.label)}${
      queued > 0 ? `. Its work sits on ${esc(dayList(queuedDays))}, which ${queuedDays.length===1?"hasn't":"haven't"} come round yet this cycle` : ""}.</div>`;
  }

  const spanDays = S.sessions.length ? (Date.now() - S.sessions[0].startedAt)/DAY_MS : 0;
  const mine = (S.sessions.length >= 4 && spanDays >= 6) ? A.weak.filter(w=>w.muscle===g) : [];
  if(mine.length){
    h += `<div class="rev-head">Flagged</div>`;
    mine.forEach(w=> h += `<div class="wp sev${w.sev}" style="cursor:default">
      <span class="wp-rank">!</span>
      <span class="wp-body"><span class="wp-do">${esc(w.act)}</span><span class="wp-why">${esc(w.detail)}</span></span>
    </div>`);
  }

  h += heads.length > 1
    ? `<div class="btn-row" style="margin-top:16px">
        <button class="btn small" id="gSplit">Break into its ${heads.length} parts</button>
        <button class="btn ghost small" id="closeModal">Done</button>
      </div>
      <div class="sub" style="margin-top:8px;color:var(--faint)">Volume targets only exist at group level; there's no research at head level, and no exercise isolates a single head cleanly enough to aim at one. Heads are judged on their share of the group's work instead.</div>`
    : `<button class="btn" style="margin-top:16px" id="closeModal">Done</button>`;
  showModal(h);
  MODAL_REOPEN = ()=> openGroupDetail(g);
  const sp = $("#gSplit");
  if(sp) sp.onclick = ()=>{
    BODY_FOCUS = g; BODY_EXPAND = true;
    hideModal();
    if(TAB !== "body"){
      TAB = "body";
      document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on", x.dataset.tab==="body"));
    }
    render();
    window.scrollTo(0,0);
    showNav();
  };
}
/* Tapping any head opens this. It is the main place a beginner learns what a muscle
   even is, so it leads with plain English and puts the numbers underneath. */
function openMuscleDetail(key){
  const R = REGIONS[key];
  if(!R){ return openGroupDetail(key); }             // a group key drills to its own card
  const g = R.g, G = GROUPS[g];
  const A = bodyAnalysis();
  const L = A.lm[g] || adjustedLandmarks(A, g);
  const own = A.rwk.sets[key] || 0;
  const share = A.rwk.share[key] || 0;
  const heads = GROUP_REGIONS[g];

  let h = `<h3>${esc(R.name)}</h3>
  <div class="md-what">
    <div class="md-row"><span class="md-k">What it is</span><span>Part of your <b>${esc(G.name.toLowerCase())}</b>. Also called the ${esc(R.tech)}.</span></div>
    <div class="md-row"><span class="md-k">Where</span><span>${esc(R.where)}.</span></div>
    <div class="md-row"><span class="md-k">How to train it</span><span>${esc(R.cue)}</span></div>
  </div>`;

  // this head's own share of the group, which is the whole point of head-level tracking
  if(heads.length > 1){
    const fair = 1/heads.length;
    const rel = share/fair;
    const verdict = own <= 0 ? "Nothing is training this head at the moment."
      : rel < 0.5 ? "This head is getting well under its fair share of your "+G.name.toLowerCase()+" work."
      : rel > 1.4 ? "This head is taking the lion's share of your "+G.name.toLowerCase()+" work."
      : "This head is getting a fair share of your "+G.name.toLowerCase()+" work.";
    h += `<div class="rev-head">Its share of your ${esc(G.name.toLowerCase())}</div>
      <div class="md-share">
        ${heads.map(r=>{
          const s = A.rwk.share[r]||0;
          const on = r===key;
          return `<div class="md-sh${on?" on":""}"><span>${esc(REGIONS[r].name)}${on?" (this one)":""}</span>
            <span class="md-shbar"><i style="width:${Math.round(s*100)}%"></i></span>
            <span class="num">${Math.round(s*100)}%</span></div>`;
        }).join("")}
      </div>
      <div class="bm-explain" style="margin-top:8px">${esc(verdict)} An even split would be about ${Math.round(fair*100)}% each.</div>`;
  }

  // WHAT IS FEEDING IT
  const exs = Object.keys(A.rwk.exs[key]||{}).sort((a,b)=>A.rwk.exs[key][b]-A.rwk.exs[key][a]);
  h += `<div class="rev-head">What's feeding it, ${esc(A.win.short)}</div>`;
  if(exs.length){
    exs.forEach(n=> h += `<div class="wd-ex"><b>${esc(n)}</b><span class="num">${r1(A.rwk.exs[key][n])} sets</span></div>`);
  } else {
    h += `<div class="wd-none">Nothing in ${esc(A.win.label)}.</div>`;
  }

  h += `<div class="btn-row" style="margin-top:16px">
      <button class="btn small" data-gopen="${g}">Back to ${esc(G.name)}</button>
      <button class="btn ghost small" id="closeModal">Done</button>
    </div>`;
  showModal(h);
  MODAL_REOPEN = ()=> openMuscleDetail(key);
  document.querySelectorAll("#modal [data-gopen]").forEach(b=> b.onclick=()=> openGroupDetail(g));
}

  h += `<div class="btn-row" style="margin-bottom:14px">
    <button class="btn ghost small" id="reportBtn">Print / PDF report</button>

  </div>`;
  const rl = (S.restLog||[]).slice().sort();
  h += `<div class="card">
    <div class="ex-head" style="margin-bottom:8px"><b style="font-family:var(--disp);font-size:16px;text-transform:uppercase;letter-spacing:.04em">Rest days</b><span class="sub num">${rl.length} total</span></div>
    <div class="sub" style="margin:-2px 0 10px">Every day you've rested, across all cycles. Add or remove rest days in <b>Settings</b>.</div>

  </div>`;
  [...S.sessions].reverse().forEach(s=>{
    const m = dayMeta(s.workoutId);
    const vol = s.entries.reduce((t,e)=>t+e.sets.reduce((u,st)=>u+((parseFloat(st.weight)||0)*(parseFloat(st.reps)||0)),0),0);
    const q = s.quality;

    const qc = q ? gradeColor(q.pct) : null;
    h += `<div class="card sess" data-sess="${s.id}">
      <div class="row1">
        <div style="display:flex;align-items:center;gap:9px">
          <span class="dot" style="background:${m.color}"></span><b>${m.name}</b>
        </div>
        <span style="display:flex;align-items:center;gap:8px">
          ${q?`<span class="sc-badge" style="color:${qc};background:${qc}22">${q.grade} · ${Math.round(q.pct*100)}%</span>`:""}
          <span class="sub num">${fmtDate(s.date)}</span>
        </span>
      </div>
      <div class="sub num" style="margin-top:2px">${s.entries.length} exercises · ${Math.round(vol).toLocaleString()} lb total${s.feel?' · '+FEELS[s.feel-1]:''}${nPr?' · 🔥 '+nPr+' PR'+(nPr>1?"s":""):''}</div>
      ${s.note?`<div class="sub" style="margin-top:4px;font-style:italic">"${esc(s.note)}"</div>`:""}
      <div class="detail">${s.entries.map((e,i)=>
        `<div class="exline"><b>${esc(e.name)}</b>
          <span class="icon-btns ex-ctl" style="float:right;margin-top:-4px">
            <button data-hup="${s.id}:${i}" aria-label="Move earlier">↑</button>
            <button data-hdown="${s.id}:${i}" aria-label="Move later">↓</button>
          </span>
          <br><span class="num">${setListHTML(e)}</span></div>`
      ).join("")}
      <div class="btn-row" style="margin-top:8px">
        <button class="btn ghost small" data-scoresess="${s.id}">${q?"Quality "+q.grade:"Grade it"}</button>
        <button class="btn ghost small" data-editsess="${s.id}">Edit session</button>
      </div>
      <div class="btn-row">
        ${s.date===todayStr()?`<button class="btn ghost small" data-resumesess="${s.id}">Resume</button>`:""}
        <button class="btn ghost small danger" data-delsess="${s.id}">Delete session</button>
      </div></div>
    </div>`;
  });
  return h;
}

// Does the plan actually use the ⇄ alternating-variant feature? Explaining a symbol
// that appears nowhere on the screen is noise, and noise is what makes a settings-heavy
// app feel complicated.
function hasAltExercises(){
  return DAYS.some(d=>(S.program[d]||[]).some(e=>e && e.alt));
}
function viewProgram(){
  let h = `<div class="hdr"><h1>Program</h1>${hdrRight()}</div>
  <div class="sub" style="margin:-8px 2px 14px">Your rotation: ${ROTATION.map(w=>dayName(w)).join(" → ")}.${
    hasAltExercises() ? " Exercises marked ⇄ alternate automatically every other session of that day." : ""
  } Targets show <span class="rpe-help">RPE</span>, tap to see what it means.</div>
  <div class="btn-row" style="margin-bottom:10px">
    <button class="btn ghost small" id="planBtn">📄 View / download full plan</button>
    <button class="btn ghost small" id="splitBtn">📅 Change schedule</button>
  </div>
  <div class="btn-row" style="margin-bottom:16px">
    <button class="btn ghost small" id="aiImportBtn" style="flex:1">✨ Import a plan</button>
  </div>
  <div class="sub" style="margin:-8px 2px 16px;font-size:12.5px;color:var(--faint)">The whole schedule as a document: every day, every exercise, sets, reps, RPE, loads, the ⇄ pairs, and what each muscle gets per cycle. Print it, save it as a Word file, or hand it to a coach.</div>`;
  DAYS.forEach(wid=>{
    const m = dayMeta(wid);
    h += `<div class="card">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <span class="dot" style="background:${m.color}"></span><h3>${m.name}</h3>
        <button class="linklike" data-renameday="${wid}" style="margin-left:auto;font-size:12.5px">rename</button>
      </div>`;
    // `|| []` rather than a bare index: a day key can legitimately be missing for a
    // moment after a sync restores an older plan, and a thrown Program tab is a much
    // worse failure than an empty card.
    (S.program[wid] || []).forEach((e,i)=>{
      const nextUp = e.alt ? (activeVariant(wid,e)===e ? e.name : e.alt.name) : null;
      const asty = altStyle(e);
      let title = esc(e.name)
        + supersetBadge(supersetInfo(S.program[wid] || [], i))
        + (asty === "side"  ? ' <span class="uni-badge">L / R</span>' : '')
        + (asty === "cross" ? ' <span class="uni-badge">crossover</span>' : '')
        + (e.alt ? ' <span class="alt-badge">⇄ '+esc(e.alt.name)+'</span>' : '');
      let meta = `${e.sets}×${esc(e.reps)}${e.rpe?" · "+esc(rpeTxt(e.rpe)):""}${e.weight!=null?" · "+e.weight+" lb":""}${e.note?" · "+esc(e.note):""}`;
      if(e.alt) meta += `<br>next ${m.name.toLowerCase()} day: ${esc(nextUp)}`;
      h += `<div class="prog-ex">
        <div><b>${title}</b><div class="meta">${meta}</div></div>
        <div class="icon-btns">
          <button data-up="${wid}:${i}" aria-label="Move up">↑</button>
          <button data-down="${wid}:${i}" aria-label="Move down">↓</button>
          <button data-edit="${wid}:${i}" aria-label="Edit">✎</button>
        </div>
      </div>`;
    });
    h += `<button class="btn ghost small" data-addex="${wid}" style="margin-top:10px">+ Add exercise</button></div>`;
  });
  /* The finisher, which runs at the end of every workout. It's empty by default,
     because a plan generally puts core work on specific days rather than taxing every one,
     so the full card only appears once there's something in it; otherwise it's one
     quiet line, which keeps the option available without leaving an empty panel. */
  const fin = S.program.finisher || [];
  if(fin.length){
    h += `<div class="card">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:2px">
        <span class="dot" style="background:var(--dim)"></span><h3>Finisher</h3>
      </div>
      <div class="sub" style="margin-bottom:6px">Runs at the end of every workout, in this order.</div>`;
    fin.forEach((e,i)=>{
      h += `<div class="prog-ex">
        <div><b>${esc(e.name)}</b><div class="meta">${e.sets}×${esc(e.reps)}${e.rpe?" · "+esc(rpeTxt(e.rpe)):""}${e.weight!=null?" · "+e.weight+" lb":""}${e.note?" · "+esc(e.note):""}</div></div>
        <div class="icon-btns">
          <button data-up="finisher:${i}" aria-label="Move up">↑</button>
          <button data-down="finisher:${i}" aria-label="Move down">↓</button>
          <button data-edit="finisher:${i}" aria-label="Edit">✎</button>
        </div>
      </div>`;
    });
    h += `<button class="btn ghost small" data-addex="finisher" style="margin-top:10px">+ Add exercise</button></div>`;
  } else {
    h += `<div class="sub" style="text-align:center;margin:4px 2px 8px">
      No finisher. Core work is placed on specific days in your plan rather than taxing every session.
      <button class="linklike" data-addex="finisher" style="margin-left:4px">Add a finisher</button>
    </div>`;
  }
  return h;
}
