const SPLIT_ORDER = ["full3","ul4","ppl3","ppl6","bro5"];
const DEFAULT_SPLIT = "ul4";

/* A split you built yourself lives on the profile as a whole object rather than a key,
   so it survives without needing an entry in SPLITS. */
function currentSplit(){
  if(S && S.customSplit && Array.isArray(S.customSplit.days) && S.customSplit.days.length){
    return S.customSplit;
  }
  return SPLITS[(S && S.splitId)] || SPLITS[DEFAULT_SPLIT];
}
function splitName(){ const sp = currentSplit(); return sp.name + (sp.tag ? ", " + sp.tag : ""); }

/* Build a split from a day count, a rest count and the day names. This is what an
   imported plan becomes: the importer reads how many sessions the programme has and
   what each one is called, and this turns that into the four values applySplit() needs.
   Names are optional — anything unnamed falls back to "Day n" and can be renamed in the
   Program tab. */
function buildCustomSplit(nDays, nRests, names){
  const days = [];
  for(let i = 0; i < nDays; i++){
    days.push({id: "day" + (i+1),
               name: (names && names[i]) || ("Day " + (i+1)),
               short: "D" + (i+1)});
  }
  /* Rests are spread through the cycle rather than stacked at the end, so the plate
     strip reads like a plausible week the moment you see it. They are still credits —
     the layout is a picture, not a schedule. */
  const layout = days.map(d=>d.id);
  const gap = Math.max(1, Math.round(nDays / (nRests + 1)));
  let inserted = 0;
  for(let i = 0; i < nRests; i++){
    const at = Math.min(layout.length, (i+1) * gap + inserted);
    layout.splice(at, 0, "rest");
    inserted++;
  }
  return {name:"My split", tag: nDays + " days a week", custom:true, days, layout};
}

let DAYS = [], ROTATION = [], CYCLE_LAYOUT = [], REST_CREDITS = 0;
let META = {};

/* Turn the chosen split into the four values the rest of the app reads. Called after
   load(), after a sync pull, and any time the split changes. */
function applySplit(){
  const sp = currentSplit();
  DAYS = sp.days.map(d=>d.id);
  ROTATION = DAYS.slice();
  CYCLE_LAYOUT = (sp.layout && sp.layout.length ? sp.layout : DAYS).slice();
  REST_CREDITS = CYCLE_LAYOUT.filter(x=>x === "rest").length;
  META = {};
  sp.days.forEach((d, i)=>{
    META[d.id] = {name:d.name, short:d.short, color:DAY_COLORS[i % DAY_COLORS.length]};
  });
  /* A day key in your history that is not in your CURRENT split still needs a name and
     a colour — you changed split, or imported a log built on a different one, and
     History, the report and the CSV all look up every session they draw. Without this
     they would render "??" against a grey dot, or throw. Marked `legacy` so the picker
     and the Program tab never offer them as somewhere to train today. */
  if(S && Array.isArray(S.sessions)){
    S.sessions.forEach(x=>{
      const id = x && x.workoutId;
      if(!id || META[id]) return;
      META[id] = {name: prettyDayId(id), short: String(id).slice(0,2).toUpperCase(),
                  color: hashColor(id), legacy:true};
    });
  }
}
// "upperA" → "Upper A", "chest" → "Chest". Only ever used for day keys we have lost the
// definition of, so it is a best effort at readability, not a naming scheme.
function prettyDayId(id){
  return String(id)
    .replace(/([a-z])([A-Z])/g, "$1 $2")
    .replace(/[_-]+/g, " ")
    .replace(/\b\w/g, c=>c.toUpperCase())
    .trim();
}
function hashColor(id){
  let h = 0;
  String(id).split("").forEach(c=>{ h = (h*31 + c.charCodeAt(0)) >>> 0; });
  return DAY_COLORS[h % DAY_COLORS.length];
}
/* Never returns undefined. Every call site that used to do META[id].name unguarded now
   goes through here, so an unknown key from a corrupted or hand-edited log degrades to
   a readable placeholder instead of taking the whole screen down. */
function dayMeta(id){
  return META[id] || {name: prettyDayId(id || "Workout"), short:"??", color:"var(--dim)", unknown:true};
}
function dayName(id){ return dayMeta(id).name; }

/* =====================================================================
   REST CREDITS

   How many rests a cycle grants comes from your split's layout (see applySplit), so
   picking a lighter split buys recovery days automatically rather than needing a second
   setting that can drift out of step with the first.

   They are CREDITS, not slots — see the note on the split above for why. Take them back
   to back, take them spread out, take neither; the cycle still rolls over on training
   days completed.

   `S.restDays` holds the dates spent in the CURRENT cycle. `S.restLog` remains the
   permanent all-time record and is untouched by any of this.                        */
function restDaysThisCycle(){
  if(!Array.isArray(S.restDays)) S.restDays = [];
  return S.restDays;
}
function restCreditsLeft(){ return Math.max(0, REST_CREDITS - restDaysThisCycle().length); }
function isRestDay(date){ return restDaysThisCycle().indexOf(date) > -1; }
function isRestToday(){ return isRestDay(todayStr()); }
function takeRestDay(date){
  const list = restDaysThisCycle();
  if(list.indexOf(date) > -1) return false;
  if(list.length >= REST_CREDITS) return false;
  // logging a day you previously deleted lifts the tombstone, or the next merge would
  // filter out the day you just took
  S.restDeleted = restTombstones().filter(d=>d !== date);
  list.push(date); list.sort();
  if(!Array.isArray(S.restLog)) S.restLog = [];
  if(!S.restLog.includes(date)){ S.restLog.push(date); S.restLog.sort(); }
  return true;
}
/* Giving a credit back. `alsoUnlog` separates "I did not actually rest that day",
   which should leave no trace, from "free the credit but I did rest", which keeps the
   day in the permanent log. */
/* Giving a credit back. `alsoUnlog` separates "I did not actually rest that day",
   which should leave no trace, from "free the credit but I did rest", which keeps the
   day in the permanent log.

   A removal has to be RECORDED, not just applied. `S.restLog` and `S.restDays` are
   merged across devices as unions, so deleting a date locally and then syncing simply
   re-adopted it from the remote copy and the rest day came back on the next reload.
   `S.restDeleted` is a tombstone list, exactly like `S.deleted` for sessions: the
   deletion itself is the thing that syncs, so it survives the merge. */
function restTombstones(){
  if(!Array.isArray(S.restDeleted)) S.restDeleted = [];
  return S.restDeleted;
}
function releaseRestDay(date, alsoUnlog){
  S.restDays = restDaysThisCycle().filter(d=>d !== date);
  if(alsoUnlog){
    S.restLog = (S.restLog||[]).filter(d=>d !== date);
    const t = restTombstones();
    if(t.indexOf(date) < 0) t.push(date);
  }
}
// short label for a rest plate that has already been spent
function restPlateLabel(date){
  if(!date) return "rest";
  if(date === todayStr()) return "today";
  const d = new Date(date+"T12:00:00");
  return d.toLocaleDateString(undefined,{month:"numeric",day:"numeric"});
}
/* =====================================================================
   GLOSSARY, every piece of jargon the app uses is tappable.

   Anywhere a term like MEV shows up it's wrapped in term("mev","MEV"), which renders a
   dotted-underlined word. Tapping it opens the entry below. One delegated click
   listener handles the whole app, so it survives every re-render.
   ===================================================================== */
/* The one-line gloss that appears on hover (and as the native tooltip on desktop).
   Tapping still opens the full entry below. Declared above term() because
   VOL_LANDMARK_SCALE calls term() while this file is still being evaluated, so the
   full GLOSSARY object further down would still be in its temporal dead zone. */
const GLOSSARY_TIP = {
  rpe:"How hard a set felt, 1-10. Really it measures how many reps you had left.",
  mev:"Minimum Effective Volume: the least weekly work a muscle needs before it grows at all.",
  mav:"Maximum Adaptive Volume: the productive middle, where each added set still pays off.",
  mrv:"Maximum Recoverable Volume: the most a muscle can recover from. Past it, sets cost fatigue but buy no growth.",
  hardset:"A set taken close enough to failure to count, roughly RPE 7 or above. Warm-ups don't.",
  acwr:"This week's load divided by your recent 4-week average. Over 1.5x is the classic injury spike.",
  e1rm:"What you could probably lift for one rep, worked backwards from a set you actually did.",
  fatigue:"Training residue that hasn't worn off yet, per muscle, right now.",
  recovery:"How far through its own recovery window a muscle is since you last trained it.",
  growth:"Is this muscle progressing? Last 3 weeks of strength and volume against the 3 before.",
  injury:"Five load-based warning flags. A training-load signal, not a diagnosis.",
  overload:"Giving your body slightly more than last time. The one rule that makes training work.",
  failure:"Taking a set until you physically cannot complete another rep with good form. That's RPE 10.",
  deload:"A deliberately easy week: keep the weights, halve the sets, so fatigue drains off.",
  superset:"Two exercises done back to back with no rest between them.",
  restwindow:"How long to wait between sets. Depends on how hard the set was, not one number for everything.",
  dropoff:"How many reps you lose from your first set to your last at the same weight. ~25% is normal.",
  density:"How many working sets you get through per hour. 15-20 is brisk and focused.",
  weighting:"A set isn't worth the same to every muscle it touches, so it isn't counted as if it were.",
  volume:"Two things get called volume: sets per week (for planning) and lb moved (for scale)."
};
/* Not esc(): term() runs while this file is still being evaluated (VOL_LANDMARK_SCALE
   calls it), and `const esc` further down is still in its temporal dead zone then. */
function attrSafe(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function term(id, label){
  const tip = GLOSSARY_TIP[id];
  return `<span class="term" data-term="${id}" role="button" tabindex="0"${
    tip ? ` data-tip="${attrSafe(tip)}" title="${attrSafe(tip)}"` : ""
  }>${label==null?id:label}</span>`;
}
// Shared tail for the three volume landmarks, they only make sense as a set.
const VOL_LANDMARK_SCALE = `
<div class="gl-scale">
  <div class="gl-bar">
    <span style="flex:10;background:#3f5f8c">too little</span>
    <span style="flex:10;background:#46a85c">the sweet spot</span>
    <span style="flex:4;background:#e8b62c">hard but ok</span>
    <span style="flex:5;background:#e05248">too much</span>
  </div>
  <div class="gl-ticks"><span>0</span><span>MEV</span><span>MAV</span><span>MRV</span><span></span></div>
</div>
<p>All three are counted in <b>${term("hardset","hard sets")} per muscle per week</b>. Three sets of bench press count as 3 chest sets, and partial credit goes to your front delts and triceps, because they did real work too.</p>
<p style="color:var(--faint);font-size:13.5px">These landmarks come from the volume-landmark framework popularised by Mike Israetel and Renaissance Periodization. They're <b>population averages with wide individual variation</b>, treat them as a starting frame, not a law. Yours may sit higher or lower.</p>`;

const GLOSSARY = {
  rpe:{title:"RPE, Rate of Perceived Exertion", html:`
    <p><b>RPE</b> is how hard a set felt, on a 1-10 scale. What it really measures is <b>how many reps you had left</b>.</p>
    <div class="rpe-scale">
    RPE 10 &nbsp;→ all-out, no reps left<br>
    RPE 9 &nbsp;&nbsp;→ 1 rep left in the tank<br>
    RPE 8 &nbsp;&nbsp;→ 2 reps left<br>
    RPE 7 &nbsp;&nbsp;→ 3 reps left<br>
    RPE 6 &nbsp;&nbsp;→ 4+ reps left, easy
    </div>
    <p>A target like <span class="num">RPE 8-9</span> means: pick a weight where you finish the set with about 1-2 reps still in you.</p>
    <p>It's the single most useful number you can log. Weight and reps say what you lifted; RPE says how close to your limit it was, which is what actually decides whether the set grew anything.</p>`},

  mev:{title:"MEV, Minimum Effective Volume", html:`
    <div class="gl-def"><b>The least weekly work a muscle needs before it grows at all.</b></div>
    <p>Below MEV you're maintaining at best, even if the sessions feel brutal. Effort doesn't substitute for volume here, a muscle needs a certain amount of total work per week before it has a reason to adapt.</p>
    <p>This is the line the Body tab's <b>weak point detection</b> uses. If a muscle sits under its MEV two weeks running, it gets flagged, because that's a muscle you're spending gym time on without getting growth back.</p>
    ${VOL_LANDMARK_SCALE}`},

  mav:{title:"MAV, Maximum Adaptive Volume", html:`
    <div class="gl-def"><b>The productive middle, where you get the most growth per set you invest.</b></div>
    <p>Between ${term("mev","MEV")} and MAV is where you want to live most of the time. Adding sets in this range keeps paying off.</p>
    <p>Above MAV you're still growing and can still recover, but each extra set returns less than the one before it, so it's a range to use deliberately for a hard block, not to sit in year-round.</p>
    ${VOL_LANDMARK_SCALE}`},

  mrv:{title:"MRV, Maximum Recoverable Volume", html:`
    <div class="gl-def"><b>The most a muscle can recover from. Past this, sets cost fatigue but stop buying growth.</b></div>
    <p>Going over MRV doesn't just waste the extra sets, it digs a hole. Recovery debt accumulates, your loads on everything else start slipping, and joints and connective tissue take the strain. It usually shows up as strength going <em>backwards</em> while you're working harder than ever.</p>
    <p>This is why the <b>${term("injury","injury risk")}</b> metric weights volume-past-MRV most heavily of all its flags.</p>
    ${VOL_LANDMARK_SCALE}`},

  hardset:{title:"Hard set (working set)", html:`
    <div class="gl-def"><b>A set taken close enough to failure to actually drive growth, roughly ${term("rpe","RPE")} 7 or above.</b></div>
    <p>Warm-ups and easy back-off sets don't count. Research on hypertrophy consistently shows the stimulus falls off sharply once you're more than about 4 reps from failure, so counting every set you performed would badly overstate your real training volume.</p>
    <p>Iron Log counts any set with reps logged as a working set, and uses your logged ${term("rpe","RPE")} to judge how hard it was. If you don't log RPE, it assumes a normal hard set (RPE 8) rather than throwing the set away.</p>
    <p><b>Partial credit:</b> a muscle that assists gets a fraction of a set, not a whole one. A bench press pays 1.0 to chest, 0.5 to front delts and 0.5 to triceps. That's why the per-muscle numbers can look odd next to your session total, and why the whole-body tile counts real sets performed instead of summing the columns.</p>`},

  acwr:{title:"Acute : chronic workload ratio", html:`
    <div class="gl-def"><b>This week's training load divided by your recent four-week weekly average.</b></div>
    <table class="gl-table">
      <tr><td>under 0.8×</td><td>You've backed off a lot, fine for a deliberate light week, detraining if it lasts.</td></tr>
      <tr><td>0.8-1.5×</td><td>The safe band. Load is progressing at a rate your body can absorb.</td></tr>
      <tr><td>over 1.5×</td><td>A spike. This is the best-established injury marker in sports science, jumping load faster than your tissues adapt is what hurts people, more than the absolute amount.</td></tr>
    </table>
    <p>The practical read: it's not how much you do, it's how fast you <em>changed</em> how much you do. A 1.5× week is how a motivated Monday becomes a strained something on Thursday.</p>
    <p>Iron Log needs about four weeks of history before this means anything, so it shows a dash until then.</p>`},

  e1rm:{title:"Estimated 1RM", html:`
    <div class="gl-def"><b>What you could probably lift for one rep, worked backwards from a set you actually did.</b></div>
    <p>Iron Log uses the Epley formula: <span class="num">weight × (1 + reps ÷ 30)</span>. So 100 lb × 10 reps estimates a 133 lb single.</p>
    <p>Why bother: it lets the app compare sets that aren't alike. 100×10 and 115×6 are hard to rank by eye, but as estimated 1RMs (133 vs 138) it's clear the second was stronger. That's how <b>${term("growth","growth")}</b> and <b>progressive overload</b> get measured when your reps move around week to week.</p>
    <p>It's only reliable in the low-rep range, so the calculation caps reps at 12, otherwise a 20-rep set would inflate the estimate wildly.</p>`},

  fatigue:{title:"Fatigue (how it's calculated)", html:`
    <div class="gl-def"><b>Training residue that hasn't worn off yet, per muscle, right now.</b></div>
    <p>Every ${term("hardset","hard set")} leaves fatigue behind, and that residue decays over time. Iron Log decays it on an exponential half-life set per muscle: side delts and calves clear in about 36 hours, quads and spinal erectors take 60.</p>
    <p>Sets closer to failure leave more behind, an RPE 10 set costs roughly 2.4× what an RPE 6 set does.</p>
    <p><b>Reading the number:</b> 100% means you've just dumped a full ${term("mrv","MRV")} week's worth onto that muscle. Under 20% is fresh. Fatigue is not the same as ${term("recovery","recovery")}, see that entry for why both exist.</p>`},

  recovery:{title:"Recovery (how it's calculated)", html:`
    <div class="gl-def"><b>How far through its own recovery window a muscle is since the last time you trained it.</b></div>
    <p>Each muscle has a typical turnaround time, 36 hours for side delts, 60 for quads, and a heavier-than-usual session stretches that window proportionally.</p>
    <p><b>Why this isn't just the inverse of ${term("fatigue","fatigue")}:</b> they answer different questions. A muscle you hammered six days ago is <em>fully recovered</em> and ready to train, but a week of hard work can still leave fatigue residue on the books. One tells you if you can train it today; the other tells you whether the week is catching up with you.</p>
    <p>Your daily check-in feeds into this. Averaging under 6 hours of sleep drops every muscle's recovery, because sleep debt measurably slows tissue repair, that's not a per-muscle effect, so it shifts them all together.</p>`},

  growth:{title:"Growth (how it's calculated)", html:`
    <div class="gl-def"><b>Is this muscle actually progressing? Last 3 weeks against the 3 weeks before.</b></div>
    <p>Two signals, blended:</p>
    <table class="gl-table">

    <p>50 means holding steady. Above 65 means strength is genuinely trending up. Below 45 means the last block went backwards.</p>
    <p>A stall with <em>adequate</em> volume is a different problem from a stall with too little, which is why weak point detection treats them separately: one needs a change of stimulus, the other needs more sets. Piling on volume to fix a fatigue-driven stall makes it worse.</p>`},

  injury:{title:"Injury risk (how it's calculated)", html:`
    <div class="gl-def"><b>Five independent flags, each grounded in something measurable, not a diagnosis.</b></div>
    <table class="gl-table">
      <tr><td>Volume past ${term("mrv","MRV")}</td><td>More going in than the muscle can recover from</td></tr>

    </table>
    <div class="gl-note">This is a training-load flag, not medical advice. It can't see your sleep quality, your joints, your technique or your history, and it can't predict an injury. Actual pain beats anything on this screen: if something hurts, treat that as the signal.</div>`},

  overload:{title:"Progressive overload", html:`
    <div class="gl-def"><b>Giving your body slightly more to handle than last time. It's the one rule that makes training work.</b></div>
    <p>Muscles adapt to what you ask of them. Ask the same thing every week and there's no reason to change. The load has to creep up.</p>
    <p>"More" doesn't have to mean weight. Any one of these counts:</p>
    <table class="gl-table">
      <tr><td>More weight</td><td>Same reps, heavier bar, the most obvious lever</td></tr>
      <tr><td>More reps</td><td>Same weight, one extra rep. Usually the easier win</td></tr>
      <tr><td>More sets</td><td>Adds ${term("volume","volume")}, but has a ceiling, see ${term("mrv","MRV")}</td></tr>
      <tr><td>Better quality</td><td>Same numbers, cleaner form, slower lowering, less cheating</td></tr>
    </table>
    <p>You only need <em>one</em> of them to move. Iron Log grades this by comparing your best ${term("e1rm","estimated 1RM")} on each exercise against the last time you did that workout.</p>
    <p style="color:var(--faint);font-size:13.5px">Progress is not linear. Beating every lift every week is not the standard, holding steady is fine, and going backwards for a week usually means fatigue, not failure.</p>`},

  failure:{title:"Training to failure", html:`
    <div class="gl-def"><b>Taking a set until you physically cannot complete another rep with good form.</b></div>
    <p>That's ${term("rpe","RPE")} 10. One rep short is RPE 9, two short is RPE 8, that gap is sometimes called <b>reps in reserve</b>.</p>
    <p>Failure is a tool, not a target. Sets taken to true failure build a little more per set, but they cost disproportionately more recovery and beat up your joints and connective tissue. Doing every set to failure is one of the most common ways people stall.</p>
    <p><b>The usual advice:</b> keep most sets at RPE 8-9, and save actual failure for the last set of an exercise, ideally on machines and cables rather than heavy free weights, where form breaking down is dangerous.</p>`},

  deload:{title:"Deload", html:`
    <div class="gl-def"><b>A deliberately easy week, taken so you can come back stronger.</b></div>
    <p>Fatigue accumulates faster than you notice. After several hard weeks it starts masking your actual strength, you're stronger than your lifts suggest, you just can't express it. A deload lets the fatigue drain off so the strength shows up.</p>
    <p>The usual recipe: <b>keep the weights, cut the sets by about half</b>, and stop every set well short of ${term("failure","failure")}. Keeping the loads is what preserves the skill and the stimulus; cutting the sets is what buys the recovery.</p>

  restwindow:{title:"Rest between sets", html:`
    <div class="gl-def"><b>How long to wait depends on how hard the set was, not one number for everything.</b></div>
    <table class="gl-table">
      <tr><td>3-5 min</td><td>Heavy sets, 6 reps or fewer, or anything at ${term("rpe","RPE")} 9.5+. Your strength systems genuinely take this long to reload.</td></tr>
      <tr><td>1.5-3 min</td><td>Normal 8-12 rep work. The bulk of what you do.</td></tr>
      <tr><td>45 s–2 min</td><td>High-rep and finisher work, where recovery is fast.</td></tr>
    </table>
    <p>Cutting rest short doesn't make a workout more productive, it just makes the next set lighter, which quietly caps the ${term("volume","volume")} you accumulate. If you're short on time, it's better to drop an exercise than to rush the ones you keep.</p>
    <p>Iron Log starts the stopwatch when you tap ✓, works out which band that set was in, and asks you to confirm if you stop the clock well before you should.</p>`},

  dropoff:{title:"Rep drop-off", html:`
    <div class="gl-def"><b>How many reps you lose from your first set to your last at the same weight.</b></div>
    <p>Losing some is completely normal, around 25% across three sets is typical and healthy. Getting 10, then 9, then 8 means you judged the weight well.</p>
    <p>A steep drop, 12 then 6, almost always means one of two things: your ${term("restwindow","rest was too short")}, or your first set was too heavy and taken too close to ${term("failure","failure")}. Both leave your later sets contributing fatigue without much stimulus.</p>
    <p>The fix is usually to start about 5 lb lighter and hold the reps, which nets more total quality work than one heroic first set followed by two poor ones.</p>`},

  density:{title:"Session density", html:`
    <div class="gl-def"><b>How many working sets you get through per hour.</b></div>
    <p>Roughly 15-20 sets an hour is a brisk, focused session. Much under 12 usually means long gaps that aren't real ${term("restwindow","rest")}, phone, queuing for equipment, wandering.</p>
    <p>Density isn't a goal in itself; the point is that a 90-minute session that could have been 55 costs you the same ${term("volume","volume")} for far more of your life, and set quality falls off past about 80 minutes anyway.</p>`},

  weighting:{title:"Why sets count as fractions", html:`
    <div class="gl-def"><b>A set is not worth the same to every muscle it touches, so it is not counted as if it were.</b></div>
    <p>A dumbbell bench press counts as a full set for your chest, about half a set for your front shoulders, and about half for your triceps. Those muscles genuinely worked, but not nearly as hard as the chest did, and counting all three as full sets would make your weekly totals roughly triple what you actually did.</p>
    <p>Six things decide the weight a muscle gets from an exercise:</p>
    <table class="gl-table">
      <tr><td>Activation</td><td>How hard the muscle actually fires. EMG research consistently shows the target muscle working far harder than its assistants on the same lift.</td></tr>
      <tr><td>Range of motion</td><td>A muscle taken through a full stretch under load grows more than one working in a short range. This is why an overhead extension is worth more to the ${term("mev","triceps long head")} than a pushdown: only the overhead position actually lengthens it.</td></tr>
      <tr><td>Stability demand</td><td>If you are fighting to balance, the target muscle cannot be driven as hard. A machine row loads the lats more precisely than a bent-over row at the same effort.</td></tr>
      <tr><td>Fatigue cost</td><td>Compound lifts drain you systemically, not just locally. Ten sets of squats and ten of leg extensions do not cost the same, which is why the ${term("mrv","MRV")} calculation cares about your compound share.</td></tr>
      <tr><td>Progression potential</td><td>Movements you can reliably add weight to week after week drive more growth over time than ones that stall or where form breaks down first.</td></tr>
      <tr><td>Evidence</td><td>Where research gives a clear answer it wins over feel. Seated versus standing calf raises is the cleanest example: knee bent hits the ${term("mev","soleus")}, knee straight hits the gastrocnemius, and no amount of effort swaps them.</td></tr>
    </table>
    <p>The practical upshot: if a muscle only ever shows up as a fraction, it has no direct work in your programme. Assisting on other people's lifts is not the same as being trained.</p>`},

  volume:{title:"Volume", html:`
    <div class="gl-def"><b>Two different things get called "volume". Iron Log uses both, in different places.</b></div>
    <table class="gl-table">
      <tr><td>Sets per week</td><td>The unit for ${term("mev","MEV")} / ${term("mav","MAV")} / ${term("mrv","MRV")} and everything on the Body tab. This is what the research on how much to train is expressed in.</td></tr>
      <tr><td>Tonnage</td><td>weight × reps × sets, the "lb moved" figure in History and your cycle wrapped. Good for a sense of scale, poor for planning, it makes high-rep leg work look enormous next to heavy pressing.</td></tr>
    </table>
    <p>When you see a volume judgement in this app, under-stimulated, in range, over MRV, it's always counting ${term("hardset","hard sets")}, never tonnage.</p>`}
};
/* GLOSSARY_ORDER / GLOSSARY_SHORT lived here. They only fed the "Jargon buster"
   chip grid, which is gone: terms are tappable in place instead. */

/* The one canonical note every one-limb-at-a-time movement carries, so the
   instruction reads identically on Tricep Kickback, Preacher Curl, Spider Curl,
   the Alternating Lateral Raise and anything you add later. */
const ALT_ARM_NOTE = "single arm, alternate L/R each set";

function ex(name,sets,reps,rpe,weight,note){ return {name,sets,reps,rpe,weight,note}; }

/* =====================================================================
   EXERCISE IDENTITY

   Every history lookup, PR check, muscle attribution and grade comparison keys off the
   exercise NAME. That made a rename silently destructive: "Tricep Pushdown" and
   "Triceps Pushdown" are two different exercises to the old code, so the moment you
   renamed one, "last time" went blank, PRs stopped firing because there was no history
   to beat, and the workout grade reported "none of today's exercises appear in the
   previous session".

   Names now resolve to a canonical key in two passes:
     1. ALIASES, either the built-in table below or one recorded when you renamed an
        exercise yourself in the program editor (S.exAliases).
     2. STRUCTURAL normalisation, which folds away the differences that are spelling
        rather than movement: abbreviations, plurals, brackets, punctuation.

   The result is that renaming an exercise is now cosmetic. Its whole past comes with it.
   ===================================================================== */
const EX_ALIASES = {
  // spelling and abbreviation variants of the built-in program
  "triceps pushdown":"tricep pushdown", "tricep pressdown":"tricep pushdown",
  "triceps pressdown":"tricep pushdown", "cable pushdown":"tricep pushdown",
  "triceps kickback":"tricep kickback",
  "cable triceps extension":"cable tricep extension",
  "overhead tricep extension":"cable tricep extension",
  "overhead triceps extension":"cable tricep extension",
  "cable overhead tricep extension":"cable tricep extension",
  "lat prayer":"cable lat prayer", "straight arm pulldown":"cable lat prayer",
  "straight-arm pulldown":"cable lat prayer",
  "smith shoulder press":"smith machine shoulder press",
  "smith machine overhead press":"smith machine shoulder press",
  "smith squat":"smith machine squat",
  "cable rear delt fly":"cable reverse rear delt fly",
  "reverse cable fly":"cable reverse rear delt fly",
  "cable reverse fly":"cable reverse rear delt fly",
  /* Seated Leg Curl inherits the old "Leg Curl" history, and should: this gym only has
     a seated machine, so every set ever logged as "Leg Curl" was already seated. The
     matching "lying leg curl" alias is deliberately NOT here — there is no lying
     machine to log, and keeping it would silently merge a future lying-curl record
     into the seated one if this lifter ever trains somewhere that has both. */
  "seated leg curl":"leg curl",
  "cable crunch":"cable ab crunch", "ab crunch":"cable ab crunch",
  "hanging leg raise":"leg raises", "lying leg raise":"leg raises",
  "guillotine bench press":"guillotine press",
  "incline db bench press":"incline dumbbell bench press",
  "db bench press":"dumbbell bench press",
  "romanian deadlift":"dumbbell rdl", "db rdl":"dumbbell rdl"
};
// User-recorded renames, loaded out of S once it exists. Kept in its own binding
// because canonEx() runs during module evaluation, while `let S` is still in its
// temporal dead zone, and even `typeof S` throws there.
let USER_ALIASES = null;
function nrmRaw(n){ return String(n==null?"":n).trim().toLowerCase().replace(/\s+/g," "); }
/* Differences that are spelling, not movement. Deliberately conservative: it collapses
   plurals and abbreviations, and it never merges two names that describe different
   movements ("seated" vs "standing" calf raise stay distinct, because they train
   different muscles). */
function structNorm(k){
  return k
    .replace(/[.,’']/g, "")
    .replace(/\s*\(([^)]*)\)\s*/g, " $1 ")           // keep the words, drop the brackets
    .replace(/\bdb\b/g, "dumbbell").replace(/\bbb\b/g, "barbell")
    .replace(/\bkb\b/g, "kettlebell").replace(/\bmach\b/g, "machine")
    .replace(/\btriceps\b|\btris\b|\btri\b/g, "tricep")
    .replace(/\bbiceps\b|\bbis\b/g, "bicep")
    .replace(/\bdelts\b/g, "delt").replace(/\blats\b/g, "lat")
    .replace(/\bpressdown\b/g, "pushdown")
    .replace(/\bflyes\b|\bflies\b|\bflye\b/g, "fly")
    .replace(/\braises\b/g, "raise").replace(/\bcurls\b/g, "curl")
    .replace(/\bpresses\b/g, "press").replace(/\brows\b/g, "row")
    .replace(/\bextensions\b/g, "extension").replace(/\bcrunches\b/g, "crunch")
    .replace(/\bdips\b/g, "dip").replace(/\bpulldowns\b/g, "pulldown")
    .replace(/\bkickbacks\b/g, "kickback").replace(/\bpushdowns\b/g, "pushdown")
    .replace(/\s+/g, " ").trim();
}
function aliasHop(k){
  if(USER_ALIASES && USER_ALIASES[k]) return nrmRaw(USER_ALIASES[k]);
  if(EX_ALIASES[k]) return EX_ALIASES[k];
  return null;
}
function canonEx(n){
  let k = nrmRaw(n);
  // alias first (a rename may point at a name that then needs normalising), then
  // normalise, then alias again in case normalising revealed a known old name.
  for(let i=0;i<4;i++){ const h = aliasHop(k); if(!h || h===k) break; k = h; }
  k = structNorm(k);
  for(let i=0;i<4;i++){ const h = aliasHop(k); if(!h || h===k) break; k = structNorm(h); }
  return k;
}
/* The built-in tables are written with human-readable keys, so they get re-keyed
   through the same canonicaliser once, at load, rather than at every lookup. */
function canonIndex(o){
  const out = {};
  Object.keys(o).forEach(k=>{ out[canonEx(k)] = o[k]; });
  return out;
}
/* ---------- keeping a renamed exercise's data ----------
   Renaming carries the HISTORY across, but on its own it would still cost you the
   curated tables: "Mid Row" has a hand-written muscle map and head split, whereas
   "Chest Supported Row" would drop through to the keyword rules and get a rougher
   approximation. This reverse index remembers the name the built-in tables know the
   exercise by, so a rename costs nothing at all.

   Built lazily, because the tables it reads are declared much further down the file
   while renames are loaded during migrate(), long before those tables exist. */
let TABLE_ORIGIN = null;
function invalidateTableOrigin(){ TABLE_ORIGIN = null; }
/* Which exercises the program runs on more than one day, cached. Declared up here with
   the other boot-time state for the same reason TABLE_ORIGIN is: migrate() runs while
   the file is still evaluating and clears this cache, and a `let` further down the file
   would still be in its temporal dead zone at that point. */
let MULTI_DAY = null;
function invalidateMultiDay(){ MULTI_DAY = null; }
function rebuildTableOrigin(){
  const al = USER_ALIASES || {};
  const built = {};
  try{
    Object.keys(al).forEach(oldRaw=>{
      const oldKey = structNorm(nrmRaw(oldRaw));   // the pre-rename key, no alias hops
      const newKey = canonEx(al[oldRaw]);
      if(!newKey || newKey === oldKey) return;
      const known = EX_MUSCLES_C[oldKey] || HEAD_BIAS_C[oldKey] || (oldKey in UNILATERAL_C);
      if(known) built[newKey] = oldKey;
    });
  }catch(e){
    /* Those tables are declared much further down the file, and migrate() runs at load
       time asking isSingleArm() about every exercise in the program, so the first call
       can land while they're still in their temporal dead zone. Leave the index
       unbuilt rather than caching a broken one; it gets retried on the next lookup,
       by which point the file has finished evaluating. */
    return null;
  }
  TABLE_ORIGIN = built;
  return built;
}
function tableKey(name){
  const idx = (TABLE_ORIGIN !== null) ? TABLE_ORIGIN : rebuildTableOrigin();
  const k = nrm(name);
  return (idx && idx[k]) || k;
}

/* ---------- unilateral (one limb at a time) classification ----------
   Every exercise in the default program is classified explicitly below, so the
   start-side tip is right without relying on how a note happens to be worded.
   UNI  = done one limb at a time → gets the RIGHT/LEFT starting-side tip
   BI   = both limbs together (or a barbell/machine) → no tip
   You can override any exercise with the "one limb at a time" toggle in the
   program editor; that flag (e.uni) always wins over this table.

   Declared up here rather than beside the views because migrate() runs at load time
   and asks isSingleArm() which exercises need the alternating-arms note, a const
   declared further down would still be in its temporal dead zone at that point.   */
const UNILATERAL = {
  /* --- the five genuinely one-limb-at-a-time movements --- */
  "single-arm cable hammer curl": true,
  "single-arm dumbbell row": true,
  "single-arm cable pulldown": true,
  "preacher curl": true,              // upper arm over the bench pad, alternating
  "dumbbell bulgarian split squat": true,

  /* --- bilateral, declared explicitly because the text fallback would guess wrong ---
     These two read like single-arm cable accessory work and are not. The face pull
     runs one D-handle a tower with both arms at once, and the V-bar extension is a
     two-handed overhead press-down. Left to inference they would both collect an L/R
     chip on every set. */
  "cable face pull (two d-handles)": false,
  "overhead cable extension (v-bar)": false,

  /* --- everything else in the plan, stated rather than inferred ---
     isSingleArm() falls back to regex-matching name AND note, and the note field here
     carries load descriptions like "45 a side" and "35 lb a hand". `\bper (arm|leg|
     side)\b` matching a note is how a barbell movement ends up tagged unilateral, so
     every exercise in the programme is declared and nothing reaches the fallback. */
  // Push A / Push B
  "smith flat bench press": false,
  "incline dumbbell bench press": false,
  "mid cable fly (on bench)": false,
  "dumbbell lateral raise": false,
  "overhead cable triceps extension": false,
  "incline smith machine bench press": false,
  "weighted chest dips": false,
  "flat dumbbell bench press": false,
  "smith machine shoulder press": false,
  // Pull A / Pull B
  "chest supported row machine": false,
  "lat pulldown": false,
  "cable lat prayer": false,
  "cable reverse rear delt fly": false,   // crossover, both arms, see CROSSOVER
  "dumbbell shrug": false,
  "incline dumbbell curl": false,
  "weighted pull-up": false,
  "bayesian cable curl": false,
  // Legs A / Legs B
  "smith machine squat": false,
  "leg extension": false,
  "seated leg curl": false,
  "standing calf raise (smith)": false,
  "cable ab crunch": false,
  "dumbbell rdl": false,
  "smith machine hip thrust": false,
  "reverse hyperextension (flat bench)": false,
  "seated calf raise (smith)": false,
  "hanging leg raise": false,

  /* --- retired movements, kept so old sessions still render their side chips
         the way they were actually logged --- */
  "tricep kickback": true,
  "alternating cable lateral raise": true,
  "spider curl": false,
  "hammer curl": false,
  "tricep pushdown": false,
  "cable tricep extension": false,
  "dumbbell bench press": false,
  "cable chest press (on bench)": false,
  "guillotine press": false,
  "chest dips": false,
  "mid row": false,
  "leg curl": false,
  "hip thrust": false,
  "leg raises": false
};
/* ---------- crossover movements ----------
   Both arms work at once, but one crosses OVER the other, and which one is on top
   alternates set to set, then flips the next time you do the exercise. The rear delt
   fly is the classic: hands cross at the bottom, and whichever arm is on top gets a
   slightly different line of pull, so you have to even it out deliberately.        */
const CROSSOVER = {
  "cable reverse rear delt fly": true
};
const CROSSOVER_C = canonIndex(CROSSOVER);
function isCrossover(e){
  if(!e) return false;
  if(e.cross === true) return true;
  if(e.cross === false) return false;
  const key = canonEx(e.name);
  if(key in CROSSOVER_C) return CROSSOVER_C[key];
  return /\bcross[- ]?over\b|\bcrossed\b|one hand over/i.test((e.name||"")+" "+(e.note||""));
}
const UNILATERAL_C = canonIndex(UNILATERAL);
function isSingleArm(e){
  if(!e) return false;
  if(e.uni === true) return true;    // explicit toggle in the program editor
  if(e.uni === false) return false;  // explicitly turned off
  const key = tableKey(e.name);
  if(key in UNILATERAL_C) return UNILATERAL_C[key];
  // Unknown exercise (custom / newly added) → fall back to reading name + note.
  const s = (e.name||"") + " " + (e.note||"");
  return /\b(single|one)[- ]?arm\b|\b(single|one)[- ]?leg\b|\bper (arm|leg|side)\b|\beach (arm|leg|side)\b|\bl\s*\/\s*r\b|\bunilateral\b|\balternating\b|alternat[a-z]*\s+(l\/r|arms?|legs?|left|right|side)/i.test(s);
}
/* Which alternating scheme an exercise uses, if any:
     "side"  → one limb at a time, R then L then R…
     "cross" → both at once, alternating which arm is on top
   Crossover wins, because a rear delt fly reads as "alternating" to the text fallback
   but isn't done one arm at a time.                                                */
function altStyle(e){
  if(isCrossover(e)) return "cross";
  if(isSingleArm(e)) return "side";
  return null;
}
function altsSides(e){ return !!altStyle(e); }
// Set 1 gets the session's start side, then it alternates every set.
function sideForSet(startSide, i){
  if(!startSide) return null;
  const flip = (i % 2) === 1;
  return flip ? (startSide === "R" ? "L" : "R") : startSide;
}
// Short tag for the set row: R / L, or R▸ / L▸ for "that arm is the one on top".
function sideTag(style, side){
  if(!side) return "";
  return style === "cross" ? side+"▸" : side;
}
function sideFull(style, side){
  const w = side === "L" ? "LEFT" : "RIGHT";
  return style === "cross" ? w+" arm on top" : w+" arm";
}
const ALT_CROSS_NOTE = "both arms, alternate which arm crosses on top each set";

/* =====================================================================
   THE PROGRAMME, v3, six-day Push/Pull/Legs A-B

   Every set count below is an APP SET, never sets-per-side. For a unilateral movement
   the app alternates sides set to set, so 4 sets is 2 per leg. Odd set counts are
   therefore uneven within a session (3 sets runs R,L,R); startSideFor() flips the
   opening side each session so it evens out across the cycle. That is deliberate, and
   it means an odd set count on a one-limb movement is not equal work per side when you
   are reasoning about volume.

   Loads on a machine that has its own starting weight — a Smith bar, a sled, a
   plate-loaded arm — should be recorded ONE WAY and kept that way. The app does not
   care which convention you pick, because every number it quotes back at you is
   derived from what you logged; it only breaks if a single exercise is logged both
   ways on different days.
   ===================================================================== */

/* Per-set RPE targets. The whole programme is built on ramps (7,8,8,9) rather than a
   blanket range, because "3 sets at RPE 9" and "7,8,8,9" prescribe very different
   amounts of fatigue for the same set count. `sets` is derived from the list length so
   the two can never disagree, and `rpe` is still populated with a summary range so
   every existing reader of e.rpe keeps working untouched. */
function rpeSummary(list){
  const lo = Math.min.apply(null, list), hi = Math.max.apply(null, list);
  return lo === hi ? String(lo) : lo + "-" + hi;
}
function exr(name, rpes, reps, weight, note, extra){
  const list = rpes.slice();
  const e = {
    name: name,
    sets: list.length,
    reps: reps,
    rpes: list,
    rpe: rpeSummary(list),
    weight: (weight == null ? null : weight),
    note: note || ""
  };
  return extra ? Object.assign(e, extra) : e;
}
/* Rest, in seconds, as [target low, target high].

   restTargetFor() derives a band from reps and RPE when nothing is declared, and its
   heuristic is close but wrong twice for a ramped plan: a 6-10 rep compound averages
   out to 8 reps and lands in the 90-180s "hypertrophy" band when it wants three
   minutes, and the high-rep band floors at 45s when the rule here is 90s minimum for
   isolation, never 60. Declaring rest per exercise fixes both without rewriting the
   fallback that every custom exercise still depends on. */
const REST_HEAVY  = [180, 240];   // 3 min, heavy compounds
const REST_SQUAT  = [180, 300];   // 3-4 min, the one movement that genuinely needs it
const REST_SECOND = [120, 180];   // 2-3 min, secondary compounds
const REST_ISO    = [90, 150];    // 90 s minimum, isolation

/* =====================================================================
   THE STARTING PROGRAMME

   Every plan the app can build for you comes from here. There are no baked-in loads:
   `weight` is null on every exercise, which routes each movement through the existing
   calibration flow the first time you meet it — you do one feeler set, tell the app
   what it felt like, and it sets the working weight from that. A number invented for a
   stranger is worse than no number, because it reads as a prescription.

   HOW A PLAN IS BUILT. A day is a list of SLOTS, not a list of exercises. A slot says
   what job needs doing — "a horizontal press, heavy, first in the session" — and the
   exercise that fills it is chosen from EX_LIBRARY by what equipment you actually have.
   The same Upper/Lower plan is therefore a barbell plan in a full gym and a dumbbell
   plan in a garage, with the muscle coverage and the set counts unchanged.

   SET COUNTS COME FROM EXPERIENCE, not from a fixed table. A beginner gets fewer sets
   per movement, because the limit on a beginner is technique and recovery rather than
   volume, and a plan that starts too big is the one that gets abandoned. See
   setsForLevel().

   VOLUME IS TUNED AGAINST THE LANDMARKS IN `MUSCLES`, not left to chance. Every plan
   here was measured per muscle against MEV and MRV and adjusted until it fit. No plan
   puts any muscle over its MRV. What is left under MEV is left there deliberately:

     • Obliques, in every plan. They take partial credit from ab work, and a dedicated
       side-bend slot is a poor trade for most people. The Body tab will say so if it
       matters for you, and adding one there takes two taps.
     • Lower back sits a fraction under, at about 3.9 against a 4 MEV. Squats, hinges
       and rows already load the erectors hard; buying the last 0.1 with a dedicated
       back extension is not worth a slot.
     • Full Body, 3 days is under on several muscles and cannot not be. Three sessions
       hold only so many hard sets. That is a true property of training three days a
       week, not a defect in the plan, and it is why the split picker states plainly who
       each option suits.

   If you change a plan, the Body tab keeps measuring the real thing: these numbers
   describe what ships, not a guarantee about whatever you edit it into.
   ===================================================================== */

/* Equipment tiers, widest first. A movement is available to you if its `gear` is in
   your tier's set. "full" is a commercial gym; "home" is a rack, a bar and plates;
   "dumbbell" is adjustable dumbbells and a bench; "bodyweight" is you and a floor. */
const GEAR_TIERS = {
  full:      ["barbell","dumbbell","machine","cable","bodyweight","smith"],
  home:      ["barbell","dumbbell","bodyweight"],
  dumbbell:  ["dumbbell","bodyweight"],
  bodyweight:["bodyweight"]
};
const GEAR_LABEL = {
  full:      {name:"Full gym",         sub:"Machines, cables, barbells, dumbbells"},
  home:      {name:"Home gym",         sub:"Barbell, rack, plates, bench"},
  dumbbell:  {name:"Dumbbells only",   sub:"Adjustable dumbbells and a bench"},
  bodyweight:{name:"Bodyweight",       sub:"No equipment, or a pull-up bar"}
};

/* The exercise library, keyed by the job a movement does. Names are plain English and
   deliberately match what the muscle map already understands, so the Body tab, the
   weak-point detector and the muscle diagram all work on a generated plan with no
   extra wiring. `cue` is one sentence of form, not a coaching manual. */
const EX_LIBRARY = {
  press_horizontal: [
    {name:"Barbell Bench Press",       gear:"barbell",   cue:"Touch the chest under control, no bounce."},
    {name:"Dumbbell Bench Press",      gear:"dumbbell",  cue:"Lower until you feel the chest stretch, press back without locking hard."},
    {name:"Chest Press Machine",       gear:"machine",   cue:"Set the seat so the handles line up with mid-chest."},
    {name:"Push-Up",                   gear:"bodyweight",cue:"Body in one line, chest to the floor. Elevate the feet once it gets easy."}
  ],
  press_incline: [
    {name:"Incline Dumbbell Bench Press", gear:"dumbbell", cue:"Bench at about 30 degrees, any steeper and the shoulders take over."},
    {name:"Incline Barbell Bench Press",  gear:"barbell",  cue:"About 30 degrees. Touch just below the collarbone."},
    {name:"Incline Push-Up",              gear:"bodyweight",cue:"Hands on a bench. Lower the surface as you get stronger."}
  ],
  fly: [
    {name:"Mid Cable Fly (on bench)", gear:"cable",    cue:"Hold the stretch a moment at the bottom."},
    {name:"Dumbbell Fly",             gear:"dumbbell", cue:"Soft elbows, open until you feel the chest lengthen."},
    {name:"Deficit Push-Up",          gear:"bodyweight",cue:"Hands on books or blocks so the chest drops below them."}

/* One slot = one job in a session, written [libraryKey, kind] or [libraryKey, kind,
   setsOverride]. `kind` picks the rep range, the RPE ramp and the rest band; the
   optional third value overrides the set count for slots that need more work than
   their kind implies. Calves and side delts are the usual ones: both tolerate — and
   need — far more volume than a single three-set slot provides, which is exactly why
   they are the two muscles most often left under-trained.

   Ordering is deliberate: the heaviest compound goes first, when you are freshest, and
   isolation last. */
const SLOT_REPS  = {heavy:"6-10", second:"8-12", iso:"12-15", abs:"10-15"};
const SLOT_RPES  = {heavy:[7,8,8,9], second:[7,8,9], iso:[8,9,9,9,9], abs:[9,10,10,10]};

const PLAN_SLOTS = {
  full3: {
    fullA: [["squat","heavy"],["press_horizontal","second"],["pull_horizontal","second"],["lateral","iso",5],["calf","iso",5],["abs","abs",4]],
    fullB: [["hinge","heavy"],["press_overhead","second"],["pull_vertical","second"],["quad_iso","iso"],["rear_delt","iso",5],["curl","iso"]],

    lowerA: [["squat","heavy"],["hinge","second"],["quad_iso","iso"],["calf","iso",5],["abs","abs",4]],
    upperB: [["pull_vertical","heavy"],["press_incline","second"],["pull_horizontal","second",4],["rear_delt","iso",5],["lateral","iso",5],["curl","iso"],["triceps","iso"]],

    pushB: [["press_incline","heavy"],["press_overhead","second"],["fly","iso"],["lateral","iso",5],["triceps","iso"]],
    pullB: [["pull_vertical","heavy"],["pull_horizontal","second"],["shrug","iso"],["rear_delt","iso",4],["curl","iso"],["abs","abs",4]],

/* Sets per slot, by training age. The gap between a beginner and an advanced lifter is
   not effort, it is how much work they can turn into growth instead of fatigue. */
function setsForLevel(kind, level){
  const table = {
    beginner:     {heavy:3, second:3, iso:3, abs:3},
    intermediate: {heavy:4, second:3, iso:3, abs:3},
    advanced:     {heavy:4, second:4, iso:4, abs:3}
  };
  return (table[level] || table.intermediate)[kind] || 3;
}
/* Which exercise fills a slot, given what you can train with.

   THE ORDER OF EACH LIST IN EX_LIBRARY IS THE PREFERENCE ORDER, best first, and this
   walks the list picking the first entry you can actually do. That is the whole rule.

   It used to walk the equipment TIERS instead — take any barbell option, else any
   dumbbell option, and so on — which quietly meant "dumbbell beats cable" everywhere,
   because dumbbell sits earlier in the tier list. A full commercial gym was handed
   dumbbell flyes over cable flyes and dumbbell overhead extensions over pushdowns: not
   wrong, exactly, but not what anyone standing in that gym would choose. The tier list
   now only answers "can I do this?", and the library answers "what is best?". */
function pickExercise(key, gear){
  const list = EX_LIBRARY[key] || [];
  const allowed = GEAR_TIERS[gear] || GEAR_TIERS.full;
  const hit = list.find(x=>allowed.indexOf(x.gear) > -1);
  // Nothing in your gear can cover this job: fall back to the bodyweight option if the
  // slot has one, and only then to the head of the list.
  return hit || list.find(x=>x.gear === "bodyweight") || list[0] || null;
}
/* Build a full programme for a split. Pure: it reads nothing from S, so onboarding can
   preview a plan before anything is saved. */
function buildProgram(splitId, gear, level, customDays){
  const slots = PLAN_SLOTS[splitId];
  const out = {};
  if(!slots){
    /* A custom split has no slot plan of its own, so each day gets a balanced
       full-body template. It is a starting point to edit, not a prescription — the
       Program tab is where you make it yours. */
    (customDays || []).forEach((d, i)=>{
      const rot = [
        [["squat","heavy"],["press_horizontal","second"],["pull_horizontal","second"],["lateral","iso"],["abs","abs"]],
        [["hinge","heavy"],["press_overhead","second"],["pull_vertical","second"],["quad_iso","iso"],["curl","iso"]],
        [["lunge","heavy"],["press_incline","second"],["pull_horizontal","second"],["ham_iso","iso"],["triceps","iso"]]
      ][i % 3];
      out[d.id] = rot.map(sl=>slotToExercise(sl, gear, level));
    });
    out.finisher = [];
    return out;
  }
  Object.keys(slots).forEach(dayId=>{
    out[dayId] = slots[dayId].map(sl=>slotToExercise(sl, gear, level)).filter(Boolean);
  });
  // Runs at the end of every session. Empty by default: core work is placed on specific
  // days above rather than taxing every session.
  out.finisher = [];
  return out;
}
function slotToExercise(sl, gear, level){
  const [key, kind, setsOverride] = sl;
  const ex = pickExercise(key, gear);
  if(!ex) return null;
  /* An override still scales with training age, it just starts from a higher base — a
     beginner does not inherit an advanced lifter's calf volume merely because calves
     are under-programmed in general. */
  const n = setsOverride
    ? Math.max(2, setsOverride - (level === "beginner" ? 1 : 0) + (level === "advanced" ? 1 : 0))
    : setsForLevel(kind, level);
  /* Slots carrying extra volume start two sets lighter and build up over the first two
     weeks (see rampedSets). Side delts and calves are the usual case: they need high
     volume to grow, and tendon adapts more slowly than muscle, so walking into the full
     count on day one is how the first fortnight of a new plan turns into an injury. */
  const ramp = n >= 4 ? Math.max(2, n - 2) : null;
  const rpes = (SLOT_RPES[kind] || SLOT_RPES.second).slice(0, n);
  while(rpes.length < n) rpes.push(rpes[rpes.length-1] || 8);
  const rest = kind === "heavy" ? (key === "squat" ? REST_SQUAT : REST_HEAVY)
             : kind === "second" ? REST_SECOND : REST_ISO;
  // Carried so applyGoalReps() knows what job this movement does without having to
  // infer it back out of the name — "Lateral Raise" and "Leg Raise" are not the same
  // kind of work, and no regex over exercise names is going to keep telling them apart.
  const extra = {rest, slotKind: kind};
  if(ramp != null) extra.rampIn = ramp;
  if(ex.incr) extra.incr = ex.incr;
  /* No starting weight, on purpose. `calibrate` sends the movement through the feeler-
     set flow the first time you do it, which sets a load from what YOU lifted rather
     than from a number picked for somebody else. */
  if(ex.calibrate) extra.calibrate = ex.calibrate;
  return exr(ex.name, rpes, SLOT_REPS[kind] || "8-12", null, ex.cue || "", extra);
}
/* The plan a brand-new profile starts on, before onboarding has run. Deliberately the
   middle-of-the-road option: if someone dismisses setup and starts lifting, what they
   get should still be a sane programme rather than an empty screen. */
function defaultProgram(){
  return buildProgram(DEFAULT_SPLIT, "full", "intermediate");
}

/* ================= PROFILES =================
   Several people's logs live side by side in this one app: you, plus each client.
   • The GitHub token is shared once, at the registry level, you never retype it.
   • Each profile keeps its OWN gist, so nobody's data can bleed into anyone else's.
   • Each profile's data blob is its own localStorage key, so switching is instant
     and works offline. The first profile deliberately reuses the original
     "ironlog.v1" key so existing data is picked up untouched.               */
const PROF_KEY = "ironlog.profiles";
const SELF_ID = "self";
let PROF = null;
function dataKeyFor(id){ return id === SELF_ID ? LS_KEY : LS_KEY + "." + id; }
function dataKey(){ return dataKeyFor(PROF && PROF.activeId ? PROF.activeId : SELF_ID); }
/* A stable, filesystem-safe folder name per person. The id suffix is what guarantees
   two clients called "Jordan" never write over each other, even if you rename one. */
function profSlug(p){
  p = p || activeProfile();
  const base = String(p.name||"person").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,28) || "person";
  return p.id === SELF_ID ? base : base + "-" + String(p.id).slice(-4);
}
// Where this person's two files live in the backup repo.
function repoPaths(p){
  const s = profSlug(p);
  return {csv:"ironlog/"+s+"/workout-log.csv", json:"ironlog/"+s+"/ironlog-backup.json", slug:s};
}
function saveProfiles(){ try{ localStorage.setItem(PROF_KEY, JSON.stringify(PROF)); }catch(e){} }
function bootProfiles(){
  try{
    const raw = localStorage.getItem(PROF_KEY);
    if(raw){
      PROF = JSON.parse(raw);
      if(PROF && Array.isArray(PROF.list) && PROF.list.length){
        if(!PROF.list.some(p=>p.id===PROF.activeId)) PROF.activeId = PROF.list[0].id;
        return;
      }
    }
  }catch(e){}
  // First run on this device, adopt whatever is already stored as "Me".
  let token = "", gistId = "", repo = "", branch = "main";
  try{
    const old = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if(old && old.sync){
      token = old.sync.token || "";
      gistId = old.sync.gistId || "";
      repo = old.sync.repo || "";
      branch = old.sync.branch || "main";
    }
  }catch(e){}
  PROF = {token, activeId: SELF_ID, list:[{id:SELF_ID, name:"Me", gistId, repo, branch}]};
  // onboarding renames this the moment someone tells us who they are
  saveProfiles();
}
bootProfiles();
function activeProfile(){
  return (PROF.list.find(p=>p.id===PROF.activeId)) || PROF.list[0];
}
function profileName(){ const p = activeProfile(); return p ? p.name : "Me"; }
// Mirror the live sync settings back onto the profile record (and the shared token),
// so the picker always shows the right gist and a new profile inherits the token.
function syncProfileRecord(){
  const p = activeProfile();
  if(!p || !S || !S.sync) return;
  p.gistId = S.sync.gistId || "";
  p.repo = S.sync.repo || "";
  p.branch = S.sync.branch || "main";
  // remember THIS person's key against THIS person, never globally over the top of
  // someone else's. PROF.token is only a default offered to brand-new profiles.
  p.token = S.sync.token || "";
  if(S.sync.token && !PROF.token) PROF.token = S.sync.token;
  saveProfiles();
}

let S = load();
applySplit();     // DAYS / ROTATION / CYCLE_LAYOUT / REST_CREDITS, from the chosen split
migrate();
function load(){
  try{
    const raw = localStorage.getItem(dataKey());
    if(raw){ return JSON.parse(raw); }
  }catch(e){}
  // Brand-new profile: start from the default program, inherit the shared token and
  // whatever gist/repo was registered for this person.
  const p = (PROF && PROF.list.find(x=>x.id===PROF.activeId)) || {};
  return {
    /* Brand-new profile. `setup` is what onboarding fills in, and its absence is what
       triggers onboarding — a separate "onboarded" boolean would be a second source of
       truth that can disagree with the first. */
    setup: null,
    splitId: DEFAULT_SPLIT,
    customSplit: null,
    program: defaultProgram(),
    pointer: 0,
    override: null,
    sessions: [],
    active: null,
    /* The token is PER PROFILE, falling back to the shared one only when this person
       has none of their own. Sharing a single token across everybody was the account
       bug: as soon as you used a second token for a second gist, the wrong key got
       sent, GitHub returned 404, and the profile loaded empty. */
    sync: {token:p.token||(PROF&&PROF.token)||"", gistId:p.gistId||"", repo:p.repo||"", branch:p.branch||"main", lastSync:null, lastRepo:null},
    /* savedAt 0, NOT Date.now(). This is an empty placeholder, not a real edit.
       Stamping it "now" made a brand-new client profile claim to be the newest state
       in the world, so the first sync refused to adopt their gist's program, pointer
       and cycle, and then pushed this blank default straight over their real data. */
    savedAt: 0,
    fresh: true
  };
}
function switchProfile(id){
  if(S && S.active){ toast("Finish or discard the current workout first"); return false; }
  if(!PROF.list.some(p=>p.id===id)) return false;
  persist();                 // flush the person we're leaving
  syncProfileRecord();
  hideRestUI();
  PROF.activeId = id;
  saveProfiles();
  S = load();
  applySplit();
  const p = activeProfile();
  // the profile record is the authority on which key and which gist this person uses
  if(p && p.token) S.sync.token = p.token;
  else if(!S.sync.token && PROF.token) S.sync.token = PROF.token;
  if(p && p.gistId) S.sync.gistId = p.gistId;
  migrate();
  saveQuiet();
  TAB = "today";
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on", x.dataset.tab==="today"));
  render();
  window.scrollTo(0,0);
  toast("Switched to "+profileName());
  SYNC_ST = "off";
  if(S.sync.token && S.sync.gistId){ setSyncStatus("pending"); syncNow(false); }
  return true;
}
function migrate(){
  // Renames you've made yourself have to be live before ANY name comparison happens.
  if(!S.exAliases || typeof S.exAliases !== "object") S.exAliases = {};
  USER_ALIASES = S.exAliases;
  invalidateTableOrigin();
  // migrate() also runs after a sync pull, which can replace the whole program
  invalidateMultiDay();

  /* ================= PLAN SHAPE GUARD =================
     A stored plan has to be an object of day-keyed arrays covering the current split,
     or every screen that walks it throws. Three ways it can arrive broken: a sync pull
     from a device mid-setup, a hand-edited export, or an imported file whose days do
     not match the split it landed on.

     The repair is deliberately narrow. A MISSING day gets an empty array, so the
     Program tab renders it and you can fill it in. It does NOT regenerate the plan
     wholesale: an empty day you can see is recoverable, and a plan silently replaced
     with a generated one is not.

     What it must never touch, and does not: sessions, check-ins, the rest log, sync
     settings, profiles, exercise aliases, the change log. Your training history is not
     a function of which plan you happen to be running.                              */
  if(!S.program || typeof S.program !== "object" || Array.isArray(S.program)){
    S.program = defaultProgram();
    save();
  }
  {
    let repaired = false;
    DAYS.forEach(d=>{
      if(!Array.isArray(S.program[d])){ S.program[d] = []; repaired = true; }
    });
    if(!Array.isArray(S.program.finisher)){ S.program.finisher = []; repaired = true; }
    /* The rotation pointer is a slot index. A split with fewer days than the one it was
       saved against leaves it pointing past the end, which reads as "today is
       undefined". */
    if(!(S.pointer >= 0 && S.pointer < ROTATION.length)){ S.pointer = 0; repaired = true; }
    if(Array.isArray(S.cycleDone)){
      const clean = S.cycleDone.filter(i=>i >= 0 && i < ROTATION.length);
      if(clean.length !== S.cycleDone.length){ S.cycleDone = clean; repaired = true; }
    }
    if(repaired) save();
  }

  // Every one-limb-at-a-time movement gets the alternating-arms note, not just the
  // three that happened to be typed with it. Runs over each day AND the finisher,
  // and over alternate (⇄) variants too.
  if(S.program){
    let noted = false;
    const stamp = e=>{
      if(!e || !e.name) return;
      const style = altStyle(e);
      if(!style) return;
      const n = String(e.note||"").trim();
      const want = style === "cross" ? ALT_CROSS_NOTE : ALT_ARM_NOTE;
      if(style === "cross" ? /crosses? on top|arm on top/i.test(n) : /alternate\s+l\s*\/\s*r/i.test(n)) return;
      e.note = n ? n.replace(/\s*·\s*$/,"") + " · " + want : want;
      noted = true;
    };
    Object.keys(S.program).forEach(k=>{
      if(!Array.isArray(S.program[k])) return;
      S.program[k].forEach(e=>{ stamp(e); if(e.alt) stamp(e.alt); });
    });
    if(noted) saveQuiet();
  }
  if(S.sync && S.sync.repo===undefined){ S.sync.repo=""; S.sync.branch="main"; S.sync.lastRepo=null; saveQuiet(); }
  if(!Array.isArray(S.cycleDone)) S.cycleDone = [];
  if(!S.cycleStart || !S.cycleV2){
    S.cycleStart = inferCycleStart();
    S.cycleV2 = true;
    saveQuiet();
  }
  if(!S.viewMode) S.viewMode = "regular";
  if(!S.checkins) S.checkins = {};
  if(!Array.isArray(S.restLog)) S.restLog = [];
  if(!Array.isArray(S.deleted)) S.deleted = [];
  if(!S.stalls || typeof S.stalls !== "object") S.stalls = {};
  // which single-limb movements have already had their gap close and retired the rule
  if(!S.asymRetired || typeof S.asymRetired !== "object") S.asymRetired = {};
  /* One rest a cycle became two, and the field changed shape with it: `S.restDay` was
     a single {date} object, `S.restDays` is the list of dates spent this cycle. A rest
     already taken under the old shape carries across as the first of the two credits
     rather than being silently forgotten. */
  if(!Array.isArray(S.restDays)) S.restDays = [];
  if(!Array.isArray(S.restDeleted)) S.restDeleted = [];
  if(S.restDay && S.restDay.date){
    /* Only carry it over if it actually falls inside the CURRENT cycle. Without this
       check a rest taken weeks ago under the previous programme was migrated into the
       new cycle and immediately spent one of its credits, which is why a fresh plan
       showed a rest day nobody had taken. */
    const rdMs = new Date(S.restDay.date + "T12:00:00").getTime();
    const inThisCycle = rdMs >= (S.cycleStart - 24*3600e3);
    if(inThisCycle && S.restDays.indexOf(S.restDay.date) < 0){
      S.restDays.push(S.restDay.date); S.restDays.sort();
    }
    delete S.restDay;
    saveQuiet();
  }
  // a tombstoned day must never linger in either list
  if(S.restDeleted.length){
    S.restDays = S.restDays.filter(d=>S.restDeleted.indexOf(d) < 0);
    S.restLog = (S.restLog||[]).filter(d=>S.restDeleted.indexOf(d) < 0);
  }
  /* Every edit to the programme, dated. Nothing recorded the shape of the plan over
     time, so a lift that "went backwards" after a rep range changed looked identical to
     one that went backwards on its own, and the printed report described seven months of
     training as though the card had never moved. Starts empty on an existing install:
     there is no way to recover edits that were never written down. */
  if(!Array.isArray(S.planLog)) S.planLog = [];
  if(!S.volWindow) S.volWindow = "cycle";   // Body tab accumulates over the cycle by default
  if(S.askWhy === undefined) S.askWhy = true;   // ask what happened when a set collapses

  /* ---- Spider Curl is bilateral ----
     It was classified as one-limb-at-a-time, which stamped an L/R chip on every set,
     printed a "start with your RIGHT arm" banner, and wrote the alternating note into
     the program. The exercise itself never had sides, so those marks were labels on
     data that was already whole-body. Clearing them from the program AND from logged
     history makes the log and the printed report describe what you actually did. */
  if(!S.fixSpiderV1){
    const unspider = e=>{
      if(!e || nrm(e.name) !== "spider curl") return false;
      let hit = false;
      if(e.uni || e.cross){ delete e.uni; delete e.cross; hit = true; }
      if(e.altStyle || e.startSide){ delete e.altStyle; delete e.startSide; hit = true; }
      const cleaned = String(e.note||"")
        .replace(/single arm, alternate L\/R each set/ig, "")
        .replace(/\s*·\s*·\s*/g, " · ").replace(/^\s*·\s*|\s*·\s*$/g, "").trim();
      if(cleaned !== String(e.note||"")){ e.note = cleaned || "both arms together"; hit = true; }
      return hit;
    };
    let touched = false;
    if(S.program) Object.keys(S.program).forEach(k=>{
      if(!Array.isArray(S.program[k])) return;
      S.program[k].forEach(e=>{ if(unspider(e)) touched = true; if(e.alt && unspider(e.alt)) touched = true; });
    });
    (S.sessions||[]).forEach(s=> (s.entries||[]).forEach(e=>{ if(unspider(e)) touched = true; }));
    if(S.active) (S.active.entries||[]).forEach(e=>{ if(unspider(e)) touched = true; });
    S.fixSpiderV1 = true;
    if(touched) save(); else saveQuiet();
  }

}
function inferCycleStart(){
  // walk history backwards; sessions still fitting in one cycle belong to the current one
  const cap = {};
  ROTATION.forEach(id=>{ cap[id] = (cap[id]||0)+1; });
  const now = Date.now();
  let anchor = null, total = 0;
  const sess = [...S.sessions].sort((a,b)=>b.startedAt-a.startedAt);
  const floor = (S.lastCycle && S.lastCycle.end) ? S.lastCycle.end : 0;
  for(const s of sess){
    if(now - s.startedAt > 9*24*3600e3) break;   // older than ~9 days → previous cycle
    if(s.startedAt <= floor) break;              // belongs to an already-completed cycle
    if(!(s.workoutId in cap)) continue;
    if(cap[s.workoutId] === 0) break;            // that day is already full → cycle boundary
    if(total >= ROTATION.length) break;
    cap[s.workoutId]--; total++;
    anchor = s.startedAt;
  }
  if(anchor != null) return anchor;
  const d = new Date(); d.setHours(0,0,0,0);
  return d.getTime();
}

/* ---------- PR detection ----------

function bestEverFor(exName, upToEntry, upToSet){

  const key = nrm(exName);
  const consider = st=>{
    const w = parseFloat(st.weight)||0;
    const reps = parseFloat(st.reps)||0;
    if(!(reps>0) && !(w>0)) return;
    seen = true;
    if(w > maxW){ maxW = w; repsAtMaxW = reps; }
    else if(w === maxW && reps > repsAtMaxW){ repsAtMaxW = reps; }

    if(!(w>0) && reps > maxRepsBw) maxRepsBw = reps;   // bodyweight rep record
  };

  // capitalisation can't hide your own history from the comparison
  S.sessions.forEach(s=> s.entries.forEach(en=>{ if(nrm(en.name)===key) en.sets.forEach(consider); }));

  // set that breaks the record) rather than on every heavier set that follows
  if(S.active && upToEntry!=null){
    S.active.entries.forEach((en,i)=>{
      if(nrm(en.name) !== key) return;
      en.sets.forEach((st,j)=>{

        // row shouldn't quietly cancel the PR on the set that follows it

        if(prior && st.done) consider(st);

  const b = bestEverFor(exName, ei, si);
  if(!b.seen) return null;                 // nothing to beat yet, first time doing it
  if(w > 0){
    if(w > b.maxW) return "WEIGHT PR";                          // heavier than ever
    if(w === b.maxW && reps > b.repsAtMaxW) return "REP PR";     // same top weight, more reps
    if(est1RM(w, reps) > b.max1RM * 1.005) return "STRENGTH PR"; // better weight×reps combo
    return null;

  if(reps > b.maxRepsBw) return "REP PR";

     • you typed numbers into later rows and markPriorDone() silently ticked the
       earlier ones for you, those sets became "done" without ever being examined;

   see which set did it. But working up 30 → 35 → 45 breaks the record three times on
   the way, and reporting "3 personal records" for one exercise overstates the day. The
   summary therefore keeps only the best set per exercise. */
function sessionPRs(sess){
  const best = new Map();

    if(!st.pr) return;
    const k = nrm(e.name);
    const row = {name:e.name, set:i+1, kind:st.pr, weight:st.weight, reps:st.reps};
    const prev = best.get(k);

/* =====================================================================
   "WHAT WENT WRONG?", catching a collapsed set while you still remember why

   A set that lands far under its target is the most informative thing that happens in
   a workout, and it's also the thing you have completely forgotten by the time you look
   at the log. Three weeks later the row just reads 185×4, and there is no way to tell
   whether that was a bad night's sleep, too heavy an opening set, a set you cut short
   on purpose to make a train, or your shoulder tweaking. Those four need opposite
   responses, and until now the app silently treated them as the same failure: all four
   cost you the same rep-range points and all four pushed the same "come down slightly
   and earn the reps back" advice, which is actively the wrong thing to say to someone
   whose shoulder just went.

   So it asks once, at the moment it happens, with one tap to answer.

   Three rules keep it from becoming nagging, which is the only way a prompt like this
   survives contact with an actual gym:
     • It asks at most ONCE PER EXERCISE per session, however many sets collapse.
     • It doesn't ask when the answer is obvious: a set that's heavier than you have
       ever lifted is supposed to be low, that's a PR attempt, not a failure.
     • Dismissing it counts as an answer, so it never asks the same question twice.
   ===================================================================== */
const SET_REASONS = [
  {code:"heavy",      icon:"🏋️", label:"The weight was too heavy",     short:"too heavy"},
  {code:"fatigue",    icon:"🔋", label:"I ran out of gas",              short:"ran out of gas"},
  {code:"form",       icon:"📐", label:"Form started breaking down",    short:"form broke down"},
  {code:"pain",       icon:"🚑", label:"Pain, or something felt off",   short:"pain or a tweak"},
  {code:"deliberate", icon:"⏱️", label:"I stopped it short on purpose", short:"stopped on purpose"},
  {code:"fine",       icon:"👍", label:"Nothing wrong, that's just where it landed", short:"nothing wrong"}
];
const REASON_BY_CODE = (function(){ const o={}; SET_REASONS.forEach(r=>o[r.code]=r); return o; })();
// Reasons that mean the set did what it was supposed to, so it must not be marked down
// for missing its rep range: you either chose to stop, or stopping was correct.
const REASON_EXEMPT = {deliberate:1, pain:1};

/* How far under target is far enough to be worth asking about?

   Not an absolute number: 5 reps is a small miss on a 6-10 squat and a collapse on a
   12-20 lateral raise. It's judged against the PRESCRIBED FLOOR, and needs to be both
   proportionally large and at least 2 whole reps, so a one-rep miss never interrupts
   you. On 6-10 that fires at 4 reps or fewer, on 8-12 at 5, on 12-20 at 8.           */
function lowRepMiss(entry, st){
  const reps = parseFloat(st && st.reps) || 0;
  if(!(reps > 0)) return null;
  const range = repRange(entry && entry.reps);
  if(!range) return null;
  const floor = range[0];
  if(!(floor > 0)) return null;
  const missBy = floor - reps;
  if(missBy < 2) return null;                  // a rep or two short is just a hard day
  if(missBy / floor < 0.3) return null;         // and it has to be proportionally big
  return {floor, reps, missBy, pct: Math.round(missBy / floor * 100)};
}
/* Whether to interrupt for this set. Everything here is a reason NOT to ask. */
function shouldAskWhy(ei, si){
  if(!S.active) return null;
  if(S.askWhy === false) return null;                       // turned off in Settings
  const entry = S.active.entries[ei];
  const st = entry && entry.sets[si];
  if(!entry || !st) return null;
  if(st.why) return null;                                   // already answered
  if(entry.whyAsked) return null;                           // once per exercise, per session
  const miss = lowRepMiss(entry, st);
  if(!miss) return null;
  /* A load heavier than anything in your history is SUPPOSED to give low reps. That's a
     personal-record attempt, and asking "what went wrong" about the best set you have
     ever done is the fastest way to teach someone to dismiss this prompt on sight. */
  const w = parseFloat(st.weight) || 0;
  if(w > 0){
    const best = bestEverFor(entry.name, ei, si);
    if(best.seen && best.maxW > 0 && w > best.maxW * 1.03) return null;
  }
  return miss;
}
/* The prompt. Big tap targets, one tap to answer, and an optional note that is only

   was dismissed. */
function askSetReason(entry, st, miss){
  return new Promise(resolve=>{
    let settled = false;
    const done = v=>{
      if(settled) return;
      settled = true;
      MODAL_DISMISS = null;
      $("#modalBg").classList.remove("show");
      resolve(v);
    };
    const setTxt = (st.weight!=null && st.weight!=="" ? st.weight+" lb" : "bodyweight")+" × "+miss.reps+" reps";
    $("#modal").innerHTML = `
      <h3>What happened there?</h3>
      <div class="sub" style="margin:-4px 0 4px">
        <b>${esc(entry.name)}</b> came in at <b>${esc(setTxt)}</b>, ${miss.missBy} rep${miss.missBy===1?"":"s"}
        under the bottom of its ${esc(entry.reps)} target.
      </div>
      <div class="sub" style="margin:0 0 14px;color:var(--faint)">
        One tap. It only asks once per exercise, and knowing which of these it was is what
        stops the app giving you the wrong advice next time.
      </div>
      <div class="wr-list" style="gap:8px;margin:0;max-width:none">
        ${SET_REASONS.map(r=>`
          <button class="reason-btn" data-reason="${r.code}">
            <span class="reason-ic">${r.icon}</span>
            <span>${esc(r.label)}</span>
          </button>`).join("")}
      </div>
      <div class="field" style="margin:14px 0 0">
        <label>Anything to add? Optional</label>
        <input id="whyNote" placeholder="e.g. left shoulder, only on the last rep" autocomplete="off">
      </div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn ghost small" id="whySkip" style="flex:1">Skip, don't ask again for this exercise</button>
      </div>`;
    $("#modal").scrollTop = 0;
    $("#modalBg").classList.add("show");
    document.querySelectorAll("#modal [data-reason]").forEach(b=> b.onclick = ()=>{
      const note = ($("#whyNote") && $("#whyNote").value.trim()) || "";

}
/* Ask, record, and act on the answer. Called from every path that can complete a set. */
async function maybeAskWhy(ei, si){

        [e, e.alt].forEach(x=>{
          if(!x || !x.name) return;
          const k = nrm(x.name);
