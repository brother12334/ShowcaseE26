/* =====================================================================
   WORKOUT QUALITY SCORE

   Eight sections, 100 points, each grading something with an evidence base behind it
   rather than a vibe. Every section reports its grade, its reasoning, and where it can,
   the exercises the finding came from, so nothing here is a verdict you can't audit.

   Two decisions worth spelling out, because they changed how the number behaves:

   • A SECTION THE APP CANNOT MEASURE IS NOT SCORED. The old card handed out half credit
     when RPE or rest times were missing, which quietly capped a genuinely excellent
     session at about 93% for not filling in a field, and rewarded a bad session for the
     same omission. Unmeasurable sections are now marked N/A and dropped from the
     denominator: the grade describes the training the app could actually see. What was
     skipped is still listed, with what to log to make it count next time.

   • THE POINTS FOLLOW THE EVIDENCE. Whether the load went up is the best single
     predictor that training worked, so overload carries the most weight. Session
     efficiency has the weakest link to any outcome, so it carries the least.

     1. Completion .............. 14   did the planned work get done
     2. Progressive overload .... 20   did it beat the last time you did it
     3. Effective intensity ..... 16   were sets close enough to failure to count
     4. Rest discipline ......... 12   rest matched to what each set demanded
     5. Rep-range adherence ..... 10   sets landing in their prescribed range
     6. Fatigue management ...... 10   performance held across sets
     7. Session efficiency ......  8   duration and density
     8. Log quality ............. 10   RPE, rest, feel, note, check-in
   ===================================================================== */
function gradeFor(pct){
  if(pct >= .97) return "A+";
  if(pct >= .93) return "A";
  if(pct >= .90) return "A−";
  if(pct >= .87) return "B+";
  if(pct >= .83) return "B";
  if(pct >= .80) return "B−";
  if(pct >= .77) return "C+";
  if(pct >= .73) return "C";
  if(pct >= .70) return "C−";
  if(pct >= .60) return "D";
  return "F";
}
function gradeColor(pct){
  return ramp([[0,C_BAD],[.6,C_BAD],[.75,C_WARN],[.9,C_OK],[1,C_OK]], pct);
}
function repRange(str){
  const m = String(str||"").match(/(\d+)\s*[-–]\s*(\d+)/);
  if(m) return [parseInt(m[1],10), parseInt(m[2],10)];
  const one = String(str||"").match(/(\d+)/);
  return one ? [parseInt(one[1],10), parseInt(one[1],10)] : null;
}
// The previous session of the same rotation day, used for the section's headline text.
function priorSessionFor(sess){
  let best = null;
  S.sessions.forEach(s=>{
    if(s.id === sess.id) return;
    if(s.workoutId !== sess.workoutId) return;
    if(s.startedAt >= sess.startedAt) return;
    if(!best || s.startedAt > best.startedAt) best = s;
  });
  return best;
}
/* ---------- the last time you did THIS EXERCISE ----------
   Overload used to be measured only against the previous session of the same rotation
   day, matched on the exact name. That failed in three ordinary situations, all of
   which read to you as "the app says nothing improved" when something clearly had:

     • the exercise was renamed, so it no longer matched its own history at all;
     • it moved between days, or you swapped a workout, so the same-day session had
       never contained it;
     • it is the finisher, which runs at the end of EVERY workout, so the same-day
       lookup skipped over the four more recent times you actually did it.

   It now finds the last session that contains the exercise, preferring the same
   rotation day where there is one and falling back to any earlier session where there
   isn't, and matches on the canonical name so a rename is invisible here.           */
function priorEntryFor(sess, exName, occ){
  occ = occ || 0;
  const k = nrm(exName);
  const earlier = S.sessions
    .filter(s => s.id !== sess.id && s.startedAt < sess.startedAt)
    .sort((a,b)=> b.startedAt - a.startedAt);
  for(const sameDayOnly of [true, false]){
    for(const s of earlier){
      if(sameDayOnly && s.workoutId !== sess.workoutId) continue;
      const hits = (s.entries||[]).filter(en => nrm(en.name) === k);
      if(!hits.length) continue;
      return {entry: hits[Math.min(occ, hits.length-1)], sess:s, sameDay: s.workoutId === sess.workoutId};
    }
  }
  return null;
}
// Best estimated 1RM across a set list. Bodyweight movements fall back to rep count,
// which is the only thing that can move on them.
function topE1RM(sets){
  return (sets||[]).reduce((b,st)=>{
    if(!isWorkingSet(st)) return b;
    const v = est1RM(parseFloat(st.weight)||0, parseFloat(st.reps)||0) || (parseFloat(st.reps)||0);
    return v > b ? v : b;
  }, 0);
}
/* ---------- why a lift came in lower than last time ----------
   Estimated 1RM going down was treated as one thing, and it is at least three:

     • a genuine regression, which is the thing worth grading;
     • a comparison that was never like-for-like, because the sets, the rep range or the
       exercise itself moved underneath it;
     • a set you deliberately stopped, or stopped because something hurt, which is the
       correct decision and the last thing that should cost you points.

   The first stays a mark against the session. The other two are EXCUSED: they earn the
   same partial credit a held lift does, and the reason is printed on the card, so the
   grade is still honest about what happened, it just stops calling it regression.

   Deliberately NOT excused, only explained: "too heavy", "ran out of gas" and "form
   broke down". Those are what a regression feels like from the inside; naming them
   doesn't undo it. Same for a comparison drawn from another rotation day, or a movement
   that ran later in the session, which are context for the advice rather than reasons
   the number shouldn't count.                                                        */
function downContext(sess, entry, idx, prior){
  const excuses = [], context = [];

  // 1, fewer sets today: the top set simply had fewer attempts at being the best one
  const nowSets = (entry.sets||[]).filter(isWorkingSet).length;
  const wasSets = (prior.entry.sets||[]).filter(isWorkingSet).length;
  if(nowSets > 0 && nowSets < wasSets){
    excuses.push(nowSets+" working set"+(nowSets===1?"":"s")+" today against "+wasSets+
      " last time, so the best set had fewer goes at being the best one");
  }

  // 2, the prescription moved in between, so the two numbers aim at different things
  const moved = planChangesFor(entry.name, prior.sess.startedAt, sess.startedAt);
  if(prescriptionMoved(moved)){
    const bits = [];
    moved.forEach(c=> (c.changes||[]).forEach(x=>{
      if(PLAN_PRESCRIPTION_FIELDS[x.key]) bits.push(x.field+" "+(x.from||"blank")+" → "+(x.to||"blank"));
    }));
    excuses.push("the prescription changed in between"+(bits.length?" ("+bits.slice(0,2).join(", ")+")":"")+
      ", so today's sets were aimed at a different target");
  }

  // 3, you said at the time that the set did what it was supposed to
  const codes = [...new Set((entry.sets||[]).map(st=>st.why && st.why.code).filter(Boolean))];
  const exempt = codes.filter(c=>REASON_EXEMPT[c] && REASON_BY_CODE[c]);
  if(exempt.length){
    excuses.push("you flagged it at the time: "+
      exempt.map(c=>REASON_BY_CODE[c].short).join(" and "));
  }

  const other = codes.filter(c=>!REASON_EXEMPT[c] && c !== "fine" && REASON_BY_CODE[c]);
  if(other.length) context.push("you logged "+other.map(c=>REASON_BY_CODE[c].short).join(" and ")+" on it");
  if(!prior.sameDay) context.push("the comparison comes from a "+widName(prior.sess.workoutId).toLowerCase()+
    " session rather than the same rotation day");
  const wasIdx = (prior.sess.entries||[]).findIndex(en=> nrm(en.name) === nrm(entry.name));
  if(wasIdx >= 0 && idx - wasIdx >= 2) context.push("it ran "+(idx-wasIdx)+" places later in the session than last time");

  return {excuse: excuses[0] || null, excuses, context};
}
function scoreWorkout(sess){
  const secs = [];
  /* `opt.na` marks a section as unmeasurable: it keeps its explanation and its
     "log this to unlock it" line, but contributes neither points nor maximum. */
  const add = (key, label, max, earned, why, tip, opt)=>{
    opt = opt || {};
    if(opt.na){
      secs.push({key, label, max, na:true, pts:0, pct:null, grade:"—",
                 why:why.filter(Boolean), tip:tip||null, unlock:opt.unlock||null});
      return;
    }
    const pts = Math.max(0, Math.min(max, earned));
    secs.push({key, label, max, pts:Math.round(pts*10)/10, pct:pts/max,
               grade:gradeFor(pts/max), why:why.filter(Boolean), tip:tip||null,
               ex:opt.ex||null});
  };
  const entries = sess.entries || [];
  const allSets = [];
  entries.forEach(e=> e.sets.forEach(st=>{ if(isWorkingSet(st)) allSets.push({e, st}); }));
  const nSets = allSets.length;
  const prs = sessionPRs(sess);

  /* 1, COMPLETION ------------------------------------------------------------- */
  (()=>{
    const plan = resolvedProgram(sess.workoutId);
    const planned = plan.reduce((t,{chosen:e})=>t + (parseInt(e.sets,10)||0), 0);
    const why = [];
    if(!planned){
      add("completion","Completion",14,0,
        ["This workout has no prescribed set count to compare against."],null,
        {na:true, unlock:"Give these exercises a target number of sets in Program."});
      return;
    }
    const ratio = nSets/planned;
    // Overshooting the plan isn't extra credit; hitting it is.
    const earned = 14 * Math.min(1, ratio);
    why.push(nSets+" working sets logged against "+planned+" planned ("+Math.round(ratio*100)+"%).");
    const skipped = plan.length - entries.length;
    if(skipped > 0) why.push(skipped+" exercise"+(skipped>1?"s":"")+" from the plan didn't get logged.");
    if(ratio >= 1) why.push("Everything on the card got done.");
    add("completion","Completion",14,earned,why,
      ratio < 1 ? "Unfinished sets are the cheapest points on this card. If time is the constraint, superset the accessories rather than dropping them."
                : null);
  })();

  /* 2, PROGRESSIVE OVERLOAD ---------------------------------------------------
     Graded per exercise against the last time you did THAT exercise, rather than
     against a whole session. A personal record counts as improvement outright: a PR
     is by definition the best you have ever done that movement, so a comparison that
     disagrees is the comparison being wrong, not the lift.                          */
  (()=>{
    const prNames = new Set(prs.map(p=>nrm(p.name)));
    const rows = [];
    entries.forEach((e,i)=>{
      const a = topE1RM(e.sets);
      if(!a) return;
      const occ = occIndex(entries, i);
      const prior = priorEntryFor(sess, e.name, occ);
      const b = prior ? topE1RM(prior.entry.sets) : 0;
      const isPR = prNames.has(nrm(e.name));
      if(!b){ rows.push({name:e.name, kind:isPR?"up":"new", a, pr:isPR}); return; }
      const d = (a - b)/b;
      let kind = d > 0.004 ? "up" : d >= -0.015 ? "held" : "down";
      if(isPR) kind = "up";                      // a record beats any comparison
      const row = {name:e.name, a, b, d, kind, pr:isPR, sameDay:prior.sameDay};
      if(kind === "down") Object.assign(row, downContext(sess, e, i, prior));
      rows.push(row);
    });
    const cmp = rows.filter(r=>r.kind!=="new");
    const why = [];
    if(!cmp.length){
      why.push(rows.length
        ? "Every exercise today is one with no earlier log to beat, so this is the baseline."
        : "No loads logged, so progression can't be measured.");
      add("overload","Progressive overload",20,0,why,
        "From here on, this section compares each exercise against the last time you did it, whichever day that was.",
        {na:true, unlock:"Run the same movements again next time round."});
      return;
    }
    const up = cmp.filter(r=>r.kind==="up");
    const held = cmp.filter(r=>r.kind==="held");
    // A lift that came in lower for a reason that isn't regression is separated out here
    // and credited as though it held. See downContext() for what counts as a reason.
    const excused = cmp.filter(r=>r.kind==="down" && r.excuse);
    const down = cmp.filter(r=>r.kind==="down" && !r.excuse);
    // Beating a lift earns full credit; holding earns most of it, because holding under
    // accumulated fatigue is a real outcome; going backwards earns nothing.
    const earned = 20 * ((up.length + (held.length + excused.length)*0.62)/cmp.length);
    why.push(up.length+" of "+cmp.length+" lifts went up, "+held.length+" held, "+down.length+" went down"+
      (excused.length ? ", and "+excused.length+" came in lower for a reason that isn't going backwards" : "")+".");
    if(prs.length) why.push("Personal record"+(prs.length>1?"s":"")+" today: "+
      [...new Set(prs.map(p=>p.name))].join(", ")+".");
    const fmtRow = r=>r.name+" ("+Math.round(r.b)+"→"+Math.round(r.a)+" est. 1RM)";
    if(up.length) why.push("Up: "+up.slice(0,4).map(r=>r.b?fmtRow(r):r.name).join(", ")+
      (up.length>4?" +"+(up.length-4)+" more":"")+".");
    if(down.length) why.push("Down: "+down.slice(0,4).map(fmtRow).join(", ")+
      (down.length>4?" +"+(down.length-4)+" more":"")+".");
    excused.slice(0,3).forEach(r=> why.push(
      "Not counted as going backwards, "+fmtRow(r)+": "+
      (r.excuses || [r.excuse]).slice(0,2).join("; and ")+". Credited the same as holding."));
    if(excused.length > 3) why.push((excused.length-3)+" more were excused the same way.");
    // Context that explains a drop without excusing it: it belongs in the reasoning, not
    // in the arithmetic, because none of it means the lift didn't actually go backwards.
    const noted = down.filter(r=>r.context && r.context.length).slice(0,2);
    noted.forEach(r=> why.push("On "+r.name+": "+r.context.join(", and ")+"."));
    const worst = down.slice().sort((x,y)=>x.d-y.d)[0];
    add("overload","Progressive overload",20,earned,why,
      up.length === 0 && down.length === 0 && excused.length
        ? "The lifts that came in lower all had a reason on record, so nothing here is treated as regression. Next time round, run "+
          excused[0].name+" under the same conditions as before and you get a comparison worth reading."
        : up.length === 0 && down.length > 0
        ? "Nothing moved up and some lifts went backwards. That is usually accumulated fatigue rather than effort, and a lighter week often unlocks the next jump."
        : up.length === 0
          ? "Holding is not failing, but pick one lift next session and add either 2.5-5 lb or a single rep. Overload only needs one variable to move."
          : down.length > up.length
            ? "More lifts went backwards than forwards. Look at the running order: whatever sits at the end of the session pays for everything in front of it."
            : down.length
              ? "Most things moved, but "+
                (down.length===1 ? down[0].name
                 : down.length===2 ? down[0].name+" and "+down[1].name
                 : down[0].name+", "+down[1].name+" and "+(down.length-2)+" other"+(down.length===3?"":"s"))+
                " went backwards. If that keeps happening, try moving "+
                (worst ? worst.name : "it")+" earlier, while you're still fresh."
              : null,
      {ex: worst ? worst.name : null});
  })();

  /* 3, EFFECTIVE INTENSITY ----------------------------------------------------
     Graded against the PER-SET target where the exercise declares a ramp, and against
     the generic productive band where it doesn't.

     This matters because the two answers genuinely disagree. A first set logged at
     RPE 7 is a miss under a blanket "RPE 7-10 is productive" rule and is exactly
     correct under a 7,8,8,9 prescription. Grading a deliberately submaximal opening
     set as a failure is how a plan that backs off from failure gets scored worse than
     the plan it replaced, which would make the score actively misleading here.

     Overshooting is treated as worse than undershooting by design: going harder than
     prescribed is the failure mode a ramped prescription exists to correct. */
  (()=>{
    const scored = allSets.filter(x=>parseFloat(x.st.rpe) > 0);
    const why = [];
    if(!scored.length){
      add("intensity","Effective intensity",16,0,
        ["No RPE logged, so how close these sets came to failure can't be assessed."],
        "RPE is the most informative number you can log: weight and reps say what you lifted, RPE says whether it was hard enough to grow anything.",
        {na:true, unlock:"Score even the last set of each exercise and this starts counting."});
      return;
    }
    const rpes = scored.map(x=>parseFloat(x.st.rpe));
    const avg = rpes.reduce((a,b)=>a+b,0)/rpes.length;

    // Split into sets the programme gave an explicit target for, and the rest.
    const targeted = [], untargeted = [];
    scored.forEach(x=>{
      const t = rpeTargetFor(x.e, x.e.sets.indexOf(x.st));
      if(t == null) untargeted.push(x); else targeted.push({x, t, got: parseFloat(x.st.rpe)});
    });

    let sum = 0, onTarget = 0, over = 0, under = 0;
    const overNames = {}, underNames = {};
    targeted.forEach(({x, t, got})=>{
      const d = got - t;
      if(Math.abs(d) <= RPE_TOL){ sum += 1; onTarget++; return; }
      if(d > 0){
        over++; overNames[x.e.name] = (overNames[x.e.name]||0)+1;
        // one point over target keeps most of its credit; two-plus is a different set
        sum += Math.max(0.25, 1 - (d - RPE_TOL) * 0.5);
      } else {
        under++; underNames[x.e.name] = (underNames[x.e.name]||0)+1;
        sum += Math.max(0.3, 1 - (Math.abs(d) - RPE_TOL) * 0.35);
      }
    });
    // anything without a prescribed target falls back to the old productive-band read
    untargeted.forEach(x=>{
      const v = parseFloat(x.st.rpe);
      sum += (v >= 7 && v <= 10) ? 1 : 0.4;
    });

    let earned = 16 * (sum / scored.length);
    const topOf = o => Object.keys(o).sort((a,b)=>o[b]-o[a])[0];

    if(targeted.length){
      why.push(onTarget+" of "+targeted.length+" sets hit their prescribed RPE target (within "+RPE_TOL+").");
      if(over) why.push(over+" set"+(over>1?"s went":" went")+" harder than prescribed"+
        (topOf(overNames)?", mostly "+topOf(overNames):"")+". Training past the target costs recovery this plan has already budgeted.");
      if(under) why.push(under+" set"+(under>1?"s stopped":" stopped")+" further from failure than prescribed"+
        (topOf(underNames)?", mostly "+topOf(underNames):"")+".");
    }
    if(untargeted.length) why.push(untargeted.length+" set"+(untargeted.length>1?"s have":" has")+
      " no per-set target, so "+(untargeted.length>1?"they were":"it was")+" graded on the general RPE 7-10 band.");
    why.push("Average RPE "+r1(avg)+" across "+scored.length+" scored sets"+
      (scored.length<nSets?" ("+(nSets-scored.length)+" unscored)":"")+".");

    add("intensity","Effective intensity",16,earned,why,
      over > targeted.length*0.35
        ? "You are consistently training past the prescribed RPE. The ramp exists so the last set is the hard one — going all-out on every set buys fatigue, not growth."
      : under > targeted.length*0.4
        ? "Most sets are stopping short of their target. The early ramp sets are meant to be easy, but the last set of each exercise should be genuinely close to failure."
      : null,
      {ex: over >= under ? topOf(overNames) : topOf(underNames)});
  })();

  /* 4, REST DISCIPLINE -------------------------------------------------------- */
  (()=>{
    const timed = allSets.filter(x=> x.st.rest != null && !x.e.superset);
    const why = [];
    if(!timed.length){
      add("rest","Rest discipline",12,0,
        ["No rest times recorded for this session."],
        "The stopwatch starts on its own when you tap ✓, so this section grades itself if you just leave it running.",
        {na:true, unlock:"Leave the rest timer running between sets."});
      return;
    }
    let sum = 0, short = 0, long = 0, good = 0;
    timed.forEach(({e, st})=>{
      const t = restTargetFor(e, st);
      const r = st.rest;
      let s;
      if(r >= t.ideal[0] && r <= t.ideal[1]){ s = 1; good++; }
      else if(r < t.ideal[0]){
        s = Math.max(0, r / t.ideal[0]) * 0.85;   // credit falls off toward nothing
        if(r < t.warn) short++;
      } else {
        s = Math.max(0.55, 1 - (r - t.ideal[1])/(t.ideal[1]*2));  // long rests cost far less
        if(r > t.hard) long++;
      }
      sum += s;
    });
    const earned = 12 * (sum/timed.length);
    why.push(good+" of "+timed.length+" timed rests sat inside the window that set's load called for.");
    if(short) why.push(short+" rest"+(short>1?"s were":" was")+" cut short for the intensity: heavy and near-failure sets want 3-5 min, 8-12 rep work 1.5-3 min.");
    if(long) why.push(long+" rest"+(long>1?"s ran":" ran")+" well past the window, which stretches the session without adding stimulus.");
    const bands = {};
    timed.forEach(({e,st})=>{ const b = restTargetFor(e,st).band; bands[b] = (bands[b]||0)+1; });
    why.push("Set mix: "+Object.keys(bands).map(b=>bands[b]+" "+b).join(", ")+".");
    if(timed.length < nSets) why.push((nSets-timed.length)+" of "+nSets+" sets weren't timed, so this is graded on the ones that were.");
    add("rest","Rest discipline",12,earned,why,
      short > timed.length*0.3
        ? "Short rests on heavy work quietly cap your loads: you end up fighting the last set instead of the weight. Give the compounds a full 3 minutes."
        : long > timed.length*0.3 ? "Trim the long rests on accessories to about 90 seconds; you'll cut real time off the session for nothing."
        : null);
  })();

  /* 5, REP-RANGE ADHERENCE ---------------------------------------------------- */
  (()=>{
    let inR = 0, under = 0, over = 0, checked = 0, excused = 0;
    const overEx = {}, underEx = {};
    allSets.forEach(({e, st})=>{
      const range = repRange(e.reps);
      if(!range) return;
      /* A set you chose to stop, or stopped because something hurt, did exactly what it
         should have. Marking it down for missing a rep range would be scoring you for
         making the right call, and would then push "come down slightly and earn the
         reps back" at someone whose shoulder just went. Excused sets leave the
         calculation entirely rather than counting as a miss. */
      if(st.why && REASON_EXEMPT[st.why.code]){ excused++; return; }
      checked++;
      const r = parseFloat(st.reps)||0;
      if(r < range[0]){ under++; underEx[e.name] = (underEx[e.name]||0)+1; }
      else if(r > range[1]){ over++; overEx[e.name] = (overEx[e.name]||0)+1; }
      else inR++;
    });
    const why = [];
    if(!checked){
      add("reprange","Rep-range adherence",10,0,
        [excused
          ? "Every set with a prescribed range was one you flagged as deliberately cut short, so there's nothing here to mark."
          : "None of today's exercises carry a prescribed rep range."],null,
        {na:true, unlock: excused ? "Nothing to do, this just wasn't a scoreable session for rep ranges."
                                  : "Add a range like 8-12 to these exercises in Program."});
      return;
    }
    const earned = 10 * ((inR + (under+over)*0.45)/checked);  // one rep out is a near miss
    why.push(inR+" of "+checked+" sets finished inside their prescribed rep range.");
    const topOf = o => Object.keys(o).sort((a,b)=>o[b]-o[a])[0];
    if(over) why.push(over+" set"+(over>1?"s":"")+" went over the top of the range"+
      (topOf(overEx)?" (mostly "+topOf(overEx)+")":"")+", so that load has become too light.");
    if(under) why.push(under+" set"+(under>1?"s":"")+" fell short"+
      (topOf(underEx)?" (mostly "+topOf(underEx)+")":"")+", so the load is likely too heavy for that range.");
    if(excused) why.push(excused+" set"+(excused>1?"s":"")+" left out of this, because you flagged "+
      (excused>1?"them":"it")+" as deliberately cut short or stopped for pain.");
    /* Whatever you told the app is a better explanation than the app's own guess, so a
       logged reason writes the advice for this section. */
    const flags = sessionFlags(sess);
    const heavyFlag = flags.filter(f=>f.code==="heavy");
    const painFlag  = flags.filter(f=>f.code==="pain");
    add("reprange","Rep-range adherence",10,earned,why,
      painFlag.length ? "You flagged pain on "+painFlag[0].name+". Leave that movement alone until it's settled, and don't chase the reps you missed."
      : heavyFlag.length ? "You said the weight was too heavy on "+heavyFlag[0].name+". Take about 10% off it next session and earn it back from there."
      : over > under && over > 1 ? "Sets finishing above the range are your cue to add weight. Move those up about 5 lb next session."
      : under > 1 ? "Dropping below the range means the load is winning. Come down slightly and earn the reps back."
      : null,
      {ex: painFlag.length ? painFlag[0].name
         : heavyFlag.length ? heavyFlag[0].name
         : over > under ? topOf(overEx) : topOf(underEx)});
  })();

  /* 6, FATIGUE MANAGEMENT ----------------------------------------------------- */
  (()=>{
    const drops = [];
    entries.forEach(e=>{
      const ws = e.sets.filter(isWorkingSet);
      if(ws.length < 2) return;
      const first = parseFloat(ws[0].reps)||0;
      const last = parseFloat(ws[ws.length-1].reps)||0;
      if(!first) return;
      // compare like for like, a rep drop only counts at the same or heavier load
      const w0 = parseFloat(ws[0].weight)||0, wN = parseFloat(ws[ws.length-1].weight)||0;
      if(wN < w0*0.95) return;
      drops.push({name:e.name, drop:(first-last)/first, first, last});
    });
    const why = [];
    if(!drops.length){
      add("fatigue","Fatigue management",10,0,
        ["No exercise here has two or more sets at a steady load, so rep drop-off can't be measured."],
        null, {na:true, unlock:"Run at least one exercise for 2+ sets at the same weight."});
      return;
    }
    const avgDrop = drops.reduce((t,d)=>t+d.drop,0)/drops.length;
    const bad = drops.filter(d=>d.drop > 0.35).sort((a,b)=>b.drop-a.drop);
    // Up to about 25% drop-off across sets is normal and expected; past about 35% the
    // later sets run on empty and contribute mostly fatigue rather than stimulus.
    const earned = 10 * Math.max(0, Math.min(1, 1 - Math.max(0, avgDrop - 0.25)/0.35));
    why.push("Reps fell "+Math.round(avgDrop*100)+"% on average from first set to last at the same load. Up to about 25% is normal.");
    if(bad.length) why.push("Steep drop-off on "+bad.slice(0,3).map(d=>d.name+" ("+d.first+"→"+d.last+")").join(", ")+".");
    else why.push("Performance held well across sets, so rest and load were matched to the work.");
    add("fatigue","Fatigue management",10,earned,why,
      bad.length ? "A collapse like that is nearly always too little rest or too heavy an opening set. Rest longer, or start about 5 lb lighter and hold the reps."
      : null,
      {ex: bad.length ? bad[0].name : null});
  })();

  /* 7, SESSION EFFICIENCY ----------------------------------------------------- */
  (()=>{
    const why = [];
    if(!sess.startedAt || !sess.finishedAt || sess.finishedAt <= sess.startedAt){
      add("efficiency","Session efficiency",8,0,["No usable start and finish time for this session."],
        null, {na:true, unlock:"Start the workout from the Today tab so it gets timed."});
      return;
    }
    const mins = (sess.finishedAt - sess.startedAt)/60000;
    // 40-80 min is the practical sweet spot: long enough for real volume, short enough
    // that quality and focus haven't decayed.
    let durScore;
    if(mins >= 40 && mins <= 80) durScore = 1;
    else if(mins < 40) durScore = Math.max(0.35, mins/40);
    else durScore = Math.max(0.4, 1 - (mins-80)/90);
    const density = nSets / Math.max(1, mins/60);      // working sets per hour
    const denScore = Math.max(0.35, Math.min(1, density/18));
    const earned = 8 * (durScore*0.6 + denScore*0.4);
    why.push(Math.round(mins)+" minutes for "+nSets+" working sets, "+r1(density)+" sets per hour.");
    why.push(mins < 40 ? "Short session, so there's room for more volume before quality suffers."
           : mins > 80 ? "Long session. Past about 80 minutes, focus and set quality tend to fall off."
           : "Duration sits in the productive 40-80 minute window.");
    add("efficiency","Session efficiency",8,earned,why,
      density < 12 ? "Around "+r1(density)+" sets an hour means a lot of standing around. Supersetting unrelated accessories is free time."
      : mins > 95 ? "Split this into two shorter sessions if you can: two 50-minute workouts beat one 100-minute one."
      : null);
  })();

  /* 8, LOG QUALITY ------------------------------------------------------------ */
  (()=>{
    const rpeN = allSets.filter(x=>parseFloat(x.st.rpe)>0).length;
    const restN = allSets.filter(x=>x.st.rest!=null).length;
    const ci = (S.checkins||{})[sess.date] || {};
    const bits = [
      {ok: nSets>0 && rpeN/nSets >= 0.8, w:3.5, yes:"RPE logged on "+Math.round(rpeN/Math.max(1,nSets)*100)+"% of sets", no:"RPE missing on "+(nSets-rpeN)+" of "+nSets+" sets"},
      {ok: nSets>0 && restN/nSets >= 0.6, w:2.5, yes:"rest timed on most sets",      no:"rest times recorded on only "+restN+" of "+nSets+" sets"},
      {ok: !!sess.feel,                   w:1.5, yes:"session feel rated",           no:"no feel rating"},
      {ok: !!(sess.note||"").trim(),      w:1.0, yes:"session note written",         no:"no session note"},
      {ok: !!(ci.sleep || ci.energy || ci.weight), w:1.5, yes:"daily check-in filled in", no:"no daily check-in for this date"}
    ];
    const earned = bits.reduce((t,b)=>t + (b.ok?b.w:0), 0);
    const good = bits.filter(b=>b.ok).map(b=>b.yes);
    const missing = bits.filter(b=>!b.ok).map(b=>b.no);
    const why = [];
    if(good.length) why.push("Captured: "+good.join(", ")+".");
    if(missing.length) why.push("Missing: "+missing.join(", ")+".");
    why.push("This is what makes every other section, and your Body map, accurate rather than guesswork.");
    add("logquality","Log quality",10,earned,why,
      missing.length ? "Each missing field is a place the analysis has to guess. RPE and rest are the two that matter most."
      : null);
  })();

  const graded  = secs.filter(s=>!s.na);
  const skipped = secs.filter(s=>s.na);
  const total = graded.reduce((t,s)=>t+s.pts, 0);
  const maxTotal = graded.reduce((t,s)=>t+s.max, 0);
  const pct = maxTotal ? total/maxTotal : 0;
  return {
    total: Math.round(total),
    max: maxTotal,
    pct,
    grade: gradeFor(pct),
    sections: secs,
    skipped: skipped.map(s=>({key:s.key, label:s.label, unlock:s.unlock})),
    prs,
    flags: sessionFlags(sess),
    advice: sessionAdvice(secs),
    when: Date.now(),
    v: 2
  };
}
/* ---------- what to actually do about it ----------
   The value of a grade isn't the letter, it's the one change worth making next time.
   This ranks every section's tip by the points it actually cost, so the top of the list
   is the highest-value fix rather than whichever section happened to be graded first.
   Sections that couldn't be scored are worth surfacing too, but never above a real
   training problem, so they sort last. */
function sessionAdvice(secs){
  const out = [];
  secs.forEach(s=>{
    if(!s.tip) return;
    const lost = s.na ? 0 : (s.max - s.pts);
    out.push({key:s.key, label:s.label, text:s.tip, ex:s.ex||null, lost, na:!!s.na});
  });
  return out.sort((a,b)=> (a.na - b.na) || (b.lost - a.lost)).slice(0, 4);
}
function scoreBlurb(q){
  const p = q.pct;
  const graded = q.sections.filter(s=>!s.na);
  const weakest = graded.slice().sort((a,b)=>a.pct-b.pct)[0];
  const lead = p >= .93 ? "Just about a model session."
    : p >= .85 ? "A strong session."
    : p >= .75 ? "A solid session with clear room to tighten up."
    : p >= .6  ? "The work got done, but a lot of value leaked out."
    : "This one was rough, worth understanding why before the next.";
  if(!weakest) return lead;
  return lead + " Your weakest section was <b>" + esc(weakest.label) + "</b> at " +
    weakest.pts + "/" + weakest.max + ".";
}
function scoreCardHTML(q, sess){
  const ringPct = Math.round(q.pct*100);
  const col = gradeColor(q.pct);
  let h = `<h3>Workout quality</h3>
  <div class="sc-hero">
    <div class="sc-ring" style="--scp:${ringPct}%;--scc:${col}">
      <div class="sc-ring-in">
        <div class="sc-grade" style="color:${col}">${q.grade}</div>
        <div class="sc-total">${q.total}/${q.max}</div>
      </div>
    </div>
    <div class="sc-blurb">${scoreBlurb(q)}</div>
  </div>`;
  if(q.prs && q.prs.length){
    h += `<div class="rev-head">Personal records, ${q.prs.length}</div>`;
    q.prs.forEach(p=> h += `<div class="rev-line"><b>🔥 ${esc(p.name)}</b><span class="num">${esc(p.kind)} · ${esc(p.weight||"bw")}×${esc(p.reps||"")}</span></div>`);
  }
  /* Sets you told the app about at the time. Above the sections, because your own
     account of what happened outranks anything the app inferred from the numbers. */
  if(q.flags && q.flags.length){
    h += `<div class="rev-head">What you flagged</div>`;
    q.flags.forEach(f=>{
      const r = REASON_BY_CODE[f.code];
      if(!r) return;
      h += `<div class="rev-line" style="align-items:flex-start">
        <b>${r.icon} ${esc(f.name)}<span style="color:var(--faint);font-weight:400"> · set ${f.set}</span></b>
        <span class="num" style="color:${f.code==="pain"?"var(--bad)":"var(--dim)"};text-align:right">${esc(r.short)}</span>
      </div>${f.note?`<div class="sub" style="margin:-4px 0 6px;font-style:italic">"${esc(f.note)}"</div>`:""}`;
    });
    if(q.flags.some(f=>f.code==="pain")){
      h += `<div class="sc-tip" style="border-left:3px solid var(--bad);padding-left:10px">
        <b>Worth saying</b> pain is the one signal that beats everything else on this card.
        Nothing here is medical advice, but if it's still there next session, stop loading that movement and get it looked at.
      </div>`;
    }
  }
  /* The single most useful thing on this card is the top of this list, so it goes above
     the section breakdown rather than being scattered through it. Ranked by the points
     each one actually cost. */
  if(q.advice && q.advice.length){
    h += `<div class="rev-head">Worth changing next time</div>`;
    q.advice.forEach((a,i)=>{
      h += `<div class="sc-tip" style="margin:0 0 10px">
        <b>${i===0?"Start here":esc(a.label)}</b> ${esc(a.text)}
        ${a.ex?`<div class="sub" style="margin-top:3px;font-size:12.5px">Mostly about <span style="color:var(--text);font-weight:600">${esc(a.ex)}</span></div>`:""}
      </div>`;
    });
  }
  if(sess && sess.progression && sess.progression.length){
    h += progressionHTML(sess.progression);
  }
  const graded = q.sections.filter(s=>!s.na);
  h += `<div class="rev-head">How the ${graded.length} graded section${graded.length===1?"":"s"} scored</div>`;
  // each section title links to the concept it grades
  const SEC_TERM = {overload:"overload", intensity:"rpe", rest:"restwindow",
    reprange:"volume", fatigue:"dropoff", efficiency:"density", logquality:"hardset"};
  graded.forEach(s=>{
    const c = gradeColor(s.pct);
    const tid = SEC_TERM[s.key];
    h += `<div class="sc-sec">
      <div class="sc-sh">
        <span class="sc-sg" style="color:${c};background:${c}22">${s.grade}</span>
        <span class="sc-n">${tid ? term(tid, esc(s.label)) : esc(s.label)}</span>
        <span class="sc-pts">${s.pts} / ${s.max}</span>
      </div>
      <div class="sc-track"><i style="width:${Math.max(2,Math.round(s.pct*100))}%;background:${c}"></i></div>
      <div class="sc-why"><ul>${s.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
    </div>`;
  });
  /* Sections the app couldn't measure are shown but NOT scored, so a missing field can
     never drag a good session's grade down. Each one says what to log to turn it on. */
  const na = q.sections.filter(s=>s.na);
  if(na.length){
    h += `<div class="rev-head">Not graded this time</div>
      <div class="sub" style="margin:-2px 0 8px">These were left out of the score entirely rather than marked down, so the grade only reflects what could actually be measured.</div>`;
    na.forEach(s=>{
      h += `<div class="sc-sec">
        <div class="sc-sh">
          <span class="sc-sg" style="color:var(--faint);background:var(--card2)">—</span>
          <span class="sc-n" style="color:var(--dim)">${esc(s.label)}</span>
          <span class="sc-pts">n/a</span>
        </div>
        <div class="sc-why"><ul>${s.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
        ${s.unlock?`<div class="sc-tip"><b>To grade it</b> ${esc(s.unlock)}</div>`:""}
      </div>`;
    });
  }
  return h;
}
function openScoreCard(sess, onDone){
  const q = sess.quality || scoreWorkout(sess);
  showModal(scoreCardHTML(q, sess) + `<button class="btn" style="margin-top:18px" id="scDone">Got it</button>`);
  let fired = false;
  MODAL_DISMISS = ()=>{ if(fired) return; fired = true; if(onDone) onDone(); };
  MODAL_REOPEN = ()=> openScoreCard(sess, onDone);
  /* Marking it on the SESSION, not just on the button, is what stops the whole "Add
     weight next time" block coming back with live buttons the next time this grade is
     opened from History. See progressionApplied(). */
  const markApplied = name=>{
    const k = nrm(name);
    (sess.progression || []).forEach(p=>{ if(p.kind === "up" && nrm(p.name) === k) p.applied = true; });
    save(); queueSync();
  };
  document.querySelectorAll("#modal [data-progapply]").forEach(btn=> btn.onclick = ()=>{
    if(applyProgression(btn.dataset.progapply, btn.dataset.progto)){
      markApplied(btn.dataset.progapply);
      btn.textContent = "Applied";
      btn.disabled = true;
      btn.classList.add("done");
    }
  });
  const all = $("#progApplyAll");
  if(all) all.onclick = ()=>{
    let n = 0;
    (sess.progression || []).filter(p=>p.kind === "up" && !progressionApplied(p)).forEach(p=>{
      if(applyProgression(p.name, p.to)){ p.applied = true; n++; }
    });
    if(n){ save(); queueSync(); }
    toast(n ? n + " load" + (n === 1 ? "" : "s") + " updated in your programme" : "Nothing to apply");
    openScoreCard(sess, onDone);
  };
  const b = $("#scDone");
  if(b) b.onclick = hideModal;      // hideModal fires MODAL_DISMISS exactly once
}

/* =====================================================================
   PROGRESSIVE OVERLOAD

   The app has always recorded everything needed to know when to add weight, and never
   said so. That was the single largest gap in it: a log that can see a completed top
   set at the top of its rep range and stays silent is asking you to do the analysis it
   was built to do for you.

   DOUBLE PROGRESSION. Work up the rep range at a fixed load; when the LAST prescribed
   set reaches the top of the range at its target RPE, add weight and rebuild from the
   bottom. Gating on the last set rather than all of them is deliberate: it is the most
   fatigued set, so it is the honest one. Hitting 12 on set one and 8 on set four means
   the load is right and you are not done with it.
   ===================================================================== */

/* Increment size, by movement class. The small-increment rule is not cosmetic: a 5 lb
   per-hand jump on a 30 lb curl is a 17% load increase, and that exact jump is
   documented as the cause of four stalled arm lifts in this log. Anything carrying an
   explicit `incr` (the three curls) overrides the class default. */
function progressionStep(e){
  const n = nrm(e && e.name);
  if(e && e.incr != null){
    return {amount: e.incr, unit: "lb a hand", why: "microplates, deliberately small"};
  }
  if(/smith/.test(n)){
    const lower = /squat|hip thrust|calf|rdl|deadlift|lunge/.test(n);
    return lower
      ? {amount: 10, alt: 20, unit: "lb total", why: "Smith bar, lower body, 10 to 20 lb"}
      : {amount: 10, unit: "lb total", why: "Smith bar, upper body"};
  }
  if(!e || e.weight == null){
    return {amount: 5, unit: "lb", bodyweight: true,
            why: "bodyweight movement: add external load once the top of the range clears on the first two sets"};
  }
  if(/dumbbell|\bdb\b/.test(n)){
    return isCompound(e.name)
      ? {amount: 5, unit: "lb a hand", why: "dumbbell compound"}
      : {amount: 2.5, unit: "lb a hand", why: "dumbbell isolation, microplates"};
  }
  return {amount: 5, unit: "lb", why: "one pin on the stack"};
}
function fmtLoad(v){
  if(v == null) return "bodyweight";
  return (Math.round(v * 10) / 10) + " lb";
}

/* The impossible-load guard.

   The previous plan prescribed an 85 lb leg extension for 10-15 reps at RPE 9 when 85
   lb had been logged as failure at 9 reps. That target could not be hit at any effort,
   so every session against it read as a failure to progress and the stall protocol
   would have fired forever. If history shows RPE 9.5+ at this load or heavier for
   fewer reps than the BOTTOM of the range, the prescription is arithmetically
   impossible and the load is the thing to change, not the effort. */
function impossibleLoadCheck(e){
  const range = repRange(e && e.reps);
  if(!range || e.weight == null) return null;
  const key = nrm(e.name);
  let worst = null;
  S.sessions.forEach(s=>(s.entries||[]).forEach(en=>{
    if(nrm(en.name) !== key) return;
    en.sets.forEach(st=>{
      const w = parseFloat(st.weight) || 0;
      const reps = parseFloat(st.reps) || 0;
      const rpe = parseFloat(st.rpe) || 0;
      if(!(reps > 0) || !(w >= e.weight)) return;
      if(rpe < 9.5) return;                    // not taken to failure, proves nothing
      if(reps >= range[0]) return;             // reached the range, so it is possible
      if(!worst || reps < worst.reps) worst = {w, reps, rpe, date: s.date};
    });
  }));
  if(!worst) return null;
  const step = progressionStep(e);
  const suggest = Math.max(0, Math.round((e.weight - step.amount * 2) * 2) / 2);
  return {
    at: worst,
    msg: fmtLoad(e.weight) + " for " + range[0] + "-" + range[1] + " reps is not reachable: "
       + "you have already hit RPE " + worst.rpe + " at " + fmtLoad(worst.w)
       + " for only " + worst.reps + " reps.",
    fix: "Drop to about " + fmtLoad(suggest) + " and earn the range back."
  };
}

/* One exercise's verdict after a session.
     up      last set cleared the top of the range at target RPE, add weight
     hold    still working up the range, says what is left to do
     stall   no improvement in reps or load across 3 sessions
     toohard the prescription itself is impossible at this load                      */
function progressionFor(sess, entry){
  const range = repRange(entry.reps);
  const ws = (entry.sets || []).filter(isWorkingSet);
  if(!ws.length) return null;
  const planned = findProgramEntry(entry.name);
  const target = planned || entry;

  const bad = impossibleLoadCheck(target);
  if(bad) return {name: entry.name, kind: "toohard", detail: bad};

  if(!range) return null;
  const last = ws[ws.length - 1];
  const reps = parseFloat(last.reps) || 0;
  const rpe = parseFloat(last.rpe) || 0;
  const tRpe = rpeTargetFor(entry, entry.sets.indexOf(last));
  const load = parseFloat(last.weight);
  const step = progressionStep(target);

  // "at its target RPE" means you got there without going past the prescribed effort.
  // No RPE logged is treated as meeting it, rather than silently blocking progression.
  const atTarget = (tRpe == null || !rpe) ? true : rpe <= tRpe + RPE_TOL;
  const clearedTop = reps >= range[1];

  if(clearedTop && atTarget){
    const from = isNaN(load) ? (target.weight == null ? null : target.weight) : load;
    const to = step.bodyweight && from == null ? step.amount : (from == null ? null : from + step.amount);
    return {
      name: entry.name, kind: "up", from, to, step,
      msg: step.bodyweight && from == null
        ? "Add " + fmtLoad(step.amount) + " next time"
        : "Add weight next time: " + fmtLoad(from) + " → " + fmtLoad(to),
      sub: "Last set hit " + reps + " reps, the top of " + range[0] + "-" + range[1] +
           (tRpe != null ? ", at RPE " + (rpe || tRpe) + " against a target of " + tRpe : "") +
           ". Rebuild from " + range[0] + " reps at the new load."
    };
  }
  if(clearedTop && !atTarget){
    return {
      name: entry.name, kind: "hold",
      msg: "Hold this load one more session",
      sub: "You reached " + reps + " reps but at RPE " + rpe + ", past the target of " + tRpe +
           ". Get the top of the range at the prescribed effort before adding weight."
    };
  }
  return {
    name: entry.name, kind: "hold",
    msg: "Need " + range[1] + " on the last set to move up",
    sub: "Last set was " + reps + " rep" + (reps === 1 ? "" : "s") + " at " + fmtLoad(isNaN(load) ? null : load) +
         ". " + (range[1] - reps) + " more and the load goes up " + fmtLoad(step.amount) + "."
  };
}
// The plan's own copy of an exercise, which is what a load change has to be written to.
function findProgramEntry(name){
  const k = nrm(name);
  for(const d of DAYS){
    const list = S.program[d] || [];
    for(const e of list){ if(nrm(e.name) === k) return e; }
  }
  return null;
}

/* ---------- stall tracking ----------
   A stall is three consecutive sessions of an exercise with no improvement in either
   reps or load. The protocol checks SLEEP FIRST and deliberately refuses to change the
   programme when sleep is the cause, because cutting volume to fix a recovery problem
   treats the symptom and removes the training at the same time. */
function bestOf(entry){
  let w = 0, reps = 0;
  (entry.sets || []).forEach(st=>{
    if(!isWorkingSet(st)) return;
    const sw = parseFloat(st.weight) || 0, sr = parseFloat(st.reps) || 0;
    if(sw > w || (sw === w && sr > reps)){ w = sw; reps = sr; }
  });
  return {w, reps};
}
function sleepAvgOver(dates){
  const vals = dates.map(d=>parseFloat((S.checkins || {})[d] && (S.checkins[d].sleep))).filter(v=>v > 0);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b, 0) / vals.length;
}
function updateStalls(sess){
  if(!S.stalls || typeof S.stalls !== "object") S.stalls = {};
  (sess.entries || []).forEach(en=>{
    const k = nrm(en.name);
    const prior = priorEntryFor(sess, en.name, 0);
    if(!prior){ S.stalls[k] = {n: 0, dates: [sess.date]}; return; }
    const now = bestOf(en), was = bestOf(prior.entry);
    const improved = now.w > was.w || (now.w === was.w && now.reps > was.reps);
    const rec = S.stalls[k] || {n: 0, dates: []};
    if(improved){ S.stalls[k] = {n: 0, dates: [sess.date]}; return; }
    rec.n = (rec.n || 0) + 1;
    rec.dates = (rec.dates || []).concat(sess.date).slice(-3);
    S.stalls[k] = rec;
  });
}
function stallVerdict(name){
  const rec = (S.stalls || {})[nrm(name)];
  if(!rec || rec.n < 3) return null;
  const sleep = sleepAvgOver(rec.dates || []);
  if(sleep != null && sleep < 6.5){
    return {
      kind: "recovery",
      msg: "Stalled 3 sessions running, but this is a recovery problem",
      sub: "You averaged " + r1(sleep) + " h sleep across those sessions. Under 6.5 h, the "
         + "programme is not the thing that is broken. Do not cut sets: fix sleep first and re-test."
    };
  }
  return {
    kind: "programme",
    msg: "Stalled 3 sessions running with adequate sleep",
    sub: "Cut this exercise by one set for two weeks, then rebuild at the same load."
       + (sleep != null ? " Sleep averaged " + r1(sleep) + " h, so recovery is not the limiter." : "")
  };
}

/* Everything the app wants to say about next session, computed once at finish and
   stored on the session so the card reads the same later. */
function buildProgression(sess){
  const out = [];
  (sess.entries || []).forEach(en=>{
    const p = progressionFor(sess, en);
    if(!p) return;
    const stall = stallVerdict(en.name);
    if(stall && p.kind !== "up") p.stall = stall;
    out.push(p);
  });
  return out;
}
/* Has this load increase already been written into the programme?

   The score card is stored on the session and re-read from History whenever you look at
   an old grade, so "Add weight next time, 3" with three live Apply buttons kept coming
   back weeks after all three had been applied — and tapping one again would stack a
   second increase on a load that had already moved. Two ways to know it's done:

     • the flag written at the moment you applied it, which is the reliable one; and
     • the programme's load standing at EXACTLY the figure this card suggested, which
       catches cards applied before that flag existed, with no migration.

   The second test is deliberately an exact match rather than "the load is at or past
   it". A >= test reads as "applied" for any load that merely sits above the suggestion
   for unrelated reasons — and the Smith entries are exactly that case, since the
   programme records them bar-inclusive (115) while the sets you log do not (40), so
   >= would have silently swallowed every Smith increase this card ever offered. An
   exact match can only be produced by applyProgression() having written it. */
function progressionApplied(p){
  if(!p || p.kind !== "up") return false;
  if(p.applied) return true;
  if(p.to == null) return false;
  const e = findProgramEntry(p.name);
  if(!e || e.weight == null) return false;
  const now = parseFloat(e.weight), to = parseFloat(p.to);
  return !isNaN(now) && !isNaN(to) && now === to;
}
function progressionHTML(list){
  if(!list || !list.length) return "";
  const done = list.filter(p=>p.kind === "up" && progressionApplied(p));
  const ups = list.filter(p=>p.kind === "up" && !progressionApplied(p));
  const hard = list.filter(p=>p.kind === "toohard");
  const stalls = list.filter(p=>p.stall);
  let h = "";
  if(hard.length){
    h += `<div class="rev-head">The load is wrong here</div>`;
    hard.forEach(p=>{
      h += `<div class="wp sev3" style="cursor:default">
        <span class="wp-rank">!</span>
        <span class="wp-body">
          <span class="wp-do">${esc(p.name)}</span>
          <span class="wp-why">${esc(p.detail.msg)}</span>
          <span class="wp-why" style="color:var(--text)">${esc(p.detail.fix)}</span>
        </span></div>`;
    });
  }
  if(ups.length){
    h += `<div class="rev-head">Add weight next time, ${ups.length}</div>`;
    ups.forEach((p,i)=>{
      h += `<div class="pg-row">
        <div class="pg-main">
          <b>${esc(p.name)}</b>
          <div class="pg-msg">${esc(p.msg)}</div>
          <div class="pg-sub">${esc(p.sub)}</div>
        </div>
        <button class="pg-apply" data-progapply="${esc(p.name)}" data-progto="${p.to == null ? "" : p.to}">Apply</button>
      </div>`;
    });
    h += `<button class="more-btn" id="progApplyAll">Apply all ${ups.length} to the programme</button>`;
  }
  /* Applied increases drop out of the actionable list but not off the card: reopening a
     grade should still tell you what changed that day, just without a button offering to
     do it a second time. */
  if(done.length){
    h += `<div class="rev-head">Already added to your programme, ${done.length}</div>`;
    done.forEach(p=>{
      h += `<div class="rev-line"><b>${esc(p.name)}</b><span class="num" style="font-size:12.5px">${
        p.to == null ? "applied" : "now " + esc(fmtLoad(p.to))} ✓</span></div>`;
    });
  }
  if(stalls.length){
    h += `<div class="rev-head">Stalled</div>`;
    stalls.forEach(p=>{
      h += `<div class="wp sev${p.stall.kind === "recovery" ? 2 : 3}" style="cursor:default">
        <span class="wp-rank">${p.stall.kind === "recovery" ? "◑" : "3"}</span>
        <span class="wp-body">
          <span class="wp-do">${esc(p.name)}: ${esc(p.stall.msg)}</span>
          <span class="wp-why">${esc(p.stall.sub)}</span>
        </span></div>`;
    });
  }
  const holds = list.filter(p=>p.kind === "hold" && !p.stall);
  if(holds.length){
    h += `<div class="rev-head">Still working up</div>`;
    holds.forEach(p=>{
      h += `<div class="rev-line"><b>${esc(p.name)}</b><span class="num" style="font-size:12.5px">${esc(p.msg)}</span></div>`;
    });
  }
  return h;
}
/* Writing a suggested load into the plan. Goes through the change log, because a load
   that moved on its own without a record is indistinguishable from one you mistyped. */
function applyProgression(name, to){
  // Adding weight during the week you took off to shed fatigue defeats the deload.
  if(deloadActive()){ toast("Load increases are blocked during a deload"); return false; }
  const e = findProgramEntry(name);
  if(!e){ toast("That exercise is not in the current programme"); return false; }
  const from = e.weight;
  const v = parseFloat(to);
  if(isNaN(v)) return false;
  e.weight = v;
  logPlanChange("weight", null, e.name,
    [fmtLoad(from) + " → " + fmtLoad(v)],
    {note: "Double progression: last set cleared the top of the rep range at target RPE."});
  save(); queueSync();
  return true;
}

/* =====================================================================
   D3 · DELOAD

   Same loads, every exercise cut to 2 sets, everything stopped 3-4 reps short of
   failure. Keeping the loads is what preserves the skill and the stimulus; cutting the
   sets is what buys the recovery. Load increases are blocked for the week, because
   adding weight during the week you took off to dissipate fatigue defeats the point.

   It is a MODE, not an edit: `S.deload` holds the week, and the programme is projected
   through deloadView() at read time. That means ending a deload restores the real plan
   exactly, with no risk of a half-applied revert leaving you on 2 sets forever.
   ===================================================================== */
const DELOAD_RPE_CAP = 7;          // stop 3-4 reps short of failure
const DELOAD_SETS = 2;
const DELOAD_EVERY_WEEKS = 6;

function deloadActive(){
  const d = S.deload;
  if(!d || !d.startedAt) return false;
  if(d.endedAt) return false;
  // a deload is one week and expires on its own; a forgotten toggle should not quietly
  // halve your training for a month
  return (Date.now() - d.startedAt) < 8 * DAY_MS;
}
/* The programme as it should be performed right now. Everything that reads the plan for
   a SESSION goes through here; the Program tab still shows the real thing, with a
   banner, because that is the plan you are deloading from. */
function deloadView(list){
  if(!deloadActive()) return list;
  return (list || []).map(e=>{
    const sets = Math.min(DELOAD_SETS, e.sets || DELOAD_SETS);
    return Object.assign({}, e, {
      sets: sets,
      rpes: Array.isArray(e.rpes)
        ? e.rpes.slice(0, sets).map(v=>Math.min(v, DELOAD_RPE_CAP))
        : undefined,
      rpe: String(DELOAD_RPE_CAP - 1) + "-" + DELOAD_RPE_CAP,
      deloaded: true
    });
  });
}
function weeksSince(ms){ return (Date.now() - ms) / (7 * DAY_MS); }
/* Anchor for "every 6th week". The first logged session is the honest start of the
   block; a deload resets it, because the next block starts when the last one ended. */
function blockStartAt(){
  if(S.deload && S.deload.endedAt) return S.deload.endedAt;
  if(S.blockStart) return S.blockStart;
  return S.sessions.length ? S.sessions[0].startedAt : Date.now();
}
/* The early-trigger conditions, read from data the app already collects. Two or more
   and the deload gets pulled forward rather than waiting for week 6. */
function deloadSignals(){
  const out = [];
  const now = Date.now();
  // 1, four or more nights under 6 h in the last week
  const short = [];
  for(let i = 0; i < 7; i++){
    const d = new Date(now - i * DAY_MS).toLocaleDateString("en-CA");
    const ci = (S.checkins || {})[d];
    const h = ci && parseFloat(ci.sleep);
    if(h > 0 && h < 6) short.push(d);
  }
  if(short.length >= 4) out.push(short.length + " nights under 6 h sleep this week");

  // 2, RPE climbing at loads handled fine before
  const recent = S.sessions.slice(-3);
  if(recent.length === 3){
    let harder = 0, compared = 0;
    recent[2].entries.forEach(en=>{
      const prior = priorEntryFor(recent[2], en.name, 0);
      if(!prior) return;
      const avg = l => {
        const v = (l.sets||[]).map(x=>parseFloat(x.rpe)).filter(x=>x>0);
        return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
      };
      const a = avg(en), b = avg(prior.entry);
      const wNow = bestOf(en).w, wWas = bestOf(prior.entry).w;
      if(a == null || b == null || wNow < wWas) return;
      compared++;
      if(a >= b + 0.75) harder++;
    });
    if(compared >= 3 && harder / compared > 0.5)
      out.push("RPE climbing at loads you handled fine last time");
  }

  // 3, session feel trending down
  const feels = S.sessions.slice(-4).map(s=>s.feel).filter(v=>v > 0);
  if(feels.length >= 3 && feels.reduce((a,b)=>a+b,0)/feels.length <= 2.4)
    out.push("session feel has been low for several workouts");

  // 4, more muscle groups flagged as pushed past recovery than usual
  try{
    const A = bodyAnalysis();
    const over = MKEYS.filter(m=>A.inj[m].score >= 60).length;
    if(over >= 3) out.push(over + " muscle groups are past what they are recovering from");
  }catch(e){}
  return out;
}
function deloadDue(){
  const wk = weeksSince(blockStartAt());
  const signals = deloadSignals();
  if(deloadActive()) return null;
  if(wk >= DELOAD_EVERY_WEEKS)
    return {reason: "scheduled", weeks: Math.floor(wk), signals,
            msg: "You are " + Math.floor(wk) + " weeks into this block. A deload is due."};
  if(signals.length >= 2)
    return {reason: "early", weeks: Math.floor(wk), signals,
            msg: "Two or more early warning signs are showing. Worth pulling the deload forward."};
  return null;
}
function startDeload(){
  S.deload = {startedAt: Date.now(), endedAt: null, reason: (deloadDue() || {}).reason || "manual"};
  logPlanChange("deload", null, "Deload week", [
    "Every exercise cut to " + DELOAD_SETS + " sets",
    "All targets capped at RPE " + DELOAD_RPE_CAP,
    "Loads held, increases blocked"
  ], {note: "One week. Week after resumes at the same loads and full set counts; missed volume is not made up."});
  save(); queueSync();
}
function endDeload(){
  if(!S.deload) return;
  S.deload.endedAt = Date.now();
  S.blockStart = Date.now();
  logPlanChange("deload", null, "Deload ended", ["Full set counts and RPE targets restored"], {});
  save(); queueSync();
}

/* =====================================================================
   D4 · THE SLEEP WINDOW

       wake - 8 h        = bedtime
       bedtime - 3 h     = latest permissible training END
       latest end - duration = latest permissible START

   This lifter has historically started sessions as late as 12:31 AM and finished at
   2:01 AM, so this is load-bearing rather than decorative. When a session will not fit,
   the app says so BEFORE the first set and names which exercises it is dropping, from
   the end, rather than letting the session silently overrun into the sleep window.
   ===================================================================== */
/* How much sleep you are aiming for. A setting rather than a constant, because 8 is a
   population default and the number that matters is yours. */
const SLEEP_NEED_DEFAULT = 8;
function sleepNeedH(){
  const v = parseFloat(S.sleepTarget);
  return v > 0 ? v : SLEEP_NEED_DEFAULT;
}
const WIND_DOWN_H = 3;
function wakeTime(){ return S.wakeTime || null; }
function hasWakeTime(){ return !!S.wakeTime; }
/* What tonight costs, worked forward instead of backward. This is the mode for when
   there is no fixed wake time to anchor to: it makes no judgement about whether the
   session fits, it just follows the same arithmetic in the other direction and tells
   you when you would actually be getting up. Finishing at 2 AM and needing 8 h is a
   1 PM wake, and seeing that number is the whole point. */
function sleepProjection(wid, startAt){
  const now = startAt || Date.now();
  const dur = projectedDuration(wid);
  const end = now + dur * 60000;
  const asleep = end + WIND_DOWN_H * 3600e3;
  const wake = asleep + sleepNeedH() * 3600e3;
  return {dur, end, asleep, wake};
}
function parseHM(hm){
  const m = String(hm||"").match(/^(\d{1,2}):(\d{2})$/);
  return m ? {h: +m[1], m: +m[2]} : {h: 8, m: 0};
}
// Typical minutes for a session of this day, from your own history where there is any.
function projectedDuration(wid){
  const past = S.sessions.filter(s=>s.workoutId === wid && s.startedAt && s.finishedAt && s.finishedAt > s.startedAt);
  if(past.length){
    const mins = past.slice(-5).map(s=>(s.finishedAt - s.startedAt) / 60000);
    return Math.round(mins.reduce((a,b)=>a+b,0) / mins.length);
  }
  // no history: estimate from the prescription, sets x (working time + prescribed rest)
  const list = deloadView(S.program[wid] || []);
  let sec = 0;
  list.forEach(e=>{
    const rest = Array.isArray(e.rest) ? e.rest[0] : 120;
    sec += (e.sets || 0) * (40 + (e.superset ? 0 : rest));
  });
  return Math.max(20, Math.round(sec / 60));
}
function sleepWindow(wid, startAt){
  const now = startAt || Date.now();
  const w = parseHM(wakeTime());
  // the next time the clock reads your wake time
  const wake = new Date(now);
  wake.setHours(w.h, w.m, 0, 0);
  if(wake.getTime() <= now) wake.setDate(wake.getDate() + 1);
  const bedtime = wake.getTime() - sleepNeedH() * 3600e3;
  const latestEnd = bedtime - WIND_DOWN_H * 3600e3;
  const dur = projectedDuration(wid);
  const latestStart = latestEnd - dur * 60000;
  return {wake: wake.getTime(), bedtime, latestEnd, latestStart, dur,
          fits: now <= latestStart, overBy: Math.max(0, Math.round((now - latestStart) / 60000))};
}
/* Which exercises have to go, always from the END, so the compounds that open the
   session are never the ones sacrificed. */
function trimForSleep(wid, win){
  const list = deloadView(S.program[wid] || []);
  if(win.fits) return {keep: list, drop: []};
  let budget = Math.max(0, win.latestEnd - Date.now()) / 60000;
  const keep = [], drop = [];
  list.forEach(e=>{
    const rest = Array.isArray(e.rest) ? e.rest[0] : 120;
    const cost = (e.sets || 0) * (40 + (e.superset ? 0 : rest)) / 60;
    if(cost <= budget){ keep.push(e); budget -= cost; }
    else drop.push(e);
  });
  // never leave nothing: the first movement is the one that matters most
  if(!keep.length && list.length){ keep.push(list[0]); drop.shift(); }
  return {keep, drop};
}
function fmtTimeOfDay(ms){
  return new Date(ms).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}

/* =====================================================================
   D5 · CALIBRATION

   Two loads have no baseline: the Dumbbell Lateral Raise and the new Seated Calf
   Raise. Guessing a number and printing it as if it were prescribed would be worse
   than admitting there isn't one, so the exercise carries `calibrate` with a ballpark
   and asks for a feeler set the first time you perform it.
   ===================================================================== */
function needsCalibration(e){
  return !!(e && e.calibrate != null && e.weight == null);
}
function calibrateHTML(e){
  return `<div class="cal-note">
    <b>Calibrate this one</b> No baseline yet. Do one feeler set of about
    ${esc(String(e.calibrate))} lb, take it to roughly the top of the rep range, then log
    what actually worked. That becomes the starting load.
  </div>`;
}
function setCalibratedLoad(name, w){
  const e = findProgramEntry(name);
  if(!e) return false;
  e.weight = w;
  delete e.calibrate;
  logPlanChange("weight", null, e.name, ["calibrated to " + fmtLoad(w)],
    {note: "First performance: starting load set from a feeler set."});
  save(); queueSync();
  return true;
}

/* =====================================================================
   D6 · RAMP-IN AND ASYMMETRY, as rules rather than prose

   Both are temporary and both expire on their own. Encoding them as dated rules means
   the app stops nagging when they lapse, instead of leaving stale advice in a note
   field forever.
   ===================================================================== */
const RAMP_IN_WEEKS = 2;
const ASYM_WEEKS = 4;
function planStartAt(){
  if(S.planStart) return S.planStart;
  // set on first migration; fall back to the first session under the new plan
  const first = S.sessions.find(s=>DAYS.indexOf(s.workoutId) > -1);
  return first ? first.startedAt : Date.now();
}
function rampInActive(){ return weeksSince(planStartAt()) < RAMP_IN_WEEKS; }
function asymActive(){ return weeksSince(planStartAt()) < ASYM_WEEKS; }
/* The movements carrying the most isolation volume start below their prescribed set
   count and build up over the first two weeks. Muscle adapts faster than tendon and
   connective tissue do, so the first fortnight on any new plan is when the jump in
   volume is most likely to cost you something. */
// How many movements in today's rotation are actually still ramping.
function countRampedMovements(){
  let n = 0;
  DAYS.forEach(d=>(S.program[d]||[]).forEach(e=>{
    if(e && e.rampIn != null && rampedSets(e) < e.sets) n++;
  }));
  return n;
}
function rampedSets(e){
  if(!rampInActive() || !e || e.rampIn == null) return e ? e.sets : 0;
  return Math.min(e.sets, e.rampIn);
}
function asymNoteFor(e){
  if(!asymActive()) return null;
  if(altStyle(e) !== "side") return null;
  return "Match the weaker side: do the same rep count on both sides, set by the weaker one.";
}
function ruleBannerHTML(){
  const bits = [];
  /* COUNT WHAT IS ACTUALLY RAMPED, rather than announcing a number. A banner that says
     "five movements are running reduced sets" when the plan has none is worse than no
     banner: it is the app describing somebody else's programme back at you. */
  const ramped = rampInActive() ? countRampedMovements() : 0;
  if(ramped > 0){
    const left = Math.max(0, RAMP_IN_WEEKS - weeksSince(planStartAt()));
    bits.push({k:"Easing in", v:ramped + " movement" + (ramped===1?" is":"s are") +
      " running reduced sets for another " +
      (left < 1 ? Math.round(left * 7) + " days" : r1(left) + " weeks") +
      ", then step up to the full count. Tendon adapts more slowly than muscle, and a new plan is when that gap bites."});
  }
  // The asymmetry rule is about single-limb work. With none in the plan, or nothing
  // logged yet, there is nothing for it to be a rule ABOUT.
  if(asymActive() && unilateralInPlan().length && S.sessions.length){
    const left = Math.max(0, ASYM_WEEKS - weeksSince(planStartAt()));
    const measured = unilateralInPlan()
      .map(e=>({name:e.name, st:sideStats(e.name)}))
      .filter(x=>x.st.ok && x.st.weaker)
      .sort((a,b)=>b.st.gap - a.st.gap)
      .slice(0,2);
    bits.push({k:"Asymmetry", v:"Match the weaker side on all single-limb work for another " +
      (left < 1 ? Math.round(left * 7) + " days" : r1(left) + " weeks") + ", then re-test." +
      (measured.length
        ? " Widest gap right now: " + measured.map(x=>
            x.name + " " + r1(x.st.gap) + " rep" + (r1(x.st.gap)===1?"":"s") +
            (x.st.confident ? "" : " (provisional)")).join(", ") + "."
        : " No balanced reading yet, so no gap to report.")});
  }
  if(!bits.length) return "";
  return `<div class="card rule-card">` + bits.map(b=>
    `<div class="rule-row"><span class="rule-k">${esc(b.k)}</span><span>${esc(b.v)}</span></div>`).join("") + `</div>`;
}

/* =====================================================================
   DRIFT GUARD

   The original diagnosis was never "days aren't pinned to the calendar" — it was that
   muscle groups were going 8 to 11 days between sessions. That is the thing worth
   catching. With six days plus one rest day, a normal week has every muscle back
   inside 3-4 days, so 5+ means you have genuinely slipped rather than merely shuffled.
   ===================================================================== */
const DRIFT_DAYS = 5;
function driftReport(){
  const now = Date.now();
  const last = {};
  S.sessions.forEach(s=>{
    (s.entries || []).forEach(e=>{
      const mm = musclesFor(e.name);
      if(!mm) return;
      const worked = (e.sets || []).some(isWorkingSet);
      if(!worked) return;
      Object.keys(mm).forEach(m=>{
        if(mm[m] < 0.5) return;           // assisting is not training
        if(!last[m] || s.startedAt > last[m]) last[m] = s.startedAt;
      });
    });
  });
  const stale = [];
  MKEYS.forEach(m=>{
    if(GROUPS[m].optional) return;
    if(!last[m]) return;                  // never trained is a weak point, not drift
    const days = (now - last[m]) / DAY_MS;
    if(days >= DRIFT_DAYS) stale.push({m, days: Math.floor(days)});
  });
  return stale.sort((a,b)=>b.days - a.days);
}
function driftHTML(){
  const stale = driftReport();
  if(!stale.length) return "";
  const top = stale.slice(0, 4);
  return `<div class="card drift-card">
    <div class="fc-k" style="color:var(--bad)">Drifting</div>
    <div class="fc-do">${top.map(x=>esc(gName(x.m)) + " " + x.days + " days").join(" · ")}${
      stale.length > 4 ? " and " + (stale.length - 4) + " more" : ""}</div>
    <div class="fc-sub">On a six-day rotation every muscle should come round inside 3 to 4 days.
      Anything past ${DRIFT_DAYS} means the rotation has slipped, not just shifted.</div>
  </div>`;
}

/* ---------- the banners these rules put on Today ---------- */
function deloadBannerHTML(){
  if(deloadActive()){
    const d = S.deload;
    const daysIn = Math.floor((Date.now() - d.startedAt) / DAY_MS) + 1;
    return `<div class="card deload-card">
      <div class="fc-k" style="color:var(--back)">Deload week, day ${daysIn} of 7</div>
      <div class="fc-do">Every exercise is cut to ${DELOAD_SETS} sets and capped at RPE ${DELOAD_RPE_CAP}. Loads stay exactly where they are.</div>
      <div class="fc-sub">Keeping the weight is what preserves the stimulus; cutting the sets is what buys the recovery. Load increases are blocked this week, and next week resumes at full sets without making up what you missed.</div>
      <button class="fc-btn" id="endDeloadBtn">End the deload now</button>
    </div>`;
  }
  const due = deloadDue();
  if(!due) return "";
  return `<div class="card deload-card">
    <div class="fc-k" style="color:var(--back)">Deload ${due.reason === "early" ? "worth pulling forward" : "due"}</div>
    <div class="fc-do">${esc(due.msg)}</div>
    ${due.signals.length ? `<div class="fc-sub">Signs showing: ${esc(due.signals.join("; "))}.</div>` : ""}
    <button class="fc-btn" id="startDeloadBtn">Start a deload week</button>
  </div>`;
}
function sleepWindowHTML(wid){
  if(S.sleepGuard === "off") return "";
  /* No fixed wake time? Then there is nothing to be late FOR, and pretending otherwise
     would be inventing a deadline. Show the consequence instead of a verdict. */
  if(!hasWakeTime()){
    if(!S.sleepTarget) return "";        // nothing to project from either, stay quiet
    const pr = sleepProjection(wid);
    return `<div class="sleep-ok">Starting now, this runs about <b>${pr.dur} min</b> and finishes
      <b>${fmtTimeOfDay(pr.end)}</b> &middot; asleep around <b>${fmtTimeOfDay(pr.asleep)}</b> after winding down,
      up <b>${fmtTimeOfDay(pr.wake)}</b> on ${r1(sleepNeedH())} h.</div>`;
  }
  const win = sleepWindow(wid);
  if(win.fits){
    return `<div class="sleep-ok">Fits your sleep window: start by <b>${fmtTimeOfDay(win.latestStart)}</b>,
      out by <b>${fmtTimeOfDay(win.latestEnd)}</b>, asleep by <b>${fmtTimeOfDay(win.bedtime)}</b>.</div>`;
  }

    <div class="fc-do">You are ${win.overBy} min past the latest start. This one runs to

    ${t.drop.length ? `<div class="fc-sub">Cut from the end, in this order:
      <b>${esc(t.drop.map(e=>e.name).join(", "))}</b>. The compounds at the front are the ones that matter;
      sleep is the constraint everything else is competing with.</div>`
      : `<div class="fc-sub">Even trimmed this will not fit. Train tomorrow rather than borrowing the hours from sleep.</div>`}
  </div>`;
