<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#131315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Iron Log — training log and planner</title>
<meta name="description" content="A training log that reads what you lift and tells you what to change. Builds a plan around your goal, experience, equipment and schedule, then grades every session and tracks the volume each muscle actually receives.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131315; --card:#1c1c20; --card2:#232329; --line:#2e2e36;
  --text:#eceae4; --dim:#a09ea6; --faint:#75747c;
  --chest:#e05248; --back:#4a82e0; --arms:#e8b62c; --shoulders:#46a85c; --legs:#e9e5db;
  /* Six-day PPL A/B. The A days keep the old palette so the app still feels familiar;
     the B days are a shifted hue of the same family, so Push A / Push B read as
     related-but-distinct at plate size rather than as two unrelated colours. */
  --d-pusha:#e05248; --d-pushb:#e8894a;
  --d-pulla:#4a82e0; --d-pullb:#5ec2d8;
  --d-legsa:#e9e5db; --d-legsb:#a9b58c;
  --ok:#46a85c; --bad:#e05248;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Barlow Condensed',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16.5px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
#app{max-width:600px;margin:0 auto;padding:16px 14px 20px}
h1,h2,h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.hdr{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 16px}
.hdr h1{font-size:32px;font-weight:700}
.hdr .date{color:var(--dim);font-family:var(--mono);font-size:13px}

/* rotation plate strip */
.plate.rest{
  background:var(--card2);color:var(--dim);
  box-shadow:none;border:2px dashed var(--faint);
}
.plate.rest.cur{border-style:solid;border-color:var(--text)}
.plates{display:flex;gap:5px;justify-content:space-between;margin:0 2px 18px}
.plate{
  flex:1;aspect-ratio:1;max-width:44px;min-width:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.02em;
  color:var(--bg);cursor:pointer;position:relative;border:none;
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.28), inset 0 0 0 11px rgba(255,255,255,.06);
  opacity:.34;transition:opacity .15s, transform .15s;
}
.plate.done{opacity:.85}
/* A slot the rotation has already moved past. The schedule is fixed, so these are
   history, not choices: they stay visible (you still want to see what you've done)
   but they don't take a tap. */
.plate.past{cursor:default}
.plate.past:active{transform:none}
.pcheck{
  position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;
  background:var(--ok);color:#0d1a10;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg);
}
.cycle-row{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 0;color:var(--faint);font-size:12px}
.cycle-row button{background:none;border:none;color:var(--faint);font:11px var(--mono);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;padding:4px}
.feel-row{display:flex;gap:9px;margin-top:8px}
.feel-btn{
  width:52px;height:52px;font-size:27px;border-radius:12px;cursor:pointer;
  background:var(--card2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  opacity:.45;filter:grayscale(.6);transition:all .15s;
}
.feel-btn.on{opacity:1;filter:none;border-color:var(--ok);transform:scale(1.12)}
.ci-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.ci-field label{display:block;color:var(--faint);font:10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.ci-field input,.ci-field select{
  width:100%;padding:12px 8px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font-family:var(--mono);font-size:16px;text-align:center;appearance:none;
}
.rest-note{margin:2px 0 12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card2);font-size:13px;color:var(--dim);text-align:center}
.linklike{background:none;border:none;color:var(--dim);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.restore-card{border:1px solid var(--arms);background:linear-gradient(180deg,rgba(232,182,44,.09),transparent)}
.restore-card h3{color:var(--arms)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{
  flex:1;padding:14px;background:var(--card2);border:none;color:var(--dim);cursor:pointer;
  font-family:var(--disp);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
}
.seg button.on{background:var(--text);color:var(--bg)}
.focus-name{font-size:27px!important;line-height:1.1}
.bar-wrap{display:flex;align-items:center;justify-content:center;margin:16px 0 6px;min-height:70px}
.bar-end{height:8px;width:22px;background:#6d6d75;border-radius:4px;flex-shrink:0}
.bar-shaft{height:8px;background:#6d6d75;border-radius:4px;flex:0 1 90px;min-width:34px}
.collar{width:9px;height:24px;background:#8a8a92;border-radius:3px;flex-shrink:0;margin:0 1px}
.sleeve{display:flex;align-items:center;gap:3px}
.sleeve.left{flex-direction:row-reverse}
.bplate{border-radius:3px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.28);flex-shrink:0}
.bplate.ghost{background:transparent!important;box-shadow:none;border:2px dashed var(--faint);animation:ghostPulse 1.3s ease-in-out infinite}
@keyframes ghostPulse{50%{opacity:.3}}
.bplate.drop{animation:plateDrop .5s cubic-bezier(.24,1.3,.4,1) both}
@keyframes plateDrop{0%{transform:translateY(-72px) rotate(-14deg);opacity:0}55%{transform:translateY(5px) rotate(2deg);opacity:1}80%{transform:translateY(-3px)}100%{transform:none;opacity:1}}
.loader-label{text-align:center;color:var(--faint);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.fullbar .bar-shaft,.fullbar .bar-end{background:#8f8f98}
.fullbar{animation:barGlow 1.6s ease-in-out infinite}
@keyframes barGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(236,234,228,.15))}50%{filter:drop-shadow(0 0 14px rgba(236,234,228,.5))}}
.card.focus .set,.card.focus .set-labels{grid-template-columns:48px 1fr 1fr 92px 56px}
.card.focus .side-chip{font-size:12.5px;padding:3px 6px;min-width:26px}
.card.focus .set input{padding:16px 8px;font-size:19px}
.card.focus .set select{padding:16px 2px;font-size:17px}
.card.focus .chk{width:56px;height:56px;font-size:23px}
.rev-stat{margin:8px 0;font-size:15px;color:var(--text)}
.rev-head{font-family:var(--disp);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:16px 0 4px;border-bottom:1px solid var(--line);padding-bottom:5px}
.rev-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14.5px}
.rev-line .num{color:var(--dim)}
.plate.cur{opacity:1;transform:scale(1.12);box-shadow:inset 0 0 0 4px rgba(0,0,0,.28), inset 0 0 0 11px rgba(255,255,255,.06), 0 0 0 2px var(--bg), 0 0 0 4px var(--text)}
.plate small{position:absolute;bottom:-17px;left:0;right:0;text-align:center;color:var(--faint);font:9.5px var(--mono);letter-spacing:0}
.plates-wrap{margin-bottom:30px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{font-size:20px;margin-bottom:2px}
.sub{color:var(--dim);font-size:14px}
.sub .num{font-size:13px}

/* buttons */
.btn{
  display:block;width:100%;padding:17px;border-radius:14px;border:none;cursor:pointer;
  font-family:var(--disp);font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  background:var(--text);color:var(--bg);
}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.small{width:auto;display:inline-block;padding:10px 16px;font-size:16px}
.btn:disabled{opacity:.4}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{flex:1}

/* exercise + set rows */
.ex{margin-bottom:14px}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ex-head b{font-size:17px}
.ex-target{color:var(--dim);font-size:13px;font-family:var(--mono);white-space:nowrap}
.ex-note{color:var(--faint);font-size:12.5px;margin-top:-4px;margin-bottom:8px}
.ex-last{
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  margin:2px 0 12px;padding:9px 11px;
  background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--dim);
  border-radius:11px;
}
.ex-insight{display:flex;gap:9px;align-items:baseline;font-size:13.5px;color:var(--text);margin:-6px 0 12px;line-height:1.4}
.ins-tag{
  flex-shrink:0;font-family:var(--disp);font-size:11.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.09em;color:var(--arms);
  border:1px solid rgba(232,182,44,.45);padding:2px 8px;border-radius:6px;
}
.ll-tag{
  font-family:var(--disp);font-size:12px;font-weight:700;line-height:1.15;
  text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin-right:3px;
}
.ll-set{
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:600;
  color:var(--text);background:rgba(255,255,255,.07);
  padding:5px 10px;border-radius:8px;white-space:nowrap;
}
#reportOverlay{position:fixed;inset:0;z-index:200;background:#fff;display:flex;flex-direction:column}
#reportOverlay .rep-bar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#111}
#reportOverlay .rep-btn{padding:11px 18px;border:none;border-radius:9px;font:bold 15px sans-serif;cursor:pointer}
#reportOverlay .rep-btn.close{background:#333;color:#fff}
#reportOverlay .rep-btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px #555}
#reportOverlay .rep-btn.print{background:#fff;color:#111}
#reportOverlay .rep-scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;color:#111;background:#fff;padding:24px 20px calc(40px + env(safe-area-inset-bottom));font-family:Georgia,'Times New Roman',serif;line-height:1.55;font-size:16px}
#reportOverlay .rep-scroll h1{font-size:26px;margin:0 0 2px;border-bottom:3px solid #111;padding-bottom:8px;color:#111}
#reportOverlay .rep-scroll h2{font-size:19px;margin:26px 0 6px;color:#111}
#reportOverlay .rep-scroll p{margin:5px 0}
#reportOverlay .rep-scroll .meta{color:#555;font-size:13px;font-style:italic}
#reportOverlay .rep-scroll table{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:13px}
#reportOverlay .rep-scroll th,#reportOverlay .rep-scroll td{border:1px solid #999;padding:5px 9px;text-align:left;vertical-align:top;color:#111}
#reportOverlay .rep-scroll th{background:#eee;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
#reportOverlay .rep-scroll td.c{text-align:center;font-variant-numeric:tabular-nums}
#reportOverlay .rep-scroll hr{border:none;border-top:1px solid #bbb;margin:18px 0}
#reportOverlay .rep-scroll .planchg{border-left:3px solid #111;background:#f4f2ee;padding:9px 14px;margin:20px 0;font-size:14px;color:#111}
#reportOverlay .rep-scroll .planchg ul{margin:5px 0 0;padding-left:18px}
#reportOverlay .rep-scroll .planchg li{margin:2px 0}
@media print{
  body.report-open>*:not(#reportOverlay){display:none!important}
  #reportOverlay{position:static;background:#fff}
  #reportOverlay .rep-bar{display:none!important}
  #reportOverlay .rep-scroll{overflow:visible;padding:0}
}
.rl-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.rl-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-family:var(--mono);font-size:13px;color:var(--dim)}
.rl-chip button{background:var(--line);border:none;color:var(--text);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;line-height:1}
.ss-badge{display:inline-block;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--bg);background:var(--dim);border-radius:5px;padding:2px 6px;vertical-align:middle;margin-left:5px}
.ss-card{border-left:3px solid var(--dim)}
/* The second half of a pair gets the outline treatment so the two read as one unit
   without the closing movement shouting as loudly as the opener. */
.ss-badge.ss-b{background:transparent;color:var(--dim);box-shadow:inset 0 0 0 1px var(--line)}
.ss-note{
  font-size:12.5px;line-height:1.45;color:var(--dim);
  margin:-2px 0 9px;padding-left:9px;border-left:2px solid var(--line);
}
.ss-note b{color:var(--text)}

/* ================= SUPERSET ROUNDS =================
   The pair as one card. The accent border is the whole card rather than a per-exercise
   stripe, because the unit here IS the pair; the rounds inside are the repeated thing.
   Colour is used once, on the header, so three rounds of amber don't shout. */
.ss-group{border:1px solid rgba(232,182,44,.4);padding:12px}
.ss-hdr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ss-hdr-t{
  font-family:var(--disp);font-size:14px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--arms);
}
.ss-hdr-t::before{content:"⟷";margin-right:6px;font-family:var(--mono)}
.ss-hdr-n{font-size:12px;color:var(--faint)}
/* what the two movements are, stated once above the rounds */
.ss-leg{padding:0 0 9px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.ss-leg:last-of-type{margin-bottom:10px}
.ss-leg-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ss-leg-h b{font-size:15px;flex:1;min-width:0}
.ss-leg .ex-last{margin:6px 0 0}
.ss-leg .ex-note{margin:3px 0 0}

.ss-round{
  background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:9px 10px;margin-bottom:8px;
}
.ss-round:last-child{margin-bottom:0}
/* a finished round recedes so the one you are on is the obvious target */
.ss-round.done{opacity:.55}
.ss-round-h{
  display:flex;align-items:baseline;gap:6px;margin-bottom:7px;
  font-family:var(--disp);font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;color:var(--text);
}
.ss-round-of{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--faint);font-weight:400}
/* the movement name, directly above its own inputs */
.ss-mv{font-size:13px;color:var(--dim);margin:0 0 4px 2px}
.ss-mv-off{color:var(--faint);display:flex;align-items:baseline;gap:7px;padding:5px 0 3px}
.ss-mv-none{
  font:10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;
  color:var(--faint);border:1px dashed var(--line);border-radius:5px;padding:2px 6px;
}
.ss-round .set{margin-bottom:7px}
.ss-round .set:last-of-type{margin-bottom:0}
.ss-rest{
  font:11px var(--mono);letter-spacing:.05em;color:var(--faint);
  margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);
}
.ss-rest::before{content:"⏱ ";}
.alt-badge{
  display:inline-block;font:11.5px var(--mono);color:var(--bg);background:var(--dim);
  border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle;
}
.set{display:grid;grid-template-columns:44px 1fr 1fr 86px 48px;gap:7px;align-items:center;margin-bottom:8px}
.set .idx{color:var(--faint);font:14px var(--mono);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.side-chip{
  font-family:var(--disp);font-style:normal;font-weight:700;font-size:11px;
  letter-spacing:.04em;line-height:1;padding:2.5px 5px;border-radius:5px;
  min-width:22px;text-align:center;
}
.sc-r{background:rgba(74,130,224,.22);color:#8ab4f0;box-shadow:inset 0 0 0 1px rgba(74,130,224,.45)}
.sc-l{background:rgba(232,182,44,.2);color:#e8b62c;box-shadow:inset 0 0 0 1px rgba(232,182,44,.45)}
.side-key{display:inline-flex;align-items:center;gap:5px;margin-left:8px;font:11px var(--mono);color:var(--faint)}
.set input{
  width:100%;padding:13px 8px;border-radius:11px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font-family:var(--mono);font-size:17px;text-align:center;
}
.set input::placeholder{color:var(--faint)}
.set select{
  width:100%;padding:13px 2px;border-radius:11px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font-family:var(--mono);font-size:16px;text-align:center;appearance:none;
}
.set .chk{
  width:48px;height:48px;border-radius:11px;border:1px solid var(--line);background:var(--card2);
  color:var(--faint);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.set .chk.on{background:var(--ok);border-color:var(--ok);color:#0d1a10}
.set-labels{display:grid;grid-template-columns:44px 1fr 1fr 86px 48px;gap:7px;color:var(--faint);font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.set-labels span{text-align:center}
/* The per-set RPE target, printed immediately left of the RPE picker so the number you
   are aiming at and the number you log sit in the same cell. Muted, because it is a
   reference value and the input is the thing you interact with. */
/* ================= TEMPORARY-RULE BANNERS =================
   Deload, sleep window, drift and the two expiring rules. All four share a shape: a
   coloured left edge naming the constraint, the consequence in readable type, and the
   reasoning underneath in grey. They sit above the exercise list because every one of
   them changes what you should do BEFORE the first set, not after. */
.deload-card{border-left:4px solid var(--back);background:linear-gradient(180deg,rgba(74,130,224,.08),transparent)}
.sleep-card{border-left:4px solid var(--bad);background:linear-gradient(180deg,rgba(224,82,72,.08),transparent)}
.drift-card{border-left:4px solid var(--bad);background:linear-gradient(180deg,rgba(224,82,72,.06),transparent)}
.rule-card{border-left:4px solid var(--arms);background:linear-gradient(180deg,rgba(232,182,44,.06),transparent);padding:12px 14px}
.rule-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--dim);padding:4px 0}
.rule-row + .rule-row{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.rule-k{
  flex-shrink:0;font-family:var(--disp);font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;color:var(--arms);min-width:74px;padding-top:1px;
}
.sleep-ok{
  font:12px var(--mono);color:var(--faint);text-align:center;
  margin:-4px 2px 12px;line-height:1.5;
}
.sleep-ok b{color:var(--dim)}
/* the calibration prompt on an exercise with no baseline load */
.cal-note{
  font-size:13px;line-height:1.5;color:var(--dim);
  background:var(--card2);border:1px dashed var(--arms);border-radius:11px;
  padding:10px 12px;margin:-2px 0 12px;
}
.cal-note b{
  display:block;font-family:var(--disp);font-size:12px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--arms);margin-bottom:3px;
}

/* ================= PROGRESSION ROWS =================
   One row per lift that earned a load increase, with the action on the right. The
   number is the point of the row, so it gets the weight; the reasoning sits under it
   in grey because you only read that when you disagree with the verdict. */
.pg-row{
  display:flex;align-items:center;gap:11px;
  background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--ok);
  border-radius:12px;padding:11px 12px;margin-bottom:9px;
}
.pg-main{flex:1;min-width:0}
.pg-main b{font-size:15px}
.pg-msg{font-family:var(--mono);font-size:14.5px;font-weight:600;color:var(--ok);margin-top:3px}
.pg-sub{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.45}
.pg-apply{
  flex-shrink:0;background:var(--ok);color:#0d1a10;border:none;border-radius:9px;
  padding:9px 14px;cursor:pointer;
  font-family:var(--disp);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
}
.pg-apply.done,.pg-apply:disabled{background:var(--card2);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}

/* ================= TIME AND DATE INPUTS =================
   iOS Safari gives input[type=time] and [type=date] an intrinsic width from the native
   control and then largely ignores `width:100%`, so with padding and a border added on
   top the field renders WIDER than its card and spills out the side. Resetting the
   appearance is what lets the width actually apply; min-width:0 stops it forcing a
   flex parent open; the explicit height keeps it the same size as every other field
   once the native chrome is gone. */
.timein{
  -webkit-appearance:none; appearance:none;
  display:block; width:100%; max-width:100%; min-width:0; box-sizing:border-box;
  padding:13px; border-radius:11px; border:1px solid var(--line);
  background:var(--card2); color:var(--text);
  font-family:var(--mono); font-size:16px; line-height:1.2; min-height:48px;
}
/* Safari renders the value inside its own inline box that stays left-aligned and can
   still overflow; this pins it to the field's own box. */
.timein::-webkit-date-and-time-value{text-align:left;margin:0}
.timein::-webkit-calendar-picker-indicator{margin-left:auto}
.timein:focus{outline:none;border-color:var(--dim)}

/* ================= WARM-UPS =================
   Deliberately quieter than a working set: no input, no tick, no border-left accent.
   It is a reference strip, and it should read as one so it never gets mistaken for
   something you are supposed to log. */
.warm{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  margin:2px 0 10px;padding:8px 10px;
  background:rgba(255,255,255,.035);border:1px dashed var(--line);border-radius:10px;
}
.warm-tag{
  font-family:var(--disp);font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;color:var(--faint);flex-shrink:0;
}
.warm-sets{display:flex;flex-wrap:wrap;gap:5px}
.warm-set{
  font-family:var(--mono);font-size:13px;color:var(--dim);
  background:rgba(255,255,255,.05);border-radius:6px;padding:3px 7px;white-space:nowrap;
}
.warm-set i{font-style:normal;color:var(--faint)}
.warm-note{flex-basis:100%;font-size:11.5px;color:var(--faint);line-height:1.35}

/* The four-week rep-matching rule, on the exercise it governs. */
.asym-hint{
  font-size:12.5px;line-height:1.45;color:var(--text);
  background:rgba(232,182,44,.09);border:1px solid rgba(232,182,44,.3);
  border-radius:9px;padding:7px 10px;margin:-4px 0 10px;
}
.asym-hint b{font-family:var(--disp);font-size:12.5px;letter-spacing:.04em;color:var(--arms)}
/* The sample the number rests on. Deliberately quiet: it matters that it is there, and
   it should never compete with the instruction above it. */
.asym-note{display:block;margin-top:3px;color:var(--faint);font-size:11.5px}

/* ---- the four-week re-test card ---- */
.asym-card{border:1px solid var(--line);border-left:4px solid var(--arms)}
.asym-row{
  background:var(--card2);border-radius:11px;padding:10px 12px;margin-top:9px;
}
.asym-row b{font-size:15px}
.asym-gap{font-size:13.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.asym-sample{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.4}
.asym-verdict{
  margin-top:6px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.07em;
  border-radius:6px;padding:3px 7px;display:inline-block;
}
.asym-verdict.ok{color:var(--ok);background:rgba(70,168,92,.14)}
.asym-verdict.keep{color:var(--arms);background:rgba(232,182,44,.14)}

.rpe-cell{display:flex;align-items:center;gap:5px;min-width:0}
.rpe-cell select{flex:1;min-width:0}
.rpe-target{
  flex-shrink:0;font-family:var(--mono);font-size:12px;font-weight:600;
  color:var(--arms);background:rgba(232,182,44,.13);
  border-radius:6px;padding:4px 5px;line-height:1;
}
.card.focus .rpe-target{font-size:13.5px;padding:6px 6px}
.last{color:var(--faint);font:12px var(--mono);grid-column:2/6;margin-top:-4px;margin-bottom:2px;padding-left:2px}

/* workout picker */
.picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.picker button{
  padding:17px;border-radius:14px;border:1px solid var(--line);background:var(--card2);
  color:var(--text);font-family:var(--disp);font-size:18px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;cursor:pointer;display:flex;align-items:center;gap:10px;
}
.dot{width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.3);flex-shrink:0}

/* history */
.sess{cursor:pointer}
.sess .row1{display:flex;justify-content:space-between;align-items:baseline}
.sess .row1 b{font-size:17px}
.sess .detail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:none}
.sess.open .detail{display:block}
.sess .detail .exline{margin-bottom:8px;font-size:14px}
.sess .detail .exline .num{color:var(--dim);font-size:13px}

/* program editor */
.prog-ex{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:8px}
.prog-ex:last-child{border-bottom:none}
.prog-ex b{font-size:16px}
.prog-ex .meta{font:12.5px var(--mono);color:var(--dim);margin-top:2px}
.icon-btns{display:flex;gap:5px;flex-shrink:0}
.icon-btns button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--dim);cursor:pointer;font-size:15px}
.ex-ctl button{width:32px;height:32px;font-size:13px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-bg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:22px;margin-bottom:12px}
.modal p{font-size:15px;color:var(--dim);margin:8px 0}
.modal .rpe-scale{font-family:var(--mono);font-size:14px;line-height:2;color:var(--text)}
.field{margin-bottom:12px}
.field label{display:block;color:var(--dim);font:12px var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.field input,.field textarea{
  width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font-size:16px;font-family:inherit;
}
.field .duo{display:flex;gap:8px}
.field .duo input{flex:1}
.togglerow{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:15px}
.togglerow input{width:22px;height:22px;accent-color:var(--ok)}

/* ================= ONBOARDING =================
   Full-screen, one question per card, nothing else competing for attention. The tab bar
   is hidden while it runs (body.onboarding) because a half-configured app behind the
   wizard is just an invitation to wander into empty screens. */
body.onboarding nav{display:none}
body.onboarding{padding-bottom:24px}
.ob-wrap{max-width:560px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) 4px 40px}
.ob-prog{height:4px;border-radius:2px;background:var(--card2);overflow:hidden;margin:0 2px 8px}
.ob-prog>i{display:block;height:100%;background:var(--text);border-radius:2px;transition:width .3s cubic-bezier(.4,0,.2,1)}
.ob-prog-n{font:11px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin:0 2px 20px}
.ob-card{margin-bottom:20px}
.ob-kick{font:11px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.ob-h{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1.06;letter-spacing:.005em;margin:0 0 12px}
.ob-sub{color:var(--dim);font-size:15px;line-height:1.5}
.ob-sub p{margin:0 0 10px}
.ob-sub p:last-child{margin-bottom:0}
.ob-opts{display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
.ob-opt{
  position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;
  padding:15px 44px 15px 16px;border-radius:14px;background:var(--card);
  border:1.5px solid var(--line);cursor:pointer;width:100%;
  transition:border-color .14s, background .14s, transform .1s;
}
.ob-opt:active{transform:scale(.99)}
.ob-opt.on{border-color:var(--text);background:var(--card2)}
.ob-opt-t{font-family:var(--disp);font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ob-opt-s{color:var(--dim);font-size:13.5px;line-height:1.45}
.ob-best{color:var(--faint);font-size:12.5px}
.ob-badge{
  font:10px var(--mono);font-style:normal;text-transform:uppercase;letter-spacing:.07em;
  color:var(--dim);background:var(--card2);border:1px solid var(--line);
  padding:2px 7px;border-radius:20px;
}
.ob-opt.on .ob-badge{background:var(--bg)}
.ob-tick{
  position:absolute;top:15px;right:15px;
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;background:var(--text);color:var(--bg);opacity:0;transition:opacity .14s;
}
.ob-opt.on .ob-tick{opacity:1}
.ob-nav{display:flex;gap:10px;margin-top:4px}
.ob-nav .btn{flex:1;margin:0}
.ob-skip{display:block;width:100%;text-align:center;margin-top:16px;color:var(--faint);font-size:13.5px;padding:8px}
.ob-plan{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.ob-day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.ob-day-h{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:18px;font-weight:700;margin-bottom:9px;flex-wrap:wrap}
.ob-day-h i{font:11px var(--mono);font-style:normal;color:var(--faint);margin-left:auto;text-transform:uppercase;letter-spacing:.05em}
.ob-ex{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;border-top:1px solid var(--line)}
.ob-ex i{color:var(--dim);font-style:normal;font-size:12.5px;flex-shrink:0}
.ob-tips{display:flex;flex-direction:column;gap:10px;margin:4px 0 22px}
.ob-tip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;color:var(--dim)}
.ob-tip b{color:var(--text)}

/* ================= AI PLAN IMPORT =================
   The importer is one modal with three faces — key setup, the thing you're importing,
   and the plan that came back — so the whole flow happens without leaving whatever
   screen you started from. */
.ai-drop{
  width:100%;padding:14px;border-radius:12px;border:1.5px dashed var(--line);
  background:var(--card2);color:var(--dim);font-size:14px;cursor:pointer;text-align:center;
}
.ai-drop:active{border-color:var(--text)}
.ai-files{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0}
.ai-file{
  display:inline-flex;align-items:center;gap:7px;max-width:100%;
  background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 11px;
  font:11.5px var(--mono);color:var(--dim);
}
.ai-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-file button{
  background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px;line-height:1;
  padding:2px 5px;flex-shrink:0;
}
.ai-busy{display:flex;align-items:center;gap:12px;padding:18px 2px;color:var(--dim);font-size:14.5px}
.ai-spin{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  border:2.5px solid var(--line);border-top-color:var(--text);animation:aiSpin .8s linear infinite;
}
@keyframes aiSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ai-spin{animation-duration:2.4s}}
.ai-err{
  margin:10px 0 0;padding:11px 13px;border-radius:11px;font-size:13.5px;line-height:1.5;
  border:1px solid var(--bad);background:rgba(224,82,72,.09);color:var(--text);
}
.ai-note{
  margin:0 0 12px;padding:11px 13px;border-radius:11px;font-size:13.5px;line-height:1.5;
  border:1px solid var(--line);background:var(--card2);color:var(--dim);
}
.ai-note b{color:var(--text)}

/* ================= TAB BAR =================
   Fixed to the bottom and drawn on its own compositor layer. The old bar used
   `backdrop-filter:blur()`, which forces Safari to re-rasterise the blur against the
   page behind it on every scroll frame, which is exactly what "the nav gets stuck"
   looked like: the bar lagging a few frames behind the content. A solid background
   plus translateZ(0) keeps it on the GPU and pinned.

   It also retracts on the way down and comes back the moment you scroll up, so a long
   Body tab isn't read through a 78px letterbox. `--navY` is driven from JS. */
nav{
  position:fixed;bottom:0;left:0;right:0;background:#17171a;
  border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:7px 0 calc(7px + env(safe-area-inset-bottom));z-index:40;
  transform:translate3d(0,var(--navY,0),0);
  transition:transform .26s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
nav button{
  background:none;border:none;color:var(--faint);cursor:pointer;flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:7px 2px 5px;border-radius:12px;
  transition:color .15s, background .15s;
}
nav button svg{width:22px;height:22px;display:block;flex-shrink:0}
/* Icon-only is the one change that reliably makes an app harder to learn, so each icon
   keeps a micro-label. It still reads as an icon bar; it just doesn't need decoding. */
nav .nav-lbl{
  font-family:var(--disp);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;line-height:1;white-space:nowrap;transition:color .15s;
}
/* Duotone accent: every icon is plain outline, all the time. The only thing that
   changes on the active tab is colour (faint → accent) and a soft accent-tinted circle
   that appears behind the icon alone, not the whole button, so the highlight sits where
   your eye already is instead of drawing a box around the label too. */
nav .nav-ic{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:11px;background:transparent;transition:background .18s ease;
}
nav button.on{color:var(--arms)}
nav button.on .nav-ic{background:rgba(232,182,44,.16)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(232,182,44,.4))}
nav button:active{transform:scale(.94)}

/* ================= INLINE TERMS =================
   Every piece of jargon is a dotted-underlined word: tap for the full entry, hover for
   a one-line gloss. The hover card is CSS-only off `data-tip`, so it costs no JS and
   works on any term the app renders, including ones inside modals. */
.rpe-help,.term{cursor:help;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-thickness:1px}
.term{color:inherit;font:inherit;position:relative}
.term:active{color:var(--arms)}
.term[data-tip]::after{
  content:attr(data-tip);
  position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px);
  width:max-content;max-width:min(270px,72vw);
  background:var(--card2);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;
  font:400 12.5px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  text-transform:none;letter-spacing:0;text-align:left;text-decoration:none;
  box-shadow:0 10px 30px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .16s, transform .16s;z-index:70;
}
.term[data-tip]::before{
  content:"";position:absolute;left:50%;bottom:calc(100% + 3px);
  border:5px solid transparent;border-top-color:var(--line);
  transform:translateX(-50%);opacity:0;transition:opacity .16s;z-index:71;
}
@media (hover:hover){
  .term[data-tip]:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
  .term[data-tip]:hover::before{opacity:1}
}
.term[data-tip]:focus-visible::after{opacity:1;transform:translateX(-50%) translateY(0)}
.term[data-tip]:focus-visible::before{opacity:1}

/* toast */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;
  font:14px var(--mono);opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.fin-label{font-family:var(--disp);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);border-top:1px dashed var(--line);padding-top:12px;margin:6px 0 10px}
.syncdot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-left:9px;vertical-align:middle;background:var(--faint)}
.empty{color:var(--faint);text-align:center;padding:34px 10px;font-size:15px}
.danger{color:var(--bad)}
a{color:var(--text)}

/* ================= ANIMATIONS ================= */
@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
#app>.card{animation:slideUp .5s cubic-bezier(.16,1,.3,1) both}
#app>.card:nth-of-type(2){animation-delay:.06s}
#app>.card:nth-of-type(3){animation-delay:.12s}
#app>.card:nth-of-type(4){animation-delay:.18s}
#app>.card:nth-of-type(5){animation-delay:.24s}
#app>.card:nth-of-type(6){animation-delay:.3s}
#app>.card:nth-of-type(7){animation-delay:.36s}
#app>.card:nth-of-type(n+8){animation-delay:.42s}

@keyframes ringPulse{0%{transform:scale(.8);opacity:.9}75%{transform:scale(1.3);opacity:0}100%{transform:scale(1.3);opacity:0}}
.plate{overflow:visible}
.plate.cur::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid rgba(255,255,255,.55);animation:ringPulse 1.7s ease-out infinite;pointer-events:none}

@keyframes bounceIn{0%{transform:scale(0)}55%{transform:scale(1.45)}100%{transform:scale(1)}}
.pcheck{animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1) both}

@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.set .chk.on{animation:pop .32s cubic-bezier(.34,1.56,.64,1)}

.btn{transition:transform .12s}
.btn:active{transform:scale(.96)}
@keyframes btnGlow{0%,100%{box-shadow:0 0 0 0 rgba(236,234,228,0)}50%{box-shadow:0 0 26px 3px rgba(236,234,228,.4)}}
#startBtn{animation:btnGlow 2.6s ease-in-out infinite}

@keyframes dotPulse{50%{transform:scale(1.6);opacity:.55}}
.syncdot.pulse{animation:dotPulse .9s ease-in-out infinite}

@keyframes shakeX{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}50%{transform:translateX(-4px)}}
body.shake{animation:shakeX .55s both}

/* ================= FINISH SEQUENCE =================
   Staged rather than simultaneous. The old version faded a translucent wash in behind
   a plate that was already animating, which on a phone meant the overlay was inserted
   while the page underneath was still reflowing from render(); the fixed layer briefly
   resolved against the pre-render layout and the plate appeared low before snapping to
   centre. Two things fix that: the overlay is now inserted on the frame AFTER the
   re-render, and page scroll is locked while it is up.

   The sequence: the room goes dark, a spotlight opens, the plate drops into it, then
   the confetti. Each step waits for the one before it. */
#celebrate{
  position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transform:translateZ(0);
}
#celebrate.out{opacity:0;transition:opacity .5s ease}
body.cele-open{overflow:hidden}

/* 1. the room goes dark */
.cele-dark{position:absolute;inset:0;background:#000;animation:celeDark .45s ease both}
@keyframes celeDark{from{opacity:0}to{opacity:.93}}

/* 2. a spotlight opens on the middle of the stage */
.cele-beam{
  position:absolute;left:50%;top:44%;width:150vmax;height:150vmax;
  transform:translate(-50%,-50%) scale(0);transform-origin:center;
  background:radial-gradient(circle,
    rgba(255,255,255,.20) 0%, rgba(255,255,255,.10) 18%,
    rgba(255,255,255,.03) 34%, transparent 55%);
  animation:celeBeam 1s .3s cubic-bezier(.2,1,.3,1) both;
  pointer-events:none;
}
@keyframes celeBeam{from{transform:translate(-50%,-50%) scale(0);opacity:0}
                    60%{opacity:1}
                    to{transform:translate(-50%,-50%) scale(1);opacity:1}}
/* keeps the edges black so the pool reads as a beam rather than a glow */
.cele-vig{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 44%, transparent 22%, rgba(0,0,0,.55) 62%, rgba(0,0,0,.9) 100%);
  animation:fadeIn .6s .35s both;
}
.cele-stack{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:clamp(14px,3vh,26px);padding:20px;transform:translateY(-3vh);max-width:92vw;
  transition:transform .45s ease;
}
#celebrate.out .cele-stack{transform:translateY(-3vh) scale(.92)}

/* 3. the plate drops into the light */
@keyframes plateSlam{
  0%{transform:translateY(-118vh) scale(1.45) rotate(-24deg);opacity:0}
  40%{opacity:1}
  62%{transform:translateY(0) scale(.92) rotate(2deg)}
  80%{transform:translateY(-9px) scale(1.05) rotate(-1deg)}
  100%{transform:translateY(0) scale(1) rotate(0)}
}
@keyframes plateFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(1.6deg)}}
.slam{
  position:relative;width:min(58vw,270px);aspect-ratio:1;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;font-size:min(17vw,80px);letter-spacing:.06em;color:var(--bg);
  box-shadow:inset 0 0 0 9px rgba(0,0,0,.28), inset 0 0 0 24px rgba(255,255,255,.08),
             0 0 90px 18px rgba(255,255,255,.28);
  animation:plateSlam .62s .55s cubic-bezier(.24,1.3,.4,1) both,
            plateFloat 2.8s 1.4s ease-in-out infinite;
}
.slam::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:5px solid rgba(255,255,255,.8);
  animation:shockwave .8s 1.1s ease-out both;pointer-events:none;
}
@keyframes shockwave{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.3);opacity:0}}
@keyframes textPop{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
.cele-text{
  text-align:center;font-family:var(--disp);font-weight:700;
  font-size:clamp(26px,9vw,44px);letter-spacing:.09em;text-transform:uppercase;line-height:1.1;
  color:#fff;text-shadow:0 0 40px rgba(255,255,255,.6), 0 3px 0 rgba(0,0,0,.4);
  animation:textPop .5s .95s cubic-bezier(.34,1.56,.64,1) both;
}
.cele-vol{
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(16px,4.5vw,21px);
  letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.92);
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);
  padding:9px 18px;border-radius:999px;
  animation:textPop .5s 1.2s cubic-bezier(.34,1.56,.64,1) both;
}
.cele-hint{
  position:absolute;bottom:max(24px, env(safe-area-inset-bottom));left:0;right:0;text-align:center;
  font:11px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4);
  animation:fadeIn .4s 2s both;z-index:3;
}
@keyframes confFall{to{transform:translateY(118vh) rotate(760deg)}}
.confetto{position:absolute;top:-36px;z-index:1;animation:confFall linear both;will-change:transform}

@keyframes prUp{0%{opacity:0;transform:translateY(4px) scale(.5)}18%{opacity:1;transform:translateY(-10px) scale(1.25)}100%{opacity:0;transform:translateY(-56px) scale(1)}}
.pr-float{
  position:fixed;z-index:300;pointer-events:none;
  font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--arms);
  text-shadow:0 0 18px rgba(232,182,44,.9);animation:prUp 1.25s ease-out both;
}

/* rest stopwatch, bumper plate face */
.rest-full{
  position:fixed;inset:0;z-index:150;background:rgba(19,19,21,.97);
  display:flex;align-items:center;justify-content:center;animation:fadeIn .2s both;
}
.pf-wrap{display:flex;flex-direction:column;align-items:center;gap:30px;transform:translateY(-2vh)}
.pf-plate{
  position:relative;width:min(86vw,62vh,420px);aspect-ratio:1;border-radius:50%;
  box-shadow:
    inset 0 0 0 7px rgba(0,0,0,.32),
    inset 0 0 0 20px rgba(255,255,255,.07),
    inset 0 0 0 23px rgba(0,0,0,.18),
    0 22px 70px rgba(0,0,0,.65);
  animation:plateSettle .5s cubic-bezier(.24,1.3,.4,1) both;
}
@keyframes plateSettle{0%{transform:scale(1.35);opacity:0}60%{transform:scale(.97);opacity:1}100%{transform:scale(1)}}
.pf-tex{
  position:absolute;inset:5%;border-radius:50%;
  background:repeating-conic-gradient(rgba(0,0,0,.1) 0deg 3deg, transparent 3deg 30deg);
  animation:pfSpin 110s linear infinite;
}
@keyframes pfSpin{to{transform:rotate(360deg)}}
.pf-ring{
  position:absolute;inset:2.6%;border-radius:50%;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 13px),#000 calc(100% - 12px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 13px),#000 calc(100% - 12px));
  background:conic-gradient(rgba(255,255,255,.95) var(--sw,0%), rgba(255,255,255,.14) 0);
  transition:none;
}
.pf-hub{
  position:absolute;inset:27%;border-radius:50%;background:var(--bg);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.09), 0 0 0 9px rgba(0,0,0,.26);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.pf-hub.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.pf-label{
  font-family:var(--disp);font-size:14px;font-weight:700;text-transform:uppercase;
  letter-spacing:.3em;text-indent:.3em;color:var(--dim);
}
.rest-full .rest-time{
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;
  font-size:clamp(38px,11vw,60px);color:var(--text);line-height:1;letter-spacing:-.02em;
}
.rest-stopbtn{width:auto;padding:16px 54px}
.rest-x{
  position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;
  width:50px;height:50px;border-radius:50%;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font-size:19px;cursor:pointer;z-index:1;
}
.rest-mini{
  position:fixed;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:150;
  display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 7px 6px 6px;box-shadow:0 8px 28px rgba(0,0,0,.55);
  animation:restPillIn .55s cubic-bezier(.22,1,.36,1) both;
}
@keyframes restPillIn{
  0%{opacity:0;transform:translateY(14px) scale(.9)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.rest-mini .rest-expand{
  display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;
  color:var(--text);padding:5px 7px;
}
.rest-mini .rest-time{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600}
.rest-dot{
  width:12px;height:12px;border-radius:50%;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.3);
  animation:dotPulse 1s ease-in-out infinite;
}
.rest-stop-mini{
  width:38px;height:38px;border-radius:50%;border:none;background:var(--bad);
  color:#fff;font-size:14px;cursor:pointer;
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ================= SPLASH ================= */
#splash{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
#splash.bye{opacity:0;transition:opacity .45s ease}
#splash.bye .splash-inner{transform:scale(1.06);transition:transform .45s ease}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:6px}
.splash-inner svg{overflow:visible;animation:logoPump .55s 1s cubic-bezier(.34,1.56,.64,1) both}
@keyframes logoPump{0%{transform:translateY(0)}40%{transform:translateY(16px)}75%{transform:translateY(-8px)}100%{transform:translateY(0)}}
.sp-left,.sp-right,.sp-bar{transform-box:fill-box;transform-origin:center}
.sp-left{animation:slideL .6s .12s cubic-bezier(.22,1.3,.36,1) both}
.sp-right{animation:slideR .6s .12s cubic-bezier(.22,1.3,.36,1) both}
@keyframes slideL{from{transform:translateX(-190px);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(190px);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
.sp-bar{animation:barIn .35s .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes barIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.spark{transform-box:fill-box;transform-origin:center;opacity:0;filter:drop-shadow(0 0 6px rgba(200,150,70,.9))}
.spark1{animation:sparkIn .5s .95s cubic-bezier(.34,1.56,.64,1) both, twinkle 1.1s 1.45s ease-in-out infinite}
.spark2{animation:sparkIn .5s 1.15s cubic-bezier(.34,1.56,.64,1) both, twinkle 1.1s 1.75s ease-in-out infinite}
@keyframes sparkIn{from{transform:scale(0) rotate(-120deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes twinkle{
  0%,100%{opacity:1;transform:scale(1) rotate(0);filter:drop-shadow(0 0 9px rgba(220,170,90,1))}
  50%{opacity:.3;transform:scale(.7) rotate(18deg);filter:drop-shadow(0 0 2px rgba(200,150,70,.3))}
}
.splash-ver{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:2px;letter-spacing:.1em;animation:wordPunch .5s 1.25s cubic-bezier(.22,1.4,.36,1) both}
.splash-word{
  font-family:var(--disp);font-size:34px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;
  color:#fff;animation:wordPunch .5s 1.15s cubic-bezier(.22,1.4,.36,1) both;
}
@keyframes wordPunch{
  0%{opacity:0;transform:scale(2.8);filter:blur(6px)}
  55%{opacity:1;transform:scale(.9);filter:blur(0)}
  78%{transform:scale(1.08)}
  100%{opacity:1;transform:scale(1)}
}

/* single-arm "start side" hint */
.arm-hint{
  display:inline-block;font-size:13px;color:var(--text);
  background:rgba(232,182,44,.12);border:1px solid rgba(232,182,44,.45);
  border-radius:9px;padding:6px 11px;margin:-2px 0 12px;line-height:1.35;
}
.arm-hint b{font-family:var(--disp);font-size:15px;letter-spacing:.05em;color:var(--arms)}
.alt-seq{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
.alt-arrow{color:var(--faint);font-size:13px;line-height:1}

/* ================= CYCLE "WRAPPED" ================= */
#wrapped{
  position:fixed;inset:0;z-index:210;overflow:hidden;color:#fff;
  display:flex;flex-direction:column;font-family:var(--disp);
  animation:fadeIn .35s both;
}
#wrapped.out{opacity:0;transition:opacity .4s ease}
.wr-bg{position:absolute;inset:0;z-index:0;transition:background .55s ease}
.wr-bars{position:relative;z-index:3;display:flex;gap:5px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px}
.wr-bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.wr-bar>i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
.wr-bar.done>i{width:100%}
.wr-bar.active>i{animation:wrFill var(--wrdur,5200ms) linear forwards}
@keyframes wrFill{from{width:0}to{width:100%}}
.wr-top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:3px 16px 0}
.wr-brand{font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.wr-x{background:none;border:none;color:#fff;font-size:24px;line-height:1;cursor:pointer;padding:4px 8px;opacity:.85}
.wr-stage{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.wr-nav{position:absolute;left:0;right:0;top:78px;bottom:0;z-index:4;display:flex}
.wr-nav>div{cursor:pointer}
.wr-nav .wr-prev{flex:1}
.wr-nav .wr-next{flex:2.4}
.wr-slide{width:100%;max-width:560px;animation:wrIn .55s cubic-bezier(.2,1,.3,1) both}
@keyframes wrIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.wr-hero{font-size:clamp(30px,10vw,52px);font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.04}
.wr-kicker{font-size:15px;letter-spacing:.18em;text-transform:uppercase;opacity:.82;margin-bottom:12px}
.wr-big{
  font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;
  font-size:clamp(56px,21vw,130px);line-height:.92;letter-spacing:-.03em;
  text-shadow:0 6px 34px rgba(0,0,0,.4);
}
.wr-unit{font-family:var(--disp);font-size:clamp(20px,7vw,34px);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-top:6px}
.wr-sub{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;opacity:.94;margin:18px auto 0;max-width:440px}
.wr-pill{
  display:inline-block;font-family:var(--mono);font-size:15px;letter-spacing:.05em;
  background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.3);
  border-radius:999px;padding:9px 18px;margin-top:18px;
}
.wr-list{display:flex;flex-direction:column;gap:10px;text-align:left;max-width:410px;margin:22px auto 0}
.wr-row{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:17px;
  border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:9px;
}
.wr-row .num{font-family:var(--mono);font-weight:600;opacity:.96;white-space:nowrap}
.wr-daychips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.wr-daychip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border-radius:999px;padding:8px 14px;font-family:var(--mono);font-size:15px}
.wr-daychip .dot{width:13px;height:13px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.wr-emoji{font-size:clamp(58px,22vw,116px);line-height:1;filter:drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.wr-done{margin-top:28px}
.wr-done button{
  background:#fff;color:#111;border:none;border-radius:999px;padding:15px 38px;cursor:pointer;
  font-family:var(--disp);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.06em;
}

/* ================= PROFILE SWITCHER ================= */
.prof-bar{
  display:flex;align-items:center;gap:12px;width:100%;margin:0 0 16px;
  padding:11px 14px;border-radius:14px;cursor:pointer;text-align:left;
  background:var(--card);border:1px solid var(--line);color:var(--text);
  transition:border-color .15s, transform .12s;
}
.prof-bar:active{transform:scale(.985)}
.prof-av{
  flex-shrink:0;width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.03em;color:#15150f;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.22);
}
.prof-av.sm{width:32px;height:32px;font-size:13.5px}
.prof-av.xs{width:30px;height:30px;font-size:13px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.22), 0 0 0 1px var(--line)}
.prof-txt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.prof-txt b{font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof-txt small{color:var(--faint);font:11.5px var(--mono);letter-spacing:.03em}
.prof-chev{color:var(--faint);font-size:20px;line-height:1;flex-shrink:0;padding-right:2px}
.prof-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.prof-item{
  display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;
  border-radius:13px;background:var(--card2);border:1px solid var(--line);
  color:var(--text);cursor:pointer;text-align:left;
}
.prof-item.on{border-color:var(--ok);background:rgba(70,168,92,.09)}
.prof-tick{color:var(--ok);font-size:18px;flex-shrink:0}
.prof-mini{
  background:none;border:none;padding:0;margin:0;cursor:pointer;
  display:flex;align-items:center;gap:6px;flex-shrink:0;
}
.prof-mini .prof-chev{font-size:15px}
.hdr .hdr-right{display:flex;align-items:center;gap:10px}
.uni-badge{
  display:inline-block;font:10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;
  color:var(--arms);border:1px solid rgba(232,182,44,.45);border-radius:5px;
  padding:1px 6px;margin-left:5px;vertical-align:middle;
}

/* ================= PR BADGE ================= */
.pr-badge{
  display:inline-block;font:10.5px var(--mono);font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:#241c00;background:var(--arms);border-radius:5px;
  padding:2px 6px;margin-left:6px;vertical-align:middle;
  box-shadow:0 0 12px rgba(232,182,44,.45);
}
.set.is-pr input{border-color:rgba(232,182,44,.55)}
.pr-row{margin:-3px 0 7px;padding-left:47px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pr-row:empty{display:none}

/* ================= "WHAT WENT WRONG?" =================
   The reason chip that sits under a set that came in far under its target, and the
   picker that captures it. Reasons meaning "this set did what it should have" are
   green rather than amber, because they are not failures and should not read as one. */
.why-chip{
  display:inline-flex;align-items:center;gap:5px;
  font:11px var(--mono);letter-spacing:.03em;
  color:var(--dim);background:var(--card2);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px;
  max-width:100%;
}
.why-chip.why-ok{color:var(--ok);border-color:rgba(70,168,92,.4);background:rgba(70,168,92,.09)}
.why-chip.why-pain{color:var(--bad);border-color:rgba(224,82,72,.45);background:rgba(224,82,72,.1)}
.reason-btn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--card2);border:1px solid var(--line);border-radius:13px;
  padding:14px 14px;color:var(--text);cursor:pointer;
  font:15.5px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  transition:border-color .12s, transform .1s;
}
.reason-btn:active{transform:scale(.985);border-color:var(--text)}
.reason-ic{font-size:21px;line-height:1;flex-shrink:0;width:26px;text-align:center}

/* ================= BODY / TRAINING STRESS MAP ================= */
.metric-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px 14px;padding:0 14px;scrollbar-width:none}
.metric-scroll::-webkit-scrollbar{display:none}
.metric-seg{display:inline-flex;gap:7px;padding-bottom:2px}
.metric-seg button{
  flex-shrink:0;padding:10px 15px;border-radius:11px;cursor:pointer;
  background:var(--card2);border:1px solid var(--line);color:var(--dim);
  font-family:var(--disp);font-size:15.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  white-space:nowrap;
}
.metric-seg button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.bm-card{padding:14px 10px 10px}
.bm-figs{display:flex;gap:4px;justify-content:center;align-items:flex-start}
.bm-fig{flex:1;min-width:0;max-width:190px;display:flex;flex-direction:column;align-items:center;gap:7px}
.bm-fig svg{width:100%;height:auto;display:block;overflow:visible}
.bm-fig-label{
  font-family:var(--disp);font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:.16em;color:var(--dim);
}
/* Three layers. `bm-weld` is every path stroked thickly in one dark tone: the strokes
   overlap so the whole body fuses into a single silhouette, which both outlines the
   figure and fills the seams between muscles so the page never shows through. The
   muscles then sit on top with their own thin dark stroke, and those thin strokes are
   what read as the black separations on an anatomy chart. */
.bm-fig svg{shape-rendering:geometricPrecision}
.bm-weld{fill:#20202a;stroke:#20202a;stroke-width:9;stroke-linejoin:round;stroke-linecap:round}
.bm-inert{fill:#33333e;stroke:#0e0e13;stroke-width:2;stroke-linejoin:round}
.bm-m{cursor:pointer;stroke:#0e0e13;stroke-width:2.4;stroke-linejoin:round;transition:opacity .18s}
.bm-m:active{opacity:.68}
.bm-legend{display:flex;flex-wrap:wrap;gap:7px 14px;justify-content:center;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.bm-lg{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim)}
.bm-sw{width:13px;height:13px;border-radius:4px;flex-shrink:0}
.bm-tap{text-align:center;font-size:12.5px;color:var(--faint);margin-top:11px}
.bm-dim{opacity:.28;transition:opacity .2s}
.bm-head-shape{stroke-width:2.8}
.bm-sel{stroke:var(--text);stroke-width:3.2}
.bm-drill small{color:var(--faint);font-family:var(--mono);font-size:11.5px}
.bm-clear{
  background:none;border:none;color:var(--faint);cursor:pointer;
  font:12px var(--mono);text-decoration:underline dotted;text-underline-offset:3px;padding:2px;
}
.bm-drill{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-top:12px;padding:10px 12px;border-radius:11px;
  background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--dim);
}
.bm-drill b{color:var(--text)}
.bm-drill button{
  background:var(--text);color:var(--bg);border:none;border-radius:8px;cursor:pointer;
  padding:7px 12px;font-family:var(--disp);font-size:13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;
}
.bm-credit{text-align:center;font-size:11px;color:var(--faint);margin:14px 0 0;opacity:.75}
.bm-credit a{color:var(--faint)}
.bm-oneline{
  font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.02em;
  text-transform:uppercase;text-align:center;color:var(--text);margin:2px 0 12px;
}
/* collapsible sections */
.card.sec{padding:0;overflow:hidden}
.sec-h{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:none;border:none;color:var(--text);cursor:pointer;padding:15px 16px 13px;text-align:left;
}
.sec-t{font-family:var(--disp);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:9px}
.sec-n{font:11px var(--mono);background:var(--card2);color:var(--dim);border-radius:999px;padding:2px 8px}
.sec-x{font-family:var(--mono);font-size:20px;color:var(--faint);line-height:1;flex-shrink:0}
.sec-sub{font-size:13.5px;color:var(--dim);line-height:1.45;padding:0 16px 14px;margin-top:-8px}
.sec-b{padding:0 16px 16px;border-top:1px solid var(--line);padding-top:14px}
.more-btn{
  display:block;width:100%;margin-top:10px;padding:11px;border-radius:11px;cursor:pointer;
  background:var(--card2);border:1px solid var(--line);color:var(--dim);
  font-family:var(--mono);font-size:13px;
}
/* group rows with their heads */
.bm-area{font-family:var(--disp);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin:16px 0 6px}
.bm-area:first-child{margin-top:0}
.bm-grow{display:flex;align-items:center;gap:10px;padding:7px 0 5px}
.bm-gname{flex:1;min-width:0;font-size:16px;font-weight:600}
.bm-gval{font-family:var(--mono);font-size:13px;color:var(--dim);flex-shrink:0}
.bm-heads{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.bm-head{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:6px 11px;color:var(--text);font-size:13px;
}
.bm-head small{color:var(--faint);font-family:var(--mono);font-size:11px}
.bm-hdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
/* muscle detail modal */
.md-what{background:var(--card2);border-radius:12px;padding:12px 13px;margin:2px 0 4px}
.md-row{display:flex;gap:10px;font-size:14.5px;line-height:1.5;padding:4px 0}
.md-k{flex:0 0 88px;color:var(--faint);font:11px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.md-share{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.md-sh{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--dim)}
.md-sh.on{color:var(--text);font-weight:600}
.md-shbar{flex:1;height:7px;border-radius:4px;background:var(--card2);overflow:hidden;min-width:40px}
.md-shbar>i{display:block;height:100%;border-radius:4px;background:var(--dim)}
.md-sh.on .md-shbar>i{background:var(--arms)}
.bm-explain{font-size:14.5px;color:var(--dim);line-height:1.6;margin:0 2px}
.bm-explain-card{background:var(--card2)}
.bm-explain-h{
  font-family:var(--disp);font-size:15px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--text);margin-bottom:8px;
}
/* headline card */
.bm-lead{padding:15px 16px}
.bm-lead-k{
  font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.02em;
  text-transform:uppercase;color:var(--text);
}
.bm-lead-v{display:flex;align-items:flex-start;gap:10px;margin-top:9px;font-size:15.5px;line-height:1.45;color:var(--dim)}
.bm-lead-v b{color:var(--text)}
.bm-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;margin-top:5px}
/* ranked list */
.bm-group{
  font-family:var(--disp);font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--faint);margin:16px 0 4px;
}
.bm-group:first-of-type{margin-top:6px}
.bm-rank{display:flex;flex-direction:column}
.bm-row{
  display:flex;align-items:center;gap:11px;padding:11px 2px;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.bm-row:last-child{border-bottom:none}
.bm-row:active{background:var(--card2)}
.bm-swatch{width:11px;height:26px;border-radius:4px;flex-shrink:0}
.bm-row .bm-name{flex:1;min-width:0;font-size:16px;display:flex;flex-direction:column;gap:2px;line-height:1.25}
.bm-row .bm-name small{color:var(--faint);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.bm-row .bm-val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
.bm-bar{width:64px;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.bm-bar>i{display:block;height:100%;border-radius:3px}
.bm-tagpill{
  font:10px var(--mono);text-transform:uppercase;letter-spacing:.07em;
  border-radius:5px;padding:2px 6px;flex-shrink:0;
}
.sys-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.sys-tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.sys-tile .sys-k{font:10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.sys-tile .sys-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:23px;font-weight:600;line-height:1.15;margin-top:3px}
.sys-tile .sys-s{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.35}

/* ================= WHAT TO FIX =================
   The old card led with a diagnosis ("Lats are under-stimulated") in small text, buried
   the action three lines down, and ended there. It now leads with the ACTION in the
   biggest type on the card, keeps the evidence to one grey line underneath, and the
   whole thing is a button: tapping opens exactly which exercises and numbers produced
   the finding, so no verdict is unexplained. */
.wp{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--faint);
  border-radius:13px;padding:13px 12px 13px 13px;margin-bottom:10px;
  color:var(--text);cursor:pointer;font:inherit;
  transition:border-color .15s, transform .12s;
}
.wp:active{transform:scale(.99)}
.wp.sev3{border-left-color:var(--bad)}
.wp.sev2{border-left-color:var(--arms)}
.wp.sev1{border-left-color:var(--back)}
.wp-rank{
  flex-shrink:0;width:26px;height:26px;border-radius:8px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;font-size:15px;
}
.wp.sev3 .wp-rank{background:rgba(224,82,72,.18);color:var(--bad)}
.wp.sev2 .wp-rank{background:rgba(232,182,44,.18);color:var(--arms)}
.wp.sev1 .wp-rank{background:rgba(74,130,224,.18);color:var(--back)}
.wp-body{flex:1;min-width:0}
.wp-do{font-size:16.5px;font-weight:600;line-height:1.35}
.wp-who{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  font:11px var(--mono);text-transform:uppercase;letter-spacing:.07em;
  color:var(--faint);margin-bottom:5px;
}
.wp-sev{flex-shrink:0}
.wp-why{font-size:13.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.wp-more{
  display:inline-block;margin-top:8px;
  font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--text);
  border-bottom:1px solid var(--line);padding-bottom:2px;
}
.wp-chev{flex-shrink:0;color:var(--faint);font-size:19px;line-height:1;align-self:center}
/* the drill-down modal a finding opens */
.wd-lead{
  background:var(--card2);border-radius:12px;padding:13px 14px;margin:2px 0 4px;
  font-size:15.5px;line-height:1.5;
}
.wd-lead b{color:var(--text)}
.wd-ex{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.wd-ex:last-child{border-bottom:none}
.wd-ex .num{color:var(--dim);font-size:13px;white-space:nowrap}
.wd-none{color:var(--faint);font-size:14px;padding:8px 0;line-height:1.5}
.wd-meter{display:flex;align-items:center;gap:10px;margin:10px 0 4px}
.wd-meter .wd-track{flex:1;height:10px;border-radius:5px;background:var(--card2);position:relative;overflow:hidden}
.wd-meter .wd-track>i{display:block;height:100%;border-radius:5px}
.wd-marks{display:flex;font:10px var(--mono);color:var(--faint);letter-spacing:.05em;margin-bottom:10px}
.wd-marks>span{flex:1;text-align:center}

/* ================= "SINCE LAST TIME" FOCUS CARD =================
   The one thing worth changing today, pulled from the grade of your last session of
   THIS rotation day. One card, one action; the full breakdown is a tap away. */
.fc-card{border:1px solid var(--line);border-left:4px solid var(--arms);background:linear-gradient(180deg,rgba(232,182,44,.07),transparent)}
.fc-k{
  display:flex;align-items:center;gap:8px;
  font-family:var(--disp);font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--arms);margin-bottom:7px;
}
.fc-grade{
  font:11px var(--mono);letter-spacing:.06em;border-radius:5px;padding:2px 7px;
  text-transform:none;letter-spacing:.02em;
}
.fc-do{font-size:16.5px;line-height:1.45}
.fc-do b{font-weight:600}
.fc-sub{font-size:13px;color:var(--dim);margin-top:7px;line-height:1.45}
.fc-btn{
  background:none;border:none;padding:0;margin-top:10px;cursor:pointer;color:var(--text);
  font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;
  border-bottom:1px solid var(--line);
}
/* the same tip, shrunk to a strip above the exercise it is about */
.fc-inline{
  display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.45;
  color:var(--text);margin:-4px 0 12px;
}

/* ================= WORKOUT QUALITY SCORE ================= */
.sc-hero{display:flex;align-items:center;gap:16px;margin-bottom:4px}
.sc-ring{
  position:relative;width:104px;height:104px;flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--scc,var(--ok)) var(--scp,0%), var(--card2) 0);
}
.sc-ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}
.sc-ring-in{position:relative;text-align:center;line-height:1}
.sc-grade{font-family:var(--disp);font-weight:700;font-size:34px;letter-spacing:.02em}
.sc-total{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin-top:3px}
.sc-blurb{font-size:14.5px;color:var(--dim);line-height:1.45}
.sc-blurb b{color:var(--text)}
.sc-sec{border-top:1px solid var(--line);padding:11px 0 10px}
.sc-sec:first-of-type{border-top:none}
.sc-sh{display:flex;align-items:center;gap:9px}
.sc-sh .sc-n{flex:1;min-width:0;font-size:15px;font-weight:600}
.sc-sh .sc-pts{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim);flex-shrink:0}
.sc-sg{
  flex-shrink:0;width:30px;text-align:center;font-family:var(--disp);font-weight:700;
  font-size:15px;border-radius:6px;padding:2px 0;
}
.sc-track{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin:7px 0 6px}
.sc-track>i{display:block;height:100%;border-radius:3px}
.sc-why{font-size:13px;color:var(--dim);line-height:1.5}
.sc-why li{margin:1px 0}
.sc-why ul{margin:0;padding-left:17px}
.sc-tip{font-size:13px;color:var(--text);margin-top:5px;line-height:1.45}
.sc-tip b{font-family:var(--disp);font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--arms)}
.sc-pill{
  display:inline-block;font:11px var(--mono);text-transform:uppercase;letter-spacing:.07em;
  border-radius:6px;padding:3px 8px;margin:0 5px 5px 0;
}
.sc-badge{
  display:inline-flex;align-items:center;gap:5px;font:11.5px var(--mono);
  border-radius:6px;padding:2px 7px;flex-shrink:0;
}

/* ================= GLOSSARY =================
   The entries themselves, reached by tapping any dotted-underlined term. The chip grid
   that used to list them all in a "Jargon buster" section is gone: every term in the
   app is now tappable where it appears, which makes a separate index of the same

.gl-scale{margin:14px 0 4px}
.gl-bar{display:flex;height:22px;border-radius:7px;overflow:hidden;font:10px var(--mono);text-transform:uppercase;letter-spacing:.05em}
.gl-bar>span{display:flex;align-items:center;justify-content:center;color:#15150f;font-weight:600}
.gl-ticks{display:flex;margin-top:5px;font:10.5px var(--mono);color:var(--faint)}

.gl-table{width:100%;border-collapse:collapse;margin:10px 0 2px;font-family:var(--mono);font-size:13px}

.gl-table td:first-child{color:var(--dim);white-space:nowrap;padding-right:10px}
.gl-table tr:last-child td{border-bottom:none}
.gl-note{font-size:13px;color:var(--faint);line-height:1.5;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
</style>

<script>
"use strict";
/* Bumped by 0.1 on every round of edits to this file. It is shown on the splash, in
   Setup, and on the printed programme, so a report you handed to someone last month can
   be matched against the build that produced it. */
const APP_VERSION = "1.2";

/* =====================================================================
   THE PLAN READER'S API KEY

   ►►► PASTE YOUR GOOGLE AI STUDIO KEY BETWEEN THE QUOTES BELOW. ◄◄◄

   That is the only setup this file needs. One key, yours, used by everybody who opens
   the app — nobody is asked to make an account or fetch a key of their own.

   Get one at https://aistudio.google.com/apikey — sign in, "Create API key", take the
   free option. No card, no billing.

   BE AWARE OF WHAT THIS MEANS. This is a static file served to the browser, so the key
   below is readable by anyone who opens the page and views source. That is unavoidable
   here and it is not a mistake — it is the trade you make for "no setup". Two things
   make it safe enough in practice, and you want both:

     1. RESTRICT THE KEY TO YOUR SITE. In Google Cloud Console → APIs & Services →
        Credentials, open this key and set Application restrictions to "Websites", then
        add your domain. A copied key then does nothing from anywhere else.
     2. LEAVE IT ON THE FREE TIER. An unbilled key cannot run up a bill. The worst a
        stranger can do is spend your daily quota.

   The free tier's limits are per KEY, not per person, so they are shared by everyone
   using the app. That is plenty for normal use — a plan import is one request, and
   people import a plan once — but if the app gets busy, imports will start coming back
   with "you've hit the rate limit" until the daily quota resets.

   Rotating the key later is one edit to this line. Nothing is stored anywhere else.
   ===================================================================== */
const AI_KEY = "";
const AI_MODEL = "gemini-2.5-flash";
/* ================= DATA ================= */
const LS_KEY = "ironlog.v1";
const GIST_FILE = "ironlog-data.json";
/* =====================================================================
   TRAINING DAYS AND THE SPLIT

   A split is the shape of your training week: which days you train, what each one
   covers, and where the rest days fall. It is CHOSEN, not compiled in. Everything
   downstream — the cycle strip, the Program tab, the rotation pointer, the volume
   planner — reads the four values below, so changing your split changes the whole app
   without a single screen needing to know it happened.

     DAYS          the training days, in the order you do them
     ROTATION      the same list, as rotation slots (rests are not slots; they are
                   credits you spend, which is why they are handled separately)
     CYCLE_LAYOUT  one entry per slot in a full cycle, training days and "rest" alike,
                   which is what the plate strip draws
     REST_CREDITS  how many rests a cycle grants, derived from the layout so the two can
                   never disagree

   They are `let`, not `const`, and applySplit() recomputes them. Nothing reads them
   before load() has run, so a saved split is always in place before the first render.

   WHY REST DAYS ARE CREDITS RATHER THAN FIXED SLOTS. A layout of
   train-train-rest-train pins recovery to a calendar that breaks the first time you
   miss a session. A credit does not: it is spent when you need it and the cycle still
   rolls over on training days completed. Take them back to back, take them spread out,
   take neither. Same recovery budget, no way to fall out of sync with it.
   ===================================================================== */
const DAY_COLORS = ["var(--d-pusha)","var(--d-pulla)","var(--d-legsa)",
                    "var(--d-pushb)","var(--d-pullb)","var(--d-legsb)",
                    "var(--chest)","var(--back)"];

/* The built-in splits. Each is a real, defensible way to organise a week rather than a
   variation for the sake of a longer menu, and each names the trade it makes so the
   choice can be made on something other than day count. `layout` is the full cycle;
   count the "rest" entries and you have the recovery budget. */
const SPLITS = {
  full3: {
    name: "Full Body",
    tag: "3 days a week",
    blurb: "Every muscle, every session. The most forgiving way to train: miss a day and nothing goes untrained for long.",
    best: "Best if you are new, short on time, or coming back after a break.",
    days: [{id:"fullA", name:"Full Body A", short:"A"},
           {id:"fullB", name:"Full Body B", short:"B"},
           {id:"fullC", name:"Full Body C", short:"C"}],
    layout: ["fullA","rest","fullB","rest","fullC","rest","rest"]
  },
  ul4: {
