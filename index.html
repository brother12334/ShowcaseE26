        : "Counting the last 7 calendar days against unscaled weekly thresholds. Simpler, but noisier on a rotation that doesn't line up with the calendar week."}</div>
      ${S.sessions.length ? landmarkExplainerHTML(bodyAnalysis()) : `<div class="sub">Log a few sessions and this fills in with your own numbers.</div>`}
    </div>`:""}
  </div>`;

  h += `<div class="card">
    <h3>GitHub gist sync</h3>
    <div class="sub" style="margin-bottom:10px">Set this up <b>once per device</b> and syncing is fully automatic from then on, when you open the app, when you come back to it, and after every workout or program change. The dot next to the app name shows status (green = synced). Create a <b>classic token</b> at github.com → Settings → Developer settings → Personal access tokens, with only the <b>gist</b> scope. It's stored only in this browser.</div>
    <div class="field"><label>Personal access token</label><input id="tokenIn" type="password" value="${esc(c.token)}" placeholder="ghp_..."></div>
    <div class="field"><label>Gist ID (leave blank to create a new one)</label><input id="gistIn" value="${esc(c.gistId)}" placeholder="auto-created on connect"></div>
    <div class="btn-row">
      <button class="btn small" id="connectBtn">${c.gistId?"Save":"Connect"}</button>
      <button class="btn ghost small" id="syncBtn" ${c.gistId?"":"disabled"}>Sync now</button>
    </div>
    <div class="btn-row"><button class="btn ghost small" id="pullBtn" ${c.gistId?"":"disabled"} style="flex:1">⬇ Pull ${esc(profileName())}'s data from this gist</button></div>
    <div class="sub" style="margin-top:6px;font-size:12.5px">Use <b>Pull</b> when you've just added someone and their history isn't showing, it fetches the gist and reports exactly what came back.</div>
    ${c.lastError?`<div class="rest-note" style="text-align:left;margin:10px 0 0;border-color:var(--bad);color:var(--text)"><b class="danger">Last sync failed</b><br><span class="num" style="font-size:12.5px">${esc(c.lastError)}</span>${/^404/.test(c.lastError)?"<br><br>A 404 here means the gist ID isn't visible to this token, check the ID is the long hex string from the gist URL, and that the token belongs to the account that owns it.":""}${/^401/.test(c.lastError)?"<br><br>A 401 means the token is invalid or expired. Generate a fresh classic token with the <b>gist</b> scope.":""}</div>`:""}
    <div class="sub num" style="margin-top:8px">${c.lastSync?"Last synced "+new Date(c.lastSync).toLocaleString():"Not synced yet"} · ${S.sessions.length} session${S.sessions.length===1?"":"s"} held locally</div>
    <div class="sub num" style="margin-top:6px;font-size:11px;color:var(--faint)">rests: ${restDaysThisCycle().length?restDaysThisCycle().join(", "):"none"} of ${REST_CREDITS} · cycle since ${new Date(S.cycleStart).toLocaleDateString()} · saved ${new Date(S.savedAt).toLocaleTimeString()}</div>
  </div>
  <div class="card">
    <h3>Repo backup</h3>
    <div class="sub" style="margin-bottom:10px">After every workout, the app also commits two files straight into your GitHub repo: <b>workout-log.csv</b> (your full history as a spreadsheet) and <b>ironlog-backup.json</b> (a restorable copy of everything). Your token needs the <b>repo</b> scope for this, if you made it with only gist, generate a new one with both boxes checked and paste it above.</div>
    <div class="field"><label>Repository (username/repo-name)</label><input id="repoIn" value="${esc(c.repo||"")}" placeholder="your-username/your-repo"></div>
    <div class="field"><label>Branch</label><input id="branchIn" value="${esc(c.branch||"main")}" placeholder="main"></div>
    <div class="btn-row">
      <button class="btn small" id="repoSaveBtn">Save</button>
      <button class="btn ghost small" id="repoBackupBtn" ${c.repo?"":"disabled"}>Back up now</button>
    </div>
    <div class="sub" style="margin-top:10px">Each person gets their own folder, so nobody overwrites anyone. <b>${esc(profileName())}</b>'s files:</div>
    <div class="sub num" style="margin-top:4px;font-size:12px;color:var(--faint);word-break:break-all">${esc(repoPaths().csv)}<br>${esc(repoPaths().json)}</div>
    <div class="sub num" style="margin-top:8px">${c.lastRepo?"Last repo backup "+new Date(c.lastRepo).toLocaleString():"No repo backups yet"}</div>
  </div>
  <div class="card">
    <h3>Rest days</h3>
    <div class="sub" style="margin:4px 0 10px">Log a day you rested, or remove one added by mistake. Rest days show in History and your report.</div>
    ${restLog.length ? `<div class="rl-list">${restLog.map(d=>`<span class="rl-chip">${fmtDate(d)}<button data-rmrest="${d}" aria-label="Remove">✕</button></span>`).join("")}</div>` : `<div class="sub" style="margin-bottom:8px">None logged yet.</div>`}
    <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
      <input type="date" class="timein" id="restDateIn" value="${todayStr()}" style="flex:1;min-height:44px;padding:11px 12px;font-size:15px">
      <button class="btn small" id="addRestBtn" style="width:auto;padding:11px 20px">Add</button>
    </div>
  </div>
  <div class="card">
    <h3>Backup</h3>
    <div class="btn-row">
      <button class="btn ghost small" id="exportBtn">Export JSON</button>
      <button class="btn ghost small" id="importBtn">Import JSON</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
  <div class="card">
    <h3 class="danger">Danger zone</h3>
    <div class="sub" style="margin:4px 0 0">This erases <b>${esc(profileName())}</b>'s local data only, other people on this device, and every gist, are untouched.</div>
    <button class="btn ghost small danger" id="resetBtn" style="margin-top:10px">Erase ${esc(profileName())}'s data on this device</button>
  </div>`;
  return h;
}

/* ================= EVENTS ================= */
/* Glossary, one delegated listener for the whole app, so every dotted-underlined term
   keeps working through every re-render. Terms can appear inside other modals (the
   muscle breakdown links to MEV, the injury entry links to ACWR), so the entry offers a
   Back button that rebuilds whatever was showing rather than leaving a dead end. */
function openGlossary(id){
  const g = GLOSSARY[id];
  if(!g) return;
  const back = MODAL_REOPEN;                                  // capture before we replace
  const pending = MODAL_DISMISS;                              // eg. the post-workout chain
  const wasOpen = $("#modalBg").classList.contains("show");
  const foot = (wasOpen && back)
    ? `<div class="btn-row" style="margin-top:18px"><button class="btn small" id="glBack">‹ Back</button></div>
       <div class="btn-row"><button class="btn ghost small" id="closeModal">Close</button></div>`
    : `<button class="btn" style="margin-top:18px" id="closeModal">Got it</button>`;
  showModal(`<h3>${g.title}</h3>${g.html}${foot}`);
  MODAL_REOPEN = back;                                        // keep it for nested terms
  MODAL_DISMISS = pending;                                    // don't drop the caller's chain
  const b = $("#glBack");
  if(b) b.onclick = ()=>{ if(back) back(); };
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-term]");
  if(t){ e.stopPropagation(); openGlossary(t.dataset.term); return; }
  if(e.target.closest(".rpe-help")) openGlossary("rpe");
});
// keyboard access for the inline terms
document.addEventListener("keydown", e=>{
  if(e.key !== "Enter" && e.key !== " ") return;
  const t = e.target.closest && e.target.closest("[data-term]");
  if(t){ e.preventDefault(); openGlossary(t.dataset.term); }
});

function bind(){
  const spb = $("#splitBtn");
  if(spb) spb.onclick = openSplitEditor;
  document.querySelectorAll("[data-renameday]").forEach(b=> b.onclick = ()=>{
    const wid = b.dataset.renameday;
    const cur = dayName(wid);
    const v = prompt("Name this training day", cur);
    if(v == null) return;
    const nm = v.trim();
    if(!nm || nm === cur) return;
    renameDay(wid, nm);
  });
  const pb = $("#profBar");
  if(pb) pb.onclick = openProfilePicker;
  const pm = $("#profMini");
  if(pm) pm.onclick = openProfilePicker;
  document.querySelectorAll(".plate").forEach(p=>{
    p.onclick = ()=>{
      if(S.active){ toast("Finish or discard the current workout first"); return; }
      const slot = parseInt(p.dataset.slot,10);
      if(isNaN(slot)) return;
      // The rotation is fixed and only runs forwards, so a spent slot is not selectable.
      // See slotIsPast(): re-running a day you've done is how the day at the far end of
      // the cycle stops getting trained.
      if(slotIsPast(slot)){
        toast(S.cycleDone.includes(slot)
          ? "Already done this cycle. The rotation only moves forward"
          : "That day has passed. The rotation only moves forward");
        return;
      }
      S.pointer = slot;
      S.override = null;
      save(); queueSync(); render();
    };
  });
  const cyc = $("#cycleReset");
  if(cyc) cyc.onclick = ()=>{
    if(confirm("Start a fresh cycle? All checkmarks clear (your history is untouched).")){
      S.cycleStart = Date.now();
      S.cycleDone = [];
      S.restDays = [];
      save(); queueSync(); render();
    }
  };
  const lrev = $("#lastReviewBtn");
  if(lrev) lrev.onclick = ()=> openCycleReview(S.lastReview);
  document.querySelectorAll("[data-rest]").forEach(rp=> rp.onclick = ()=>{
    if(S.active){ toast("Finish or discard the current workout first"); return; }
    const slot = parseInt(rp.dataset.rest, 10);
    const taken = restDaysThisCycle();
    const date = taken[slot] || null;
    const today = todayStr();
    if(date === today){
      if(confirm("Cancel today's rest day? The credit goes back.")){
        releaseRestDay(today, true);
        save(); queueSync(); render();
      }
      return;
    }
    if(date){ toast("That rest was "+fmtDate(date)+". Tap an empty plate to take another."); return; }
    if(isRestToday()){ toast("Today is already logged as a rest day"); return; }
    if(!restCreditsLeft()){ toast("Both rest days are used this cycle"); return; }
    if(confirm("Take today as a rest day? You get "+REST_CREDITS+" per cycle, and this would be "
               +(taken.length+1)+" of "+REST_CREDITS+".")){
      takeRestDay(today);
      save(); queueSync(); render();
    }
  });
  const ur = $("#undoRestBtn");
  if(ur) ur.onclick = ()=>{
    // decided to train after all, so this was never a rest day: unlog it entirely
    releaseRestDay(todayStr(), true);
    save(); queueSync(); render();
  };
  const crb = $("#clearRestBtn");
  if(crb) crb.onclick = ()=>{
    // frees a credit but keeps the day in the permanent rest log: you did rest that
    // day, you are only saying it should not count against this cycle's allowance
    const taken = restDaysThisCycle();
    if(!taken.length) return;
    const d = taken[taken.length-1];
    if(confirm("Free up the rest credit from "+fmtDate(d)+" so you can take another? "
               +"The day stays in your rest history; remove it in Settings if it was a mistake.")){
      releaseRestDay(d, false);
      save(); queueSync(); render();
    }
  };

  // "See the full breakdown" on the Since-last-time card
  document.querySelectorAll("[data-fullgrade]").forEach(b=> b.onclick=()=>{
    const s = S.sessions.find(x=>x.id===b.dataset.fullgrade);
    if(s) openScoreCard(s, null);
  });

  const art = $("#asymRetestBtn");
  if(art) art.onclick = ()=>{
    const res = applyAsymRetest();
    render();
    toast(res.retired.length
      ? "Rule retired on "+res.retired.length+" movement"+(res.retired.length===1?"":"s")
      : "Gaps still open, rule stays on");
  };

  const dlStart = $("#startDeloadBtn");
  if(dlStart) dlStart.onclick = ()=>{ startDeload(); render(); toast("Deload week started"); };
  const dlEnd = $("#endDeloadBtn");
  if(dlEnd) dlEnd.onclick = ()=>{ endDeload(); render(); toast("Deload ended, full sets restored"); };

  const start = $("#startBtn");
  if(start) start.onclick = ()=> startWorkout(todaysWorkoutId());

  const goR = $("#goRestore");
  if(goR) goR.onclick = ()=>{
    TAB = "sync";
    document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on", x.dataset.tab==="sync"));
    render();
    setTimeout(()=>{ const t=$("#tokenIn"); if(t) t.focus(); }, 60);
  };

  ["ciW","ciS","ciE"].forEach(id=>{
    const el = $("#"+id);
    if(el) el.onchange = ()=>{
      const d = todayStr();
      const ci = S.checkins[d] || {};
      if(id==="ciW") ci.weight = el.value.trim();
      if(id==="ciS") ci.sleep = el.value.trim();
      if(id==="ciE") ci.energy = el.value;
      S.checkins[d] = ci;
      save(); queueSync();
    };
  });

  document.querySelectorAll(".set input, .set select").forEach(el=>{
    if(el.dataset.e==null) return;      // skip the session-editor's own rows
    el.onchange = async ()=>{
      const ei = parseInt(el.dataset.e,10), si = parseInt(el.dataset.s,10), f = el.dataset.f;
      const st = S.active.entries[ei].sets[si];
      const before = st.pr || null;
      st[f] = el.value;
      if(String(el.value).trim() !== "") markPriorDone(ei, si);
      // Typing a heavier weight (or more reps) onto an already-ticked set is a PR path
      // the old code never looked at. Re-check the whole exercise, then surface it.
      if(st.done && (f==="weight" || f==="reps")){
        refreshPRs(ei);
        if(st.pr && st.pr !== before){
          const chk = document.querySelector(`.set .chk[data-e="${ei}"][data-s="${si}"]`);
          if(chk) prFloat(chk, st.pr);
          drawPRBadges(ei);
        } else if(!st.pr && before){
          drawPRBadges(ei);
        }
      }
      save();
      /* The rep count landing is the trigger, not the ✓. Plenty of sessions get logged
         by typing the numbers straight in and never tapping the tick at all, and those
         are exactly the sessions where a collapsed set would otherwise go unexplained. */
      if(f === "reps") await maybeAskWhy(ei, si);
    };
  });
  document.querySelectorAll(".set .chk").forEach(el=>{
    el.onclick = async ()=>{
      const ei = parseInt(el.dataset.e,10), si = parseInt(el.dataset.s,10);
      const entry = S.active.entries[ei];
      const wasComplete = entry.sets.length && entry.sets.every(x=>x.done);
      const st = entry.sets[si];
      // About to log a set while a rest timer for a DIFFERENT set is barely started?
      // That means the last rest was ~nothing, ask before it gets recorded, using the
      // rest target for the set that's actually resting.
      if(!st.done && !entry.superset){
        const rt = S.active.restTimer;
        if(rt && !(rt.e===ei && rt.s===si)){
          if(!(await confirmShortRest(restElapsed(), "log this next set"))) return;
        }
      }
      st.done = !st.done;
      if(st.done){
        const row = el.parentElement;
        const wIn = row.querySelector('[data-f="weight"]');
        const rIn = row.querySelector('[data-f="reps"]');
        if(!st.weight && wIn.placeholder && wIn.placeholder!=="lbs"){ st.weight=wIn.placeholder; wIn.value=wIn.placeholder; }
        if(!st.reps && rIn.placeholder && rIn.placeholder!=="reps"){ st.reps=rIn.placeholder; rIn.value=rIn.placeholder; }
        // PR spark, compared against your ALL-TIME best for this exercise, and now
        // recorded on the set so it also shows as a badge and in the session summary.
        checkPR(ei, si, el);
        /* The ✓ starts the stopwatch, except in two cases: inside a superset, where
           there is deliberately no rest, and on the very last set of the very last
           exercise, where there is nothing left to rest FOR. Timing the walk to the
           car was never useful and it polluted the rest-discipline grade. */
        const lastEntry = ei === S.active.entries.length - 1;
        const lastSet = si === entry.sets.length - 1;
        // endsRound() is the superset-aware version of "is there anything left to rest
        // for": inside a pair only the movement that closes the round starts the clock.
        if(endsRound(S.active.entries, ei, si) && !(lastEntry && lastSet)) startRest(ei, si);
      } else {
        // unchecking: cancel its running timer and clear its recorded rest
        const rt = S.active.restTimer;
        if(rt && rt.e===ei && rt.s===si){ S.active.restTimer=null; hideRestUI(); }
        delete st.rest;
        delete st.pr;
        delete st.why;              // no longer a completed set, so its reason is stale
      }
      el.classList.toggle("on", st.done);
      refreshPRs(ei);
      drawPRBadges(ei);
      save();
      const isComplete = entry.sets.length && entry.sets.every(x=>x.done);
      if(S.viewMode==="focus" && wasComplete !== isComplete){
        // completion flipped → the barbell gains/loses a plate
        const doShake = isComplete;
        render();
        if(doShake && !reducedMotion()){
          document.body.classList.add("shake");
          setTimeout(()=>document.body.classList.remove("shake"), 600);
        }
      }
      /* Last, and only after the rest clock is already running, so answering the
         question doesn't eat into the rest it just started timing. */
      if(st.done) await maybeAskWhy(ei, si);
    };
  });
  document.querySelectorAll("[data-addset]").forEach(b=> b.onclick=()=>{
    S.active.entries[b.dataset.addset].sets.push({weight:"",reps:"",rpe:"",done:false});
    save(); render();
  });
  document.querySelectorAll("[data-rmset]").forEach(b=> b.onclick=()=>{
    const sets = S.active.entries[b.dataset.rmset].sets;
    if(sets.length>1){ sets.pop(); save(); render(); }
  });

  const fin = $("#finishBtn");
  if(fin) fin.onclick = finishWorkout;
  function harvestActive(){
    if(!S.active) return;
    document.querySelectorAll(".set input[data-e], .set select[data-e]").forEach(el=>{
      const {e,s,f} = el.dataset;
      if(S.active.entries[e] && S.active.entries[e].sets[s]) S.active.entries[e].sets[s][f] = el.value;
    });
    const n = $("#sessNote");
    if(n) S.active.note = n.value;
  }
  document.querySelectorAll("[data-exup]").forEach(b=> b.onclick=()=>{
    const i = parseInt(b.dataset.exup,10);
    if(i<=0) return;
    harvestActive();
    [S.active.entries[i-1], S.active.entries[i]] = [S.active.entries[i], S.active.entries[i-1]];
    save(); render();
  });
  document.querySelectorAll("[data-exdown]").forEach(b=> b.onclick=()=>{
    const i = parseInt(b.dataset.exdown,10);
    if(i>=S.active.entries.length-1) return;
    harvestActive();
    [S.active.entries[i], S.active.entries[i+1]] = [S.active.entries[i+1], S.active.entries[i]];
    save(); render();
  });
  document.querySelectorAll("[data-exskip]").forEach(b=> b.onclick=()=>{
    const i = parseInt(b.dataset.exskip,10);
    if(confirm("Skip "+S.active.entries[i].name+" today? It won't appear in this session's log.")){
      harvestActive();
      S.active.entries.splice(i,1);
      if(S.active.focusIdx!=null) S.active.focusIdx = Math.min(S.active.focusIdx, Math.max(0, S.active.entries.length-1));
      save(); render();
      toast("Skipped, it'll be back next time");
    }
  });
  const goFocus = dir=>{
    harvestActive();
    const list = S.active.entries;
    let i = S.active.focusIdx || 0;
    /* Step by WHOLE exercises: a superset pair is one stop, so moving forward off the
       first half must clear the second, and moving back onto a pair must land on its
       first half rather than dropping you into the middle of it. */
    if(dir > 0){
      const here = supersetInfo(list, i);
      i += (here && here.role === "first" && list[i+1]) ? 2 : 1;
    } else {
      i -= 1;
      const landed = supersetInfo(list, i);
      if(landed && landed.role === "second") i -= 1;
    }
    S.active.focusIdx = Math.max(0, Math.min(i, list.length-1));
    save(); render(); window.scrollTo(0,0);
  };
  document.querySelectorAll("[data-fprev]").forEach(b=> b.onclick=()=> goFocus(-1));
  document.querySelectorAll("[data-fnext]").forEach(b=> b.onclick=()=> goFocus(1));
  const appEl = $("#app");
  if(S.active && S.viewMode==="focus"){
    let sx = null;
    appEl.ontouchstart = e=>{ sx = e.touches[0].clientX; };
    appEl.ontouchend = e=>{
      if(sx==null) return;
      const dx = e.changedTouches[0].clientX - sx;
      sx = null;
      if(Math.abs(dx) > 75) goFocus(dx < 0 ? 1 : -1);
    };
  } else {
    appEl.ontouchstart = null;
    appEl.ontouchend = null;
  }
  document.querySelectorAll("[data-vmode]").forEach(b=> b.onclick=()=>{
    S.viewMode = b.dataset.vmode;
    save(); render();
    toast(S.viewMode==="focus" ? "Focus mode on, one exercise at a time" : "Regular view on");
  });
  const sn = $("#sessNote");
  if(sn) sn.onchange = ()=>{ S.active.note = sn.value; save(); };
  document.querySelectorAll("#app [data-feel]").forEach(b=> b.onclick=()=>{
    const v = parseInt(b.dataset.feel,10);
    S.active.feel = S.active.feel===v ? null : v;
    save();
    document.querySelectorAll("#app [data-feel]").forEach(x=>x.classList.toggle("on", parseInt(x.dataset.feel,10)===S.active.feel));
  });
  const disc = $("#discardBtn");
  if(disc) disc.onclick = ()=>{
    if(confirm("Discard this workout? Nothing will be saved.")){ S.active=null; hideRestUI(); save(); render(); }
  };

  const plan = $("#planBtn");
  if(plan) plan.onclick = openPlan;
  const aiB = $("#aiImportBtn");
  if(aiB) aiB.onclick = ()=> openAIImport(false);
  const rep = $("#reportBtn");
  if(rep) rep.onclick = openReport;
  const docB = $("#docBtn");
  if(docB) docB.onclick = downloadDoc;

  const addRest = $("#addRestBtn");
  if(addRest) addRest.onclick = ()=>{
    const d = $("#restDateIn").value;
    if(!d){ toast("Pick a date first"); return; }
    if(!S.restLog.includes(d)){ S.restLog.push(d); S.restLog.sort(); save(); queueSync(); render(); toast("Rest day logged"); }
    else toast("That day's already logged");
  };
  document.querySelectorAll("[data-rmrest]").forEach(b=> b.onclick=()=>{
    const d = b.dataset.rmrest;
    if(!confirm("Remove rest day "+fmtDate(d)+"?")) return;
    releaseRestDay(d, true);   // tombstoned, so a sync cannot resurrect it
    save(); queueSync(); render();
  });

  document.querySelectorAll(".sess").forEach(c=>{
    c.onclick = e=>{
      const d = e.target.dataset || {};
      // any control inside the expanded detail handles its own click
      if(d.delsess || d.editsess || d.resumesess || d.scoresess || d.hup || d.hdown) return;
      c.classList.toggle("open");
    };
  });
  document.querySelectorAll("[data-editsess]").forEach(b=> b.onclick=()=> openSessionEditor(b.dataset.editsess));
  document.querySelectorAll("[data-scoresess]").forEach(b=> b.onclick=()=>{
    const s = S.sessions.find(x=>x.id===b.dataset.scoresess);
    if(!s) return;
    // Grade older sessions on demand and keep the result. A score from the previous
    // scoring version is re-run too, so History isn't a mix of two different scales.
    if(!s.quality || s.quality.v !== 2){
      sweepSessionPRs(s);
      s.quality = scoreWorkout(s);
      s.edited = Date.now();
      save(); queueSync();
    }
    openScoreCard(s, ()=>render());
  });
  // reorder exercises inside a finished session, straight from History

/* ---------- workout flow ---------- */
function startWorkout(wid){
  // lock in this session's starting arm now, so it can't shift if the session count
  // changes later (e.g. resuming from history splices a session out of the list).
  const side = startSideFor(wid);
  S.active = {
    id: uid(),
    workoutId: wid,
    date: todayStr(),
    startedAt: Date.now(),
    entries: resolvedProgram(wid).map(({chosen:e, isFinisher}, _wi)=>({
      name: e.name, reps: e.reps, rpe: e.rpe, note: e.note, fin: isFinisher||undefined,
      // the per-set ramp, frozen at session start so editing the plan mid-workout
      // can't retarget sets you have already done
      rpes: Array.isArray(e.rpes) ? e.rpes.slice() : undefined,
      // which warm-up ramp this slot earns, decided by position in the session
      warm: warmupKindFor(resolvedProgram(wid).map(x=>x.chosen), _wi) || undefined,
      // the prescribed load, carried so the warm-up ramp has something to take a
      // percentage of. Distinct from the per-set weights on entry.sets.
      planWeight: (e.weight == null ? undefined : e.weight),
      rest: Array.isArray(e.rest) ? e.rest.slice() : undefined,
      superset: e.superset||undefined, supersetEnd: e.supersetEnd||undefined,
      // which alternating scheme this movement uses, and which side it opens on 
      // both frozen at session start so per-set L/R can never drift mid-workout
      altStyle: altStyle(e) || undefined,
      startSide: altStyle(e) ? side : undefined,
      sets: Array.from({length:e.sets}, ()=>({weight:"",reps:"",rpe:"",done:false}))
    }))
  };
  save(); render();
}
function resumeSession(id){
  const idx = S.sessions.findIndex(s=>s.id===id);
  if(idx<0) return;
  const s = S.sessions[idx];
  if(s.date !== todayStr()){ toast("You can only resume today's workout"); return; }
  if(S.active && !confirm("You have a workout in progress, replace it with this one?")) return;
  // pull the finished session back into an active, editable session
  S.active = {
    id: s.id,
    workoutId: s.workoutId,
    date: s.date,
    startedAt: s.startedAt,
    note: s.note||"",
    feel: s.feel||null,
    focusIdx: 0,
    restTimer: null,
    entries: s.entries.map(e=>({
      name: e.name, reps: e.reps, rpe: e.rpe, note: e.note, fin: e.fin||undefined,
      superset: e.superset||undefined, supersetEnd: e.supersetEnd||undefined,
      altStyle: e.altStyle || altStyle(e) || undefined,
      startSide: altStyle(e) ? (e.startSide || startSideFor(s.workoutId)) : undefined,
      sets: e.sets.map(st=>Object.assign({}, st))
    }))
  };
  S.sessions.splice(idx,1); // remove from history while it's live again
  recomputeCycle(false);
  save(); queueSync();
  TAB = "today";
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on", x.dataset.tab==="today"));
  render();
  window.scrollTo(0,0);
  toast("Workout resumed, finish again when you're done");
}
function finishWorkout(){
  const a = S.active;
  const logged = a.entries.some(e=>e.sets.some(st=>st.done || st.reps));
  if(!logged){
    if(!confirm("No sets logged yet, finish anyway?")) return;
  } else if(!confirm("Complete your workout? This saves the session to your history.")){
    return;
  }
  if(a.restTimer){ a.restTimer = null; hideRestUI(); }
  a.entries.forEach(e=>{ e.sets = e.sets.filter(st=>st.done || st.reps || st.weight); });
  a.entries = a.entries.filter(e=>e.sets.length);
  a.finishedAt = Date.now();
  const wid = a.workoutId;
  const noteEl = $("#sessNote");
  if(noteEl) a.note = noteEl.value.trim();
  const vol = a.entries.reduce((t,e)=>t+e.sets.reduce((u,st)=>u+((parseFloat(st.weight)||0)*(parseFloat(st.reps)||0)),0),0);
  const sessObj = {id:a.id, workoutId:a.workoutId, date:a.date, startedAt:a.startedAt, finishedAt:a.finishedAt, entries:a.entries, note:a.note||"", feel:a.feel||null};
  const existing = S.sessions.findIndex(x=>x.id===a.id);
  if(existing>=0) S.sessions.splice(existing,1);
  S.sessions.push(sessObj);
  S.sessions.sort((x,y)=>x.startedAt-y.startedAt);
  S.active = null;
  // Re-check every logged set for records BEFORE grading, so a PR typed into a row
  // that never got an explicit ✓ still counts, both as a badge and as improvement.
  sweepSessionPRs(sessObj);
  // Progression is evaluated once, at finish, against the history as it stood then, and
  // stored on the session so the card says the same thing when you reopen it later.
  updateStalls(sessObj);
  sessObj.progression = buildProgression(sessObj);
  // graded once, at the moment it's finished, and stored on the session so History
  // shows the same number later even as the surrounding history grows
  sessObj.quality = scoreWorkout(sessObj);
  const cycleFinished = recomputeCycle(true);
  S.override = null;
  save(); render();
  // celebration → quality score → cycle wrapped, each waiting for the last
  const afterScore = ()=>{
    if(cycleFinished && S.lastReview) setTimeout(()=>openCycleReview(S.lastReview), 250);
  };
  /* One frame after render(), so the overlay is never inserted into a layout that is
     still settling. The "saved" toast is gone: it fired at the bottom of the screen
     underneath a full-screen celebration that already says the same thing, which is
     what read as a stray element appearing at the bottom and jumping. */
  let _celeStarted = false;
  const _startCele = ()=>{
    if(_celeStarted) return;
    _celeStarted = true;
    celebrate(cycleFinished ? "cycle" : "workout", wid, Math.round(vol),
              ()=> setTimeout(()=>openScoreCard(sessObj, afterScore), 300));
  };
  /* Two frames is what lets the layout settle. But requestAnimationFrame does not fire
     at all in a backgrounded tab, and finishing a workout is exactly when a phone gets
     locked or switched away from, so a timer guarantees the handoff. Without it the
     celebration AND the score card behind it would simply never appear. */
  requestAnimationFrame(()=> requestAnimationFrame(_startCele));
  setTimeout(_startCele, 140);
  if(S.sync.gistId) syncNow(false);
  if(S.sync.repo) repoBackup(false);
}
function recomputeCycle(announce){
  // the cycle's checkmarks are always derived from actual logged sessions since cycleStart
  const done = [];
  S.sessions
    .filter(s=>s.startedAt >= S.cycleStart)
    .sort((a,b)=>a.startedAt-b.startedAt)
    .forEach(s=>{
      for(let i=0;i<ROTATION.length;i++){
        if(ROTATION[i]===s.workoutId && !done.includes(i)){ done.push(i); break; }
      }
    });
  if(done.length >= ROTATION.length){
    // full cycle in the books → capture the review, then start fresh
    S.lastReview = buildCycleReview();
    S.lastCycle = {start:S.cycleStart, end:Date.now()};
    S.cycleStart = Date.now();
    S.cycleDone = [];
    S.restDays = [];
    /* Back to the top of the rotation. The pointer used to be left wherever the last
       session put it, so the cycle that had just closed on Legs B opened the new one on
       Legs B again — the rotation's own wrap-around was the one place it did not run in
       order. It matters more now that the strip refuses to move backwards: leaving the
       pointer at the end would have opened a fresh cycle with everything before it
       already looking spent. */
    S.pointer = 0;
    if(announce) toast("Cycle complete, starting a fresh one 🔁");
    save();   // real transition, mark as a change worth syncing
    return true;
  } else {
    S.cycleDone = done;
  }
  // if the suggested day is already done, move to the next unchecked one
  if(S.cycleDone.includes(S.pointer)){
    for(let k=1;k<=ROTATION.length;k++){
      const idx = (S.pointer+k)%ROTATION.length;
      if(!S.cycleDone.includes(idx)){ S.pointer = idx; break; }
    }
  }
  saveQuiet();   // derived recomputation, don't claim a newer change on every boot
  return false;
}
/* The free-choice workout picker used to live here, behind a "#swapBtn" that no view
   has rendered for some time. It is gone rather than merely unbound: a modal listing
   all six days with no notion of where you are in the cycle is exactly the escape hatch
   that turns a set schedule into a menu, and it would have re-opened the same hole
   slotIsPast() was added to close. `S.override` is still read by todaysWorkoutId() so
   any value already sitting in an older save keeps working for the day it was set. */

/* =====================================================================
   PROGRAMME CHANGE LOG

   The programme is a living document, and until now it was the only part of the app
   with no memory. That cost two things that both read as the app being wrong:

     • The printed report described every session against a plan it silently assumed had
       always looked the way it looks today. A coach reading "3 sets of 8-12" at the top
       and a session of 4 sets of 6 in March had no way to know the card changed in May.
     • The quality score compared each lift against the last time you did it without
       knowing whether the prescription underneath it had moved. Take a movement from
       6-10 to 12-15 and the estimated 1RM drops by design; the grade called that
       going backwards.

   So every edit is written down: what changed, on which day, from what to what. It
   starts from the moment this version runs, because edits made before it were never
   recorded anywhere and cannot be invented after the fact.
   ===================================================================== */
const PLAN_FIELDS = [
  {k:"name",   label:"name"},
  {k:"sets",   label:"sets"},
  {k:"reps",   label:"rep range"},
  {k:"rpe",    label:"target RPE"},
  {k:"weight", label:"starting weight"},
  {k:"note",   label:"note"}
];
// Fields that change what the numbers in the log MEAN, as opposed to how the row reads.
// Only these excuse a lift for coming in lower than last time.
const PLAN_PRESCRIPTION_FIELDS = {name:1, sets:1, reps:1, weight:1};
function planFieldVal(e, k){
  if(!e) return "";
  if(k === "weight") return (e.weight==null || e.weight==="") ? "bodyweight" : String(e.weight)+" lb";
  return String(e[k]==null ? "" : e[k]).trim();
}
/* One flat list of what actually differs between two versions of an exercise, including
   its alternating partner, which is part of the prescription. */
function planDiff(a, b){
  const out = [];
  PLAN_FIELDS.forEach(f=>{
    const x = planFieldVal(a, f.k), y = planFieldVal(b, f.k);
    if(x !== y) out.push({field:f.label, key:f.k, from:x, to:y});
  });
  const an = (a && a.alt && a.alt.name) || "", bn = (b && b.alt && b.alt.name) || "";
  if(an !== bn){
    out.push({field:"alternating partner", key:"name", from:an||"none", to:bn||"none"});
  } else if(a && a.alt && b && b.alt){
    PLAN_FIELDS.forEach(f=>{
      if(f.k === "name") return;
      const x = planFieldVal(a.alt, f.k), y = planFieldVal(b.alt, f.k);
      if(x !== y) out.push({field:bn+" "+f.label, key:f.k, from:x, to:y});
    });
  }
  return out;
}
/* `name` is always the name the exercise ends up with, so a renamed movement's changes
   still come back from planChangesFor() under the name you look it up by. */
function logPlanChange(kind, wid, name, changes, extra){
  if(!Array.isArray(S.planLog)) S.planLog = [];
  S.planLog.push(Object.assign({
    at: Date.now(), date: todayStr(), day: wid, kind,
    name: String(name||""), changes: changes || []
  }, extra || {}));
  if(S.planLog.length > 500) S.planLog = S.planLog.slice(-500);
}
/* Every logged change to one exercise inside a time window. Matched on the canonical
   name, so a rename doesn't hide the change that renamed it. */
function planChangesFor(exName, fromAt, toAt){
  const k = nrm(exName);
  return (S.planLog||[]).filter(c=>{
    if(!(c.at > fromAt && c.at <= toAt)) return false;
    return nrm(c.name) === k || (c.prevName && nrm(c.prevName) === k);
  });
}
// Did the prescription itself move, as opposed to a note or an RPE target?
function prescriptionMoved(changes){
  return changes.some(c=>
    c.kind === "add" || c.kind === "remove" ||
    (c.changes||[]).some(d=>PLAN_PRESCRIPTION_FIELDS[d.key]));
}
function planChangeSentence(c){
  const day = c.day === "finisher" ? "the finisher" : widName(c.day)+" day";
  if(c.kind === "add")    return "Added <b>"+esc(c.name)+"</b> to "+esc(day)+
    (c.spec ? " ("+esc(c.spec)+")" : "")+".";
  if(c.kind === "remove") return "Removed <b>"+esc(c.name)+"</b> from "+esc(day)+
    ". Sessions already logged keep it.";
  if(c.kind === "move")   return "Moved <b>"+esc(c.name)+"</b> "+(c.dir<0?"earlier":"later")+
    " in "+esc(day)+", to position "+c.pos+" of "+c.of+".";
  const bits = (c.changes||[]).map(d=>
    esc(d.field)+" "+(d.from ? esc(d.from) : "blank")+" → "+(d.to ? esc(d.to) : "blank"));
  return "Changed <b>"+esc(c.prevName || c.name)+"</b> on "+esc(day)+": "+bits.join("; ")+".";
}

    <button class="btn small" id="saveEx">Save</button>
    ${isNew?"":'<button class="btn ghost small danger" id="delEx">Delete</button>'}
    <button class="btn ghost small" id="closeModal">Cancel</button>
  </div>`;
  showModal(h);
  $("#f_hasAlt").onchange = ev=>{ $("#altFields").style.display = ev.target.checked ? "block" : "none"; };
  $("#saveEx").onclick = ()=>{
    const ne = {
      name: $("#f_name").value.trim(),
      sets: Math.max(1, parseInt($("#f_sets").value,10)||3),
      reps: $("#f_reps").value.trim(),
      rpe: $("#f_rpe").value.trim(),
      weight: $("#f_weight").value===""?null:parseFloat($("#f_weight").value),
      note: $("#f_note").value.trim()
    };
    if(!ne.name){ toast("Name it first"); return; }
    // store the override only when it disagrees with the built-in tables, so those can
    // keep improving for exercises the user never touched
    const want = $("#f_alt").value;                       // "", "side" or "cross"
    const auto = altStyle({name:ne.name, note:ne.note});
    if(want !== (auto||"")){
      ne.cross = want === "cross";
      ne.uni   = want === "side";
    }
    if($("#f_hasAlt").checked){
      const na = {
        name: $("#g_name").value.trim(),
        sets: Math.max(1, parseInt($("#g_sets").value,10)||3),
        reps: $("#g_reps").value.trim(),
        rpe: $("#g_rpe").value.trim(),
        weight: $("#g_weight").value===""?null:parseFloat($("#g_weight").value),
        note: $("#g_note").value.trim()
      };
      if(!na.name){ toast("Name the alternate too"); return; }
      ne.alt = na;
    }
    /* A rename must not orphan the exercise's own history. Two things happen:
       the old name is registered as an alias, which is enough on its own because every
       lookup in the app canonicalises through it, so "last time", PR detection and the
       overload grade all keep working; and the logged entries are rewritten so History
       and the printed report show the new name too. */
    const oldName = isNew ? "" : String(e.name||"");
    // taken before anything is written back, while `e` is still the previous version
    const diff = isNew ? [] : planDiff(e, ne);
    // taken now, because registering the alias below makes the two names canonicalise
    // to the same thing, at which point the rename is invisible to nrm()
    const renamed = !isNew && !!oldName && nrm(oldName) !== nrm(ne.name);
    if(renamed){
      const oldKey = nrmRaw(oldName);
      let moved = 0;
      S.sessions.forEach(s=>{
        let touched = false;
        (s.entries||[]).forEach(en=>{
          if(nrmRaw(en.name) === oldKey){ en.name = ne.name; touched = true; moved++; }
        });
        if(touched) s.edited = Date.now();
      });
      S.exAliases[oldKey] = ne.name;
      USER_ALIASES = S.exAliases; invalidateTableOrigin();
      if(moved) toast("Renamed, and "+moved+" logged entr"+(moved===1?"y":"ies")+" came with it");
    }
    if(isNew) S.program[wid].push(ne); else S.program[wid][idx]=ne;
    if(isNew){
      logPlanChange("add", wid, ne.name, [],
        {spec: ne.sets+" × "+(ne.reps||"?")+(ne.rpe?" at RPE "+ne.rpe:"")});
    } else if(diff.length){
      logPlanChange("edit", wid, ne.name, diff, renamed ? {prevName: oldName} : null);
    }
    invalidateMultiDay();
    save(); queueSync(); hideModal(); render();
  };
  const del = $("#delEx");
  if(del) del.onclick = ()=>{
    if(confirm("Remove this exercise from the program? Past logs keep it.")){
      const gone = S.program[wid][idx];
      S.program[wid].splice(idx,1);
      logPlanChange("remove", wid, gone ? gone.name : "", []);
      invalidateMultiDay(); save(); queueSync(); hideModal(); render();
    }
  };
}
function moveEx(wid, idx, dir){
  idx = parseInt(idx,10);
  const arr = S.program[wid], j = idx+dir;
  if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]]=[arr[j],arr[idx]];
  /* Order is a real prescription change, not cosmetic: what sits at the end of a session
     pays for everything in front of it, and the quality score reads the running order. */
  logPlanChange("move", wid, arr[j].name, [], {dir, pos:j+1, of:arr.length});
  save(); queueSync(); render();
}

/* Move an exercise up or down inside a finished session. Order matters for reading a
   session back, and for the quality score's fatigue-management read, so it's editable
   after the fact, both from the History card and inside the session editor. */
function moveSessEx(sessId, idx, dir, silent){
  const s = S.sessions.find(x=>x.id===sessId);
  if(!s) return false;
  idx = parseInt(idx,10);
  const j = idx + dir;
  if(j < 0 || j >= s.entries.length) return false;
  [s.entries[idx], s.entries[j]] = [s.entries[j], s.entries[idx]];
  s.edited = Date.now();
  save(); queueSync();
  if(!silent){
    // keep this card open across the re-render so you can keep nudging
    render();
    const card = document.querySelector(`.sess[data-sess="${sessId}"]`);
    if(card) card.classList.add("open");
  }
  return true;
}

/* ---------- session editor (edit history) ---------- */
function allExerciseNames(){
  const set = new Set();
  Object.keys(S.program).forEach(k=>{
    S.program[k].forEach(e=>{
      if(e.name) set.add(e.name);
      if(e.alt && e.alt.name) set.add(e.alt.name);
    });
  });
  S.sessions.forEach(s=>s.entries.forEach(e=>set.add(e.name)));
  return [...set].filter(n=>n && !/round 2/i.test(n)).sort((a,b)=>a.localeCompare(b));
}
function openSessionEditor(id){
  const s = S.sessions.find(x=>x.id===id);

}
