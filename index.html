/* =====================================================================
   WARM-UPS

   Two to three ramping sets before the FIRST exercise of a session, working up to
   roughly 90% of the working load for 2-3 reps. One light set before the SECOND
   compound. Nothing at all before isolation work.

   They are guidance, not data: none of them are logged, none of them count toward set
   totals, and none reach volume, PR detection, the muscle map or the quality score.
   That is deliberate rather than lazy. A warm-up set is defined by being easy, so
   counting it as a working set would inflate every volume figure in the app, and
   asking you to tick three extra rows before your first real set is exactly the
   friction that stops people warming up at all.

   A ramp is expressed in percentages so it stays correct when the load moves. The last
   rung sits at 90% for 2-3 reps: close enough to feel the working weight, far enough
   from it to cost nothing.

   WHICH NUMBER THE PERCENTAGE IS TAKEN OF, which is where this used to be wrong.

   The ramp was always computed from the PRESCRIBED load on the programme card, and for
   the Smith work that number is recorded bar-inclusive: 115 means "25 lb bar + 45 a
   side". The weights actually typed into the set rows are not — they are the load the
   way you actually record that lift, with the bar left out. So the warm-up quoted
   "45 lb → 75 lb → 105 lb" above sets being logged at 40, and the only way to read that
   was that the warm-up had the bar in it and the working sets did not. It did.

   So the ramp is taken from YOUR OWN LOGGED NUMBERS instead — see warmWorkingLoad() for
   the three sources and why they rank the way they do. The short version: what you are
   about to lift if the last grade said to add weight, otherwise what you actually lifted
   last time, and only with no history at all the prescribed load, bar removed.

   Reading the log rather than the card fixes more than the units. Whatever convention a
   given movement happens to be recorded in, the warm-up is quoted in that same one, and
   a load you have already moved past stops warming you up for the wrong weight.       */
const WARM_FULL = [{pct:0.40, reps:"8"}, {pct:0.65, reps:"5"}, {pct:0.90, reps:"3"}];
const WARM_LIGHT = [{pct:0.55, reps:"5"}];

/* The Smith machine's carriage. The programme's Smith loads include it (see the note on
   defaultProgram); nothing that gets typed into a set row does. */
const SMITH_BAR = 25;
function barWeightFor(name){
  return /\bsmith\b/.test(nrm(name)) ? SMITH_BAR : 0;
}
/* The load the ramp is a percentage OF, and where the number came from. `ctx` is how the
   caller says which exercise slot this is, and matches the arguments the "last time" box
   next to it is already built from.

   Three sources, in order, and the order is the whole point:

     next  the load you are about to lift. When the last session's grade ended in "add
           weight next time: 40 → 50", 50 is what today's sets are for, so 50 is what the
           ramp aims at. Warming up to 90% of 40 on the session you step up puts the top
           warm-up rung UNDER your opening working set, which is not a warm-up.
     last  otherwise, the heaviest working set you actually did last time.
     plan  and only with no history at all, the prescribed load with the bar removed.

   The verdict is read from the most recent session containing the movement, so it is
   always the current recommendation — train again and that session brings its own. It is
   honoured whether or not you tapped Apply: the suggestion is the app's read on that
   exact session either way, and a warm-up rung 10 lb high costs less than one 10 lb low. */
function warmWorkingLoad(e, ctx){
  if(ctx && ctx.workoutId && e && e.name){
    const l = lastEntryFor(ctx.workoutId, e.name, !!ctx.anyDay, ctx.occ || 0);
    if(l){
      const up = progressionUpFor(l.sess, e.name, ctx.occ || 0);
      if(up != null) return {w: up, src: "next"};
      let top = 0;
      (l.sets || []).forEach(st=>{
        if(!st || st.reps === "" || st.reps == null) return;
        const w = parseFloat(st.weight);
        if(w > top) top = w;
      });
      if(top > 0) return {w: top, src: "last"};
    }
  }
  // programme entries carry `weight`; live session entries carry `planWeight`
  const w = parseFloat(e && (e.weight != null ? e.weight : e.planWeight));
  if(!(w > 0)) return null;
  const bare = w - barWeightFor(e.name);
  return bare > 0 ? {w: bare, src: "plan"} : null;
}
/* The load a session's grade told you to move to for this movement, if it told you
   anything. Occurrence-aware for the same reason every other lookup is: the finisher
   runs crunch → leg raise → crunch, and the 2nd crunch's verdict is not the 1st's. */
function progressionUpFor(sess, name, occ){
  if(!sess || !Array.isArray(sess.progression)) return null;
  const k = nrm(name);
  const hits = sess.progression.filter(p=>p.kind === "up" && nrm(p.name) === k);
  if(!hits.length) return null;
  const to = parseFloat(hits[Math.min(occ || 0, hits.length - 1)].to);
  return to > 0 ? to : null;
}

/* Is this movement genuinely unloaded, as opposed to loaded-but-not-yet-calibrated?
   Only used to word the warm-up, so a wrong answer costs a phrase, not a prescription. */
function isBodyweightMovement(name){
  return /push[- ]?up|pull[- ]?up|chin[- ]?up|\bdip|plank|bodyweight|glute bridge|nordic|sissy|inverted row|leg raise|hanging|split squat$|single-leg/i
    .test(nrm(name || ""));
}
// Round to something you can actually load: dumbbells move in 2.5s, plates in 5s.
function warmRound(w, name){
  const step = /dumbbell|\bdb\b/.test(nrm(name)) ? 2.5 : 5;
  return Math.max(step, Math.round(w / step) * step);
}
/* Which ramp, if any, this exercise gets. Position in the session decides it: the
   opener gets the full ramp because it is the one going in cold, the second compound
   gets a single light set, and isolation gets nothing because the compounds in front
   of it have already warmed the joint. */
function warmupKindFor(list, index){
  if(index === 0) return "full";
  const compounds = [];
  list.forEach((x, i)=>{ if(isCompound(x.name || (x.chosen && x.chosen.name))) compounds.push(i); });
  if(compounds.length > 1 && compounds[1] === index) return "light";
  return null;
}
function warmupPlan(e, kind, ctx){
  if(!kind) return [];
  const spec = kind === "full" ? WARM_FULL : WARM_LIGHT;
  const src = warmWorkingLoad(e, ctx);
  const w = src && src.w;
  if(!(w > 0)){
    /* No load to take a percentage of. Two very different reasons for that, and
       labelling both "bodyweight" was wrong: a push-up genuinely has no load, whereas a
       barbell bench press you have simply never logged has one you don't know yet.
       Telling someone to warm up for a bench press with "bodyweight × 8" reads as the
       app having lost track of what the exercise is. */
    if(isBodyweightMovement(e && e.name)){
      return kind === "full"
        ? [{label:"bodyweight", reps:"8"}, {label:"bodyweight", reps:"5"}]
        : [{label:"bodyweight", reps:"5"}];
    }
    return kind === "full"
      ? [{label:"light", reps:"8"}, {label:"build up", reps:"5"}, {label:"almost there", reps:"3"}]
      : [{label:"one light set", reps:"5"}];
  }
  return spec.map(x=>({label: warmRound(w * x.pct, e.name) + " lb", reps: x.reps,
                       pct: Math.round(x.pct*100), src: src.src}));
}
function warmupHTML(e, kind, ctx){
  const plan = warmupPlan(e, kind, ctx);
  if(!plan.length) return "";
  return `<div class="warm">
    <span class="warm-tag">Warm-up</span>
    <span class="warm-sets">${plan.map(x=>
      `<span class="warm-set">${esc(x.label)} <i>&times;${esc(x.reps)}</i></span>`).join("")}</span>
    <span class="warm-note">${
      plan[0] && plan[0].pct == null
        ? (isBodyweightMovement(e && e.name)
            ? (kind === "full" ? "easy reps to warm the joint, no added load. Not counted."
                               : "one easy set. Not counted.")
            : "work up to your first real set. Once you've logged this one, the ramp uses your own numbers. Not counted.")
        /* Saying WHICH load it is aiming at matters on the session you step up: the
           numbers jump, and "your new load" is the difference between that reading as
           the plan working and reading as the app having lost track of your weights. */
        : (kind === "full"
            ? "ramping to about 90% of your " + (plan[0].src === "next" ? "new" : "working") + " load. Not counted."
            : "one light set" + (plan[0].src === "next" ? ", off your new load" : "") + ". Not counted.")}</span>
  </div>`;
}

/* =====================================================================
   LEFT / RIGHT ASYMMETRY, measured rather than asserted

   Every set of a one-limb-at-a-time movement is already attributable to a side: the
   entry stores `startSide` and sideForSet() alternates from there, so set 1 is the
   opening side, set 2 the other, set 3 the opener again. Nothing was reading it.

   THE PARITY PROBLEM, which is the whole reason this is more than an average.

   With 3 sets at RPE 7,8,9 the opening side gets positions 1 and 3 and the other side
   gets position 2. Those positions are not equivalent: position 1 is the freshest set
   of the exercise and position 3 the most fatigued. startSideFor() flips the opener
   every session, so across a PAIR of sessions each side has had positions 1, 2 and 3
   exactly once and the fatigue mix is identical. Across an ODD number of sessions it
   is not: one side is still carrying an extra fresh set, or an extra fatigued one,
   that has not been offset yet.

   On a gap of a few tenths of a rep that would not matter. On the kind of gap this rule
   exists to catch — one arm doing 15 reps where the other does 6 — being wrong by "one
   extra fresh set" is enough to make a closing gap look open or an open one look
   closed, and the four-week re-test decides whether to keep training both sides to the
   weaker one. So the
   comparison runs on a BALANCED WINDOW: the largest run of recent sessions in which
   the number that opened right equals the number that opened left.

   Balanced, not merely even, because the flip derives from a session count that a
   deleted or resumed session can repeat, so R,L,R,L is the intent and not a guarantee.
   ===================================================================== */
let ASYM_CACHE = {key:null, data:{}};
function asymCacheKey(){
  const last = S.sessions[S.sessions.length-1] || {};
  return S.sessions.length + ":" + (last.id||"") + ":" + (last.edited||0);
}
// Every logged appearance of a one-limb movement, newest first, with its opening side.
function sideHistory(exName){
  const k = nrm(exName);
  const out = [];
  for(let i=S.sessions.length-1; i>=0; i--){
    const s = S.sessions[i];
    (s.entries||[]).forEach(en=>{
      if(nrm(en.name) !== k) return;
      if(!en.startSide) return;                 // logged before sides were tracked
      const sets = (en.sets||[]).filter(isWorkingSet);
      if(!sets.length) return;
      out.push({date:s.date, at:s.startedAt, startSide:en.startSide, entry:en, sets});
    });
  }
  return out;
}
/* The largest RECENT run whose opening sides balance. Walks newest-first and remembers
   the last point at which the two counts were equal; everything older than that is
   dropped, because including it would reintroduce exactly the bias this removes. */
function balancedWindow(hist){
  let r = 0, l = 0, cut = 0;
  for(let i=0; i<hist.length; i++){
    if(hist[i].startSide === "R") r++; else l++;
    if(r === l) cut = i + 1;                    // balanced as of here
  }
  return {window: hist.slice(0, cut), dropped: hist.length - cut, openedR: cut/2, openedL: cut/2};
}
function sideStats(exName){
  const key = asymCacheKey();
  if(ASYM_CACHE.key !== key){ ASYM_CACHE = {key, data:{}}; }
  const ck = nrm(exName);
  if(ck in ASYM_CACHE.data) return ASYM_CACHE.data[ck];

  const hist = sideHistory(exName);
  const bal = balancedWindow(hist);
  const acc = {R:{reps:[], loads:[]}, L:{reps:[], loads:[]}};
  bal.window.forEach(h=>{
    h.entry.sets.forEach((st, i)=>{
      if(!isWorkingSet(st)) return;
      const side = sideForSet(h.startSide, i);
      if(!side || !acc[side]) return;
      const reps = parseFloat(st.reps)||0;
      const w = parseFloat(st.weight)||0;
      if(reps > 0) acc[side].reps.push(reps);
      if(w > 0) acc[side].loads.push(w);
    });
  });
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const R = {reps: avg(acc.R.reps), load: avg(acc.R.loads), sets: acc.R.reps.length};
  const L = {reps: avg(acc.L.reps), load: avg(acc.L.loads), sets: acc.L.reps.length};

  let out;
  if(!bal.window.length || R.reps == null || L.reps == null){
    out = {
      ok:false, sessions: hist.length, balanced: bal.window.length,
      reason: hist.length
        ? (bal.window.length
            ? "not enough logged sets on both sides yet"
            : "only "+hist.length+" session"+(hist.length===1?"":"s")+" logged, and the opening side has not flipped yet")
        : "no sides logged for this movement yet"
    };
  } else {
    const gap = R.reps - L.reps;                 // positive means the right is ahead
    out = {
      ok:true,
      sessions: hist.length,
      balanced: bal.window.length,               // sessions actually compared
      dropped: bal.dropped,                      // trimmed to keep the window balanced
      R, L,
      gap: Math.abs(gap),
      weaker: Math.abs(gap) < 0.05 ? null : (gap > 0 ? "L" : "R"),
      stronger: Math.abs(gap) < 0.05 ? null : (gap > 0 ? "R" : "L"),
      // two sessions is the minimum that can cancel the positional bias at all
      confident: bal.window.length >= 2
    };
  }
  ASYM_CACHE.data[ck] = out;
  return out;
}
function sideWordFull(s){ return s === "L" ? "left" : "right"; }
// The gap in words, with the sample it rests on, so the number is never bare.
function asymGapText(st){
  if(!st.ok) return st.reason;
  if(!st.weaker) return "Both sides level at about "+r1(st.R.reps)+" reps.";
  const w = st.weaker === "L" ? st.L : st.R;
  const s = st.weaker === "L" ? st.R : st.L;
  return "Your "+sideWordFull(st.weaker)+" is "+r1(st.gap)+" rep"+(r1(st.gap)===1?"":"s")+
    " behind: "+sideWordFull(st.stronger)+" "+r1(s.reps)+", "+sideWordFull(st.weaker)+" "+r1(w.reps)+".";
}
function asymSampleText(st){
  if(!st.ok) return "";
  const n = st.balanced;
  return n + " balanced session" + (n===1?"":"s") +
    (st.dropped ? ", oldest " + st.dropped + " dropped to keep the opening sides even" : "") +
    (st.confident ? "" : " — too few to cancel the fresh-set bias, treat as provisional");
}
// A movement retires from the rule individually once its own gap has closed.
function asymRetiredFor(exName){
  return !!(S.asymRetired && S.asymRetired[nrm(exName)]);
}
function asymActiveFor(e){
  if(altStyle(e) !== "side") return false;
  if(asymRetiredFor(e.name)) return false;
  /* Once the re-test has run, the four-week clock stops being the authority. Anything
     it did not retire is a movement whose gap it measured and found still open, so the
     rule continues on that movement until the gap actually closes. Falling back to the
     clock here was a bug: it switched the rule off for Preacher Curl at week four with
     a measured nine-rep gap, which is precisely the case it exists for. */
  if(S.asymRetest && S.asymRetest.at) return true;
  if(asymActive()) return true;                      // still inside the initial window
  /* Window over but the re-test not yet acknowledged. The rule holds until you have
     actually seen the numbers, otherwise it lapses silently on the day the clock runs
     out and you would go back to training both sides to their own limit without ever
     being told whether the gap had closed. */
  return asymRetestDue();
}
const ASYM_CLOSED_GAP = 2;      // "within 2 reps" retires the rule, per the plan
function unilateralInPlan(){
  const out = [], seen = new Set();
  DAYS.forEach(d=>(S.program[d]||[]).forEach(e=>{
    if(altStyle(e) !== "side") return;
    const k = nrm(e.name);
    if(seen.has(k)) return;
    seen.add(k); out.push(e);
  }));
  return out;
}
/* The four-week re-test. Due once the rule's window is up; reports each movement's
   measured gap and retires the rule on the ones now inside 2 reps. */
function asymRetestDue(){
  if(asymActive()) return false;                       // still inside the four weeks
  if(S.asymRetest && S.asymRetest.at){
    /* Already run once. It comes back only when there is something good to report:
       a movement it kept the rule on has since closed to within the threshold on a
       balanced reading. That makes it self-maintaining without nagging, because it
       cannot reappear while nothing has changed. */
    return unilateralInPlan().some(e=>{
      if(asymRetiredFor(e.name)) return false;
      const st = sideStats(e.name);
      return st.ok && st.confident && st.gap <= ASYM_CLOSED_GAP;
    });
  }
  return unilateralInPlan().some(e=>sideStats(e.name).ok);
}
function asymRetestHTML(){
  if(!asymRetestDue()) return "";
  const rows = unilateralInPlan().map(e=>({e, st: sideStats(e.name)}));
  return `<div class="card asym-card">
    <div class="fc-k" style="color:var(--arms)">Four-week asymmetry re-test</div>
    <div class="fc-do">The rep-matching rule has run its four weeks. Here is where each side actually sits.</div>
    ${rows.map(({e, st})=>`<div class="asym-row">
      <b>${esc(e.name)}</b>
      <div class="asym-gap">${esc(asymGapText(st))}</div>
      ${st.ok ? `<div class="asym-sample">${esc(asymSampleText(st))}</div>` : ""}
      ${st.ok ? `<div class="asym-verdict ${st.gap <= ASYM_CLOSED_GAP ? "ok" : "keep"}">${
        st.gap <= ASYM_CLOSED_GAP
          ? "Inside "+ASYM_CLOSED_GAP+" reps &mdash; rule retires for this movement"
          : "Still outside "+ASYM_CLOSED_GAP+" reps &mdash; keep matching the weaker side"
      }</div>` : ""}
    </div>`).join("")}
    <button class="fc-btn" id="asymRetestBtn">Apply and close the re-test</button>
  </div>`;
}
function applyAsymRetest(){
  if(!S.asymRetired || typeof S.asymRetired !== "object") S.asymRetired = {};
  const kept = [], retired = [];
  unilateralInPlan().forEach(e=>{
    const st = sideStats(e.name);
    if(!st.ok) return;
    // never retire on a provisional reading: an unbalanced window is exactly the case
    // where a gap can look closed when it is not
    if(st.confident && st.gap <= ASYM_CLOSED_GAP){
      S.asymRetired[nrm(e.name)] = true;
      retired.push(e.name);
    } else kept.push(e.name);
  });
  S.asymRetest = {at: Date.now(), retired, kept};
  logPlanChange("rule", null, "Asymmetry rule re-test", [
    retired.length ? "Retired on: "+retired.join(", ") : "Nothing retired yet",
    kept.length ? "Still matching the weaker side on: "+kept.join(", ") : "All movements are level"
  ], {note:"Gaps measured on balanced windows only, so positional bias from the opening-side flip is cancelled."});
  save(); queueSync();
  return {retired, kept};
}

/* =====================================================================
   SUPERSET PAIRS, labelled on both halves

   Only the FIRST movement of a pair carries the `superset` flag, and that is correct:
   the flag suppresses the rest timer, drops the movement from rest-discipline grading
   and removes its rest from the session-length estimate, and all three of those are
   true of the first movement only, because the rest genuinely happens after the second.

   But a bare "superset" badge on one exercise, with no mention of the other, is close
   to useless standing in the gym: it tells you a rule applies without telling you what
   it applies to. Both halves are therefore labelled, with the pairing named and the
   rest behaviour spelled out, while the functional flag stays exactly where it was.  */
function supersetInfo(list, i){
  const cur = list && list[i];
  if(!cur) return null;
  if(cur.superset){
    const next = list[i+1];
    return {role:"first", partner: next ? next.name : null};
  }
  const prev = list[i-1];
  if(prev && prev.superset) return {role:"second", partner: prev.name};
  return null;
}
function supersetBadge(info){
  if(!info) return "";
  return ` <span class="ss-badge${info.role==="second"?" ss-b":""}">superset ${
    info.role==="first" ? "1/2" : "2/2"}</span>`;
}
function supersetNoteHTML(info){
  if(!info || !info.partner) return "";
  return `<div class="ss-note">${info.role === "first"
    ? `Straight into <b>${esc(info.partner)}</b> with no rest, then rest.`
    : `Comes straight after <b>${esc(info.partner)}</b>. Rest after this one.`}</div>`;
}

/* =====================================================================
   SUPERSET ROUNDS

   A superset is performed round by round: one set of A, one set of B, rest, repeat.
   Rendering it as two separate exercise cards described the pairing accurately and
   showed you the wrong shape — you read three sets of lateral raise stacked together
   and did them that way.

   So a pair renders as ONE card of rounds. The inputs inside are byte-identical to the
   ones the flat view emits, same data-e / data-s identity, so every handler already
   bound to them (the change handler, the tick, PR badges, markPriorDone) keeps working
   untouched. Only the layout moved.

   UNEVEN PAIRS ARE NORMAL and are not an error to hide: Legs A runs 3 calf raises
   against 2 ab crunches, Legs B runs 2 reverse hypers against 4 seated calf raises.
   A round where one movement has run out shows the movement greyed with "no set this
   round" rather than silently vanishing, because a missing row reads as a bug.
   ===================================================================== */

/* One set row. Extracted so the flat view and the round view cannot drift apart:
   there is exactly one definition of what a loggable set looks like. */
function setRowHTML(en, ei, si, last, idxLabel){
  const st = en.sets[si];
  if(!st) return "";
  const idx = (idxLabel != null) ? idxLabel : (si + 1);
  return `<div class="set${st.pr?" is-pr":""}">
    <span class="idx">${idx}${sideChip(en, si)}</span>
    <input inputmode="decimal" data-e="${ei}" data-s="${si}" data-f="weight" value="${st.weight??""}" placeholder="${last&&last[si]&&last[si].weight!=null&&last[si].weight!==""?last[si].weight:"lbs"}">
    <input inputmode="numeric" data-e="${ei}" data-s="${si}" data-f="reps" value="${st.reps??""}" placeholder="${last&&last[si]&&last[si].reps?last[si].reps:"reps"}">
    <span class="rpe-cell">${rpeTargetChipHTML(en, si)}<select data-e="${ei}" data-s="${si}" data-f="rpe">${rpeOptions(st.rpe)}</select></span>
    <button class="chk ${st.done?"on":""}" data-e="${ei}" data-s="${si}" data-f="done">✓</button>
  </div>${prBadgeRow(st, ei, si)}`;
}

/* Does ticking this set END a round, and therefore start the rest clock?

   The second movement of a pair always ends its round. The FIRST movement ends the
   round only when its partner has no set left at that index, which is exactly the
   uneven-pair case: on Legs A the third calf raise has no ab crunch after it, so the
   rest has to start there or the clock never runs for that round at all. */
function endsRound(entries, ei, si){
  const info = supersetInfo(entries, ei);
  if(!info) return true;                       // not in a pair, normal behaviour
  if(info.role === "second") return true;
  const partner = entries[ei + 1];
  return !(partner && partner.sets && partner.sets[si]);
}
function supersetRounds(a, i){
  const A = a.entries[i], B = a.entries[i+1];
  return Math.max(A ? A.sets.length : 0, B ? B.sets.length : 0);
}
/* The whole pair as one card of rounds. */
function supersetGroupHTML(a, i, tips, tipsSeen){
  const pair = [{en: a.entries[i], ei: i}, {en: a.entries[i+1], ei: i+1}];
  const rounds = supersetRounds(a, i);
  const isLastPairInSession = (i + 1) === a.entries.length - 1;

  const meta = pair.map(p=>{
    const occ = occIndex(a.entries, p.ei);
    const anyDay = p.en.fin || sharedAcrossDays(p.en.name);
    return {
      last: lastSetsFor(a.workoutId, p.en.name, anyDay, occ),
      box:  lastBox(a.workoutId, p.en.name, anyDay, occ),
      ctx:  {workoutId: a.workoutId, anyDay, occ}
    };
  });

  let h = `<div class="card ex ss-group">
    <div class="ss-hdr">
      <span class="ss-hdr-t">Superset &middot; ${rounds} round${rounds===1?"":"s"}</span>
      <span class="ss-hdr-n">one set of each, back to back</span>
    </div>`;

  // What the two movements are, once, with their targets and last-time numbers.
  pair.forEach((p, k)=>{
    h += `<div class="ss-leg">
      <div class="ss-leg-h">
        <b>${esc(p.en.name)}</b>
        <span class="ex-target">${p.en.sets.length}×${esc(p.en.reps||"")}</span>
        <span class="icon-btns ex-ctl">
          <button data-addset="${p.ei}" aria-label="Add a set to ${esc(p.en.name)}">+</button>
          <button data-rmset="${p.ei}" aria-label="Remove a set from ${esc(p.en.name)}">−</button>
          <button data-exskip="${p.ei}" aria-label="Skip ${esc(p.en.name)} today">✕</button>
        </span>
      </div>
      ${p.en.note?`<div class="ex-note">${esc(p.en.note)}</div>`:""}
      ${p.en.warm ? warmupHTML(p.en, p.en.warm, meta[k].ctx) : ""}
      ${meta[k].box || ""}
      ${inlineTipHTML(tips[nrm(p.en.name)], tipsSeen)}
      ${p.en.startSide ? altHintHTML(p.en.altStyle||"side", p.en.startSide, p.en.sets.length) : ""}
      ${asymHintHTML(p.en)}
    </div>`;
  });

  for(let r = 0; r < rounds; r++){
    const done = pair.every(p => !p.en.sets[r] || p.en.sets[r].done);
    h += `<div class="ss-round${done?" done":""}">
      <div class="ss-round-h"><span>Round ${r+1}</span><span class="ss-round-of">of ${rounds}</span></div>`;
    pair.forEach((p, k)=>{
      if(!p.en.sets[r]){
        h += `<div class="ss-mv ss-mv-off">${esc(p.en.name)}
          <span class="ss-mv-none">no set this round</span></div>`;
        return;
      }
      h += `<div class="ss-mv">${esc(p.en.name)}</div>`;
      h += setRowHTML(p.en, p.ei, r, meta[k].last, "");
    });
    // the rest belongs to the round, not to either movement
    const lastRound = r === rounds - 1;
    h += `<div class="ss-rest">${
      lastRound && isLastPairInSession
        ? "Last round of the session, no rest needed"
        : "Rest after this round"
    }</div></div>`;
  }
  return h + `</div>`;
}

/* ---------- cycle review ---------- */
function cycleSummary(start, end){
  const sess = S.sessions.filter(s=>s.startedAt>=start && s.startedAt<=end);
  let vol = 0, durTotal = 0, durN = 0, feelTotal = 0, feelN = 0, totalReps = 0, totalSets = 0;
  let heaviest = null;               // {name, w, reps}, single heaviest load touched
  const perDay = {}, exTop = {}, exVol = {};
  sess.forEach(s=>{
    perDay[s.workoutId] = (perDay[s.workoutId]||0)+1;
    if(s.startedAt && s.finishedAt && s.finishedAt>s.startedAt){ durTotal += (s.finishedAt-s.startedAt); durN++; }
    if(s.feel){ feelTotal += s.feel; feelN++; }
    s.entries.forEach(e=>{
      e.sets.forEach(st=>{
        const w = parseFloat(st.weight)||0, reps = parseFloat(st.reps)||0;
        vol += w*reps;
        if(reps>0){ totalSets++; totalReps += reps; }
        exVol[e.name] = (exVol[e.name]||0) + w*reps;
        if(w>0 && (!heaviest || w>heaviest.w)) heaviest = {name:e.name, w, reps};
      });
      const t = e.sets.reduce((b,st)=>{
        const w = parseFloat(st.weight)||0;
        return b==null||w>b ? w : b;
      }, null);
      if(t!=null) exTop[e.name] = Math.max(exTop[e.name]||0, t);
    });
  });
  const avgDurMin = durN ? Math.round(durTotal/durN/60000) : null;
  const avgFeel = feelN ? Math.round(feelTotal/feelN*10)/10 : null;
  // most-worked movement by total volume
  let topVolEx = null;
  Object.keys(exVol).forEach(name=>{ if(exVol[name]>0 && (!topVolEx || exVol[name]>topVolEx.vol)) topVolEx = {name, vol:exVol[name]}; });
  // rest days that fall inside this cycle's window
  const restCount = (S.restLog||[]).filter(d=>{
    const ms = new Date(d+"T12:00:00").getTime();
    return ms>=start && ms<=end;
  }).length;
  return {vol:Math.round(vol), n:sess.length, perDay, exTop, avgDurMin, avgFeel, totalReps, totalSets, heaviest, topVolEx, restCount};
}
function buildCycleReview(){
  const now = Date.now();
  const cur = cycleSummary(S.cycleStart, now);
  const prev = S.lastCycle ? cycleSummary(S.lastCycle.start, S.lastCycle.end) : null;
  const moved = [], stalled = [];
  if(prev){
    Object.keys(cur.exTop).forEach(name=>{
      if(!(name in prev.exTop)) return;
      const d = cur.exTop[name] - prev.exTop[name];
      if(d > 0) moved.push({name, from:prev.exTop[name], to:cur.exTop[name]});
      else if(d === 0 && cur.exTop[name] > 0) stalled.push({name, w:cur.exTop[name]});
    });
  }
  return {cur, prevVol: prev?prev.vol:null, moved:moved.slice(0,6), stalled:stalled.slice(0,6), when:now};
}
// Router: full-screen "Wrapped" slideshow by default; plain modal when motion is reduced.
function openCycleReview(r){
  if(!r || !r.cur) return;
  if(reducedMotion()) openCycleReviewSimple(r);
  else openCycleWrapped(r);
}
function openCycleReviewSimple(r){
  if(!r || !r.cur) return;
  const pct = (r.prevVol && r.prevVol>0) ? Math.round((r.cur.vol - r.prevVol)/r.prevVol*100) : null;
  const dayLine = Object.keys(r.cur.perDay||{}).filter(k=>r.cur.perDay[k]).map(k=>dayName(k)+" ×"+r.cur.perDay[k]).join(" · ");
  let h = `<h3>Cycle review</h3>
  <div class="rev-stat"><span class="num" style="font-size:26px;font-weight:600">${r.cur.vol.toLocaleString()} lb</span> total volume
    ${pct!=null?`<span class="num" style="color:${pct>=0?"var(--ok)":"var(--bad)"};margin-left:8px">${pct>=0?"+":""}${pct}% vs last cycle</span>`:""}</div>
  <div class="rev-stat">${r.cur.n} workouts, ${esc(dayLine)}</div>
  ${r.cur.avgDurMin?`<div class="rev-stat">Average workout: <span class="num">${r.cur.avgDurMin} min</span></div>`:""}
  ${r.cur.avgFeel?`<div class="rev-stat">Average feel: ${FEELS[Math.min(4,Math.max(0,Math.round(r.cur.avgFeel)-1))]} <span class="num">${r.cur.avgFeel}/5</span></div>`:""}`;
  if(r.moved.length){
    h += `<div class="rev-head">Moved up</div>`;
    r.moved.forEach(m=>{ h += `<div class="rev-line"><b>${esc(m.name)}</b><span class="num">${m.from} → ${m.to} lb</span></div>`; });
  }
  if(r.stalled.length){
    h += `<div class="rev-head">Held steady</div>`;
    r.stalled.forEach(m=>{ h += `<div class="rev-line"><b>${esc(m.name)}</b><span class="num">${m.w} lb</span></div>`; });
  }
  if(!r.moved.length && !r.stalled.length && r.prevVol==null){
    h += `<div class="sub" style="margin-top:10px">First full cycle logged, from the next one on, this review compares against it.</div>`;
  }
  h += `<button class="btn" style="margin-top:16px" id="closeModal">Done</button>`;
  showModal(h);
}

/* ---------- cycle review, "Wrapped" slideshow ---------- */
function wrCountUp(el, target, dur){
  if(!el) return;
  const raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window) : (cb=>setTimeout(()=>cb(Date.now()),16));
  dur = dur || 1400;
  let t0 = null;
  const tick = now=>{
    if(!el.isConnected) return;
    if(t0===null) t0 = now;
    const p = Math.min(1,(now-t0)/dur);
    const eased = 1-Math.pow(1-p,3);
    el.textContent = Math.round(target*eased).toLocaleString();
    if(p<1) raf(tick);
  };
  raf(tick);
}
function buildWrappedSlides(r){

  slides.push({

      <div class="wr-big"><span id="wrN">0</span></div>

      onShow:st=>wrCountUp(st.querySelector("#wrReps"), cur.totalReps||0, 1600)
    });

  // 5, heaviest load

        <div class="wr-big"><span id="wrHv">0</span></div>
        <div class="wr-unit">lb</div>
        <div class="wr-sub">on <b>${esc(cur.heaviest.name)}</b>${cur.heaviest.reps?`, for ${cur.heaviest.reps} reps`:""}. 💪</div>`,
      onShow:st=>wrCountUp(st.querySelector("#wrHv"), cur.heaviest.w||0, 1200)
    });

  // 8, feel + duration + rest
  if(cur.avgFeel || cur.avgDurMin || cur.restCount){
    const feelEmoji = cur.avgFeel ? FEELS[Math.min(4,Math.max(0,Math.round(cur.avgFeel)-1))] : "";
    let sub = "";
    if(cur.avgDurMin) sub = `Average session ran about <b>${cur.avgDurMin} minutes</b>${cur.restCount?`, with <b>${cur.restCount}</b> rest day${cur.restCount>1?"s":""} to recover`:""}.`;
    else if(cur.restCount) sub = `<b>${cur.restCount}</b> rest day${cur.restCount>1?"s":""} taken to recover.`;
    slides.push({
      bg:"linear-gradient(160deg,#3a2e00,#e8b62c)",
      html:`<div class="wr-kicker">How it felt</div>
        ${cur.avgFeel?`<div class="wr-emoji">${feelEmoji}</div><div class="wr-unit" style="margin-top:10px">${cur.avgFeel} / 5 on average</div>`:`<div class="wr-hero">Recovery<br>counts too</div>`}
        ${sub?`<div class="wr-sub">${sub}</div>`:""}`
    });
  }
  // 9, outro
  slides.push({
    bg:"linear-gradient(160deg,#46a85c,#4a82e0 52%,#e05248)",
    html:`<div class="wr-emoji">🔁</div>
      <div class="wr-hero" style="margin-top:10px">Onto the<br>next cycle</div>
      <div class="wr-sub">Fresh slate, same iron. Go get it.</div>
      <div class="wr-done"><button id="wrDone">Let's go</button></div>`,
    onShow:st=>{ const b = st.querySelector("#wrDone"); if(b) b.onclick = ()=>{ const w=document.getElementById("wrapped"); if(w && !w.classList.contains("out")){ w.classList.add("out"); setTimeout(()=>w.remove(),420); } }; }
  });
  return slides;
}
function openCycleWrapped(r){
  if(!r || !r.cur){ return; }
  const slides = buildWrappedSlides(r);
  if(slides.length < 2){ openCycleReviewSimple(r); return; }
  const old = document.getElementById("wrapped"); if(old) old.remove();
  const el = document.createElement("div");
  el.id = "wrapped";
  el.innerHTML = `
    <div class="wr-bg"></div>
    <div class="wr-bars">${slides.map((s,i)=>`<div class="wr-bar" data-b="${i}"><i></i></div>`).join("")}</div>
    <div class="wr-top"><span class="wr-brand">Iron Log · Wrapped</span><button class="wr-x" aria-label="Close">✕</button></div>
    <div class="wr-stage"></div>
    <div class="wr-nav"><div class="wr-prev" aria-label="Previous"></div><div class="wr-next" aria-label="Next"></div></div>`;
  document.body.appendChild(el);
  const stage = el.querySelector(".wr-stage");
  const bg = el.querySelector(".wr-bg");
  const nav = el.querySelector(".wr-nav");
  const DUR = 5200;
  let idx = 0, timer = null;
  const close = ()=>{
    if(el.classList.contains("out")) return;
    clearTimeout(timer);
    el.classList.add("out");
    setTimeout(()=>el.remove(), 420);
  };
  const show = i=>{
    idx = Math.max(0, Math.min(i, slides.length-1));
    clearTimeout(timer);
    const sl = slides[idx];
    bg.style.background = sl.bg;
    stage.innerHTML = `<div class="wr-slide">${sl.html}</div>`;
    // story-style progress bars
    el.querySelectorAll(".wr-bar").forEach((b,j)=>{
      b.classList.remove("active","done");
      const fi = b.querySelector("i");
      fi.style.animation = "none";
      if(j<idx){ b.classList.add("done"); fi.style.width = "100%"; }
      else { fi.style.width = "0"; }
    });
    const active = el.querySelector(`.wr-bar[data-b="${idx}"]`);
    if(active){
      active.style.setProperty("--wrdur", DUR+"ms");
      const fi = active.querySelector("i");
      void fi.offsetWidth;              // reflow so the fill animation restarts
      fi.style.animation = "";
      fi.style.width = "";
      active.classList.add("active");
    }
    // last slide has an actual button → don't let the tap-nav overlay eat the click
    nav.style.display = (idx===slides.length-1) ? "none" : "flex";
    if(sl.onShow) sl.onShow(stage);
    if(idx < slides.length-1) timer = setTimeout(()=>show(idx+1), DUR);
  };
  const next = ()=>{ if(idx < slides.length-1) show(idx+1); else close(); };
  const prev = ()=>{ show(idx-1); };
  el.querySelector(".wr-x").onclick = close;
  el.querySelector(".wr-next").onclick = next;
  el.querySelector(".wr-prev").onclick = prev;
  let sx = null;
  el.addEventListener("touchstart", e=>{ sx = e.touches[0].clientX; }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(sx==null) return;
    const dx = e.changedTouches[0].clientX - sx;
    sx = null;
    if(Math.abs(dx) > 55){ dx<0 ? next() : prev(); }
  });
  show(0);
}

/* A real in-app confirmation instead of the OS `confirm()` box, it can carry the
   formatting and the "why" that a native dialog can't, and it doesn't get suppressed
   by "prevent this page from creating more dialogs" after a few taps. */
function askConfirm(opts){
  return new Promise(resolve=>{
    let settled = false;
    const done = v=>{
      if(settled) return;
      settled = true;
      MODAL_DISMISS = null;
      $("#modalBg").classList.remove("show");
      resolve(v);
    };
    $("#modal").innerHTML = `<h3>${esc(opts.title||"Are you sure?")}</h3>
      <p style="color:var(--text);font-size:15px;line-height:1.5">${opts.body||""}</p>
      ${opts.meta?`<div class="sub num" style="margin:10px 0 0;font-size:12px;color:var(--faint)">${opts.meta}</div>`:""}
      <div class="btn-row" style="margin-top:18px">
        <button class="btn small" id="askYes" style="flex:1">${esc(opts.yes||"Yes")}</button>
      </div>
      <div class="btn-row"><button class="btn ghost small" id="askNo" style="flex:1">${esc(opts.no||"Cancel")}</button></div>`;
    $("#modal").scrollTop = 0;
    $("#modalBg").classList.add("show");
    $("#askYes").onclick = ()=>done(true);
    $("#askNo").onclick = ()=>done(false);
    MODAL_DISMISS = ()=>done(false);   // tapping the backdrop = "no"
  });
}

async function gistFetch(path, opts={}){
  const res = await fetch("https://api.github.com/"+path, {
    ...opts,
    headers: {
      "Accept":"application/vnd.github+json",
      "Authorization":"Bearer "+S.sync.token,
      ...(opts.headers||{})
    }
  });
  if(!res.ok){
    let msg = res.status+"";
    try{ msg += " "+(await res.json()).message; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}

    blockStart:S.blockStart||null, planStart:S.planStart||null, wakeTime:S.wakeTime||null, sleepTarget:S.sleepTarget||null,
    asymRetired:S.asymRetired||{}, asymRetest:S.asymRetest||null,
    volWindow:S.volWindow||"cycle", askWhy:S.askWhy!==false, deleted:(S.deleted||[]).slice(-500), planLog:(S.planLog||[]).slice(-500), sessions:S.sessions, savedAt:S.savedAt}, null, 1);
}

async function ensureGist(){

function mergeSessions(localArr, remoteArr, tomb){
  const byId = new Map();
  const consider = s=>{
    if(tomb.has(s.id)) return;
    const prev = byId.get(s.id);
    if(!prev){ byId.set(s.id, s); return; }
    // keep the version edited most recently (fall back to finishedAt)
    const t = s.edited || s.finishedAt || 0;
    const pt = prev.edited || prev.finishedAt || 0;
    if(t >= pt) byId.set(s.id, s);
  };
  localArr.forEach(consider);
  remoteArr.forEach(consider);
  return [...byId.values()].sort((a,b)=>a.startedAt-b.startedAt);
}
/* Stall counters are training state, not a log. A union that keeps the HIGHER count
   means a stall detected on your phone is not quietly reset by opening the app on a
   laptop that has not seen those sessions yet. */
function mergeStalls(local, remote){
  const out = Object.assign({}, remote || {});
  Object.keys(local || {}).forEach(k=>{
    const a = local[k], b = out[k];
    out[k] = (!b || (a && (a.n||0) >= (b.n||0))) ? a : b;
  });
  return out;
}
/* The change log is append-only, so merging is a union. Two devices editing the same
   exercise in the same millisecond is the only collision possible, and keeping both
   entries is the honest answer to it. */
function mergePlanLog(localArr, remoteArr){
  const byKey = new Map();
  [...(localArr||[]), ...(remoteArr||[])].forEach(c=>{
    if(!c || !c.at) return;
    byKey.set(c.at+"|"+c.kind+"|"+(c.day||"")+"|"+(c.name||""), c);
  });
  return [...byKey.values()].sort((a,b)=>a.at-b.at).slice(-500);
}
/* A union capped at the allowance, newest kept. A blank must never erase a real rest
   day, and two devices that each spent one should end up with both rather than with
   whichever happened to sync last. Tolerates the old single-object shape on the way in
   so a gist written by v2 still merges. */
function pickRestDay(localRD, remoteRD){
  const norm = v => Array.isArray(v) ? v.slice() : (v && v.date) ? [v.date] : [];
  const all = [...new Set(norm(localRD).concat(norm(remoteRD)))].filter(Boolean).sort();
  return all.slice(-REST_CREDITS);
}
function pruneRestDay(){
  // after the cycle anchor is settled, drop any rest day that predates this cycle
  S.restDays = restDaysThisCycle().filter(d=>{
    const ms = new Date(d+"T12:00:00").getTime();
    return ms >= S.cycleStart - 24*3600e3;
  });
}
function reconcileCycleAfterMerge(remoteCycleStart){
  // adopt the earliest reasonable anchor so no session belonging to the
  // current cycle gets stranded outside the window after a merge
  const inferred = inferCycleStart();
  const candidates = [inferred];
  if(remoteCycleStart) candidates.push(remoteCycleStart);
  if(S.cycleStart) candidates.push(S.cycleStart);
  const floor = (S.lastCycle && S.lastCycle.end) ? S.lastCycle.end + 1 : 0;
  const valid = candidates.filter(c=>c >= floor);
  S.cycleStart = valid.length ? Math.min(...valid) : inferred;
  recomputeCycle(false);
  pruneRestDay();
}
/* An explicit, loud "go and get their data", the one to reach for when a client's
   history isn't showing. Unlike the silent background sync it reports exactly what the
   gist contained, so a wrong ID or an empty gist is obvious instead of looking like a
   bug in the app. */
async function pullFromGist(){
  if(!S.sync.token){ toast("Add your GitHub token first"); return; }
  if(!S.sync.gistId){ toast("Add a gist ID first"); return; }
  setSyncStatus("pending");
  try{
    const g = await gistFetch("gists/"+S.sync.gistId);
    const f = g.files && g.files[GIST_FILE];
    if(!f){
      const names = Object.keys(g.files||{});
      throw new Error("that gist has no "+GIST_FILE+" file in it"+(names.length?" (it contains: "+names.join(", ")+")":", it's empty"));
    }
    let content = f.content;
    if(f.truncated) content = await (await fetch(f.raw_url)).text();
    const remote = JSON.parse(content);
    const nRemote = Array.isArray(remote.sessions) ? remote.sessions.length : 0;
    const nLocal = S.sessions.length;
    if(!nRemote && !nLocal){
      setSyncStatus("ok");
      S.sync.lastError = null; saveQuiet(); render();
      showModal(`<h3>Gist reached, but it's empty</h3>
        <p>The gist opened fine, so the ID and token are right. It just doesn't contain any logged workouts yet.</p>
        <p>If you expected history here, the most likely cause is that this is a <b>different gist</b> from the one their data lives in. Open the gist on github.com and check it has a <span class="num">${GIST_FILE}</span> file with sessions in it.</p>
        <button class="btn" style="margin-top:16px" id="closeModal">OK</button>`);
      return;
    }
    const ok = await askConfirm({
      title: "Load "+profileName()+"'s data?",
      body: `That gist holds <b>${nRemote}</b> logged workout${nRemote===1?"":"s"}.`
        + (nLocal ? ` This device currently has <b>${nLocal}</b> for ${esc(profileName())}. They'll be merged, nothing is deleted.`
                  : ` This profile is empty, so everything will be brought in.`),
      meta: "gist "+S.sync.gistId.slice(0,12)+"…",
      yes: "Load it in",
      no: "Cancel"
    });
    if(!ok){ setSyncStatus("ok"); return; }
    const tomb = new Set([...(S.deleted||[]), ...(remote.deleted||[])]);
    if(remote.program) S.program = remote.program;
    if(remote.splitId) S.splitId = remote.splitId;
    if(remote.customSplit) S.customSplit = remote.customSplit;
    if(remote.profile) S.profile = remote.profile;
    applySplit();
    if(remote.pointer != null) S.pointer = remote.pointer;
    if(remote.lastCycle) S.lastCycle = remote.lastCycle;
    if(remote.lastReview) S.lastReview = remote.lastReview;
    S.checkins = Object.assign({}, S.checkins||{}, remote.checkins||{});
    S.exAliases = Object.assign({}, remote.exAliases||{}, S.exAliases||{});
    S.stalls = mergeStalls(S.stalls, remote.stalls);
    USER_ALIASES = S.exAliases; invalidateTableOrigin();
    S.restDeleted = [...new Set([...(S.restDeleted||[]), ...(remote.restDeleted||[])])];
      S.restLog = [...new Set([...(S.restLog||[]), ...(remote.restLog||[])])]
        .filter(d=>S.restDeleted.indexOf(d) < 0).sort();
    S.planLog = mergePlanLog(S.planLog, remote.planLog);
    S.restDays = pickRestDay(S.restDays, remote.restDays || remote.restDay)
      .filter(d=>(S.restDeleted||[]).indexOf(d) < 0);
    S.deleted = [...tomb];
    S.sessions = mergeSessions(S.sessions, remote.sessions||[], tomb);
    reconcileCycleAfterMerge(remote.cycleStart);
    S.savedAt = Math.max(remote.savedAt||0, S.savedAt||0);
    S.sync.lastSync = Date.now();
    S.sync.lastError = null;
    delete S.fresh;
    migrate();
    saveQuiet();
    syncProfileRecord();
    setSyncStatus("ok");
    TAB = "history";
    document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on", x.dataset.tab==="history"));
    render();
    window.scrollTo(0,0);
    toast(profileName()+" now has "+S.sessions.length+" workouts ✓");
  }catch(err){
    setSyncStatus("err");
    S.sync.lastError = String(err.message||err);
    saveQuiet(); render();
    showModal(`<h3>Couldn't pull that gist</h3>
      <p class="num" style="font-size:13.5px;color:var(--bad)">${esc(S.sync.lastError)}</p>
      <p>${/^404/.test(S.sync.lastError)
        ? "A <b>404</b> means GitHub can't see that gist with this token. Two things to check: the gist ID is the long hex string at the end of the gist's URL (not the username), and the token belongs to the account that owns the gist."
        : /^401/.test(S.sync.lastError)
        ? "A <b>401</b> means the token is invalid or expired. Make a fresh classic token with the <b>gist</b> scope ticked."
        : /^403/.test(S.sync.lastError)
        ? "A <b>403</b> means the token is missing the <b>gist</b> scope, or you've hit GitHub's rate limit. Wait a minute, then check the scope."
        : "Check the gist ID and token, then try again."}</p>
      <button class="btn" style="margin-top:16px" id="closeModal">OK</button>`);
  }
}
async function syncNow(announce){
  if(!S.sync.token || !S.sync.gistId){ if(announce) toast("Connect first"); return; }
  try{
    const g = await gistFetch("gists/"+S.sync.gistId);
    const f = g.files && g.files[GIST_FILE];
    let remote = null;
    if(f){
      let content = f.content;
      if(f.truncated){ content = await (await fetch(f.raw_url)).text(); }
      try{ remote = JSON.parse(content); }catch(e){}
    }
    const before = S.sessions.length;
    /* A profile with no sessions of its own has nothing to defend. Whatever is in the
       gist is the truth, adopt it wholesale. This is what makes "add client, paste
       their gist ID" actually restore them, and it stops a blank default program from
       being pushed over a client's real one. */
    const localIsEmpty = !S.sessions.length && (S.fresh || !S.savedAt);
    if(remote && (remote.savedAt > S.savedAt || localIsEmpty)){
      const tomb = new Set([...(S.deleted||[]), ...(remote.deleted||[])]);
      if(remote.program) S.program = remote.program;
    if(remote.splitId) S.splitId = remote.splitId;
    if(remote.customSplit) S.customSplit = remote.customSplit;
    if(remote.profile) S.profile = remote.profile;
    applySplit();
      if(remote.pointer != null) S.pointer = remote.pointer;
      S.restDays = pickRestDay(S.restDays, remote.restDays || remote.restDay)
      .filter(d=>(S.restDeleted||[]).indexOf(d) < 0);
      if(remote.lastCycle) S.lastCycle = remote.lastCycle;
      if(remote.lastReview) S.lastReview = remote.lastReview;
      S.checkins = Object.assign({}, S.checkins||{}, remote.checkins||{});
      S.exAliases = Object.assign({}, remote.exAliases||{}, S.exAliases||{});
      S.stalls = mergeStalls(S.stalls, remote.stalls);
      USER_ALIASES = S.exAliases; invalidateTableOrigin();
      S.restDeleted = [...new Set([...(S.restDeleted||[]), ...(remote.restDeleted||[])])];
      S.restLog = [...new Set([...(S.restLog||[]), ...(remote.restLog||[])])]
        .filter(d=>S.restDeleted.indexOf(d) < 0).sort();
      S.planLog = mergePlanLog(S.planLog, remote.planLog);
      S.deleted = [...tomb];
      S.sessions = mergeSessions(S.sessions, remote.sessions||[], tomb);
      reconcileCycleAfterMerge(remote.cycleStart);
      S.savedAt = Math.max(remote.savedAt||0, S.savedAt||0);
      delete S.fresh;
      migrate();       // a restored program still needs the alternating-arm notes etc.
      saveQuiet();
    } else if(remote){
      const tomb = new Set([...(S.deleted||[]), ...(remote.deleted||[])]);
      S.checkins = Object.assign({}, remote.checkins||{}, S.checkins||{});
      S.exAliases = Object.assign({}, remote.exAliases||{}, S.exAliases||{});
      S.stalls = mergeStalls(S.stalls, remote.stalls);
      USER_ALIASES = S.exAliases; invalidateTableOrigin();
      S.restDeleted = [...new Set([...(S.restDeleted||[]), ...(remote.restDeleted||[])])];
      S.restLog = [...new Set([...(S.restLog||[]), ...(remote.restLog||[])])]
        .filter(d=>S.restDeleted.indexOf(d) < 0).sort();
      S.planLog = mergePlanLog(S.planLog, remote.planLog);
      S.restDays = pickRestDay(S.restDays, remote.restDays || remote.restDay)
      .filter(d=>(S.restDeleted||[]).indexOf(d) < 0);
      S.deleted = [...tomb];
      S.sessions = mergeSessions(S.sessions, remote.sessions||[], tomb);
      reconcileCycleAfterMerge(remote.cycleStart);
      delete S.fresh;
      saveQuiet();   // keep our own (newer or equal) savedAt
    }
    const pulled = S.sessions.length - before;
    await gistFetch("gists/"+S.sync.gistId, {method:"PATCH", body: JSON.stringify({files:{[GIST_FILE]:{content:payload()}}})});
    S.sync.lastSync = Date.now();
    // we just pushed the current state (with its existing savedAt) to the gist 
    // saveQuiet keeps our savedAt in lock-step with what's in the gist instead of
    // bumping it to now(), which would falsely mark this device as "newer" and cause
    // every subsequent open to re-push and confuse other devices' merge decisions.
    saveQuiet();
    setSyncStatus("ok");
    S.sync.lastError = null;
    /* Always re-render when the sync actually brought data in. Background syncs used to
       skip this, so a client's history would land in storage while the screen you were
       already looking at stayed empty, which reads exactly like "it didn't work". */
    if(pulled !== 0 || TAB==="sync" || announce) render();
    if(pulled > 0) toast("Pulled in "+pulled+" workout"+(pulled===1?"":"s")+" for "+profileName());
    else if(announce) toast("Synced ✓");
  }catch(err){
    setSyncStatus("err");
    S.sync.lastError = String(err.message||err);
    saveQuiet();
    if(TAB==="sync") render();
    toast("Sync failed: "+err.message);
  }
}

/* =====================================================================
   PROGRAM DOCUMENT

   A printable, shareable copy of the whole plan: the rotation, every day's exercises
   with sets, reps, RPE and starting loads, the alternating (⇄) pairs and which one is
   up next, the L/R rules, the finisher, and the volume each muscle group actually
   receives per cycle. It's the thing you hand a coach, print for the gym wall, or keep
   as a record of what the programme was on a given date.

   Built from the LIVE program rather than the defaults, so it always describes what
   you're actually running, including anything you've edited.
   ===================================================================== */
function planExerciseRow(e, wid, opts){
  opts = opts || {};
  const asty = altStyle(e);
  const bits = [];
  if(asty === "side")  bits.push("one limb at a time, alternating L/R each set");
  if(asty === "cross") bits.push("both arms, alternating which crosses on top");
  if(e.note) bits.push(e.note);
  const load = (e.weight != null && e.weight !== "") ? e.weight + " lb" : "bodyweight";
  return `<tr>
    <td><b>${esc(e.name)}</b>${opts.altOf ? `<br><span class="sm">alternates with ${esc(opts.altOf)}</span>` : ""}</td>
    <td class="c">${esc(String(e.sets))}</td>
    <td class="c">${esc(e.reps || "—")}</td>
    <td class="c">${e.rpe ? esc(String(e.rpe)) : "—"}</td>
    <td class="c">${esc(load)}</td>
    <td>${bits.length ? esc(bits.join(" · ")) : ""}</td>
  </tr>`;
}
/* How long a full cycle actually takes you, in days. Needed because the volume
   landmarks are published PER WEEK while the programme is built per cycle, and a cycle
   is nowhere near seven days. Measured from your own history where there is any, and
   falling back to eight, which is seven training days plus the one rest day. */
function typicalCycleDays(){
  const spans = [];
  if(S.lastCycle && S.lastCycle.start && S.lastCycle.end){
    spans.push((S.lastCycle.end - S.lastCycle.start)/DAY_MS);
  }
  /* The current cycle only counts once it is actually complete, and it is measured to
     its LAST SESSION rather than to now. Measuring to now means a finished cycle that
     has been sitting idle for a week reports itself as a fortnight long, which halves
     every per-week figure in the table and turns the whole document into a claim that
     you are undertraining everything. */
  if(S.cycleStart && S.sessions.length){
    const inCycle = S.sessions.filter(s=>s.startedAt >= S.cycleStart);
    if(inCycle.length >= ROTATION.length){
      const last = Math.max.apply(null, inCycle.map(s=>s.startedAt));
      spans.push((last - S.cycleStart)/DAY_MS);
    }
  }
  // seven workouts plus a rest day realistically lands between 5 and 16 days; anything
  // outside that is a gap in the log rather than a cycle length
  const usable = spans.filter(d=>d >= 5 && d <= 16);
  if(!usable.length) return 8;
  return usable.reduce((a,b)=>a+b,0)/usable.length;
}
/* Volume per muscle group across one full pass of the rotation, computed with the same
   attribution the Body tab uses, so the document and the app can never disagree.

   Both units are printed. Comparing a per-CYCLE total against a per-WEEK target would
   overstate everything by roughly 15%, and would have this document telling you that
   you are past what you can recover from on muscles the app calls fine. The verdict
   column is therefore formed on the per-week figure, which is the unit the research
   the targets come from is expressed in. */
function planVolumeTable(){
  const per = {};
  GKEYS.forEach(g=>{ per[g] = 0; });
  ROTATION.forEach(wid=>{
    resolvedProgram(wid).forEach(({chosen:e})=>{
      const mm = musclesFor(e.name);
      if(!mm) return;
      const n = parseInt(e.sets, 10) || 0;
      Object.keys(mm).forEach(g=>{ if(per[g] !== undefined) per[g] += mm[g] * n; });
    });
  });
  const days = typicalCycleDays();
  const toWeek = v => v * 7 / days;
  const rows = GKEYS
    .filter(g => per[g] > 0 || !GROUPS[g].optional)
    .sort((a,b)=> per[b] - per[a])
    .map(g=>{
      const G = GROUPS[g];
      const v = per[g], w = toWeek(v);
      const verdict = v <= 0 ? "nothing trains it"
        : w < G.mev  ? "below the minimum that grows it"
        : w <= G.mav ? "inside the productive range"
        : w <= G.mrv ? "above target, still recoverable"
        : "past what it recovers from";
      return `<tr>
        <td>${esc(G.name)}</td>
        <td class="c">${r1(v)}</td>
        <td class="c">${r1(w)}</td>
        <td class="c">${G.mev} – ${G.mav}</td>
        <td>${esc(verdict)}</td>
      </tr>`;
    }).join("");
  return `<table>
    <thead><tr>
      <th>Muscle group</th><th>Per cycle</th><th>Per week</th><th>Weekly target</th><th>Where that lands</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <p class="meta">Sets are counted with partial credit: a movement pays a full set to the muscle it targets and
  a fraction to each muscle that assists, which is why the totals aren't whole numbers. The per-week column
  assumes a cycle takes about ${Math.round(days)} days${S.lastCycle ? ", measured from your own history" : ""},
  and the verdict is formed on that figure, because the targets are published per week. Targets shown are the
  population figures for an intermediate lifter, before the personal scaling the app applies on the Body tab.</p>`;
}
function buildPlanInner(){

  <hr>`;

      }
    });
    body += `</tbody></table>`;
  });

  const fin = S.program.finisher || [];

      <p class="meta">Runs at the end of every workout, in this order.</p>
      <table>
        <thead><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>RPE</th><th>Start load</th><th>Notes</th></tr></thead>
        <tbody>${fin.map(e=>planExerciseRow(e, "finisher")).join("")}</tbody>
      </table>`;
  }

  body += `<hr><h2>What each muscle gets, per cycle</h2>${planVolumeTable()}`;

  body += `<hr><h2>How to run it</h2>
  <p><b>RPE</b> is how hard a set felt on a 1–10 scale, and what it really measures is how many reps you had
  left. RPE 10 is all out, 9 is one rep left, 8 is two. A target of RPE 8–9 means finishing with about one to
  two reps still in you.</p>
  <p><b>Rest</b> scales with what the set demanded, not one number for everything: three to five minutes for
  heavy work of six reps or fewer, one and a half to three minutes for eight-to-twelve rep work, and
  forty-five seconds to two minutes for high-rep finishing work.</p>
  <p><b>Progression.</b> When every set of an exercise finishes at or above the top of its rep range, add
  weight, roughly 5&nbsp;lb on upper-body movements and 10&nbsp;lb on lower-body ones, and rebuild the reps
  from the bottom of the range. Only one variable has to move for the session to count as progress.</p>
  <p><b>⇄ pairs</b> alternate automatically every other time that day comes round, so both movements keep
  getting trained without lengthening the session.</p>
  <p><b>L/R movements</b> are done one limb at a time, alternating each set, and the side you open with flips
  every session so neither arm is always the fresh one.</p>`;

  return body;
}

/* ---------- formal training report ---------- */
function longDate(d){
  return new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}
function setSentence(st){
  const w = (st.weight!=null && st.weight!=="") ? st.weight+" lb" : "bodyweight";
  let s = w+" × "+(st.reps||"?")+" reps";
  if(st.rpe) s += " at RPE "+st.rpe;
  return s;
}
function joinList(arr){
  if(arr.length<=1) return arr.join("");
  return arr.slice(0,-1).join(", ")+", and "+arr[arr.length-1];
}
function buildReportInner(){
  const sessions = [...S.sessions].sort((a,b)=>a.startedAt-b.startedAt);
  const first = sessions[0], lastS = sessions[sessions.length-1];
  const counts = {};
  sessions.forEach(s=>{ counts[s.workoutId]=(counts[s.workoutId]||0)+1; });
  const countLine = joinList(Object.keys(counts).map(k=>counts[k]+" "+dayName(k).toLowerCase()+" "+(counts[k]===1?"session":"sessions")));

  /* Programme edits, placed in the timeline where they happened rather than collected in
     an appendix. Read top to bottom, the report now says "these sessions, then the card
     changed like this, then these sessions", which is the only ordering in which a
     change in the numbers afterwards can be interpreted. */
  const changes = (S.planLog||[]).slice().sort((a,b)=>a.at-b.at);
  let ci_ = 0;
  const changeBlock = until=>{
    const batch = [];
    while(ci_ < changes.length && changes[ci_].at < until) batch.push(changes[ci_++]);
    if(!batch.length) return "";
    // one block per calendar day, because that is the resolution the rest of the report reads at
    let out = "", day = null, items = [];
    const flush = ()=>{
      if(!items.length) return;
      out += `<div class="planchg"><b>Programme changed, ${longDate(day)}</b>
        <ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
      items = [];
    };
    batch.forEach(c=>{
      if(c.date !== day){ flush(); day = c.date; }
      items.push(planChangeSentence(c));
    });
    flush();
    return out;
  };

  let body = `<h1>Training History Report</h1>
  <p class="meta">Prepared ${new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})} · Iron Log</p>
  <p>This report covers <b>${sessions.length}</b> logged training ${sessions.length===1?"session":"sessions"} from ${longDate(first.date)} through ${longDate(lastS.date)}, comprising ${countLine}.${(S.restLog&&S.restLog.length)?" Rest days taken: "+joinList(S.restLog.slice().sort().map(d=>longDate(d)))+".":""}</p>
  ${changes.length?`<p>The programme was edited <b>${changes.length}</b> time${changes.length===1?"":"s"} over this period. Each edit is shown in place, between the sessions it sits between, so a change in the numbers after one of them can be read against it. Edits made before ${longDate(changes[0].date)} were not recorded.</p>`:""}
  <hr>`;

  sessions.forEach(s=>{
    body += changeBlock(s.startedAt);
    const m = dayMeta(s.workoutId);
    const vol = s.entries.reduce((t,e)=>t+e.sets.reduce((u,st)=>u+((parseFloat(st.weight)||0)*(parseFloat(st.reps)||0)),0),0);
    const dur = durFmt(s);
    const clock = ms => new Date(ms).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    const metaBits = [];
    if(s.startedAt) metaBits.push("Started: "+clock(s.startedAt));
    if(s.finishedAt) metaBits.push("Ended: "+clock(s.finishedAt));
    if(dur) metaBits.push("Duration: "+dur);
    if(s.feel) metaBits.push("Feel: "+FEELS[s.feel-1]+" ("+s.feel+"/5)");
    const ci = (S.checkins||{})[s.date];
    if(ci){
      if(ci.weight) metaBits.push("Bodyweight: "+esc(ci.weight)+" lb");
      if(ci.sleep) metaBits.push("Sleep: "+esc(ci.sleep)+" h");
      if(ci.energy) metaBits.push("Energy: "+esc(ci.energy)+"/10");
    }
    if(s.quality) metaBits.push("Quality score: "+s.quality.total+"/"+s.quality.max+" ("+s.quality.grade.replace("−","-")+")");
    if(s.note) metaBits.push("Note: "+esc(s.note));
    body += `<h2>${longDate(s.date)}, ${m.name} Day</h2>
    ${metaBits.length?`<p class="meta">${metaBits.join(" · ")}</p>`:""}
    <table><thead><tr><th>Exercise</th><th>Set</th><th>Side</th><th>Weight (lb)</th><th>Reps</th><th>RPE</th><th>Rest</th></tr></thead><tbody>`;
    s.entries.forEach(e=>{
      // keep the original index so the L/R attribution stays correct after filtering
      const sets = e.sets.map((st,i)=>({st,i})).filter(x=>x.st.reps||x.st.weight);
      if(!sets.length) return;
      sets.forEach(({st,i}, row)=>{
        const side = e.startSide ? sideForSet(e.startSide, i) : null;
        body += `<tr>${row===0?`<td rowspan="${sets.length}"><b>${esc(e.name)}</b></td>`:""}
          <td class="c">${row+1}</td>
          <td class="c">${side ? esc((e.altStyle==="cross" ? side+" on top" : side)) : " "}</td>
          <td class="c">${st.weight!=null&&st.weight!==""?esc(st.weight):"bodyweight"}</td>
          <td class="c">${esc(st.reps||"")}</td>
          <td class="c">${esc(st.rpe||" ")}</td>
          <td class="c">${st.rest?esc(fmtClock(st.rest)):" "}</td></tr>`;
      });
    });
    body += `</tbody></table>`;
    if(vol>0) body += `<p class="meta">Total working volume: ${Math.round(vol).toLocaleString()} lb.</p>`;
    /* Anything flagged at the time. A coach reading this needs to know that a short set
       was a deliberate stop or a tweak, not a failed rep, and that is exactly the
       context a table of numbers loses. */
    const flags = sessionFlags(s);
    if(flags.length){
      body += `<p class="meta"><b>Noted during the session:</b> ` + flags.map(f=>{
        const r = REASON_BY_CODE[f.code];
        return esc(f.name)+" set "+f.set+", "+esc(r ? r.short : f.code)+(f.note ? " ("+esc(f.note)+")" : "");
      }).join("; ") + `.</p>`;
    }
  });

  body += changeBlock(Infinity);      // anything edited since the last logged session
  return body;
}

/* ---------- repo backup (CSV + JSON committed to the GitHub repo) ---------- */
function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
function fmtSetShort(st){
  const w = (st.weight!=null && st.weight!=="") ? st.weight : "bw";
  let s = w+"×"+(st.reps||"?");
  if(st.rpe) s += " @"+st.rpe;
  return s;
}
function buildCSV(){
  const sessions = [...S.sessions].sort((a,b)=>b.startedAt-a.startedAt);
  let maxSets = 1;
  sessions.forEach(s=>s.entries.forEach(e=>{
    const n = e.sets.filter(st=>st.reps||st.weight).length;
    if(n>maxSets) maxSets = n;
  }));
  const header = ["Exercise"];
  for(let i=1;i<=maxSets;i++) header.push("Set "+i);
  const rows = [header];
  if(S.restLog && S.restLog.length){
    S.restLog.slice().sort().forEach(d=>{
      rows.push([d+", REST DAY", ...Array(Math.max(0,maxSets)).fill("")]);
    });
    rows.push(Array(maxSets+1).fill(""));
  }
  sessions.forEach(s=>{
    rows.push([s.date+", "+dayName(s.workoutId).toUpperCase(), s.note||"", ...Array(Math.max(0,maxSets-1)).fill("")]);
    s.entries.forEach(e=>{
      const sets = e.sets.filter(st=>st.reps||st.weight);
      if(!sets.length) return;
      const row = [e.name];
      for(let i=0;i<maxSets;i++) row.push(sets[i] ? fmtSetShort(sets[i]) : "");
      rows.push(row);
    });
    rows.push(Array(maxSets+1).fill(""));
  });
  return rows.map(r=>r.map(v=>{
    v = String(v==null?"":v);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(",")).join("\n");
}
async function repoPut(path, content, message, branch){
  branch = branch || S.sync.branch || "main";
  for(let attempt=1; attempt<=3; attempt++){
    let sha = null;
    try{
      const cur = await gistFetch("repos/"+S.sync.repo+"/contents/"+encodeURIComponent(path)+"?ref="+branch+"&t="+Date.now());
      sha = cur.sha;
    }catch(e){ /* file doesn't exist yet, first commit */ }
    const body = {message, content: b64(content), branch};
    if(sha) body.sha = sha;
    try{
      await gistFetch("repos/"+S.sync.repo+"/contents/"+encodeURIComponent(path), {method:"PUT", body: JSON.stringify(body)});
      return;
    }catch(err){
      // 409 = another commit landed between our read and write, refetch sha and retry
      if(String(err.message).startsWith("409") && attempt<3){
        await new Promise(r=>setTimeout(r, 900*attempt));
        continue;
      }
      throw err;
    }
  }
}
let repoBusy = false, repoAgain = false;
async function repoBackup(announce){
  if(!S.sync.token || !S.sync.repo){ if(announce) toast("Add your repo in the Sync tab first"); return; }
  if(repoBusy){ repoAgain = true; return; }
  repoBusy = true;
  try{
    // Preflight: confirm the repo is reachable with this token, and learn its REAL
    // default branch. This is what turns the useless bare "404" into a fixable message
    // and quietly recovers from a main/master mismatch.
    let repoInfo;
    try{
      repoInfo = await gistFetch("repos/"+S.sync.repo);
    }catch(e){
      const m = String(e.message);
      if(m.startsWith("404")){
        throw new Error("repo '"+S.sync.repo+"' not visible to this token. Check it's spelled owner/repo, and that your token has the FULL 'repo' scope, a gist-only token gets 404 here, and private repos 404 without it.");
      }
      if(m.startsWith("401")){ throw new Error("token invalid or expired, paste a fresh one above."); }
      if(m.startsWith("403")){ throw new Error("token lacks the 'repo' scope. Regenerate a classic token with the 'repo' box checked."); }
      throw e;
    }
    // Fall back to the repo's actual default branch if the configured one doesn't exist.
    let branch = S.sync.branch || repoInfo.default_branch || "main";
    try{
      await gistFetch("repos/"+S.sync.repo+"/branches/"+encodeURIComponent(branch)+"?t="+Date.now());
    }catch(e){
      if(String(e.message).startsWith("404") && repoInfo.default_branch && repoInfo.default_branch!==branch){
        branch = repoInfo.default_branch;
        S.sync.branch = branch; save();
        if(announce) toast("Branch not found, switched to '"+branch+"'");
      }
    }
    /* One folder per person. These used to be hardcoded at the repo root, so every
       profile pointed at the same repo wrote over the previous one's files, the
       second person to sync silently replaced the first person's log. */
    const stamp = new Date().toLocaleString();
    const paths = repoPaths();
    const who = profileName();
    await repoPut(paths.csv,  buildCSV(), "Workout log, "+who+", "+stamp, branch);
    await repoPut(paths.json, payload(),  "Data backup, "+who+", "+stamp, branch);
    S.sync.lastRepo = Date.now();
    save();
    setSyncStatus("ok");
    if(announce){ toast("Backed up to repo ✓"); if(TAB==="sync") render(); }
  }catch(err){
    setSyncStatus("err");
    toast("Repo backup failed: "+err.message);
  }finally{
    repoBusy = false;
    if(repoAgain){ repoAgain = false; repoBackup(false); }
  }
}

/* ---------- backup ---------- */
function exportJSON(){
  const blob = new Blob([payload()], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ironlog-"+profSlug()+"-"+todayStr()+".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(e){
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d.program || !Array.isArray(d.sessions)) throw new Error("not an Iron Log file");
      S.program = d.program;
      S.pointer = d.pointer||0;
      if(d.cycleStart) S.cycleStart = d.cycleStart;
      if(d.checkins) S.checkins = d.checkins;
      if(Array.isArray(d.restLog)) S.restLog = d.restLog;
      if(Array.isArray(d.planLog)) S.planLog = d.planLog;
      S.sessions = d.sessions;
      recomputeCycle(false);
      save(); queueSync(); render(); toast("Imported ✓");
    }catch(err){ toast("Import failed: "+err.message); }
  };
  r.readAsText(file);
  e.target.value = "";
}

/* ================= BOOT ================= */
(function(){
  const sp = document.getElementById("splash");
  const vEl = sp && sp.querySelector(".splash-ver");
  if(vEl) vEl.textContent = "v"+APP_VERSION;
  if(!sp) return;
  if(reducedMotion()){ sp.remove(); return; }
  const bye = ()=>{
    if(!sp.isConnected || sp.classList.contains("bye")) return;
    sp.classList.add("bye");
    setTimeout(()=>sp.remove(), 480);
  };
  sp.onclick = bye;
  setTimeout(bye, 2450);
})();
/* First run opens the wizard. This sits here, at the end of the script, rather than up
   beside load(): `OB` is a `let` declared with the onboarding code far below, so
   touching it any earlier is a temporal-dead-zone ReferenceError that takes the whole
   app down before it paints. */
if(needsOnboarding()) startOnboarding();
else render();
if(S.active && S.active.restTimer) showRestUI(S.active.restTimer.min);
if(S.sync.token && S.sync.gistId){ setSyncStatus("pending"); syncNow(false); }
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && S.sync.token && S.sync.gistId) syncNow(false);
});
</script>
