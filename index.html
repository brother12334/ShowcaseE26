/* =====================================================================
   MUSCLE MODEL, the data behind the Body tab

   Volume landmarks follow the widely used MEV / MAV / MRV framework
   (Israetel et al.): MEV is roughly the least weekly volume that still grows a
   muscle, MAV the productive middle, MRV the most it can recover from. Numbers are
   HARD SETS PER MUSCLE PER WEEK, which is the unit the research is expressed in.
   `recov` is the hours a normal hard session for that muscle needs before it's back 
   small muscles turn around fast, spinal erectors and quads are the slowest.
   ===================================================================== */
/* ---------------- GROUPS ----------------
   Volume landmarks live HERE, at group level, because that is the only level the
   research supports. MEV is the least weekly hard sets that still grows the muscle,
   MAV the productive range where added sets keep paying off, MRV the most it can
   recover from. Values are hard sets per muscle per week for an INTERMEDIATE lifter,
   and every one gets scaled per person by experience, training frequency, how close to
   failure the sets are, how compound-heavy the work is, and logged recovery.
   See adjustedLandmarks().

   `recov` is the hours a normal hard session for that group needs before it is ready
   again. `optional` groups are drawn and tracked but never flagged as weak points,

const EX_MUSCLES_C = canonIndex(EX_MUSCLES);
function musclesFor(name){
  const k = nrm(name);
  const t = tableKey(name);                       // survives a rename
  if(EX_MUSCLES_C[t]) return EX_MUSCLES_C[t];
  if(EX_MUSCLES_C[k]) return EX_MUSCLES_C[k];
  for(const [re, m] of MUSCLE_KEYWORDS){ if(re.test(k) || re.test(t)) return m; }
  return null;
}
// No RPE logged? Assume a normal hard working set rather than throwing the set away.
function effRpe(st){ const r = parseFloat(st && st.rpe); return r > 0 ? r : 8; }
function isWorkingSet(st){ return (parseFloat(st && st.reps)||0) > 0; }

const DAY_MS = 86400000;
function blankMuscleMap(v){ const o = {}; MKEYS.forEach(k=> o[k] = (typeof v==="function" ? v(k) : v)); return o; }

/* Walk every logged set in a time window and attribute it to muscles. */
function windowStats(from, to){
  const out = blankMuscleMap(()=>({sets:0, vol:0, best:0, lastMs:0, lastSets:0, hardSets:0,
                                   nearFail:0, restN:0, restShort:0, exs:{},
                                   compound:0, rpeSum:0, rpeN:0, dates:{}, days:0, rpeAvg:0}));
  S.sessions.forEach(s=>{
    if(s.startedAt < from || s.startedAt >= to) return;
    s.entries.forEach(e=>{
      const mm = musclesFor(e.name);
      if(!mm) return;
      e.sets.forEach(st=>{
        if(!isWorkingSet(st)) return;
        const reps = parseFloat(st.reps)||0;
        const w = parseFloat(st.weight)||0;
        const rpe = effRpe(st);
        const e1 = w > 0 ? est1RM(w, reps) : reps;   // bodyweight → reps stand in for load
        const tgt = restTargetFor(e, st);
        Object.keys(mm).forEach(m=>{
          const o = out[m];
          if(!o) return;
          const c = mm[m];
          o.sets += c;
          o.vol  += w * reps * c;
          o.exs[e.name] = (o.exs[e.name]||0) + c;
          if(rpe >= 7) o.hardSets += c;
          if(rpe >= 9.5) o.nearFail += c;
          if(mm[m] >= 1 && e1 > o.best) o.best = e1;
          if(st.rest != null){ o.restN += 1; if(st.rest < tgt.warn) o.restShort += 1; }
          if(s.startedAt > o.lastMs){ o.lastMs = s.startedAt; o.lastSets = 0; }
          if(s.startedAt === o.lastMs) o.lastSets += c;
          // inputs the adjusted landmarks need: how often, how hard, how compound
          if(isCompound(e.name)) o.compound += c;
          o.rpeSum += rpe * c; o.rpeN += c;
          o.dates[s.date] = 1;
        });
      });
    });
  });
  MKEYS.forEach(m=>{
    const o = out[m];
    o.days = Object.keys(o.dates).length;
    o.rpeAvg = o.rpeN > 0 ? o.rpeSum/o.rpeN : 0;
  });
  return out;
}
/* Multi-joint lifts carry systemic fatigue that single-joint work does not, which is
   why a compound-heavy week lowers what you can recover from. */
const COMPOUND_RE = /bench|press|row|pulldown|pull[- ]?up|chin|squat|deadlift|rdl|romanian|lunge|dip\b|thrust|leg press|hack|clean|snatch|shrug/i;
const ISOLATION_RE = /fly|flye|raise|curl|extension|kickback|pushdown|press[- ]?down|crunch|calf|abduction|adduction|pullover|prayer/i;
function isCompound(name){
  const k = nrm(name);
  if(ISOLATION_RE.test(k) && !/press|row|squat/.test(k)) return false;
  return COMPOUND_RE.test(k);
}

/* Fatigue, every hard set leaves a residue that decays exponentially with the
   muscle's own recovery half-life, scaled by how close to failure it was. 100 means
   "you've just dumped a full MRV week onto this muscle". */
function fatigueByMuscle(now){
  const raw = blankMuscleMap(0);
  S.sessions.forEach(s=>{
    const hrs = (now - s.startedAt)/3600e3;
    if(hrs < 0 || hrs > 14*24) return;
    s.entries.forEach(e=>{
      const mm = musclesFor(e.name);
      if(!mm) return;
      e.sets.forEach(st=>{
        if(!isWorkingSet(st)) return;
        const rpe = effRpe(st);
        // RPE 6 → 0.55×, RPE 10 → 1.30×, proximity to failure drives fatigue cost
        const intensity = 0.55 + Math.max(0, Math.min(1, (rpe - 6)/4)) * 0.75;
        Object.keys(mm).forEach(m=>{
          if(raw[m] === undefined) return;
          raw[m] += mm[m] * intensity * Math.pow(0.5, hrs / MUSCLES[m].recov);
        });
      });
    });
  });
  return blankMuscleMap(m => Math.max(0, Math.min(100, Math.round(raw[m] / MUSCLES[m].mrv * 100))));
}

/* Sleep and energy don't change per-muscle, but they absolutely change how fast any
   of it comes back, so they shift every muscle's recovery clock together. */
function recoveryModifier(){
  const days = [];
  for(let i=0;i<3;i++){
    const d = new Date(Date.now() - i*DAY_MS).toLocaleDateString("en-CA");
    const ci = (S.checkins||{})[d];
    if(ci) days.push(ci);
  }
  if(!days.length) return {mod:0, why:[]};
  let mod = 0; const why = [];
  const sl = days.map(c=>parseFloat(c.sleep)).filter(x=>x>0);
  if(sl.length){
    const avg = sl.reduce((a,b)=>a+b,0)/sl.length;
    if(avg < 6){ mod -= 18; why.push("averaging "+avg.toFixed(1)+" h sleep, under 6 h measurably blunts recovery"); }
    else if(avg < 7){ mod -= 8; why.push("averaging "+avg.toFixed(1)+" h sleep, a little short of the 7-9 h window"); }
    else if(avg >= 8){ mod += 6; why.push("averaging "+avg.toFixed(1)+" h sleep, recovery is well supported"); }
  }
  const en = days.map(c=>parseFloat(c.energy)).filter(x=>x>0);
  if(en.length){
    const avg = en.reduce((a,b)=>a+b,0)/en.length;
    if(avg <= 4){ mod -= 10; why.push("self-rated energy is low ("+avg.toFixed(1)+"/10)"); }
    else if(avg >= 8){ mod += 4; why.push("self-rated energy is high ("+avg.toFixed(1)+"/10)"); }
  }
  return {mod: Math.max(-25, Math.min(10, mod)), why};
}

/* Recovery, how far through its own recovery window each muscle is. Distinct from
   fatigue: a muscle hammered 6 days ago is fully recovered even if the week's fatigue
   residue is still on the books. Heavier days stretch the window proportionally. */
function recoveryByMuscle(now, wk, modInfo){
  const mod = modInfo.mod;
  return blankMuscleMap(m=>{
    const o = wk[m];
    if(!o || !o.lastMs) return 100;                  // nothing to recover from
    const hrs = (now - o.lastMs)/3600e3;
    const typical = Math.max(2, MUSCLES[m].mav/3);    // a "normal" session's set count
    const load = Math.min(2, Math.max(0.55, (o.lastSets || 1) / typical));
    const need = MUSCLES[m].recov * load;
    return Math.max(0, Math.min(100, Math.round(hrs/need*100 + mod)));
  });
}

/* Growth, is the muscle actually progressing? Compares the last 3 weeks against the
   3 before it on estimated 1RM (the strength signal, weighted 70%) and total volume
   (the stimulus signal, 30%). 50 = holding steady, 100 = ~+12% and climbing fast. */
function growthByMuscle(now){
  const W = 21*DAY_MS;
  const a = windowStats(now - W, now + 1);
  const b = windowStats(now - 2*W, now - W);
  const out = {};
  MKEYS.forEach(m=>{
    if(!a[m].sets){ out[m] = {score:null, note:"not trained in the last 3 weeks"}; return; }
    if(!b[m].sets){ out[m] = {score:55, note:"first block on record, nothing to compare against yet", isNew:true}; return; }
    const strP = b[m].best > 0 ? (a[m].best - b[m].best)/b[m].best : 0;
    const volP = b[m].vol  > 0 ? (a[m].vol  - b[m].vol )/b[m].vol  : 0;
    const raw = strP*0.7 + volP*0.3;
    out[m] = {score: Math.max(0, Math.min(100, Math.round(50 + raw*400))), strP, volP,
              bestNow:a[m].best, bestPrev:b[m].best};
  });
  return out;
}

/* Injury risk, five independent flags, each grounded in something measurable:
     • weekly volume past MRV (the muscle can't recover from what's going in)
     • an acute:chronic workload ratio above ~1.5, the classic spike marker from
       sports-science injury literature
     • high standing fatigue combined with low recovery
     • a large share of sets taken to true failure (RPE 9.5+)
     • heavy sets cut short on rest, so load is being handled pre-recovered            */
function injuryByMuscle(now, wk, fat, rec, lm, win){
  const chronic = windowStats(now - 28*DAY_MS, now + 1);
  const out = {};
  MKEYS.forEach(m=>{
    const M = MUSCLES[m];
    const sets = wk[m].sets;
    // The accumulation window may be a cycle rather than a week, so anything compared
    // against a per-week figure has to be expressed as a per-week rate first.
    const perWeek = sets / (win.scale || 1);
    const MRV = (lm[m] && lm[m].mrv) || M.mrv;
    const flags = [];
    let risk = 0;

    if(sets > MRV){
      const over = Math.min(1, (sets - MRV)/MRV);
      risk += 28*over + 8;
      flags.push({w:Math.round(28*over+8), t:"volume "+win.short+" is past what this muscle recovers from ("+r1(sets)+" sets vs a ceiling of "+r1(MRV)+")"});
    }
    const chronicWk = chronic[m].sets/4;
    if(chronicWk >= 2){
      const acwr = perWeek/chronicWk;
      if(acwr > 1.5){
        const x = Math.min(1, (acwr - 1.5)/1.0);
        risk += 24*x + 6;
        flags.push({w:Math.round(24*x+6), t:"you're running at "+acwr.toFixed(1)+"× your 4-week average, and spikes above 1.5× are the classic injury marker"});
      }
    }
    if(fat[m] >= 55 && rec[m] <= 55){
      const x = Math.min(1, (fat[m]-55)/45) * Math.min(1, (55-rec[m])/55 + .35);
      risk += 22*x;
      if(22*x >= 4) flags.push({w:Math.round(22*x), t:"carrying "+fat[m]+"% fatigue with only "+rec[m]+"% recovery banked"});
    }
    if(wk[m].hardSets > 0){
      const share = wk[m].nearFail/wk[m].hardSets;
      if(share > 0.4){
        const x = Math.min(1, (share-0.4)/0.6);
        risk += 14*x;
        if(14*x >= 3) flags.push({w:Math.round(14*x), t:Math.round(share*100)+"% of sets taken to true failure (RPE 9.5+), connective tissue pays for that"});
      }
    }
    if(wk[m].restN >= 3){
      const share = wk[m].restShort/wk[m].restN;
      if(share > 0.3){
        const x = Math.min(1, (share-0.3)/0.7);
        risk += 12*x;
        if(12*x >= 3) flags.push({w:Math.round(12*x), t:Math.round(share*100)+"% of sets started before the rest that load called for"});
      }
    }
    out[m] = {score: Math.max(0, Math.min(100, Math.round(risk))), flags:flags.sort((a,b)=>b.w-a.w)};
  });
  return out;
}
function r1(n){ return Math.round(n*10)/10; }

/* =====================================================================
   EXPERIENCE LEVEL

   Inferred from your logged history, overridable per person. The inference can only
   see how long you have used THIS APP, which is not the same as your training age, so
   with little history it deliberately assumes intermediate rather than beginner, and
   the Body tab tells you to set it.
   ===================================================================== */
const EXP_LEVELS = ["beginner","intermediate","advanced"];
function inferExperience(){
  if(!S.sessions.length) return "intermediate";
  const weeks = (Date.now() - S.sessions[0].startedAt)/(7*DAY_MS);
  const n = S.sessions.length;
  if(weeks < 8) return "intermediate";                 // too little to judge, assume the middle
  if(weeks < 30 || n < 55) return "beginner";
  if(weeks < 100 || n < 190) return "intermediate";
  return "advanced";
}
function experience(){
  const set = S.experience;
  return (set && set !== "auto" && EXP_LEVELS.indexOf(set) > -1) ? set : inferExperience();
}
function experienceIsAuto(){ return !S.experience || S.experience === "auto"; }

/* =====================================================================
   ADJUSTED VOLUME LANDMARKS

   The base numbers in GROUPS are population figures for an intermediate lifter. Five
   things genuinely move them, and all five are measurable from your own log:

     1. EXPERIENCE   MEV rises with training age. The more adapted you are, the more
                     work it takes to make anything happen, and the more you can
                     recover from.
     2. FREQUENCY    The same weekly volume is easier to recover from split over more
                     sessions than dumped into one, so MRV rises with frequency.
     3. INTENSITY    Sets taken closer to failure do more per set but cost far more
                     fatigue, so a high average RPE raises MEV effectiveness and lowers
                     MRV.
     4. EXERCISE     Compound work costs systemic fatigue that isolation work does not,
        SELECTION    so a compound-heavy week lowers MRV.
     5. RECOVERY     Short sleep and low energy lower what you can recover from. Read
                     straight from your daily check-ins.
   ===================================================================== */
const EXP_SCALE = {
  beginner:     {mev:0.70, mav:0.75, mrv:0.80},
  intermediate: {mev:1.00, mav:1.00, mrv:1.00},
  advanced:     {mev:1.20, mav:1.18, mrv:1.22}
};
function adjustedLandmarks(A, g){
  const G = GROUPS[g];
  const exp = experience();
  const sc = EXP_SCALE[exp] || EXP_SCALE.intermediate;
  let mev = G.mev * sc.mev, mav = G.mav * sc.mav, mrv = G.mrv * sc.mrv;
  const why = [{k:"Experience", v:exp, note:"base numbers scaled for an "+exp+" lifter"}];

  const o = A.wk[g] || {};
  // 2 - frequency: how many separate days this group was trained in the last 7
  const freq = o.days || 0;
  if(freq >= 3){ mrv *= 1.15; mav *= 1.06; why.push({k:"Frequency", v:freq+"x / week", note:"spreading volume over 3+ sessions raises what you can recover from"}); }
  else if(freq === 1 && o.sets > 0){ mrv *= 0.90; why.push({k:"Frequency", v:"1x / week", note:"one big session a week is harder to recover from than the same volume split up"}); }
  else if(freq === 2){ why.push({k:"Frequency", v:"2x / week", note:"a solid default, no adjustment"}); }

  // 3 - intensity: average RPE across this group's sets
  const rpe = o.rpeAvg;
  if(rpe > 0){
    if(rpe >= 9.2){ mrv *= 0.85; mev *= 0.90; why.push({k:"Intensity", v:"RPE "+r1(rpe), note:"training this close to failure does more per set but costs a lot more recovery"}); }
    else if(rpe <= 7.4){ mrv *= 1.10; mev *= 1.15; why.push({k:"Intensity", v:"RPE "+r1(rpe), note:"easier sets do less each, so it takes more of them"}); }
    else why.push({k:"Intensity", v:"RPE "+r1(rpe), note:"in the productive range, no adjustment"});
  }

  // 4 - exercise selection: share of this group's sets that came from compound lifts
  if(o.sets > 0){
    const comp = (o.compound||0)/o.sets;
    if(comp > 0.6){ mrv *= 0.90; why.push({k:"Exercise mix", v:Math.round(comp*100)+"% compound", note:"compound lifts carry systemic fatigue that isolation work does not"}); }
    else if(comp < 0.3){ mrv *= 1.08; why.push({k:"Exercise mix", v:Math.round(comp*100)+"% compound", note:"isolation-heavy work is cheaper to recover from, so you can tolerate more"}); }
    else why.push({k:"Exercise mix", v:Math.round(comp*100)+"% compound", note:"a balanced mix, no adjustment"});
  }

  // 5 - recovery: sleep and energy from your check-ins
  const mod = A.modInfo.mod;
  if(mod !== 0){
    mrv *= (1 + mod/100 * 0.7);
    mav *= (1 + mod/100 * 0.4);
    why.push({k:"Recovery", v:(mod>0?"+":"")+mod, note: mod<0
      ? "short sleep or low energy lowers what you can recover from"
      : "good sleep and energy raise what you can recover from"});
  }

  /* 6 - the window. Landmarks are published per week, but the Body tab accumulates over
     the current cycle by default, and a cycle is rarely exactly 7 days. Scaling the
     thresholds by the window's real length keeps the comparison honest: 10 sets over a
     9-day cycle is not the same claim as 10 sets in a week, and only one of them should
     be measured against a weekly MEV. */
  const win = A.win || {scale:1, days:7, mode:"week"};
  const scale = win.scale || 1;
  const weekly = {mev: Math.round(mev*10)/10, mav: Math.round(mav*10)/10, mrv: Math.round(mrv*10)/10};
  if(scale !== 1){
    mev *= scale; mav *= scale; mrv *= scale;
    why.push({k:"Window", v:Math.round(win.days)+" days",
      note:"targets scaled from per-week figures to the length of this cycle"});
  }

  const R = v => Math.max(0, Math.round(v*10)/10);
  mev = R(mev); mav = R(Math.max(mav, mev+1)); mrv = R(Math.max(mrv, mav+1));
  return {mev, mav, mrv, weekly, scale, why, exp, base:{mev:G.mev, mav:G.mav, mrv:G.mrv}};
}
function landmarkExplainerHTML(A){
  const exp = experience();
  let h = `<div class="bm-explain">Your set targets are not fixed numbers. They start from published
    population figures for each muscle group, then get scaled by five things the app can read from your own log,
    and finally by the length of the window they're counted over.</div>
    <div class="rev-head">Your experience level</div>
    <div class="seg" style="margin-bottom:6px">${
      ["auto"].concat(EXP_LEVELS).map(l=>`<button class="${(experienceIsAuto()?"auto":exp)===l?"on":""}" data-exp="${l}">${l==="auto"?"Auto":l[0].toUpperCase()+l.slice(1)}</button>`).join("")
    }</div>
    <div class="sub" style="margin-bottom:10px">${experienceIsAuto()
      ? `Currently reading you as <b>${exp}</b>, inferred from ${S.sessions.length} logged sessions. The app can only see how long you have used <i>it</i>, not how long you have trained, so if you came in experienced then set this yourself.`
      : `Set manually to <b>${exp}</b>.`}</div>
    <div class="rev-head">The three thresholds</div>
    <table class="gl-table">
      <tr><td>${term("mev","MEV")}</td><td>The least weekly work that still grows the muscle. Below it you are maintaining.</td></tr>
      <tr><td>${term("mav","MAV")}</td><td>The productive range. Added sets keep paying off here.</td></tr>
      <tr><td>${term("mrv","MRV")}</td><td>The most it can recover from. Past this you accumulate fatigue without growth.</td></tr>
    </table>
    <div class="rev-head">What is moving your numbers</div>`;
  // show the adjustment trail for the group with the most volume, as a worked example
  let best = null;
  GKEYS.forEach(g=>{ if(!GROUPS[g].optional && (!best || A.wk[g].sets > A.wk[best].sets)) best = g; });
  if(best){
    const L = adjustedLandmarks(A, best);
    h += `<div class="sub" style="margin-bottom:6px">Worked through on <b>${esc(gName(best))}</b>, your highest-volume group ${esc((A.win&&A.win.short)||"this week")}:</div>
      <table class="gl-table">
        <tr><td>Base</td><td>MEV ${L.base.mev} / MAV ${L.base.mav} / MRV ${L.base.mrv} sets per week</td></tr>` +
      L.why.map(w=>`<tr><td>${esc(w.k)}</td><td><b>${esc(String(w.v))}</b><br><span style="color:var(--faint)">${esc(w.note)}</span></td></tr>`).join("") +
      `<tr><td><b>Yours</b></td><td><b>MEV ${L.mev} / MAV ${L.mav} / MRV ${L.mrv}</b></td></tr>
      </table>`;
  }
  h += `<div class="gl-note">Head-level regions like the three triceps heads do not get their own thresholds.
    There is no research at that level and no exercise isolates a single head cleanly enough to aim at one.
    Heads are judged on their <b>share of the group's work</b> instead, which is a real and fixable problem.</div>`;
  return h;
}

/* `ctx` carries the accumulation window's own wording and what the rest of the cycle
   still prescribes, so "not trained" never gets stated as a fact about your training
   when it is really a fact about which day of the rotation it is. */
function volState(m, sets, L, ctx){
  L = L || GROUPS[m];
  ctx = ctx || {};
  if(sets <= 0){
    return (ctx.pending > 0)
      ? {k:"queued", label:"not trained yet",
         txt:"no sets yet, with about "+r1(ctx.pending)+" prescribed on "+(ctx.names||"the days left in this cycle")}
      : {k:"none", label:"not trained",
         txt:"no sets logged "+(ctx.short || "this week")+
             (ctx.cycleOpen ? ", and nothing left in this cycle trains it" : "")};
  }
  if(sets < L.mev)   return {k:"under",   label:"too little",  txt:r1(sets)+" of the "+L.mev+" weekly sets it takes to grow"};
  if(sets <= L.mav)  return {k:"optimal", label:"just right",  txt:r1(sets)+" sets, inside your productive "+L.mev+" to "+L.mav+" window"};
  if(sets <= L.mrv)  return {k:"high",    label:"a lot",       txt:r1(sets)+" sets, above your target of "+L.mav+" but still recoverable"};
  return               {k:"over",    label:"too much",    txt:r1(sets)+" sets, past the "+L.mrv+" you can recover from"};
}

/* ---------- the accumulation window ----------
   MEV / MAV / MRV are published per WEEK, but a 7-workout rotation plus a rest day
   takes 8 to 11 real days to get through. Read on a rolling 7-day window, chest lands
   inside the window twice in some weeks and once in others, so every number moves for
   reasons that have nothing to do with training, and a muscle you trained perfectly
   well reads as "under-stimulated" purely because its day happened to fall 8 days ago.

   The default is therefore the CYCLE: everything since the current cycle began, with
   the thresholds scaled by how long that cycle has actually run, so a 9-day cycle is
   measured against 9/7 of the weekly landmark. The unit still matches the research; the
   window now matches how you actually train. Settings switches it back to a rolling
   7 days for anyone who plans by the calendar instead.                              */
function volWindowInfo(now){
  const week = {mode:"week", from: now - 7*DAY_MS, to: now + 1, days: 7, scale: 1,
                label:"the last 7 days", short:"this week", unit:"per week",
                prevFrom: now - 14*DAY_MS, prevTo: now - 7*DAY_MS, prevLabel:"the week before"};
  if((S.volWindow || "cycle") !== "cycle") return week;
  const start = S.cycleStart;
  if(!start || start > now) return week;
  const raw = (now - start)/DAY_MS;
  // Two days into a cycle there is nothing to read, and scaling by a fraction of a day
  // makes every target absurd, so the rolling week covers the gap.
  if(raw < 2) return week;
  const days = Math.min(21, raw);          // a stalled cycle shouldn't inflate targets forever
  const prev = S.lastCycle;
  return {
    mode:"cycle", from:start, to: now + 1, days, scale: days/7,
    label:"this cycle, "+Math.round(days)+" day"+(Math.round(days)===1?"":"s")+" so far",
    short:"this cycle", unit:"this cycle",
    prevFrom: prev ? prev.start : (start - days*DAY_MS),
    prevTo:   prev ? prev.end   : start,
    prevLabel: prev ? "last cycle" : "the period before"
  };
}
/* ---------- WHERE YOU ARE IN THE CYCLE ----------
   Every verdict on this tab reads a window of logged sets and compares it against a
   weekly target. That is only a fair comparison at the END of a rotation. Two workouts
   into a seven-workout cycle, legs day is four sessions away, so the app was reading
   "no quad volume" off a schedule that hadn't got there yet and reporting it as a weak
   point: the one thing guaranteed to teach you to ignore the section.

   So the rotation itself is consulted. For each muscle this works out how many sets the
   REMAINING days of the current cycle still prescribe, and how many a full pass of the
   rotation prescribes in total. A muscle whose work is still queued is not
   under-stimulated, and a muscle the programme genuinely never trains is a different
   finding from one whose day comes round on Thursday.

   `pending` is prescribed sets, not logged ones, so it says what the plan owes you, and
   it drops to zero for a day the moment that day is logged.                          */
function programVolume(widList){
  const per = blankMuscleMap(0);
  widList.forEach(wid=>{
    if(!S.program[wid]) return;
    resolvedProgram(wid).forEach(({chosen:e})=>{
      const mm = musclesFor(e.name);
      if(!mm) return;
      const n = parseInt(e.sets, 10) || 0;
      Object.keys(mm).forEach(g=>{ if(per[g] !== undefined) per[g] += mm[g] * n; });
    });
  });
  return per;
}
function cycleProgress(){
  const done = new Set((S.cycleDone||[]).map(Number));
  const remaining = [];
  ROTATION.forEach((wid,i)=>{ if(!done.has(i)) remaining.push(wid); });
  const names = [...new Set(remaining.map(widName))];
  // per-day volume, kept so a muscle can name the days that actually carry ITS work
  // rather than reciting every day you have left
  const byDay = {};
  [...new Set(remaining)].forEach(wid=>{ byDay[wid] = programVolume([wid]); });
  return {
    done: ROTATION.length - remaining.length,
    total: ROTATION.length,
    remaining,
    names,
    byDay,
    pending: programVolume(remaining),          // what the rest of this cycle still owes
    planned: programVolume(ROTATION),           // what one full pass prescribes
    complete: remaining.length === 0
  };
}
/* The days left in this cycle that train a given muscle, named. "3 sets on Legs day" is
   a schedule you can check; "3 sets on Arms, Chest, and Legs" is a list you have to
   decode. */
function pendingDayNames(cyc, m){
  if(!cyc || !cyc.byDay) return [];
  return [...new Set(Object.keys(cyc.byDay)
    .filter(wid => (cyc.byDay[wid][m] || 0) > 0)
    .map(widName))];
}
function dayList(names){
  if(!names || !names.length) return "the days you have left this cycle";
  return joinList(names) + (names.length === 1 ? " day" : " days");
}
/* One call, everything the Body tab needs. */
function bodyAnalysis(){
  const now = Date.now();
  const win    = volWindowInfo(now);
  const wk     = windowStats(win.from, win.to);
  const prevWk = windowStats(win.prevFrom, win.prevTo);
  const fat    = fatigueByMuscle(now);
  const modInfo= recoveryModifier();
  const rec    = recoveryByMuscle(now, wk, modInfo);
  const grow   = growthByMuscle(now);
  // landmarks are personalised per group, and scaled to the window, before any verdict
  const lm = {};
  const A0 = {wk, modInfo, win};
  MKEYS.forEach(m=>{ lm[m] = adjustedLandmarks(A0, m); });
  const inj    = injuryByMuscle(now, wk, fat, rec, lm, win);
  const cyc    = cycleProgress();
  const vol    = blankMuscleMap(m => wk[m].sets);
  const stCtx  = {short: win.short, cycleOpen: !cyc.complete};
  const state  = blankMuscleMap(m => volState(m, wk[m].sets, lm[m],
                   Object.assign({pending: cyc.pending[m] || 0,
                                  names: dayList(pendingDayNames(cyc, m))}, stCtx)));

  /* Whole-body load. Deliberately NOT the sum of the per-muscle numbers: a bench press
     set pays into chest, front delts and triceps, so summing those columns would report
     three times the sets you actually did. This counts real working sets performed. */
  const rawSets = (from, to)=>{
    let n = 0;
    S.sessions.forEach(s=>{
      if(s.startedAt < from || s.startedAt >= to) return;
      s.entries.forEach(e=> e.sets.forEach(st=>{ if(isWorkingSet(st)) n++; }));
    });
    return n;
  };
  const totals = {
    setsWk: rawSets(win.from, win.to),
    setsPrev: rawSets(win.prevFrom, win.prevTo),
    fat: Math.round(MKEYS.reduce((t,m)=>t+fat[m],0)/MKEYS.length),
    rec: Math.round(MKEYS.reduce((t,m)=>t+rec[m],0)/MKEYS.length),
    inj: Math.round(Math.max(...MKEYS.map(m=>inj[m].score)))
  };
  // ACWR is defined as a per-week rate against a 4-week average, so it stays weekly
  // regardless of which window the volume columns are using.
  const chronicWkAll = rawSets(now - 28*DAY_MS, now + 1)/4;
  totals.acwr = chronicWkAll >= 4 ? ((totals.setsWk/(win.scale||1))/chronicWkAll) : null;

  const rwk = regionStats(win.from, win.to);
  return {now, win, lm, wk, prevWk, fat, rec, grow, inj, vol, state, totals, modInfo, rwk, cyc,
          weak: weakPoints({wk, prevWk, fat, rec, grow, inj, state, lm, win, rwk, cyc})};
}

/* =============== WEAK POINT DETECTION ===============
   Five separate lenses, because "weak point" means five different things: a muscle can
   be under-stimulated, stalled, structurally out of balance with its opposite,
   neglected outright, or driven past what it recovers from.

   Each finding now carries FOUR pieces rather than three, because the old shape led
   with a diagnosis and buried the action:

     act    the thing to do, in an imperative sentence. This is the headline.
     title  the diagnosis, kept as a subhead for people who want the label.
     why    the evidence, one grey line: the numbers that produced the finding.
     detail the longer reasoning, shown only when you open the finding.

   `muscle` and `kind` are what make a finding drillable: tapping it opens exactly which
   exercises fed that muscle and how far off the target it is, so no verdict here is
   something you have to take on trust.                                              */
function weakPoints(A){
  const out = [];
  const win = A.win || {scale:1, short:"this week", unit:"per week"};
  const L = m => (A.lm && A.lm[m]) || GROUPS[m];
  // `score` is 0-100 confidence-weighted urgency; the displayed severity band is
  // derived from it, so a 5%-short muscle never shouts as loud as a missing one.
  const push = (score, muscle, kind, title, act, why, detail)=> out.push({
    score, sev: score>=68 ? 3 : score>=38 ? 2 : 1, muscle, kind, title, act, why, detail
  });
  /* What the rest of this cycle still prescribes for each muscle. Every rule below that
     reads a shortfall has to net this off first, or it reports the rotation's own
     ordering back to you as a training error. */
  const cyc = A.cyc || {pending:{}, planned:{}, names:[], done:0, total:0, complete:true};
  const pend = m => (cyc.pending && cyc.pending[m]) || 0;

  // 1, under-stimulated relative to minimum effective volume
  MKEYS.forEach(m=>{
    const M = MUSCLES[m], lm = L(m), s = A.wk[m].sets, p = A.prevWk[m].sets;
    if(s <= 0 && p <= 0) return;                     // rule 2 owns the "not trained at all" case
    if(!(lm.mev > 0) || s >= lm.mev) return;
    /* The sets the remaining days of the cycle still owe this muscle count towards the
       threshold. Being 4 sets short with 6 prescribed on a day you haven't done yet is
       a schedule, not a shortfall, and calling it one is how the section loses you. */
    const projected = s + pend(m);
    if(projected >= lm.mev * 0.95) return;
    const shortfall = (lm.mev - projected)/lm.mev;   // 0 → will reach MEV, 1 → nothing at all
    const chronic = p < lm.mev;
    const score = Math.min(100, Math.round(shortfall*80*(chronic?1.25:0.8)));
    if(score < 18) return;                           // a rounding-error shortfall isn't a weak point
    const need = Math.max(2, Math.ceil(lm.mev - projected));
    push(score, m, "under",
      M.name+" "+mIs(m)+" under-stimulated",
      "Add about "+need+" more hard sets of direct "+mMovement(m)+".",
      r1(s)+" of the "+r1(lm.mev)+" sets it takes to grow, "+win.short+
        (pend(m) > 0 ? ", and only "+r1(pend(m))+" more scheduled before the cycle ends" : "")+".",
      "A muscle needs a certain amount of total work before it has any reason to adapt, and effort doesn't substitute for it. "+
      (pend(m) > 0
        ? "The rest of this cycle is already counted here: even once "+dayList(pendingDayNames(cyc, m))+
          " "+(pendingDayNames(cyc, m).length===1?"is":"are")+" done, it still lands short. "
        : cyc.complete ? "" : "Nothing left in this cycle trains it. ")+
      (chronic ? "It was short in the previous period too, so this isn't one quiet week."
               : "Last time round it was in range, so this may just be a light spell.")+
      " One extra "+(GROUPS[m].lc||gName(m).toLowerCase())+" movement of 3 sets does it, or a set added to each one you already run.");
  });

  // 2, nothing trains it, which is three different claims and used to be one
  MKEYS.forEach(m=>{
    if(A.wk[m].sets > 0 || A.prevWk[m].sets > 0) return;
    if(A.grow[m].score !== null) return;             // trained inside 3 weeks, just not lately
    const planned = (cyc.planned && cyc.planned[m]) || 0;
    // (a) the rotation trains it and hasn't got there yet: not a finding at all
    if(pend(m) > 0) return;
    if(planned > 0){
      // (b) the programme does prescribe it, but the days that carry it went unlogged
      push(58, m, "none",
        MUSCLES[m].name+" "+mIs(m)+" in the plan but not in the log",
        "Run the days that carry your "+MUSCLES[m].lc+" work, or move it onto a day you actually do.",
        "The rotation prescribes about "+r1(planned)+" sets a cycle, and none have been logged in 3 weeks.",
        "A prescription only counts once it's performed. Either those days are the ones getting dropped, in which case the work belongs on a day you reliably train, or the log is behind reality.");
      return;
    }
    // (c) genuinely nothing in the programme touches it
    push(92, m, "none",
      "Nothing in your program trains "+MUSCLES[m].name.toLowerCase(),
      "Add one direct "+MUSCLES[m].lc+" movement to your rotation.",
      "No logged sets at all in the last 3 weeks, and nothing across a full pass of the rotation prescribes any.",
      "With no direct work, "+MUSCLES[m].lc+"s can only fall behind everything around them. Even "+
      r1(L(m).mev)+" sets is the difference between holding ground and losing it, and assisting on other lifts is not the same as being trained.");
  });

  // 3, stalled despite adequate volume
  MKEYS.forEach(m=>{
    const g = A.grow[m];
    if(!g || g.score === null || g.isNew) return;
    if(A.wk[m].sets < L(m).mev) return;              // rule 1 already owns this case
    if(g.score >= 45) return;
    const dropped = g.strP < -0.02;
    const score = dropped ? Math.min(95, 55 + Math.abs(g.strP)*300) : 42;
    push(Math.round(score), m, "stall",
      MUSCLES[m].name+" "+(MUSCLES[m].pl?"have":"has")+" stalled",
      dropped
        ? "Take a lighter week here: about half the sets, same loads."
        : "Change the stimulus rather than the amount of it.",
      "Volume is fine, but estimated strength is "+(dropped ? "down "+Math.abs(Math.round(g.strP*100))+"%" : "flat")+
        " versus the previous 3 weeks"+(g.bestPrev ? " ("+Math.round(g.bestPrev)+" → "+Math.round(g.bestNow)+" lb est. 1RM)" : "")+".",
      "More sets is the wrong lever when the sets you already do aren't converting. "+
      (dropped
        ? "A stall with falling strength is nearly always accumulated fatigue rather than too little work, so cut the sets by about half, keep the loads, and rebuild from there."
        : "Swap the main movement, slow the lowering phase to about 3 seconds, or take the top set one RPE closer to failure. Any of the three changes what the muscle is being asked to adapt to."));
  });

  // 4, structural balance between opposing / paired muscles
  const ratios = [
    {a:["chest","delts_front","triceps"], b:["lats","upper_back","traps","biceps"],
     an:"pushing", bn:"pulling", lo:0.75, hi:1.35,
     actLow:"Add pressing volume, your back work is ahead of your chest.",
     actHigh:"Add rowing and pulldown volume to balance the pressing.",
     whyLow:"Press work has fallen behind pull work.",
     whyHigh:"Push dominance rounds the shoulders forward and is the most common source of front-shoulder pain."},
    {a:["quads"], b:["hams"], an:"quad", bn:"hamstring", lo:0.8, hi:2.0,
     actLow:"Add quad work: leg extensions or squats.",
     actHigh:"Add hamstring work: RDLs and leg curls.",
     whyLow:"Your hamstrings are ahead of your quads.",
     whyHigh:"Quad dominance well past 2:1 tracks with hamstring strains and knee complaints."},
    {a:["delts_front"], b:["delts_rear"], an:"front delt", bn:"rear delt", lo:0.6, hi:1.6,
     actLow:"Check your press volume, front delts are behind.",
     actHigh:"Add rear delt work: face pulls or reverse flyes.",
     whyLow:"Front delts are mostly fed by pressing, so this usually means press volume dropped.",
     whyHigh:"Front delts get paid by every press you do; rear delts only grow from what you give them directly."}
  ];
  ratios.forEach(R=>{
    const sa = R.a.reduce((t,m)=>t+A.wk[m].sets,0);
    const sb = R.b.reduce((t,m)=>t+A.wk[m].sets,0);
    if(sa + sb < 6) return;                          // too little data to call it
    /* Mid-rotation, this compares a side that has come round against one that hasn't.
       Chest day then back day reads as 2:1 pushing on the Monday and 1:1 on the Tuesday,
       and only one of those is about you. The projected ratio, with the rest of the
       cycle's prescribed sets added in, has to be out of band as well before it counts. */
    const pa = R.a.reduce((t,m)=>t+pend(m),0);
    const pb = R.b.reduce((t,m)=>t+pend(m),0);
    const proj = (sa+pa)/Math.max(0.5, sb+pb);
    if(sb < 1){
      if(pb > 0) return;                             // the balancing work is still queued
      push(88, R.b[0], "balance",
        "No "+R.bn+" volume at all",
        R.actHigh,
        r1(sa)+" sets of "+R.an+" work with nothing balancing it, "+win.short+
          ", and nothing left in this cycle trains it.",
        R.whyHigh);
      return;
    }
    const ratio = sa/sb;
    if(ratio > R.hi && proj <= R.hi) return;         // the rest of the cycle already fixes it
    if(ratio < R.lo && proj >= R.lo) return;
    if(ratio > R.hi){
      push(Math.min(95, Math.round(40 + (ratio/R.hi - 1)*90)), R.b[0], "balance",
        R.bn.replace(/^./,c=>c.toUpperCase())+"s lag behind "+R.an+"s",
        R.actHigh,
        r1(sa)+" sets of "+R.an+" against "+r1(sb)+" of "+R.bn+", a "+ratio.toFixed(1)+":1 ratio where about 1:1 keeps the joint balanced.",
        R.whyHigh);
    } else if(ratio < R.lo){
      push(Math.min(95, Math.round(40 + (R.lo/ratio - 1)*90)), R.a[0], "balance",
        R.an.replace(/^./,c=>c.toUpperCase())+"s lag behind "+R.bn+"s",
        R.actLow,
        r1(sa)+" sets of "+R.an+" against "+r1(sb)+" of "+R.bn+" ("+ratio.toFixed(2)+":1).",
        R.whyLow);
    }
  });

  // 5, driven past what it recovers from
  MKEYS.forEach(m=>{
    const i = A.inj[m];
    if(!i || i.score < 55) return;
    push(i.score, m, "over",
      MUSCLES[m].name+" "+mIs(m)+" being pushed past recovery",
      "Cut "+MUSCLES[m].name.toLowerCase()+" sets by about a third, keep the loads.",
      i.flags.slice(0,2).map(f=>f.t).join("; ")+".",
      "Volume you can't recover from is volume you don't grow from: past this point the sets cost fatigue without buying adaptation, and connective tissue takes the strain. Hold the weights where they are, because dropping the load is what costs you the strength.");
  });

  // Most urgent first. One entry per muscle keeps the list readable, and the
  // highest-scoring finding for a muscle is the one worth acting on first anyway.
  const seen = new Set();
  return out.sort((a,b)=>b.score-a.score).filter(w=>{
    if(seen.has(w.muscle)) return false;
    seen.add(w.muscle); return true;
  }).slice(0, 7);
}

/* ================= RENDER ================= */
let TAB = "today";
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick = ()=>{ TAB=b.dataset.tab; document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b)); render(); window.scrollTo(0,0); showNav(); };
});
/* ---------- tab bar behaviour ----------
   Retracts as you scroll down and comes back the instant you scroll up, so a long tab
   isn't read through a 78px letterbox and the bar is never more than a flick away.
   It's always shown at the very top and the very bottom of the page.

   Why the old bar felt like it was sticking, and what's different:

     • `backdrop-filter: blur()` on a fixed element forces Safari to re-rasterise the
       blur against whatever is behind it on every scroll frame, so the bar visibly
       lagged the content. It's now a solid colour on its own compositor layer.
     • This handler never reads layout. `pageYOffset` is free; `scrollHeight` is not,
       and reading it inside a scroll handler forces a synchronous reflow on every
       event. The document height is cached and refreshed on render and resize instead.
     • The only write is a custom property that flips at most twice per gesture, because
       setHidden() returns early when nothing changed, and it animates a transform,
       which the compositor handles without touching layout at all.                  */
let showNav = ()=>{};
let refreshNavBounds = ()=>{};
(function(){
  const nav = document.querySelector("nav");
  if(!nav) return;
  const HIDE_AFTER = 90;   // stay put until you're properly into the page
  const DEADZONE   = 8;    // ignore jitter and iOS rubber-banding
  let lastY = 0, hidden = false, docH = 0;
  const setHidden = v=>{
    if(v === hidden) return;
    hidden = v;
    nav.style.setProperty("--navY", v ? "calc(100% + 2px)" : "0px");
  };
  refreshNavBounds = ()=>{ docH = document.documentElement.scrollHeight; };
  refreshNavBounds();
  window.addEventListener("scroll", ()=>{
    const y = Math.max(0, window.pageYOffset || 0);
    const dy = y - lastY;
    if(Math.abs(dy) <= DEADZONE) return;
    const atBottom = y + window.innerHeight >= docH - 4;
    if(y < HIDE_AFTER || atBottom) setHidden(false);
    else setHidden(dy > 0);
    lastY = y;
  }, {passive:true});
  window.addEventListener("resize", refreshNavBounds, {passive:true});
  showNav = ()=>{ lastY = Math.max(0, window.pageYOffset || 0); setHidden(false); refreshNavBounds(); };
})();

/* =====================================================================
   ONBOARDING

   Six short steps, each asking one thing, each answerable in a tap. The order is
   deliberate: it goes from what you know for certain about yourself (your name, why
   you are here) to what the app can decide FOR you if you would rather not think about
   it (which exercises, how many sets). Nothing asks for a number you would have to
   look up, and nothing asks twice.

   WHAT EACH ANSWER ACTUALLY CHANGES, because a setup flow that quietly discards its
   own answers is worse than no setup flow:

     name        every screen that addresses you, and the profile switcher
     goal        the rep ranges and rest targets your starting plan is written in
     experience  sets per exercise (setsForLevel) and the volume landmarks in the
                 Body tab, which scale with training age
     equipment   which exercise fills each slot in your plan (pickExercise)
     schedule    your split: training days, rest credits, the whole cycle strip
     plan        generated from all of the above, or imported from a file

   You can leave at any point — "skip setup" gives you the middle-of-the-road default
   plan and puts the wizard behind a button in Settings. Being stuck inside a form is
   the fastest way to lose someone who just wanted to see the app.
   ===================================================================== */
const GOALS = {
  muscle:   {name:"Build muscle",     sub:"Get bigger. Moderate reps, plenty of volume.",
             reps:{heavy:"6-10", second:"8-12", iso:"12-15", abs:"10-15"}},
  strength: {name:"Get stronger",     sub:"Lift heavier. Lower reps, longer rests.",
             reps:{heavy:"4-6",  second:"6-8",  iso:"8-12",  abs:"10-15"}},
  lean:     {name:"Lose fat, keep muscle", sub:"Keep the weights up while eating less. Same training, shorter rests.",
             reps:{heavy:"6-10", second:"10-12", iso:"12-20", abs:"12-20"}},
  health:   {name:"General health",   sub:"Feel good, move well, stay strong. Nothing extreme.",
             reps:{heavy:"8-12", second:"10-12", iso:"12-15", abs:"10-15"}}
};
const LEVELS = {
  beginner:     {name:"New to this",   sub:"Under a year of consistent training, or starting again."},
  intermediate: {name:"Some experience", sub:"A year or two of steady training. You know the main lifts."},
  advanced:     {name:"Experienced",   sub:"Several years in. You know how your own body responds."}
};

let OB = null;     // the in-progress answers; null when the wizard is closed
const OB_STEPS = ["welcome","name","goal","level","gear","split","plan","done"];

function needsOnboarding(){ return !S.setup && !(S.sessions && S.sessions.length); }
function startOnboarding(){
  OB = {step:0, name:"", goal:"muscle", level:"beginner", gear:"full",
        splitId:DEFAULT_SPLIT, imported:null};
  TAB = "today";
  render();
}
function obGo(n){
  OB.step = Math.max(0, Math.min(OB_STEPS.length-1, n));
  render();
  window.scrollTo(0,0);
}
/* Writing the answers into the profile. Everything the wizard collected lands in one
   place so a later screen can explain WHY it recommends what it recommends. */
function finishOnboarding(){
  const o = OB;
  S.setup = {name:o.name || "Me", goal:o.goal, level:o.level, gear:o.gear,
             at: Date.now()};
  S.experience = o.level;                 // stop inferring; they told us
  S.splitId = o.splitId;
  S.customSplit = null;
  applySplit();
  if(o.imported){
    /* An imported plan is left exactly as it was written. It is somebody's actual
       programme — running applyGoalReps over it would quietly rewrite every rep range
       in it to match an answer they gave two screens ago. */
    adoptImportedPlan(o.imported);
  } else {
    S.program = buildProgram(o.splitId, o.gear, o.level);
    applyGoalReps(S.program, o.goal);
  }
  S.pointer = 0; S.cycleDone = []; S.cycleStart = Date.now(); S.restDays = [];
  if(o.name){
    const p = activeProfile();
    if(p){ p.name = o.name; saveProfiles(); }
  }
  OB = null;
  save(); queueSync(); render();
  toast("You're all set. Your first workout is ready.");
}
// The goal only moves rep ranges and rest, never the exercises: the movements you need
// are the same whatever you are chasing, the dose is what differs.
function applyGoalReps(prog, goalId){
  const g = GOALS[goalId]; if(!g) return;
  Object.keys(prog).forEach(day=>{
    (prog[day]||[]).forEach(e=>{
      const kind = e.slotKind
                 || (e.rest === REST_HEAVY || e.rest === REST_SQUAT ? "heavy"
                    : e.rest === REST_SECOND ? "second" : "iso");
      if(g.reps[kind]) e.reps = g.reps[kind];
      // Strength work needs longer between sets than the same movement trained for size
      if(goalId === "strength" && kind === "heavy") e.rest = [210, 300];
      if(goalId === "lean" && kind === "iso") e.rest = [60, 90];
    });
  });
}
/* Taking on a plan from a file. Accepts a full Iron Log export (program + sessions) or
   a bare program object, because "import my plan" and "restore my backup" are the same
   action from the user's side and it is not their job to know which file they have. */
function adoptImportedPlan(d){
  if(!d) return false;
  const prog = d.program || d;
  if(!prog || typeof prog !== "object") return false;
  S.program = prog;
  if(d.splitId) S.splitId = d.splitId;
  if(d.customSplit) S.customSplit = d.customSplit;
  /* A plan whose days do not match any known split needs a split built to fit it, or
     the rotation would point at days the programme has never heard of. */
  const keys = Object.keys(prog).filter(k=>k !== "finisher" && Array.isArray(prog[k]));
  /* Unless the import brought its own split AND that split actually covers the days in
     the programme. It used to synthesise one regardless, which threw away the day names
     the file (or the importer) had just supplied and replaced "Push"/"Pull"/"Legs" with
     "Day 1"/"Day 2"/"Day 3". */
  const supplied = d.customSplit && Array.isArray(d.customSplit.days)
    && d.customSplit.days.length === keys.length
    && d.customSplit.days.every(x=> keys.indexOf(x.id) > -1);
  if(!supplied){
    const known = SPLIT_ORDER.find(id=>{
      const ids = SPLITS[id].days.map(d2=>d2.id).slice().sort().join(",");
      return ids === keys.slice().sort().join(",");
    });
    if(known){ S.splitId = known; S.customSplit = null; }
    else if(keys.length){
      S.customSplit = {name:"Imported split", tag:keys.length+" days a week", custom:true,
                       days: keys.map((k,i)=>({id:k, name:prettyDayId(k), short:"D"+(i+1)})),
                       layout: keys.concat(keys.length >= 5 ? ["rest","rest"] : ["rest"])};
      S.splitId = null;
    }
  }
  if(Array.isArray(d.sessions) && d.sessions.length) S.sessions = d.sessions;
  if(d.checkins) S.checkins = d.checkins;
  if(d.restLog) S.restLog = d.restLog;
  applySplit();
  return true;
}

/* ---------- the wizard's screens ---------- */
function obCardOpen(kicker, title, sub){
  return `<div class="ob-card">
    ${kicker?`<div class="ob-kick">${esc(kicker)}</div>`:""}
    <h2 class="ob-h">${esc(title)}</h2>
    ${sub?`<div class="ob-sub">${sub}</div>`:""}`;
}
function obChoice(dataAttr, val, on, name, sub){
  return `<button class="ob-opt${on?" on":""}" ${dataAttr}="${esc(val)}">
    <span class="ob-opt-t">${esc(name)}</span>
    <span class="ob-opt-s">${esc(sub)}</span>
    <span class="ob-tick">✓</span>
  </button>`;
}
function obProgress(){
  // welcome and done are not "steps" you are working through, so they don't count
  const total = OB_STEPS.length - 2;
  const at = Math.min(total, Math.max(0, OB.step));
  if(OB.step === 0 || OB.step === OB_STEPS.length-1) return "";
  return `<div class="ob-prog"><i style="width:${Math.round(at/total*100)}%"></i></div>
    <div class="ob-prog-n">Step ${at} of ${total}</div>`;
}
function viewOnboarding(){
  const step = OB_STEPS[OB.step];
  let h = `<div class="ob-wrap">${obProgress()}`;

  if(step === "welcome"){
    h += obCardOpen("", "Iron Log",
      `<p>A training log that reads what you lift and tells you what to change.</p>
       <p>It tracks every set, grades each session, watches the volume each muscle
       actually receives, and tells you when a load is ready to go up. Setup takes about
       a minute.</p>`);
    h += `<button class="btn" id="obStart">Set up my training</button>
      <button class="btn ghost" id="obImportTop">I already have a plan — import it</button>
      <div class="ob-sub" style="margin:8px 2px 0;font-size:13px;color:var(--faint)">
        Paste it, upload it, or photograph the sheet you train off. It gets read and turned
        into a working plan, whatever shape it's in.</div>
      <button class="linklike ob-skip" id="obSkip">Skip for now, just show me the app</button>`;
  }

  if(step === "name"){
    h += obCardOpen("About you", "What should we call you?",
      "<p>Only used to label your log. It never leaves your device unless you turn on sync.</p>");
    h += `<div class="field"><input id="obName" placeholder="Your name" value="${esc(OB.name)}" autocomplete="given-name"></div>`;
    h += obNav(true);
  }

  if(step === "goal"){
    h += obCardOpen("About you", "What are you training for?",
      "<p>This sets your rep ranges and how long to rest. You can change it later, and it never changes which exercises you do.</p>");
    h += `<div class="ob-opts">` +
      Object.keys(GOALS).map(k=>obChoice("data-obgoal", k, OB.goal===k, GOALS[k].name, GOALS[k].sub)).join("") +
      `</div>`;
    h += obNav();
  }

  if(step === "level"){
    h += obCardOpen("About you", "How long have you been training?",
      "<p>This sets how many sets you start with. Starting lower than you could handle is easy to fix; starting too high is how programmes get abandoned.</p>");
    h += `<div class="ob-opts">` +
      Object.keys(LEVELS).map(k=>obChoice("data-oblevel", k, OB.level===k, LEVELS[k].name, LEVELS[k].sub)).join("") +
      `</div>`;
    h += obNav();
  }

  if(step === "gear"){
    h += obCardOpen("Your gym", "What can you train with?",
      "<p>Your plan is built from what you actually have. Pick the closest match — you can swap any single exercise afterwards.</p>");
    h += `<div class="ob-opts">` +
      Object.keys(GEAR_LABEL).map(k=>obChoice("data-obgear", k, OB.gear===k, GEAR_LABEL[k].name, GEAR_LABEL[k].sub)).join("") +
      `</div>`;
    h += obNav();
  }

  if(step === "split"){
    h += obCardOpen("Your week", "How often can you train?",
      "<p>Be honest rather than optimistic. Three days you actually do beats six you skip — the app can always add more later.</p>");
    h += `<div class="ob-opts">` +
      SPLIT_ORDER.map(id=>{
        const sp = SPLITS[id];
        const on = OB.splitId === id;
        return `<button class="ob-opt${on?" on":""}" data-obsplit="${id}">
          <span class="ob-opt-t">${esc(sp.name)} <i class="ob-badge">${esc(sp.tag)}</i></span>
          <span class="ob-opt-s">${esc(sp.blurb)}</span>
          <span class="ob-opt-s ob-best">${esc(sp.best)}</span>
          <span class="ob-tick">✓</span>
        </button>`;
      }).join("");
    /* There is deliberately no "build your own schedule from scratch" option here.
       Choosing a day count and naming empty days is the one question in this wizard
       nobody can answer well before they have trained on it, and it produced the worst
       plans the app could make. If you already train on a schedule of your own, import
       it (the button below) and the whole thing — days, names, exercises — is read off
       what you already have. */
    h += `</div>
      <button class="btn ghost" id="obImportSplit" style="margin-bottom:18px">I already train on my own plan — import it</button>`;
    h += obNav();
  }

  if(step === "plan"){
    const imported = OB.imported;
    const preview = imported
      ? (imported.program || imported)
      : buildProgram(OB.splitId, OB.gear, OB.level);
    /* Day names come from whichever source produced the plan: a built-in split knows
       its own, an imported one carries its split with it, and anything else falls back
       to a readable version of the key. */
    const nameOf = (day, i)=>{
      if(imported){
        const sp = imported.customSplit;
        const d = sp && (sp.days||[]).find(x=>x.id === day);
        return (d && d.name) || prettyDayId(day);
      }
      return ((SPLITS[OB.splitId].days.find(d=>d.id===day)||{}).name) || day;
    };
    h += obCardOpen("Your plan", imported ? "Here's your plan" : "Here's your starting plan",
      imported
        ? `<p>Read off what you gave us. Check it over — every exercise, set count and rep
           range below is editable in the Program tab once you're in.</p>`
        : `<p>Built from your answers. Nothing here is fixed — swap exercises, change sets, add or remove days whenever you like.</p>
           <p><b>There are no starting weights on purpose.</b> The first time you do each exercise the app asks for one easy set and sets the weight from that, so every load comes from what <i>you</i> actually lifted.</p>`);
    if(preview){
      h += `<div class="ob-plan">`;
      Object.keys(preview).filter(k=>k!=="finisher" && Array.isArray(preview[k]) && preview[k].length).forEach((day, i)=>{
        h += `<div class="ob-day">
          <div class="ob-day-h"><span class="dot" style="background:${DAY_COLORS[i%DAY_COLORS.length]}"></span>${esc(nameOf(day, i))}
            <i>${preview[day].length} exercises &middot; ${preview[day].reduce((t,e)=>t+(e.sets||0),0)} sets</i></div>
          ${preview[day].map(e=>`<div class="ob-ex"><span>${esc(e.name)}</span><i class="num">${e.sets}×${esc(e.reps)}</i></div>`).join("")}
        </div>`;
      });
      h += `</div>`;
    }
    h += `<button class="btn" id="obAccept">${imported?"Use this plan":"Looks good, let's go"}</button>`;
    h += `<button class="btn ghost" id="obImport">${imported?"Import a different plan":"I have my own plan to import"}</button>`;
    h += `<button class="linklike ob-skip" id="obBack">Back</button>`;
  }

  if(step === "done"){
    h += obCardOpen("", "You're set up",
      `<p>Your first session is waiting on the Today tab. Tap an exercise, log your sets, and the app takes it from there.</p>`);
    h += `<div class="ob-tips">
      <div class="ob-tip"><b>Log RPE if you can.</b> It's how hard a set felt, 1-10. It's the number that drives almost everything the app tells you.</div>

      <div class="ob-tip"><b>Nothing is locked in.</b> Change your plan, split or goal any time from the Program tab.</div>

}
function obNav(isName){
  return `<div class="ob-nav">
    <button class="btn ghost" id="obPrev">Back</button>

}
function bindOnboarding(){
  const on = (id, fn)=>{ const el = $("#"+id); if(el) el.onclick = fn; };
  on("obStart", ()=>obGo(1));
  on("obSkip", ()=>{
    /* Skipping is a real choice, not a trap door: they get the default plan and the
       wizard stays available in Settings. */
    S.setup = {name:"Me", goal:"muscle", level:"intermediate", gear:"full", skipped:true, at:Date.now()};
    OB = null; save(); render();
    toast("Using a starter plan. Set it up properly any time from Program → Setup.");
  });
  on("obPrev", ()=>obGo(OB.step-1));
  on("obBack", ()=>obGo(OB.step-1));
  on("obNext", ()=>{
    if(OB_STEPS[OB.step] === "name"){
      const v = $("#obName"); OB.name = v ? v.value.trim() : "";
    }
    obGo(OB.step+1);
  });
  const nameIn = $("#obName");
  if(nameIn){
    nameIn.oninput = ()=>{ OB.name = nameIn.value.trim(); };
    nameIn.onkeydown = e=>{ if(e.key === "Enter") obGo(OB.step+1); };
    setTimeout(()=>nameIn.focus(), 60);
  }
  document.querySelectorAll("[data-obgoal]").forEach(b=> b.onclick = ()=>{ OB.goal = b.dataset.obgoal; render(); });
  document.querySelectorAll("[data-oblevel]").forEach(b=> b.onclick = ()=>{ OB.level = b.dataset.oblevel; render(); });
  document.querySelectorAll("[data-obgear]").forEach(b=> b.onclick = ()=>{ OB.gear = b.dataset.obgear; render(); });
  document.querySelectorAll("[data-obsplit]").forEach(b=> b.onclick = ()=>{
    OB.splitId = b.dataset.obsplit;
    render();
  });
  on("obAccept", ()=> obGo(OB.step+1));
  on("obFinish", finishOnboarding);
  /* Every "import" entry point lands in the same place. The importer decides for itself
     whether what you handed it is an Iron Log backup (adopted as-is) or a plan in some
     other form (read by the model), because that distinction is ours to make, not
     yours. */
  on("obImport",     ()=> openAIImport(true));
  on("obImportTop",  ()=> openAIImport(true));
  on("obImportSplit",()=> openAIImport(true));
}

/* =====================================================================
   IMPORTING A PLAN YOU ALREADY HAVE

   The single biggest thing standing between this app and somebody who already trains
   is that they have a plan, it is written down somewhere, and typing it in exercise by
   exercise is an hour of work before they see a single screen that is about THEM. So
   they don't type it in. They hand it over — pasted text, a screenshot, a PDF from a
   coach, a photo of the sheet taped inside a locker door — and a model reads it into
   the same programme object buildProgram() produces.

   WHAT COMES BACK IS ORDINARY PROGRAMME DATA. There is no "AI plan" mode and nothing
   downstream knows an import happened. The importer's only job is to produce days and
   exercises in the app's own shape; from that point the volume analysis, the grading,
   the progression rules and the muscle map all run on it exactly as they run on a
   generated plan. That is deliberate: an import that produced a second, special kind of
   plan would have to be taught to every screen in the app, and would be wrong in one of
   them within a month.

   NOBODY IS ASKED TO SET ANYTHING UP. The key is the one at the top of this file, and
   it belongs to whoever publishes the app. That is the whole point: a person who opens
   this to log a workout should never meet a screen asking them for an API key, and most
   of them would close the tab if they did. See the note on AI_KEY for what that costs
   and how to fence it in.
   ===================================================================== */
const AI_ENDPOINT = "https://generativelanguage.googleapis.com/v1beta/models/";

function aiReady(){ return !!String(AI_KEY).trim(); }

/* The names the rest of the app already understands. Handing these to the model as a
   preferred vocabulary is what makes an imported plan land on the muscle map properly:
   "DB Bench" comes back as "Dumbbell Bench Press", which EX_MUSCLES has an exact entry
   for, rather than falling through to the keyword rules. Anything genuinely not in here
   keeps the name it arrived with — MUSCLE_KEYWORDS still places it. */
let AI_VOCAB = null;
function aiVocabulary(){
  if(AI_VOCAB) return AI_VOCAB;
  /* Deduplicated by canonical name, not by spelling. EX_LIBRARY and EX_MUSCLES overlap,
     and they do not always capitalise the same movement the same way — listing both
     "Mid Cable Fly (On Bench)" and "Mid Cable Fly (on bench)" tells the model these are
     two different exercises, which is the one thing this list exists to prevent. The
     library's spelling wins, because that is what a generated plan uses. */
  const byCanon = {};
  Object.keys(EX_LIBRARY).forEach(k=> EX_LIBRARY[k].forEach(x=>{ byCanon[canonEx(x.name)] = x.name; }));
  Object.keys(EX_MUSCLES).forEach(n=>{
    const c = canonEx(n);
    if(!byCanon[c]) byCanon[c] = n.replace(/\b[a-z]/g, ch=>ch.toUpperCase());
  });
  AI_VOCAB = Object.keys(byCanon).map(c=>byCanon[c]).sort();
  return AI_VOCAB;
}
let AI_NAME_INDEX = null;
function aiNameIndex(){
  if(AI_NAME_INDEX) return AI_NAME_INDEX;
  const o = {};
  aiVocabulary().forEach(n=>{ o[canonEx(n)] = n; });
  AI_NAME_INDEX = o;
  return o;
}
// Snap a returned name onto the app's spelling of the same movement, if it is one.
function aiSnapName(n){
  const clean = String(n==null?"":n).replace(/\s+/g," ").trim().slice(0,48);
  if(!clean) return "";
  const hit = aiNameIndex()[canonEx(clean)];
  if(hit) return hit;
  /* Not a movement we know, so the name is kept as written — except that a plan typed
     in lower case ("incline db press") would then sit in lower case on every screen it
     appears on. Title-casing an all-lowercase name fixes that; anything with capitals
     already is left alone, because "DB" and "RDL" are not "Db" and "Rdl". */
  return /[A-Z]/.test(clean) ? clean : clean.replace(/\b[a-z]/g, c=>c.toUpperCase());
}

function aiSystemPrompt(){
  return [
"You convert a person's existing weight-training programme into structured JSON for a training-log app called Iron Log. The input may be pasted text, a spreadsheet, a coach's PDF, a screenshot, or a photograph of a handwritten sheet. Read whatever you are given and transcribe the plan that is actually in it.",
"",
"RULES",
"1. One entry in 'days' is ONE TRAINING SESSION in the rotation, in the order it is performed. Do not create a day for rest. If the source names its days (Push, Pull, Upper A, Chest and Triceps), keep those names.",
"2. 'restDaysPerCycle' is how many rest days one full pass through those sessions contains. If the plan is a weekly one, that is 7 minus the number of training days. If it says nothing, use your best reading of it.",
"3. 'sets' is the number of working sets, as a whole number. Warm-up sets are not working sets — leave them out. For a one-limb-at-a-time movement, give the TOTAL number of sets, not sets per side (this app alternates sides set by set): '3 sets each arm' is 6.",
"4. 'reps' is a short string exactly as prescribed: '8', '6-10', '12-15', 'AMRAP', or a number of seconds for a timed hold. Never a sentence.",
"5. 'rpe' is one target per set, in order, length equal to 'sets'. If the source gives RPE or RIR, convert it (RPE = 10 minus RIR) and use it. If it gives none, write a sensible ramp for the movement rather than repeating one number: heavy compounds ramp like 7,8,8,9 and isolation sits at 8-9 throughout.",
"6. 'kind' classifies the job the movement does in that session: 'heavy' for the main barbell or machine compound it opens with, 'second' for a secondary compound, 'iso' for single-joint or isolation work, 'abs' for direct core work.",
"7. 'weight' is a working load in POUNDS, and only when the source states an actual number for it. Convert kilos to pounds (1 kg = 2.20462 lb) and round to the nearest 5, and say so in that exercise's note. If the source gives a percentage of 1RM, a band colour, 'moderate', or nothing at all, leave weight out entirely — the app will set the load from the user's own first set.",
"8. 'note' is at most one short sentence: a tempo, a form cue, a rest instruction, a conversion you made. Leave it empty if the source has nothing to say. Never invent coaching.",
"9. Keep the source's exercise order within each day.",
"10. Transcribe, do not improve. Do not add exercises the plan does not contain, do not drop ones it does, do not rebalance it, and do not correct it even if you think it is a poor programme.",
"",
"EXERCISE NAMES. Where a movement matches one in this list, use the list's exact spelling. Where it does not, keep the plan's own name, tidied to title case.",
aiVocabulary().join(", "),
"",
"IF IT IS NOT A TRAINING PLAN, or it is too unclear to transcribe — a blurred photo, a nutrition sheet, a single sentence — set 'understood' to false and put one plain sentence in 'problem' saying what you would need instead. Do not guess a plan into existence. Otherwise set 'understood' to true.",
"",
"Put anything you had to assume, could not read, or deliberately dropped into 'warnings', one short sentence each. An empty list is fine."
  ].join("\n");
}

/* The response schema. Structured output is what makes this reliable enough to ship:
   the model cannot answer with prose, a code fence, or a differently-shaped object, so
   the parsing below only ever has to defend against wrong VALUES, never wrong shape. */
const AI_PLAN_SCHEMA = {
  type:"OBJECT",
  properties:{
    understood:      {type:"BOOLEAN", description:"false if the input is not a readable training plan"},
    problem:         {type:"STRING",  description:"why it could not be read, if understood is false"},
    splitName:       {type:"STRING",  description:"a short name for the whole programme, eg. Push Pull Legs"},
    restDaysPerCycle:{type:"INTEGER"},
    warnings:        {type:"ARRAY", items:{type:"STRING"}},
    days:{
      type:"ARRAY",
      items:{
        type:"OBJECT",
        properties:{
          name:{type:"STRING"},
          exercises:{
            type:"ARRAY",
            items:{
              type:"OBJECT",
              properties:{
                name:  {type:"STRING"},
                sets:  {type:"INTEGER"},
                reps:  {type:"STRING"},
                rpe:   {type:"ARRAY", items:{type:"NUMBER"}},
                kind:  {type:"STRING", enum:["heavy","second","iso","abs"]},
                weight:{type:"NUMBER", nullable:true},
                note:  {type:"STRING"}
              },
              required:["name","sets","reps","kind"],
              propertyOrdering:["name","sets","reps","rpe","kind","weight","note"]
            }
          }
        },
        required:["name","exercises"],
        propertyOrdering:["name","exercises"]
      }
    }
  },
  required:["understood","days"],
  propertyOrdering:["understood","problem","splitName","restDaysPerCycle","warnings","days"]
};

/* One file, as one part of the request. Text-ish files go in as text because that is
   both cheaper and more accurate than making the model read a picture of characters it
   could have been handed directly. */
function aiFilePart(file){
  return new Promise((resolve, reject)=>{
    const name = file.name || "file";
    const isText = /^text\//.test(file.type) || /json|csv|markdown/.test(file.type)
                   || /\.(txt|md|csv|json|tsv)$/i.test(name);
    const r = new FileReader();
    r.onerror = ()=> reject(new Error("Couldn't read " + name));
    if(isText){
      r.onload = ()=> resolve({text:"File \"" + name + "\":\n\n" + String(r.result).slice(0, 120000)});
      r.readAsText(file);
      return;
    }
    const mime = file.type || "";
    if(!/^image\/(png|jpeg|jpg|webp|heic|heif)$|^application\/pdf$/.test(mime)){
      reject(new Error("Can't read " + name + ". Use a photo, a screenshot, a PDF, or plain text."));
      return;
    }
    r.onload = ()=>{
      const s = String(r.result);
      resolve({inlineData:{mimeType: mime, data: s.slice(s.indexOf(",") + 1)}});
    };
    r.readAsDataURL(file);
  });
}

async function aiCall(parts){
  if(!aiReady()) throw new Error("The plan reader isn't switched on for this copy of the app.");
  let res;
  try{
    res = await fetch(AI_ENDPOINT + encodeURIComponent(AI_MODEL) + ":generateContent", {
      method:"POST",
      headers:{"Content-Type":"application/json", "x-goog-api-key": String(AI_KEY).trim()},
      body: JSON.stringify({
        contents:[{role:"user", parts}],
        systemInstruction:{parts:[{text: aiSystemPrompt()}]},
        generationConfig:{temperature:0.15, responseMimeType:"application/json", responseSchema:AI_PLAN_SCHEMA}
      })
    });
  }catch(e){
    throw new Error("Couldn't reach Google. Check your connection and try again.");
  }
  let j = {};
  try{ j = await res.json(); }catch(e){}
  if(!res.ok){
    /* A key problem is the app owner's to fix, not this person's, so the wording never
       asks them to go and do something about it — it tells them it is not their fault
       and that it will be back. */
    const msg = (j.error && j.error.message) || ("HTTP " + res.status);
    if((res.status === 400 && /api key/i.test(msg)) || res.status === 403)
      throw new Error("The plan reader isn't working right now — that's a problem at our end, not yours. Try again later, or build your plan in the Program tab in the meantime.");
    if(res.status === 404)
      throw new Error("The plan reader is misconfigured (no model called \"" + AI_MODEL + "\"). That's ours to fix.");
    if(res.status === 429)
      throw new Error("The plan reader is busy — it's had a lot of use today. Wait a few minutes and try again.");
    if(res.status >= 500)
      throw new Error("Google's API is having a moment (" + res.status + "). Try again shortly.");
    throw new Error(msg);
  }
  const cand = (j.candidates || [])[0];
  if(!cand){
    const b = j.promptFeedback && j.promptFeedback.blockReason;
    throw new Error(b ? "Google's safety filter blocked that input (" + b + ")." : "Gemini sent back an empty answer.");
  }
  if(cand.finishReason === "MAX_TOKENS")
    throw new Error("That plan was too long to read in one go. Import a few days at a time.");
  const text = (((cand.content || {}).parts) || []).map(p=>p.text || "").join("");
  if(!text.trim()) throw new Error("Gemini sent back an empty answer.");
  try{ return JSON.parse(text); }
  catch(e){ throw new Error("Gemini's answer wasn't readable. Try again."); }
}

/* ---------- turning the answer into a programme ----------
   Everything here is defensive. The schema guarantees the shape; these guard the values,
   because a set count of 0, an RPE of 47 or a forty-word exercise name would all be
   valid JSON and would all break a screen somewhere downstream. */
function aiExercise(x){
  if(!x) return null;
  const name = aiSnapName(x.name);
  if(!name) return null;
  const kind = ["heavy","second","iso","abs"].indexOf(x.kind) > -1 ? x.kind : "second";
  const sets = Math.max(1, Math.min(10, Math.round(Number(x.sets)) || 3));
  let rpes = (Array.isArray(x.rpe) ? x.rpe : [])
    .map(n=> Math.round(Number(n) * 2) / 2)
    .filter(n=> n >= 5 && n <= 10);
  if(!rpes.length) rpes = (SLOT_RPES[kind] || SLOT_RPES.second).slice(0, sets);
  while(rpes.length < sets) rpes.push(rpes[rpes.length-1] || 8);
  rpes = rpes.slice(0, sets);
  const reps = String(x.reps == null ? "" : x.reps).trim().slice(0,14) || SLOT_REPS[kind] || "8-12";
  const rest = kind === "heavy" ? REST_HEAVY : kind === "second" ? REST_SECOND : REST_ISO;
  const w = Number(x.weight);
  const weight = (x.weight == null || !isFinite(w) || w <= 0) ? null : Math.round(w * 2) / 2;
  return exr(name, rpes, reps, weight, String(x.note || "").trim().slice(0,120), {rest, slotKind:kind});
}
function aiPlanToProgram(data){
  const days = (data.days || [])
    .filter(d=> d && d.name != null && Array.isArray(d.exercises) && d.exercises.length)
    .slice(0, 8);
  if(!days.length) throw new Error("There were no training days in that.");
  const names = days.map((d,i)=> String(d.name).replace(/\s+/g," ").trim().slice(0,28) || ("Day " + (i+1)));
  /* Rest days are a budget, not a schedule (see the note on the split), so all the
     import has to get right is HOW MANY. A plan that says nothing gets the remainder of
     a seven-day week, which is what almost every written programme means. */
  const asked = Number(data.restDaysPerCycle);
  const rests = Math.max(0, Math.min(5, isFinite(asked) && asked >= 0 ? Math.round(asked)
                                                                     : Math.max(0, 7 - days.length)));
  const split = buildCustomSplit(days.length, rests, names);
  split.name = String(data.splitName || "My plan").replace(/\s+/g," ").trim().slice(0,32) || "My plan";
  split.tag = days.length + " days a week";
  split.imported = true;
  const program = {finisher: []};
  days.forEach((d, i)=>{
    program[split.days[i].id] = d.exercises.slice(0, 16).map(aiExercise).filter(Boolean);
  });
  const empty = split.days.filter(d=> !program[d.id].length);
  if(empty.length === split.days.length) throw new Error("None of those days had exercises we could read.");
  const warnings = (Array.isArray(data.warnings) ? data.warnings : [])
    .map(w=> String(w).trim().slice(0,160)).filter(Boolean).slice(0, 6);
  return {program, customSplit:split, warnings, splitId:null};
}

/* ---------- the importer ---------- */
let AI_IMP = null;
function openAIImport(fromOnboarding){

function renderAIImport(){

function aiImportHTML(){

      <textarea id="aiText" rows="7" spellcheck="false" placeholder="e.g.&#10;Mon — Push: Bench 4x6-8, Incline DB 3x10, Lateral raise 4x15, Pushdowns 3x12&#10;Wed — Pull: Deadlift 3x5, Pull-ups 4xAMRAP, Barbell row 3x10, Curls 3x12&#10;Fri — Legs: Squat 4x6, RDL 3x10, Leg press 3x12, Calves 4x15">${esc(a.text)}</textarea></div>
