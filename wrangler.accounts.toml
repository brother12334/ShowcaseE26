# Cloudflare Workers build config for the ACCOUNT service — a second, separate Worker
# from the plan-reader proxy (see wrangler.toml), because this one needs a KV binding the
# plan reader must never have: the plan reader should not be able to read a single byte
# of anybody's training data.
#
# Deploy, from the repo root:
#   wrangler kv namespace create E26_ACCOUNTS
# That prints an id — paste it below in place of REPLACE_WITH_KV_NAMESPACE_ID, then:
#   wrangler deploy proxy/accountworker.js --name element26-accounts --config wrangler.accounts.toml
#
# See proxy/README.md for the full walkthrough, including how to wire the resulting URL
# into index.html's E26_API and how to verify it with curl.

name = "element26-accounts"
main = "proxy/accountworker.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "E26_ACCOUNTS"
id = "7314f516e47245458b5dde6a2f56707a"
